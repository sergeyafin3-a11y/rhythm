function talkLeft(){ return Math.max(0, TALK_SECS - (Date.now() - tk.started) / 1000); }
function talkStart(n){
  const t = TALK && TALK.byId[tk.id];
  if(!t) return;
  clearInterval(tk.timer);
  tk.take = n; tk.stage = 'rec'; tk.started = 0; tk.noMic = false; tk.rec = null;
  if(n === 2) tk.used = {};
  window.scrollTo(0,0); renderEnglish();
  function go(){
    if(tk.stage !== 'rec' || tk.take !== n) return;
    tk.started = Date.now();
    const st = document.getElementById('tkStatus');
    if(st) st.innerHTML = tkStatus();
    tk.timer = setInterval(talkTick, 250);
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ tk.noMic = true; go(); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    if(tk.stage !== 'rec' || tk.take !== n){ stream.getTracks().forEach(function(x){ x.stop(); }); return; }
    const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(function(x){
      return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(x);
    });
    let rec;
    try{ rec = new MediaRecorder(stream, type ? {mimeType:type} : undefined); }
    catch(e){ stream.getTracks().forEach(function(x){ x.stop(); }); tk.noMic = true; go(); return; }
    const chunks = [];
    rec.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = function(){
      stream.getTracks().forEach(function(x){ x.stop(); });
      if(!chunks.length) return;
      if(tk.takes[n]) URL.revokeObjectURL(tk.takes[n]);
      tk.takes[n] = URL.createObjectURL(new Blob(chunks, {type: rec.mimeType || type || 'audio/mp4'}));
      if(tab === 'english' && (state.enView || 'speak') === 'speak' && tk.stage !== 'rec') renderEnglish();
    };
    rec.start();
    tk.rec = rec;
    go();
  }).catch(function(){ tk.noMic = true; go(); });
}
function talkTick(){
  const left = talkLeft();
  const c = document.getElementById('tkClock'), r = document.getElementById('tkRing');
  if(c) c.textContent = talkClock(left);
  if(r) r.style.strokeDashoffset = (TALK_RING * (1 - left / TALK_SECS)).toFixed(1);
  if(left <= 0) talkStop();
}
function talkStop(){
  clearInterval(tk.timer); tk.timer = null;
  if(tk.stage !== 'rec') return;
  tk.stage = tk.take === 1 ? 'review1' : 'review2';
  if(tk.rec && tk.rec.state !== 'inactive'){ try{ tk.rec.stop(); }catch(e){} }
  tk.rec = null;
  if(navigator.vibrate) try{ navigator.vibrate(30); }catch(e){}
  if(tab === 'english' && (state.enView || 'speak') === 'speak'){ window.scrollTo(0,0); renderEnglish(); }
}
function talkReset(){
  clearInterval(tk.timer); tk.timer = null;
  if(tk.rec && tk.rec.state !== 'inactive'){ tk.rec.onstop = null; try{ tk.rec.stop(); tk.rec.stream.getTracks().forEach(function(x){ x.stop(); }); }catch(e){} }
  Object.keys(tk.takes).forEach(function(n){ URL.revokeObjectURL(tk.takes[n]); });
  tk.id = null; tk.stage = 'idle'; tk.takes = {}; tk.rec = null; tk.started = 0; tk.used = {};
}

let swHide = false;

function swHas(term){
  const k = String(term).toLowerCase();
  return (state.words || []).some(function(x){ return String(x.term).toLowerCase() === k; });

/* finds «try them on» for «to try something on», so the phrase stands out in its sentence */
function swMark(s, phrase){
  const skip = /^(to|a|an|the|someone|somebody|something|sb|sth|one's|oneself|be|a\/b|A|B|doing|do)$/;
  const toks = String(phrase).replace(/[()…]/g, ' ').split(/\s+/).filter(function(x){ return x && !skip.test(x) && /[a-z]/i.test(x); });
  if(!toks.length) return esc(s);
  const parts = toks.map(function(x){
    const base = x.replace(/[^a-z'-]/gi, '');
    const stem = base.length > 6 ? base.slice(0, -2) : base.length > 4 ? base.slice(0, -1) : base;
    return stem.replace(/[-']/g, '\\$&') + "[a-z'-]*";
  });
  let m = null;
  try{ m = new RegExp('\\b' + parts.join("(?:[^a-z]+[a-z'-]+){0,3}?[^a-z]+"), 'i').exec(s); }catch(e){}
  if(!m) return esc(s);
  return esc(s.slice(0, m.index)) + '<mark>' + esc(m[0]) + '</mark>' + esc(s.slice(m.index + m[0].length));
}

    '<div class="sw-list'+(swHide ? ' hide' : '')+'">'+words.map(function(w){

        '<button class="sw-del" data-act="sw-del" data-id="'+esc(w.id)+'" aria-label="Remove">×</button></div>'+
        (w.ctx ? '<p class="sw-ex">'+swMark(w.ctx, w.term)+'</p>' : '')+
        '<div class="sw-back">'+(w.mean ? '<p class="sw-mean">'+esc(w.mean)+'</p>' : '')+
        (w.ru ? '<p class="sw-ru" lang="ru">'+esc(w.ru)+'</p>' : '')+'</div></article>';
    }).join('')+'</div>';
  view.innerHTML = h;
}

function libMeta(it){
  const bits = [];
  if(it.p > 1) bits.push(it.p + '× a day');
  bits.push(it.w === 7 ? 'every day' : it.w + '× a week');
  return bits.join(' · ');
}
function paintLibList(){
  const box = $('#libList'); if(!box) return;
  const q = libQuery.trim().toLowerCase();
  const have = {};
  state.habits.forEach(function(h){ if(!h.archived) have[h.title.toLowerCase()] = 1; });
  let rows = '', found = 0;
  LIBRARY.forEach(function(group, gi){
    if(libCat !== 'all' && libCat !== group.cat) return;
    const hits = group.items.filter(function(it){
      return !q || (group.cat + ' ' + it.t).toLowerCase().replace(/&#39;/g, "'").indexOf(q) !== -1;
    });
    if(!hits.length) return;
    if(libCat === 'all') rows += '<p class="eyebrow" style="margin:16px 0 6px">' + group.cat + '</p>';
    group.items.forEach(function(it, ii){
      if(hits.indexOf(it) === -1) return;
      found++;
      const owned = !!have[it.t.replace(/&#39;/g, "'").toLowerCase()];
      rows += '<button class="librow'+(owned?' have':'')+'" data-act="add-lib" data-i="'+gi+':'+ii+'"'+
        (owned ? ' aria-disabled="true"' : '')+'>'+
        '<span class="habit-emoji">'+it.e+'</span>'+
        '<span><b>'+it.t+'</b><em>'+libMeta(it)+'</em></span>'+
        '<span class="plus">'+(owned ? '✓' : '+')+'</span></button>';
    });
  });
  box.innerHTML = found ? rows :
    '<div class="empty" style="padding:30px 14px"><p>Nothing matches that.<br>Write your own instead.</p>'+
    '<button class="btn btn-primary" data-act="custom-habit">Write my own</button></div>';
}

function celebrate(el){
  if(el){ el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'), 200); }
  if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
}
function toggleHabit(id, el){
  const h = state.habits.find(x=>x.id===id); if(!h) return;
  const k = today(), per = h.perDay||1, c = count(h,k);
  if(c >= per){
    setCount(h,k,0); state.xp = Math.max(0, state.xp - 10*per); toast('Check-in removed');
  } else {
    setCount(h,k,c+1); state.xp += 10; celebrate(el);
    if(c+1 >= per){
      const box = el && el.querySelector('.check');
      const r = box ? box.getBoundingClientRect() : null;
      const fx = r ? r.left + r.width/2 : innerWidth/2;
      const fy = r ? r.top + r.height/2 : innerHeight/2;
      if(doneToday() === activeHabits().length){
        const W = innerWidth, H = innerHeight;
        fanfare();
        fireworks({
          veil: 0.72, duration: 330,
          bursts: [
            {x: fx,     y: fy,     count: 200, power: 1.9, at: 1},
            {x: W*0.22, y: H*0.26, count: 200, power: 2.1, at: 34},
            {x: W*0.78, y: H*0.20, count: 200, power: 2.1, at: 64},
            {x: W*0.50, y: H*0.42, count: 240, power: 2.4, at: 96},
            {x: W*0.16, y: H*0.50, count: 180, power: 2.0, at: 128},
            {x: W*0.84, y: H*0.46, count: 180, power: 2.0, at: 158},
            {x: W*0.50, y: H*0.24, count: 280, power: 2.7, at: 192}
          ]
        });
        toast('✨ Every habit is closed for today');
      } else {
        fireworks({
          veil: 0.3, duration: 125,
          bursts: [
            {x: fx, y: fy, count: 190, power: 1.7, at: 1},
            {x: innerWidth*(0.18 + Math.random()*0.64), y: innerHeight*(0.14 + Math.random()*0.24),
             count: 150, power: 1.95, at: 18}
          ]
        });
      }
    }
  }
  ygHabitChanged(h);
  save(); renderToday();
}

document.addEventListener('click', function(e){
  const pick = e.target.closest('[data-skin-pick]');
  if(pick){
    state.skin = pick.getAttribute('data-skin-pick'); applySkin(state.skin); save();
    document.querySelectorAll('.skins').forEach(renderSkinGrid);
    return;
  }
  const em = e.target.closest('[data-emoji]');
  if(em){ em.parentElement.querySelectorAll('[data-emoji]').forEach(b=>b.setAttribute('aria-pressed','false'));
          em.setAttribute('aria-pressed','true'); return; }
  const chip = e.target.closest('.chip[data-per],.chip[data-wg],.chip[data-kind],.chip[data-cat],.chip[data-when]');
  if(chip){ chip.parentElement.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed','false'));
            chip.setAttribute('aria-pressed','true'); return; }

  const btn = e.target.closest('[data-act]'); if(!btn) return;
  const act = btn.getAttribute('data-act'), id = btn.getAttribute('data-id');

  if(act==='toggle') toggleHabit(id, btn.closest('.habit'));
  else if(act==='new-habit'){
    if(sheet.classList.contains('open')){ closeSheet(); setTimeout(sheetLibrary, 140); }
    else sheetLibrary();
  }
  else if(act==='custom-habit'){ closeSheet(); setTimeout(()=>sheetHabit(null), 140); }
  else if(act==='libcat'){ libCat = btn.getAttribute('data-c'); sheetLibrary(); }
  else if(act==='add-lib'){
    if(btn.getAttribute('aria-disabled') === 'true'){ toast('Already on your list'); return; }
    const parts = btn.getAttribute('data-i').split(':');
    const it = LIBRARY[+parts[0]].items[+parts[1]];
    const title = it.t.replace(/&#39;/g, "'");
    state.habits.push({id:'h'+Date.now().toString(36), title:title, emoji:it.e, perDay:it.p, weekGoal:it.w, when:(it.d || guessWhen(title))});
    save(); paintLibList(); render(); toast('Added — ' + title);
  }
  else if(act==='edit-habit') sheetHabit(id);
  else if(act==='skins') sheetSkins();
  else if(act==='fonts') sheetFonts();
  else if(act==='toggle-sound'){
    state.sound = state.sound === false;
    save(); sheetSettings();
    if(state.sound){ fanfare(); toast('Sound on — that is the fanfare'); } else toast('Sound off');
  }
  else if(act==='pick-font'){
    state.font = btn.getAttribute('data-f');
    applyFont(state.font); save();
    if(sheet.classList.contains('open')) sheetFonts();
    const ob = document.getElementById('onboardFonts');
    if(ob) ob.innerHTML = fontCards();
    render();
  }
  else if(act==='close') closeSheet();
  else if(act==='data') sheetData();

  else if(act==='save-settings'){
    const v = $('#nameIn'); if(v) state.name = v.value.trim();
    save(); closeSheet(); paintHeader(); toast('Saved');
  }
  else if(act==='save-habit'){
    const title = ($('#tIn').value||'').trim();
    if(!title){ toast('Give it a name'); $('#tIn').focus(); return; }
    const emoji = (sheet.querySelector('#emojiPick [aria-pressed="true"]')||{}).dataset?.emoji || '⭐️';
    const per = +(sheet.querySelector('#perPick [aria-pressed="true"]')||{dataset:{per:1}}).dataset.per;
    const wg  = +(sheet.querySelector('#wgPick [aria-pressed="true"]')||{dataset:{wg:7}}).dataset.wg;
    const wh  = (sheet.querySelector('#whenPick [aria-pressed="true"]')||{dataset:{when:'day'}}).dataset.when;
    if(id){ const h = state.habits.find(x=>x.id===id); Object.assign(h,{title,emoji,perDay:per,weekGoal:wg,when:wh,why:($('#hWhy').value||'').trim()}); }
    else state.habits.push({id:'h'+Date.now().toString(36), title, emoji, perDay:per, weekGoal:wg, when:wh, why:($('#hWhy').value||'').trim()});
    save(); closeSheet(); render(); toast(id ? 'Updated' : 'Habit added');
  }
  else if(act==='del-habit'){
    if(!confirm('Delete this habit and its whole history?')) return;
    state.habits = state.habits.filter(x=>x.id!==id); delete state.log[id];
    save(); closeSheet(); render(); toast('Deleted');
  }
  else if(act==='go-todo'){ go('todo'); }
  else if(act==='sk-view'){ skView = btn.getAttribute('data-v'); window.scrollTo(0,0); renderSkills(); }
  else if(act==='pd-retry'){ pddFailed = false; renderSkills(); }
  else if(act==='pd-start'){
    if(!PDD || !LEARN) return;
    pddStart(btn.getAttribute('data-m'), btn.getAttribute('data-x'));
    window.scrollTo(0,0); renderSkills();
  }
  else if(act==='pd-pick'){
    if(!quiz || quiz.done) return;
    const qid = quiz.items[quiz.i], o = +btn.getAttribute('data-o');
    if(quiz.mode === 'exam'){ quiz.picks[qid] = o; renderSkills(); return; }
    if(quiz.picks[qid]) return;
    quiz.picks[qid] = o;
    pddRecord(qid, o === PDD.byId[qid][4]); save(); renderSkills();
  }
  else if(act==='pd-next'){
    if(!quiz) return;
    if(quiz.i + 1 < quiz.items.length) quiz.i++;
    else { quiz.done = true; save(); }
    window.scrollTo(0,0); renderSkills();
  }
  else if(act==='pd-jump'){
    if(!quiz) return;
    quiz.i = Math.max(0, Math.min(quiz.items.length - 1, +btn.getAttribute('data-i')));
    window.scrollTo(0,0); renderSkills();
  }
  else if(act==='pd-finish'){
    if(!quiz) return;
    const open = quiz.items.filter(function(x){ return !quiz.picks[x]; }).length;
    if(open && !confirm(open + (open === 1 ? ' question is' : ' questions are') + ' still unanswered. Finish anyway?')) return;
    pdFinish(); window.scrollTo(0,0); renderSkills();
  }
  else if(act==='pd-quit'){
    if(quiz && quiz.mode === 'exam' && !quiz.done && !confirm('Leave the exam? This attempt will not count.')) return;
    clearInterval(pdTimer); pdTimer = null;
    if(quiz && quiz.from != null) lnCh = quiz.from;
    quiz = null; window.scrollTo(0,0); renderSkills();
  }
  else if(act==='ln-open'){
    const lid = btn.getAttribute('data-l');
    if(!LEARN || !LEARN.byLesson[lid]) return;
    lnFromQuiz = btn.getAttribute('data-from') === 'quiz' && !!quiz;
    if(!lnFromQuiz && quiz){ clearInterval(pdTimer); pdTimer = null; quiz = null; }
    lnLesson = lid;
    if(!lnFromQuiz) lnCh = LEARN.byLesson[lid].c;
    window.scrollTo(0,0); renderSkills();
  }
  else if(act==='ln-back'){
    lnLesson = null; lnFromQuiz = false;
    window.scrollTo(0,0); renderSkills();
  }
  else if(act==='ln-ch'){ lnCh = +btn.getAttribute('data-c'); window.scrollTo(0,0); renderSkills(); }
  else if(act==='ln-home'){ lnCh = null; window.scrollTo(0,0); renderSkills(); }
  else if(act==='ln-done'){
    lnLearned()[btn.getAttribute('data-l')] = today(); save(); celebrate(btn); renderSkills();
    toast('Learned — its questions join your daily practice');
  }
  else if(act==='ln-undo'){ delete lnLearned()[btn.getAttribute('data-l')]; save(); renderSkills(); }
  else if(act==='ln-flip'){
    const k = btn.getAttribute('data-k');
    lnOpen[k] = !lnOpen[k];
    btn.classList.toggle('open', lnOpen[k]);
  }
  else if(act==='ln-hot'){
    const fig = btn.closest('.ln-svg');
    if(!fig || !LEARN) return;
    const key = fig.getAttribute('data-k'), parts = key.split('|'), h = +btn.getAttribute('data-h');
    const inf = LEARN.byLesson[parts[0]], b = inf && inf.l.blocks[+parts[1]];
    if(!b || !b.hot || !b.hot[h]) return;
    lnHot[key] = h;
    fig.querySelectorAll('[data-h]').forEach(function(g){ g.classList.toggle('on', g === btn); });
    const out = fig.querySelector('.ln-hot-out');
    if(out){ out.className = 'ln-hot-out'; out.removeAttribute('lang'); out.innerHTML = '<b>'+lnMd(b.hot[h][0])+'</b>'+lnMd(b.hot[h][1]); }
  }
  else if(act==='ln-pick'){
    const box = btn.closest('.ln-check');
    if(!box || !PDD) return;
    const qid = box.getAttribute('data-q'), q = PDD.byId[qid];
    if(!q || lnPicks[qid]) return;
    const o = +btn.getAttribute('data-o');
    lnPicks[qid] = o;
    pddRecord(qid, o === q[4]); save();
    box.outerHTML = lnCheckHtml(qid);
    paintTabDots();
  }
  else if(act==='dc-done'){ state.diction[today()] = true; save(); celebrate(btn); renderSkills(); toast('Diction done for today'); }
  else if(act==='dc-undo'){ delete state.diction[today()]; save(); renderSkills(); }
  else if(act==='td-quick'){
    const f = $('#tdQuick'); const v = (f ? f.value : '').trim();
    if(!v){ if(f) f.focus(); return; }
    todos().push({id:'t'+Date.now().toString(36), t:v, date:today(), time:'', note:'', done:false, made:Date.now()});
    todoDraft = ''; save(); renderTodos();
    const f2 = $('#tdQuick'); if(f2) f2.focus();
  }
  else if(act==='td-toggle'){
    const t = todos().find(function(x){ return x.id === id; });
    if(!t) return;
    t.done = !t.done; t.doneAt = t.done ? today() : '';
    if(t.done){ state.xp += 5; celebrate(btn.closest('.td')); }
    save(); renderTodos();
  }
  else if(act==='td-edit') sheetTodo(id);
  else if(act==='td-day'){
    const f = $('#tdDate'); if(f) f.value = btn.getAttribute('data-d');
    sheet.querySelectorAll('[data-act="td-day"]').forEach(function(b){ b.setAttribute('aria-pressed','false'); });
    btn.setAttribute('aria-pressed','true');
  }
  else if(act==='td-save'){
    const t = todos().find(function(x){ return x.id === id; });
    if(!t) return;
    const v = ($('#tdT').value || '').trim();
    if(!v){ toast('Give it a name'); $('#tdT').focus(); return; }
    t.t = v; t.date = $('#tdDate').value || ''; t.time = $('#tdTime').value || '';
    t.note = ($('#tdNote').value || '').trim();
    save(); closeSheet(); go('todo'); toast('Saved');
  }
  else if(act==='td-del'){
    if(!confirm('Delete this task?')) return;
    state.todos = todos().filter(function(x){ return x.id !== id; });
    save(); closeSheet(); go('todo'); toast('Deleted');
  }
  else if(act==='fd-setup'){ sheetFoodSetup(); }
  else if(act==='fd-pick'){
    btn.parentElement.querySelectorAll('.fd-opt').forEach(function(b){ b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
  }

/* ---------- Practice tab: driving theory and diction ---------- */
let skView = 'pdd';

/* ---- Driving theory: the official Armenian Road Police bank, in Russian ---- */
const PDD_DAILY = 15;
const PDD_EXAM = {n:20, sec:30*60, maxWrong:2};
let PDD = null, pddLoading = false, pddFailed = false, quiz = null, pdTimer = null;
/* the textbook: chapters of lessons, plus a short explanation for every question */
let LEARN = null, lnCh = null, lnLesson = null, lnFromQuiz = false;
const lnPicks = {}, lnOpen = {}, lnHot = {};

function pddState(){
  if(!state.pdd) state.pdd = {};
  const p = state.pdd;
  if(!p.s) p.s = {}; if(!p.miss) p.miss = {}; if(!p.day) p.day = {}; if(!p.exams) p.exams = []; if(!p.learned) p.learned = {};
  return p;
}
function pddLoad(){
  if((PDD && LEARN) || pddLoading) return;
  pddLoading = true; pddFailed = false;
  function get(url){ return fetch(url).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }
  Promise.all([PDD || get('pdd/q.json'), LEARN || get('pdd/learn.json')])
    .then(function(res){
      if(!PDD){
        const data = res[0];
        data.byId = {};
        data.q.forEach(function(x){ data.byId[x[0]] = x; });
        PDD = data;
      }
      if(!LEARN) LEARN = lnIndex(res[1]);
      pddLoading = false;
      if(tab === 'practice') renderSkills();
    })
    .catch(function(){ pddLoading = false; pddFailed = true; if(tab === 'practice') renderSkills(); });
}
/* lookups the screens need: a lesson by id, the lesson behind every question, the reading order */
function lnIndex(d){
  d.byLesson = {}; d.lessonOf = {}; d.order = [];
  d.chapters.forEach(function(c, ci){
    c.lessons.forEach(function(l, li){
      d.byLesson[l.id] = {c:ci, i:li, l:l};
      d.order.push(l.id);
      l.covers.forEach(function(q){ d.lessonOf[q] = l.id; });
    });
  });
  return d;
}
function lnLearned(){ return pddState().learned; }
function lnLearnedToday(){
  const L = (state.pdd && state.pdd.learned) || {};
  return Object.keys(L).some(function(k){ return L[k] === today(); });
}
/* the questions of every finished lesson — of the whole textbook, or of one chapter */
function lnPool(ci){
  const L = lnLearned(), out = [];
  LEARN.chapters.forEach(function(c, k){
    if(ci != null && k !== ci) return;
    c.lessons.forEach(function(l){
      if(L[l.id]) l.covers.forEach(function(id){ if(PDD.byId[id]) out.push(PDD.byId[id]); });
    });
  });
  return out;
}
function pddToday(){ return pddState().day[today()] || 0; }
function pddMissCount(){ return Object.keys(pddState().miss).length; }
function pddRightIn(list){ const s = pddState().s; return list.filter(function(q){ return s[q[0]] && s[q[0]][0] > 0; }).length; }
function pddShuffle(a){
  const x = a.slice();
  for(let i = x.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = x[i]; x[i] = x[j]; x[j] = t; }
  return x;
}
/* mistakes first, then questions never seen, then the ones seen longest ago */
function pddPick(pool, n){
  const st = pddState();
  const miss  = pddShuffle(pool.filter(function(q){ return st.miss[q[0]]; }));
  const fresh = pddShuffle(pool.filter(function(q){ return !st.s[q[0]]; }));
  const old   = pool.filter(function(q){ return st.s[q[0]] && !st.miss[q[0]]; })
                    .sort(function(a, b){ return st.s[a[0]][2] - st.s[b[0]][2]; });
  const order = miss.slice(0, 5).concat(fresh, miss.slice(5), old);
  const seen = {}, out = [];
  for(const q of order){ if(!seen[q[0]]){ seen[q[0]] = 1; out.push(q[0]); } if(out.length >= n) break; }
  return out;
}
function pddRecord(id, ok){
  const st = pddState();
  const r = st.s[id] || (st.s[id] = [0, 0, 0]);
  if(ok){ r[0]++; delete st.miss[id]; } else { r[1]++; st.miss[id] = 1; }
  r[2] = dayIndex();
  st.day[today()] = (st.day[today()] || 0) + 1;
  const keys = Object.keys(st.day).sort();
  while(keys.length > 60) delete st.day[keys.shift()];
}
function pddStart(mode, x){
  let items, title, from = null;
  if(mode === 'exam'){ items = pddShuffle(PDD.q).slice(0, PDD_EXAM.n).map(function(q){ return q[0]; }); title = 'Exam ticket'; }
  else if(mode === 'miss'){ items = pddShuffle(Object.keys(pddState().miss).filter(function(id){ return PDD.byId[id]; })).slice(0, PDD_DAILY); title = 'Mistakes'; }
  else if(mode === 'lesson'){
    const inf = LEARN.byLesson[x];
    if(!inf) return;
    items = pddPick(inf.l.covers.map(function(id){ return PDD.byId[id]; }).filter(Boolean), 20);
    title = inf.l.t; from = inf.c;
  }
  else if(mode === 'chapter'){
    const ci = +x;
    if(!LEARN.chapters[ci]) return;
    items = pddPick(lnPool(ci), PDD_DAILY); title = LEARN.chapters[ci].t; from = ci;
    if(!items.length){ toast('Finish a lesson of this chapter first'); return; }
  }
  else {
    items = pddPick(lnPool(), PDD_DAILY); title = 'Today’s questions';
    if(!items.length){ toast('Finish a lesson first — its questions come here'); return; }
  }
  if(!items.length){ toast(mode === 'miss' ? 'No mistakes to fix' : 'Nothing to practise here'); return; }
  quiz = {mode:mode, title:title, items:items, i:0, picks:{}, done:false, started:Date.now(), from:from, x:x};
  lnLesson = null; lnFromQuiz = false;
  if(mode === 'exam'){ clearInterval(pdTimer); pdTimer = setInterval(pdTick, 1000); }
}
function pdLeft(){ return Math.max(0, PDD_EXAM.sec - Math.floor((Date.now() - quiz.started) / 1000)); }
function pdClock(s){ return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function pdTick(){
  if(!quiz || quiz.mode !== 'exam' || quiz.done){ clearInterval(pdTimer); pdTimer = null; return; }
  const left = pdLeft(), el = document.getElementById('pdClock');
  if(el){ el.textContent = pdClock(left); el.classList.toggle('low', left < 300); }
  if(left <= 0){ pdFinish(); if(tab === 'practice') renderSkills(); }
}
function pdFinish(){
  if(!quiz || quiz.done) return;
  quiz.done = true; clearInterval(pdTimer); pdTimer = null;
  if(quiz.mode === 'exam'){
    let ok = 0;
    quiz.items.forEach(function(id){
      const q = PDD.byId[id], p = quiz.picks[id], right = p === q[4];
      if(right) ok++;
      if(p) pddRecord(id, right); else { pddState().miss[id] = 1; }
    });
    const wrong = quiz.items.length - ok;
    const st = pddState();
    st.exams.push({d:today(), ok:ok, n:quiz.items.length, pass: wrong <= PDD_EXAM.maxWrong,
                   sec: Math.min(PDD_EXAM.sec, Math.floor((Date.now() - quiz.started) / 1000))});
    while(st.exams.length > 20) st.exams.shift();
  }
  save();
}

function renderSkills(){

  if(quiz) return renderQuiz();
  if(lnCh !== null) return renderChapter();
  renderPddHome();
}

  }

  const pool = lnPool(), n = pddToday();
  if(pool.length){
    h += '<section class="pd-today ln-today">'+
      '<p class="eyebrow">Questions today</p>'+
      '<div class="pd-goal"><b class="num">'+Math.min(n, 999)+'</b><span>of '+PDD_DAILY+'</span></div>'+
      '<div class="pbar"><i style="width:'+Math.min(100, Math.round(100 * n / PDD_DAILY))+'%"></i></div>'+

      '<p class="ln-note">Drawn from the '+pool.length+' exam questions of the lessons you’ve done — your mistakes first.</p>'+
      '</section>';
  } else {
    h += '<p class="ln-note ln-lead">Exam questions open up lesson by lesson: finish one, and its questions come into your daily practice.</p>';

  const st = pddState(), last = st.exams[st.exams.length - 1], mc = pddMissCount();
  if(Object.keys(st.s).length){
    h += '<div class="pd-stats">'+

/* lesson text: **bold** and ==highlight==, everything else escaped */
function lnMd(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/==(.+?)==/g, '<mark>$1</mark>');
}
/* several diagrams share a page, so their ids get a per-block prefix; numbered markers become buttons */
function lnSvg(svg, key, on){
  const p = 'ln' + key.replace(/[^a-z0-9]/gi, '') + '-';
  return svg
    .replace(/(\s)id='([^']+)'/g, "$1id='" + p + "$2'")
    .replace(/url\(#([^)]+)\)/g, 'url(#' + p + '$1)')
    .replace(/href='#([^']+)'/g, "href='#" + p + "$1'")
    .replace(/data-h='(\d+)'/g, function(m, n){ return "data-act='ln-hot' data-h='" + n + "'" + (+n === on ? " class='on'" : ''); });
}
function lnBlock(l, b, bi){
  const key = l.id + '|' + bi;
  if(b.k === 'p') return '<p class="ln-p">'+lnMd(b.x)+'</p>';
  if(b.k === 'list') return '<ul class="ln-list">'+b.x.map(function(t){ return '<li>'+lnMd(t)+'</li>'; }).join('')+'</ul>';
  if(b.k === 'steps') return '<ol class="ln-steps">'+b.x.map(function(t){ return '<li>'+lnMd(t)+'</li>'; }).join('')+'</ol>';
  if(b.k === 'key') return '<div class="ln-key">'+b.x.map(function(p){ return '<div><b>'+lnMd(p[0])+'</b><span>'+lnMd(p[1])+'</span></div>'; }).join('')+'</div>';
  if(b.k === 'compare') return '<div class="ln-cmp">'+b.x.map(function(p){ return '<div><b>'+lnMd(p[0])+'</b><p>'+lnMd(p[1])+'</p></div>'; }).join('')+'</div>';
  if(b.k === 'flip'){
    return '<div class="ln-flips">'+b.x.map(function(p, i){
      const k = key + '|' + i;
      return '<button class="ln-flip'+(lnOpen[k] ? ' open' : '')+'" data-act="ln-flip" data-k="'+k+'">'+
        '<span class="f">'+lnMd(p[0])+'</span><span class="b">'+lnMd(p[1])+'</span><i lang="en">Tap to see</i></button>';
    }).join('')+'</div>';
  }
  if(b.k === 'tip') return '<div class="ln-tip"><p class="eyebrow" lang="en">Remember</p><p>'+lnMd(b.x)+'</p></div>';
  if(b.k === 'trap') return '<div class="ln-trap"><p class="eyebrow" lang="en">Exam trap</p><p>'+lnMd(b.x)+'</p></div>';
  if(b.k === 'img'){
    return '<figure class="ln-fig"><img src="pdd/img/'+esc(b.src)+'" alt="" decoding="async">'+
      (b.cap ? '<figcaption>'+lnMd(b.cap)+'</figcaption>' : '')+'</figure>';
  }
  if(b.k === 'svg'){
    const on = lnHot[key];
    let s = '<figure class="ln-fig ln-svg" data-k="'+key+'">'+lnSvg(b.svg, key, on);
    if(b.hot){
      s += on == null || !b.hot[on]
        ? '<div class="ln-hot-out hint" lang="en">Tap the numbers on the picture</div>'
        : '<div class="ln-hot-out"><b>'+lnMd(b.hot[on][0])+'</b>'+lnMd(b.hot[on][1])+'</div>';
    }
    return s + (b.cap ? '<figcaption>'+lnMd(b.cap)+'</figcaption>' : '') + '</figure>';
  }
  if(b.k === 'check') return lnCheckHtml(b.id);
  return '';
}
/* an official question inside the lesson, answered in place */
function lnCheckHtml(qid){
  const q = PDD.byId[qid];
  if(!q) return '';
  const pick = lnPicks[qid];
  let s = '<div class="ln-check" data-q="'+qid+'"><p class="eyebrow" lang="en">Check yourself · exam question</p>'+
    (q[5] ? '<img class="pd-img" src="pdd/img/'+q[5]+'" alt="">' : '')+
    '<p class="pd-q">'+esc(q[2])+'</p><div class="pd-opts">';
  q[3].forEach(function(o, k){
    const n = k + 1;
    let cls = 'pd-opt';
    if(pick){ if(n === q[4]) cls += ' right'; else if(n === pick) cls += ' wrong'; else cls += ' dim'; }
    s += '<button class="'+cls+'" data-act="ln-pick" data-o="'+n+'"'+(pick ? ' disabled' : '')+'><span class="k">'+n+'</span><span>'+esc(o)+'</span></button>';
  });
  s += '</div>';
  if(pick){
    s += '<p class="pd-feedback '+(pick === q[4] ? 'ok' : 'no')+'" lang="en">'+(pick === q[4] ? 'Right.' : 'Not this one — the answer is '+q[4]+'.')+'</p>';
    if(LEARN.why[qid]) s += '<p class="ln-why">'+lnMd(LEARN.why[qid])+'</p>';
  }
  return s + '</div>';
}

    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>'+

    '<div class="pd-head"><span>'+esc(quiz.title)+' · '+(quiz.i + 1)+' of '+quiz.items.length+'</span>'+
    (exam ? '<span class="pd-clock num" id="pdClock">'+pdClock(pdLeft())+'</span>' : '')+'</div>';
  if(exam){
    h += '<div class="pd-dots">'+quiz.items.map(function(x, k){
      return '<button class="'+(quiz.picks[x] ? 'on' : '')+(k === quiz.i ? ' now' : '')+'" data-act="pd-jump" data-i="'+k+'" aria-label="Question '+(k + 1)+'">'+(k + 1)+'</button>';
    }).join('')+'</div>';
  } else {
    h += '<div class="pbar" style="margin:8px 0 16px"><i style="width:'+Math.round(100 * quiz.i / quiz.items.length)+'%"></i></div>';
  }
  if(q[5]) h += '<img class="pd-img" src="pdd/img/'+q[5]+'" alt="">';
  h += '<p class="pd-q" lang="ru">'+esc(q[2])+'</p><div class="pd-opts" lang="ru">';
  q[3].forEach(function(o, k){
    const n = k + 1;
    let cls = 'pd-opt';
    if(revealed){ if(n === q[4]) cls += ' right'; else if(n === pick) cls += ' wrong'; else cls += ' dim'; }
    else if(pick === n) cls += ' picked';
    h += '<button class="'+cls+'" data-act="pd-pick" data-o="'+n+'"'+(revealed ? ' disabled' : '')+'><span class="k">'+n+'</span><span>'+esc(o)+'</span></button>';
  });
  h += '</div>';

  if(revealed){
    const right = pick === q[4], why = LEARN.why[id], lid = LEARN.lessonOf[id];
    h += '<p class="pd-feedback '+(right ? 'ok' : 'no')+'">'+(right ? 'Right.' : 'Not this one — the answer is '+q[4]+'.')+'</p>'+
         (why ? '<p class="pd-why" lang="ru">'+lnMd(why)+'</p>' : '')+
         (!right && lid && quiz.mode !== 'lesson'
           ? '<button class="linkbtn pd-lesson" data-act="ln-open" data-from="quiz" data-l="'+lid+'">Open the lesson: <span lang="ru">'+esc(LEARN.byLesson[lid].l.t)+'</span></button>'
           : '')+
         '<button class="btn btn-primary btn-full" data-act="pd-next" style="margin-top:14px">'+
         (quiz.i + 1 < quiz.items.length ? 'Next →' : 'See how it went →')+'</button>';
  } else if(exam){
    h += '<div class="pd-nav">'+
      (quiz.i > 0 ? '<button class="btn btn-ghost" data-act="pd-jump" data-i="'+(quiz.i - 1)+'">← Back</button>' : '<span></span>')+
      (quiz.i + 1 < quiz.items.length
        ? '<button class="btn btn-primary" data-act="pd-jump" data-i="'+(quiz.i + 1)+'">Next →</button>'
        : '<button class="btn btn-primary" data-act="pd-finish">Finish the exam</button>')+
      '</div>';
  }
  view.innerHTML = h;
}

function renderQuizResult(){
  const exam = quiz.mode === 'exam';
  let ok = 0; const wrong = [];
  quiz.items.forEach(function(id){
    const q = PDD.byId[id], p = quiz.picks[id];
    if(p === q[4]) ok++; else if(exam || p) wrong.push({q:q, p:p});
  });
  const answered = exam ? quiz.items.length : Object.keys(quiz.picks).length;
  const pass = ok >= quiz.items.length - PDD_EXAM.maxWrong;
  let h = '<div class="pd-result">'+
    '<p class="eyebrow">'+esc(quiz.title)+'</p>'+
    '<b class="num">'+ok+' / '+answered+'</b>'+
    '<p>'+(exam ? (pass ? 'Passed — at most two mistakes, like the real exam asks.' : 'Not passed this time. The real exam allows two mistakes.')
                : (wrong.length ? 'The ones you missed are now in Mistakes.' : 'Every one right.'))+'</p></div>';
  if(wrong.length){
    h += '<section class="rd-block"><p class="eyebrow">What to look at again</p>'+
      wrong.map(function(w){
        const id = w.q[0], why = LEARN.why[id], lid = LEARN.lessonOf[id];

          '</div>';
      }).join('')+'</section>';
  }
  h += '<div class="sheet-actions" style="margin-top:22px">'+

    '<button class="btn btn-primary" data-act="pd-quit">Done</button></div>';
  view.innerHTML = h;
}

  {id:'d13', v:'vhq3G2p2eVc', t:'5 diction exercises and a tongue twister',     min:12, by:'Кирилл Плешаков-Качалин', daily:false, desc:'A longer lesson with more explanation.'},
  {id:'d14', v:'5wf2WLUhlWI', t:'Making speech vivid and convincing',           min:15, by:'Кирилл Плешаков-Качалин', daily:false, desc:'Beyond clear sounds: intonation and emphasis.'}
];
function dictionOfDay(){ const d = DICTION_VIDEOS.filter(function(x){ return x.daily; }); return d[dayIndex() % d.length]; }
function twistersOfDay(){
  const base = (dayIndex() * 3) % TWISTERS.length;
  return [0, 1, 2].map(function(k){ return TWISTERS[(base + k) % TWISTERS.length]; });
}
function dictionDone(key){ return !!(state.diction && state.diction[key || today()]); }

function renderDiction(){
  const v = dictionOfDay(), done = dictionDone();
  let h = skSeg();
  h += '<p class="eyebrow" style="margin-top:6px">Today · about 10 minutes</p>';

  h += '<section class="dc-step"><div class="dc-num">1</div><div class="dc-body">'+
    '<p class="dc-title">Warm-up <span>3 min</span></p>'+
    '<ol class="dc-list">'+DICTION_WARMUP.map(function(x){ return '<li><b>'+esc(x[0])+'</b> '+esc(x[1])+'</li>'; }).join('')+'</ol>'+
    '</div></section>';

  h += '<section class="dc-step"><div class="dc-num">2</div><div class="dc-body">'+
    '<p class="dc-title">Video of the day <span>'+v.min+' min</span></p>'+vidCard(v, true)+
    '</div></section>';

  h += '<section class="dc-step"><div class="dc-num">3</div><div class="dc-body">'+
    '<p class="dc-title">Tongue twisters <span>3 min</span></p>'+
    '<p class="dc-how">Each one three ways: slowly and over-articulated, then at normal speed, then as fast as you can while every sound stays clear. Finish with a whisper.</p>'+
    twistersOfDay().map(function(t){ return '<blockquote class="dc-tw" lang="ru">'+esc(t)+'</blockquote>'; }).join('')+
    '</div></section>';

  h += done
    ? '<p class="neck-done" style="margin-top:18px">✓ Diction done today <button class="linkbtn" data-act="dc-undo">Undo</button></p>'
    : '<button class="btn btn-primary btn-full" data-act="dc-done" style="margin-top:18px">✓ Done for today</button>';

  const ws = weekStart(today());
  h += '<div class="wk-strip" style="margin-top:18px">';
  for(let i = 0; i < 7; i++){
    const d = shift(ws, i), hit = dictionDone(d);
    h += '<div><i class="'+(hit ? 'hit' : '')+(d === today() ? ' now' : '')+'">'+(hit ? '✓' : '')+'</i><span>'+WSHORT[i]+'</span></div>';
  }
  h += '</div>';

  h += '<section class="rd-block"><p class="eyebrow">All lessons</p><div class="vid-list">'+
    DICTION_VIDEOS.filter(function(x){ return x.id !== v.id; }).map(function(x){ return vidCard(x, false); }).join('')+
    '</div></section>';
  view.innerHTML = h;
}

/* a quiet dot on the Practice tab while today’s theory or diction is still open */
function paintTabDots(){
  const t = document.querySelector('.tab[data-tab="practice"]');
  if(!t) return;
  const theory = pddToday() >= PDD_DAILY || lnLearnedToday();
  t.classList.toggle('due', !theory || !dictionDone());
}

/* ---------- Navigation and start-up ---------- */
function go(t){
  tab = t;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', x.dataset.tab===t ? 'true':'false'));
  window.scrollTo({top:0, behavior:'instant' in document.documentElement.style ? 'instant' : 'auto'});
  render();
}
function render(){
  paintTabDots();
  if(tab==='todo') renderTodos();
  else if(tab==='english') renderEnglish();
  else if(tab==='practice') renderSkills();
  else renderToday();
}
function paintHeader(){
  const d = new Date();
  $('#dateLine').textContent = WDAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
  const h = d.getHours();
  const part = h<5 ? 'Good night' : h<12 ? 'Good morning' : h<18 ? 'Good afternoon' : 'Good evening';
  $('#greeting').textContent = state.name ? part + ', ' + state.name : part;
}

function start(){
  applySkin(state.skin);
  applyFont(state.font || 'auto');
  $('#onboard').classList.add('hidden');
  $('#main').classList.remove('hidden');
  paintHeader(); save(); render();
}

if(state.skin){ start(); }
else {
  state.skin = 'peach';
  applySkin(state.skin); applyFont(state.font || 'auto');
  $('#onboard').classList.remove('hidden');
  renderSkinGrid($('#onboardSkins'));
  $('#onboardFonts').innerHTML = fontCards();
  $('#onboardDone').addEventListener('click', function(){
    save(); start(); toast('Theme and typeface live in Settings');
  });
}

/* New day — repaint */
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && state.skin) { paintHeader(); render(); } });

if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
})();
</script>
</body>
</html>
