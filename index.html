<!doctype html>
<html lang="ru" data-skin="peach">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhythm</title>
<meta name="description" content="Daily habits, English and recipes">
<meta name="theme-color" content="#FBE9DE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rhythm">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600;7..72,700&family=Manrope:wght@400;500;700&family=Nunito:wght@400;600;700;800&family=Oswald:wght@500;600&family=Philosopher:wght@700&family=Prata&family=Unbounded:wght@700;800&display=swap">
<style>
/* ============================================================
   THEMES — each with its own palette and typeface
   ============================================================ */
:root,
[data-skin="orangery"]{
  color-scheme: light;
  --font-display: 'Literata', Georgia, serif;
  --font-body: 'Golos Text', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 700;
  --display-tracking: -0.015em;
  --ground:#E7EDE4; --surface:#F6F9F3; --surface-2:#DEE7D9; --line:#C9D6C2;
  --ink:#1F2C24; --ink-soft:#46584C; --ink-mute:#7A8C7F;
  --accent:#2F6B4F; --accent-ink:#F6F9F3; --accent-soft:#CFE0D2;
  --gold:#B0862F; --shadow: 0 1px 2px rgba(31,44,36,.06), 0 8px 24px -12px rgba(31,44,36,.18);
  --radius:14px; --radius-lg:22px; --border-w:1px;
}
[data-skin="midnight"]{
  color-scheme: dark;
  --font-display: 'Prata', Georgia, serif;
  --font-body: 'Manrope', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 400; --display-tracking: 0em;
  --ground:#0D1220; --surface:#161E30; --surface-2:#1F2940; --line:#2B3752;
  --ink:#E6EBF5; --ink-soft:#A9B4CC; --ink-mute:#6C7893;
  --accent:#8FA7FF; --accent-ink:#0D1220; --accent-soft:#26304C;
  --gold:#F0B45E; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.8);
  --radius:14px; --radius-lg:22px; --border-w:1px;
}
[data-skin="peach"]{
  color-scheme: light;
  --font-display: 'Comfortaa', ui-rounded, sans-serif;
  --font-body: 'Nunito', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 700; --display-tracking: -0.01em;
  --ground:#FBE9DE; --surface:#FFF7F2; --surface-2:#F6DACB; --line:#EBC5B2;
  --ink:#40272A; --ink-soft:#7A5157; --ink-mute:#A9807F;
  --accent:#C4566B; --accent-ink:#FFF7F2; --accent-soft:#F7D3D6;
  --gold:#D98E3C; --shadow: 0 1px 2px rgba(64,39,42,.06), 0 10px 26px -14px rgba(64,39,42,.3);
  --radius:18px; --radius-lg:28px; --border-w:1px;
}
[data-skin="riso"]{
  color-scheme: light;
  --font-display: 'Unbounded', 'Golos Text', sans-serif;
  --font-body: 'Golos Text', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 800; --display-tracking: -0.03em;
  --ground:#F7F3EA; --surface:#FFFFFF; --surface-2:#EDE7DA; --line:#141414;
  --ink:#141414; --ink-soft:#4A4A4A; --ink-mute:#8A8A8A;
  --accent:#2B44FF; --accent-ink:#FFFFFF; --accent-soft:#D9DEFF;
  --gold:#FF4D8D; --shadow: 3px 3px 0 #141414;
  --radius:4px; --radius-lg:6px; --border-w:2px;
}
[data-skin="dusk"]{
  color-scheme: light;
  --font-display: 'Philosopher', Georgia, serif;
  --font-body: 'Golos Text', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 700; --display-tracking: -0.005em;
  --ground:#E9E6F1; --surface:#F6F4FA; --surface-2:#DDD8EA; --line:#CBC4DD;
  --ink:#2A2340; --ink-soft:#574C75; --ink-mute:#8880A3;
  --accent:#6B57C7; --accent-ink:#F6F4FA; --accent-soft:#DCD4F5;
  --gold:#C98A45; --shadow: 0 1px 2px rgba(42,35,64,.06), 0 10px 26px -14px rgba(42,35,64,.32);
  --radius:16px; --radius-lg:24px; --border-w:1px;
}
[data-skin="charcoal"]{
  color-scheme: dark;
  --font-display: 'Oswald', ui-sans-serif, sans-serif;
  --font-body: 'Manrope', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 600; --display-tracking: 0.005em;
  --ground:#121211; --surface:#1C1C1A; --surface-2:#262624; --line:#35352F;
  --ink:#EDEAE2; --ink-soft:#ADA79A; --ink-mute:#78736A;
  --accent:#D9C7A3; --accent-ink:#121211; --accent-soft:#2E2B24;
  --gold:#C98F5A; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 34px -18px rgba(0,0,0,.9);
  --radius:10px; --radius-lg:16px; --border-w:1px;
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; background:var(--ground); }
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  min-height:100dvh;
}
button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
.display{ font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking); text-wrap:balance; }
.eyebrow{ font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-mute); }
.num{ font-variant-numeric:tabular-nums; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.app{
  max-width:520px; margin:0 auto;
  min-height:100dvh;
  display:flex; flex-direction:column;
  padding: max(14px, env(safe-area-inset-top)) 16px 0;
}
main{ flex:1; padding-bottom:104px; }
.hidden{ display:none !important; }

/* ============================================================
   HEADER
   ============================================================ */
.top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:8px 0 18px; }
.top h1{ margin:2px 0 0; font-size:26px; line-height:1.1; }
.top .date{ margin-bottom:6px; }
.iconbtn{
  width:42px; height:42px; flex:none; display:grid; place-items:center;
  border-radius:999px; border:var(--border-w) solid var(--line);
  background:var(--surface); color:var(--ink-soft);
  transition:transform .15s ease, color .15s ease;
}
.iconbtn:active{ transform:scale(.93); }
.iconbtn svg{ width:19px; height:19px; }

/* ============================================================
   DAY RING — one segment per habit
   ============================================================ */
.ring-card{
  background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:var(--radius-lg); box-shadow:var(--shadow);
  padding:22px 20px; display:flex; align-items:center; gap:20px; margin-bottom:22px;
}
.ring{ width:124px; height:124px; flex:none; position:relative; }
.ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring .seg{ fill:none; stroke-width:9; stroke-linecap:round; transition:stroke .35s ease, opacity .35s ease; }
.ring .seg.off{ stroke:var(--surface-2); }
.ring .seg.on{ stroke:var(--accent); }
.ring-center{ position:absolute; inset:0; display:grid; place-content:center; text-align:center; }
.ring-center b{ font-family:var(--font-display); font-weight:var(--display-weight); font-size:36px; line-height:1; display:block; letter-spacing:var(--display-tracking); }
.ring-center b small{ font-size:.55em; color:var(--ink-mute); letter-spacing:0; }
.ring-center span{ font-size:11px; color:var(--ink-mute); letter-spacing:.08em; text-transform:uppercase; font-weight:700; }
.ring-side{ min-width:0; }
.ring-side .lead{ font-family:var(--font-display); font-weight:var(--display-weight); font-size:19px; line-height:1.2; letter-spacing:var(--display-tracking); margin:6px 0 4px; }
.ring-side p{ margin:0; font-size:13.5px; color:var(--ink-soft); }
.lvl{ display:flex; align-items:center; gap:8px; margin-top:12px; }
.lvl-bar{ flex:1; height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
.lvl-bar i{ display:block; height:100%; background:var(--gold); border-radius:99px; transition:width .5s cubic-bezier(.2,.8,.2,1); }
.lvl small{ font-size:11px; color:var(--ink-mute); font-weight:700; letter-spacing:.06em; }

/* ============================================================
   HABIT LIST
   ============================================================ */
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:22px 2px 10px; }
.section-head:first-of-type{ margin-top:0; }
.list{ display:flex; flex-direction:column; gap:10px; }
.habit{
  background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow);
  padding:13px 14px; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:13px;
  transition:transform .18s cubic-bezier(.2,.8,.2,1), border-color .2s ease;
}
.habit.done{ border-color:var(--accent); }
.habit.pop{ transform:scale(1.02); }
.habit-emoji{ width:40px; height:40px; flex:none; display:grid; place-items:center; font-size:21px; border-radius:var(--radius); background:var(--surface-2); }
.habit-main{ min-width:0; }
.habit-name{ font-weight:700; font-size:15.5px; line-height:1.25; margin:0 0 5px; overflow-wrap:anywhere; }
.habit-meta{ display:flex; align-items:center; gap:9px; font-size:12px; color:var(--ink-mute); flex-wrap:wrap; }
.streak{ display:inline-flex; align-items:center; gap:3px; color:var(--gold); font-weight:700; }
.chain{ display:flex; gap:4px; }
.chain i{ width:7px; height:7px; border-radius:99px; background:var(--surface-2); display:block; }
.chain i.hit{ background:var(--accent); }
.chain i.today{ box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink-mute); }
.check{
  width:44px; height:44px; flex:none; border-radius:999px;
  border:2px solid var(--line); display:grid; place-items:center;
  color:transparent; transition:background .2s ease, border-color .2s ease, color .2s ease, transform .15s ease;
}
.check svg{ width:22px; height:22px; }
.check:active{ transform:scale(.88); }
.habit.done .check{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.counter{ display:flex; align-items:center; gap:2px; }
.counter .cnt{ font-size:12px; color:var(--ink-mute); font-weight:700; min-width:26px; text-align:right; }

.empty{ text-align:center; padding:44px 18px; color:var(--ink-mute); }
.empty p{ margin:8px 0 18px; font-size:14px; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 18px; border-radius:999px; font-weight:700; font-size:14.5px;
  border:var(--border-w) solid var(--line); background:var(--surface); color:var(--ink);
  text-decoration:none; transition:transform .15s ease, opacity .2s ease;
}
.btn:active{ transform:scale(.96); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn-ghost{ background:transparent; }
.btn-danger{ color:#C0392B; border-color:currentColor; background:transparent; }
.btn-full{ width:100%; }
.btn-sm{ padding:8px 14px; font-size:13px; }

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; justify-content:center;
  padding:0 16px calc(12px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.tabs-inner{
  pointer-events:auto; width:100%; max-width:488px;
  display:grid; grid-template-columns:repeat(6,1fr); gap:1px;
  background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:999px; padding:5px; box-shadow:var(--shadow);
}
.tab{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 1px 7px; border-radius:999px; color:var(--ink-mute);
  font-size:8.8px; font-weight:700; letter-spacing:.03em;
  transition:background .2s ease, color .2s ease;
}
.tab svg{ width:18px; height:18px; }
.tab[aria-selected="true"]{ background:var(--accent-soft); color:var(--accent); }
[data-skin="charcoal"] .tab[aria-selected="true"],
[data-skin="midnight"] .tab[aria-selected="true"]{ color:var(--accent); }

/* ============================================================
   WEEKS / STATS
   ============================================================ */
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:22px; }
.stat{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius);
  padding:14px 12px; box-shadow:var(--shadow);
}
.stat b{ font-family:var(--font-display); font-weight:var(--display-weight); font-size:27px; line-height:1; display:block; letter-spacing:var(--display-tracking); }
.stat span{ display:block; margin-top:6px; font-size:11px; color:var(--ink-mute); font-weight:600; line-height:1.3; }

.grid-card{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:16px 14px; margin-bottom:14px; overflow-x:auto;
}
.grid-head{ display:flex; align-items:center; gap:9px; margin-bottom:12px; }
.grid-head .habit-emoji{ width:30px; height:30px; font-size:16px; border-radius:9px; }
.grid-head b{ font-size:14.5px; overflow-wrap:anywhere; }
.grid-head .pct{ margin-left:auto; font-size:12px; font-weight:700; color:var(--ink-mute); flex:none; }
.weeks{ display:flex; gap:5px; min-width:min-content; }
.wcol{ display:flex; flex-direction:column; gap:5px; }
.cell{ width:16px; height:16px; border-radius:5px; background:var(--surface-2); }
[data-skin="riso"] .cell{ border-radius:2px; }
.cell.l1{ background:var(--accent); opacity:.35; }
.cell.l2{ background:var(--accent); opacity:.65; }
.cell.l3{ background:var(--accent); }
.cell.future{ background:transparent; box-shadow:inset 0 0 0 1px var(--surface-2); }
.cell.today{ box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink-mute); }
.daylabels{ display:flex; flex-direction:column; gap:5px; margin-right:3px; }
.daylabels span{ height:16px; font-size:9.5px; line-height:16px; color:var(--ink-mute); font-weight:700; width:16px; }

/* ============================================================
   REWARDS
   ============================================================ */
.prize{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:14px; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:center;
}
.prize.locked{ opacity:.62; }
.prize.ready{ border-color:var(--gold); }
.prize-badge{
  width:46px; height:46px; flex:none; display:grid; place-items:center; font-size:23px;
  border-radius:999px; background:var(--surface-2);
}
.prize.ready .prize-badge, .prize.claimed .prize-badge{ background:var(--accent-soft); }
.prize b{ display:block; font-size:14.5px; line-height:1.25; overflow-wrap:anywhere; }
.prize p{ margin:4px 0 0; font-size:12.5px; color:var(--ink-mute); }
.pbar{ height:5px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-top:8px; }
.pbar i{ display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .5s ease; }
.claimed-tag{ display:inline-block; margin-top:7px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); }

/* ============================================================
   BOTTOM SHEET
   ============================================================ */
.scrim{
  position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.42);
  opacity:0; pointer-events:none; transition:opacity .25s ease;
  backdrop-filter:blur(2px);
}
.scrim.open{ opacity:1; pointer-events:auto; }
.sheet{
  position:fixed; z-index:41; left:0; right:0; bottom:0;
  max-width:520px; margin:0 auto;
  background:var(--ground); color:var(--ink);
  border-top-left-radius:26px; border-top-right-radius:26px;
  border-top:var(--border-w) solid var(--line);
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));
  max-height:88dvh; overflow-y:auto;
  transform:translateY(102%); transition:transform .32s cubic-bezier(.2,.85,.25,1);
}
.sheet.open{ transform:translateY(0); }
.grabber{ width:38px; height:4px; border-radius:99px; background:var(--line); margin:0 auto 14px; }
.sheet h2{ font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking); font-size:22px; margin:0 0 4px; }
.sheet .sub{ margin:0 0 18px; font-size:13.5px; color:var(--ink-mute); }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-mute); margin-bottom:7px; }
.field input[type=text], .field input[type=number], .field select, .field textarea{
  width:100%; padding:12px 14px; border-radius:var(--radius);
  border:var(--border-w) solid var(--line); background:var(--surface); color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
.emojis{ display:flex; flex-wrap:wrap; gap:7px; }
.emojis button{
  width:42px; height:42px; border-radius:var(--radius); font-size:20px;
  border:var(--border-w) solid var(--line); background:var(--surface); display:grid; place-items:center;
}
.emojis button[aria-pressed="true"]{ background:var(--accent-soft); border-color:var(--accent); }
.chips{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{
  padding:9px 14px; border-radius:999px; font-size:13px; font-weight:600;
  border:var(--border-w) solid var(--line); background:var(--surface); color:var(--ink-soft);
}
.chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.sheet-actions{ display:flex; gap:9px; margin-top:22px; }
.sheet-actions .btn{ flex:1; }
.rowlink{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 2px; border-bottom:var(--border-w) solid var(--line); font-size:14.5px; font-weight:600; text-align:left;
}
.rowlink:last-of-type{ border-bottom:0; }
.rowlink span{ color:var(--ink-mute); font-weight:500; font-size:13px; }

/* ============================================================
   THEME PICKER
   ============================================================ */
.skins{ display:grid; grid-template-columns:1fr 1fr; gap:11px; }
.fontcard{
  width:100%; text-align:left; padding:14px 15px; border-radius:var(--radius);
  border:var(--border-w) solid var(--line); background:var(--surface); margin-bottom:9px;
  transition:transform .16s ease, border-color .2s ease;
}
.fontcard:active{ transform:scale(.985); }
.fontcard[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); }
.fontcard .fp{ display:block; font-size:23px; line-height:1.1; margin-bottom:6px; }
.fontcard .fb{ display:block; font-size:13.5px; line-height:1.35; margin-bottom:7px; }
.fontcard .fn{ font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-mute); }
.fontcard[aria-pressed="true"] .fn{ color:var(--accent); }
.skin{
  border-radius:16px; padding:14px 13px 13px; text-align:left; position:relative;
  border:2px solid transparent; overflow:hidden; transition:transform .18s ease;
}
.skin:active{ transform:scale(.97); }
.skin[aria-pressed="true"]{ border-color:var(--ink); }
.skin .sname{ display:block; font-size:15px; line-height:1.15; margin-bottom:4px; padding-right:22px; }
.skin .sdesc{ display:block; font-size:11px; opacity:.72; line-height:1.3; }
.sprev{ display:flex; align-items:center; gap:7px; margin-top:11px; padding:7px 8px; border-radius:9px; }
.sprev i{ display:block; }
.sprev .d{ width:14px; height:14px; border-radius:4px; flex:none; }
.sprev .l{ flex:1; height:4px; border-radius:99px; }
.sprev .c{ width:15px; height:15px; border-radius:99px; flex:none; }
.swatches{ display:flex; gap:5px; margin-top:9px; }
.swatches i{ width:15px; height:15px; border-radius:99px; display:block; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); }
.skin .tick{ position:absolute; top:10px; right:10px; width:19px; height:19px; border-radius:99px; display:none; place-items:center; }
.skin[aria-pressed="true"] .tick{ display:grid; }
.skin .tick svg{ width:11px; height:11px; }

/* ============================================================
   WELCOME SCREEN
   ============================================================ */
.onboard{ padding:26px 0 40px; }
.onboard .kicker{ margin-bottom:12px; }
.onboard h1{ font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking); font-size:34px; line-height:1.08; margin:0 0 10px; text-wrap:balance; }
.onboard .intro{ margin:0 0 26px; font-size:15px; color:var(--ink-soft); max-width:34ch; }
.onboard .skins{ margin-bottom:6px; }
.onboard .obl{ display:block; margin:26px 0 11px; }
.onboard .obl2{ margin-top:30px; }
.obfoot{
  position:sticky; bottom:0; padding:14px 0 calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--ground) 62%, transparent);
}

.tw{ cursor:pointer; border-radius:3px; transition:background .15s ease; }
.tw.on{ background:var(--accent-soft); }
.tw:active{ background:var(--accent-soft); }
.tip{
  position:fixed; z-index:70; max-width:min(82vw, 320px);
  background:var(--ink); color:var(--ground);
  padding:11px 14px; border-radius:13px; font-size:14.5px; line-height:1.4;
  box-shadow:0 12px 34px rgba(0,0,0,.34);
  opacity:0; pointer-events:none; transform:translate(-50%, 0) scale(.96);
  transition:opacity .16s ease, transform .16s ease;
}
.tip.show{ opacity:1; transform:translate(-50%, -8px) scale(1); }
.tip b{ display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.65; margin-bottom:3px; font-weight:700; }
.tip i{ font-style:normal; opacity:.65; }
.rd-hint{ margin:12px 0 0; font-size:12.5px; color:var(--ink-mute); text-align:center; }

/* ---- To-do ---- */
.td-add{ display:flex; gap:8px; margin-bottom:18px; }
.td-add input{
  flex:1; padding:13px 15px; border-radius:999px; font-size:15px;
  border:var(--border-w) solid var(--line); background:var(--surface); color:var(--ink);
}
.td-add input:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
.td-add button{
  width:46px; height:46px; flex:none; border-radius:999px; display:grid; place-items:center;
  background:var(--accent); color:var(--accent-ink); font-size:24px; line-height:1;
}
.td-group{ margin-bottom:22px; }
.td-group > .eyebrow{ display:block; margin-bottom:9px; }
.td-group.late > .eyebrow{ color:#C0392B; }
.td-list{ display:flex; flex-direction:column; gap:8px; }
.td{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:12px 13px;
  display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center;
  transition:transform .16s cubic-bezier(.2,.8,.2,1);
}
.td:active{ transform:scale(.99); }
.td .box{
  width:26px; height:26px; flex:none; border-radius:8px; border:2px solid var(--line);
  display:grid; place-items:center; color:transparent;
  transition:background .18s ease, border-color .18s ease, color .18s ease;
}
.td .box svg{ width:15px; height:15px; }
.td.done .box{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.td-main{ min-width:0; text-align:left; }
.td-main b{ display:block; font-size:15px; line-height:1.3; font-weight:600; overflow-wrap:anywhere; }
.td.done .td-main b{ text-decoration:line-through; color:var(--ink-mute); }
.td-main em{ display:block; font-style:normal; font-size:12px; color:var(--ink-mute); margin-top:4px; line-height:1.35; }
.td-time{
  flex:none; font-size:13px; font-weight:700; color:var(--accent);
  font-variant-numeric:tabular-nums; padding:5px 9px; border-radius:8px; background:var(--accent-soft);
}
.td.done .td-time{ background:var(--surface-2); color:var(--ink-mute); }
.td-late .td-time{ background:#C0392B; color:#fff; }
.td-card{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:16px; margin-bottom:20px; width:100%; text-align:left; display:block;
}
.td-card .top{ display:flex; align-items:center; gap:10px; }
.td-card .top .eyebrow{ margin:0; }
.td-card .go{ margin-left:auto; font-size:12.5px; font-weight:700; color:var(--accent); }
.td-card ul{ margin:12px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px; }
.td-card li{ font-size:14px; line-height:1.35; display:flex; gap:9px; align-items:baseline; }
.td-card li span{ font-size:12px; font-weight:700; color:var(--accent); flex:none; font-variant-numeric:tabular-nums; }
.td-card p{ margin:10px 0 0; font-size:13px; color:var(--ink-mute); }

/* ---- What's New ---- */
.rd-card{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:16px 16px 15px; margin-bottom:20px; width:100%; text-align:left; display:block;
}
.rd-card .top{ display:flex; align-items:center; gap:10px; }
.rd-card .top .eyebrow{ margin:0; }
.rd-card .go{ margin-left:auto; font-size:12.5px; font-weight:700; color:var(--accent); }
.rd-card h3{
  margin:8px 0 5px; font-family:var(--font-display); font-weight:var(--display-weight);
  letter-spacing:var(--display-tracking); font-size:19px; line-height:1.2;
}
.rd-card p{ margin:0; font-size:13px; color:var(--ink-mute); }
.rd-card.done{ border-color:var(--accent); }
.rd-flag{ font-size:15px; }

.rd-head{ display:flex; flex-wrap:wrap; gap:7px; margin:0 0 14px; }
.rd-body p{ font-size:16px; line-height:1.62; margin:0 0 14px; color:var(--ink); }
.rd-body p:last-child{ margin-bottom:0; }
.rd-block{ margin-top:28px; }
.rd-block > .eyebrow{ display:block; margin-bottom:12px; }
.qa{
  width:100%; text-align:left; background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:13px 15px; margin-bottom:9px;
}
.qa b{ display:block; font-size:14.5px; line-height:1.4; font-weight:600; }
.qa i{ display:block; font-style:normal; font-size:11px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--accent); margin-top:8px; }
.qa p{ margin:8px 0 0; font-size:14px; line-height:1.5; color:var(--ink-soft); }
.rd-word{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:13px 15px; margin-bottom:9px;
  display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center;
}
.rd-word b{ display:block; font-size:15px; line-height:1.3; }
.rd-word span{ display:block; font-size:12.5px; color:var(--ink-mute); margin-top:3px; line-height:1.4; }
.rd-word .add{
  width:38px; height:38px; flex:none; border-radius:999px; display:grid; place-items:center;
  border:var(--border-w) solid var(--line); color:var(--accent); font-size:20px; line-height:1;
}
.rd-word.have .add{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-size:15px; }
.rd-say{
  background:var(--accent-soft); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  padding:18px 17px;
}
.rd-say p{ margin:0 0 12px; font-size:15px; line-height:1.5; color:var(--ink); }
.rd-say ul{ margin:0; padding-left:18px; }
.rd-say li{ font-size:14px; line-height:1.6; color:var(--ink-soft); }
.rd-archive{ display:flex; flex-direction:column; gap:1px; }
.rd-row{
  display:grid; grid-template-columns:auto 1fr auto; gap:11px; align-items:center; width:100%; text-align:left;
  padding:12px 2px; border-bottom:var(--border-w) solid var(--line);
}
.rd-row:last-child{ border-bottom:0; }
.rd-row b{ display:block; font-size:14px; line-height:1.3; font-weight:600; overflow-wrap:anywhere; }
.rd-row em{ display:block; font-style:normal; font-size:11.5px; color:var(--ink-mute); margin-top:2px; }
.rd-row .tick{ font-size:13px; color:var(--accent); }

/* ---- Workouts ---- */
.wk-card{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:16px 16px 14px; margin-bottom:20px; width:100%; text-align:left; display:block;
}
.wk-card .top{ display:flex; align-items:center; gap:10px; margin-bottom:2px; }
.wk-card .top .eyebrow{ margin:0; }
.wk-card .go{ margin-left:auto; font-size:12.5px; font-weight:700; color:var(--accent); }
.wk-card h3{
  margin:6px 0 3px; font-family:var(--font-display); font-weight:var(--display-weight);
  letter-spacing:var(--display-tracking); font-size:20px; line-height:1.15;
}
.wk-card p{ margin:0; font-size:13px; color:var(--ink-mute); line-height:1.4; }
.wk-mins{ display:flex; gap:6px; flex-wrap:wrap; margin-top:13px; }
.wk-mins span{
  padding:7px 12px; border-radius:999px; font-size:12.5px; font-weight:700;
  background:var(--surface-2); color:var(--ink-soft); font-variant-numeric:tabular-nums;
}
.wk-card.done{ border-color:var(--accent); }
.wk-done-line{ display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--accent); font-weight:700; }

.wk-list{ display:flex; flex-direction:column; gap:16px; }
.wk{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); overflow:hidden;
}
.wk.picked{ border-color:var(--accent); }
a.wk-thumb{ text-decoration:none; }
.wk-thumb{
  display:block; width:100%; aspect-ratio:16/9; background:var(--surface-2); position:relative;
  border:0; padding:0; overflow:hidden;
}
.wk-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.wk-thumb .fallback{
  position:absolute; inset:0; display:none; place-items:center; font-size:40px;
  background:linear-gradient(140deg, var(--surface-2), var(--accent-soft));
}
.wk-thumb.broken img{ display:none; }
.wk-thumb.broken .fallback{ display:grid; }
.wk-thumb .play{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:52px; height:52px; border-radius:999px; background:rgba(12,10,14,.55);
  display:grid; place-items:center; backdrop-filter:blur(3px);
}
.wk-thumb .play svg{ width:20px; height:20px; color:#fff; margin-left:3px; }
.wk-thumb .len{
  position:absolute; right:9px; bottom:9px; background:rgba(12,10,14,.78); color:#fff;
  font-size:11.5px; font-weight:700; padding:3px 7px; border-radius:6px; font-variant-numeric:tabular-nums;
}
.wk-body{ padding:14px 15px 15px; }
.wk-body b{ display:block; font-size:15.5px; line-height:1.3; overflow-wrap:anywhere; }
.wk-meta{ display:flex; flex-wrap:wrap; gap:7px; margin:10px 0 0; }
.wk-meta span{
  padding:5px 10px; border-radius:999px; font-size:11.5px; font-weight:700;
  background:var(--surface-2); color:var(--ink-soft);
}
.wk-meta span.hard{ background:var(--accent-soft); color:var(--accent); }
.wk-body p{ margin:10px 0 0; font-size:13px; line-height:1.45; color:var(--ink-mute); }
.wk-acts{ display:flex; gap:9px; margin-top:14px; }
.wk-acts .btn{ flex:1; }

.wk-note{
  background:var(--surface); border:var(--border-w) solid var(--line); border-left:3px solid var(--accent);
  border-radius:var(--radius); padding:13px 15px; font-size:13.5px; line-height:1.5;
  color:var(--ink-soft); margin-bottom:18px;
}
.wk-strip{ display:flex; gap:6px; margin:14px 0 0; }
.wk-strip div{ flex:1; text-align:center; }
.wk-strip i{
  display:block; height:30px; border-radius:8px; background:var(--surface-2); margin-bottom:5px;
  display:grid; place-items:center; font-size:14px; font-style:normal;
}
.wk-strip i.hit{ background:var(--accent-soft); }
.wk-strip span{ font-size:9.5px; font-weight:700; color:var(--ink-mute); }

/* ---- Why: the point of all this ---- */
.why{ width:100%; text-align:left; display:block; margin:0 0 20px; padding:0; }
.why > span{
  display:block; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  font-weight:700; color:var(--ink-mute); margin-bottom:5px;
}
.why q{
  quotes:none; display:block; color:var(--accent);
  font-family:var(--font-display); font-weight:var(--display-weight);
  letter-spacing:var(--display-tracking); font-size:16.5px; line-height:1.35;
}
.why.blank q{ color:var(--ink-mute); font-family:var(--font-body); font-weight:500; font-size:14px; }
.habit-why{
  margin:6px 0 0; font-size:12.5px; line-height:1.4; color:var(--ink-mute);
  border-left:2px solid var(--accent-soft); padding-left:8px;
}
.recap{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:20px 18px; margin-bottom:18px;
}
.recap .eyebrow{ margin-bottom:12px; }
.recap p{ margin:0 0 11px; font-size:14.5px; line-height:1.5; color:var(--ink-soft); }
.recap p:last-child{ margin-bottom:0; }
.recap b{
  font-family:var(--font-display); font-weight:var(--display-weight);
  letter-spacing:var(--display-tracking); font-size:19px; color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.recap .close{ color:var(--ink); font-size:14px; padding-top:4px; border-top:var(--border-w) solid var(--line); margin-top:14px; }

/* ---- My words ---- */
.seg{
  display:flex; gap:4px; background:var(--surface-2); border-radius:999px;
  padding:4px; margin-bottom:18px;
}
.seg button{
  flex:1; padding:9px 8px; border-radius:999px; font-size:13px; font-weight:700;
  color:var(--ink-mute); transition:background .2s ease, color .2s ease;
}
.seg button[aria-selected="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
.seg small{ font-weight:700; opacity:.6; }

.words{ display:flex; flex-direction:column; gap:10px; }
.word{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:14px 15px; width:100%; text-align:left;
  transition:transform .18s cubic-bezier(.2,.8,.2,1);
}
.word:active{ transform:scale(.99); }
.word-top{ display:flex; align-items:center; gap:10px; }
.word-top b{ font-size:16.5px; line-height:1.25; overflow-wrap:anywhere; }
.boxdots{ display:flex; gap:3px; margin-left:auto; flex:none; }
.boxdots i{ display:block; width:6px; height:6px; border-radius:99px; background:var(--surface-2); }
.boxdots i.on{ background:var(--accent); }
.word .ctx{ margin:8px 0 0; font-size:14px; line-height:1.45; color:var(--ink-soft); }
.word .ctx mark{ background:var(--accent-soft); color:var(--accent); padding:0 3px; border-radius:4px; font-weight:700; }
.word .mean{ margin:7px 0 0; font-size:12.5px; color:var(--ink-mute); line-height:1.4; }

.pwrap{ display:flex; flex-direction:column; gap:14px; }
.pcard{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:26px 20px; text-align:center; min-height:230px;
  display:flex; flex-direction:column; justify-content:center; gap:14px;
}
.pcard .q{ font-size:17.5px; line-height:1.55; color:var(--ink); }
.pcard .q mark{ background:none; color:var(--accent); font-weight:700; }
.blank{ display:inline-block; min-width:76px; border-bottom:2.5px solid var(--accent); vertical-align:baseline; }
.pcard .a{
  font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking);
  font-size:27px; line-height:1.15; color:var(--ink);
}
.pcard .m{ font-size:13.5px; color:var(--ink-mute); line-height:1.45; }
.pbtns{ display:flex; gap:9px; }
.pbtns .btn{ flex:1; }
.pdone{ text-align:center; padding:36px 16px; }
.pdone .big{
  font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking);
  font-size:30px; line-height:1.15; margin:10px 0 6px;
}

/* ============================================================
   DECOR — a drawn motif behind the header, one per theme
   ============================================================ */
.decor{
  position:fixed; top:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:520px; height:240px; z-index:0; pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom, #000 30%, transparent 100%);
          mask-image:linear-gradient(to bottom, #000 30%, transparent 100%);
}
.decor svg{ width:100%; height:100%; display:block; }
.app{ position:relative; z-index:1; }
#confetti{ position:fixed; inset:0; z-index:50; pointer-events:none; }

/* ============================================================
   EMPTY STATES — small drawings instead of a lone emoji
   ============================================================ */
.emptyart{ width:96px; height:96px; margin:0 auto 4px; display:block; }

/* ============================================================
   ENGLISH — affirmation and ten phrases a day
   ============================================================ */
.affirm{
  background:var(--accent-soft); border:var(--border-w) solid var(--line);
  border-radius:var(--radius-lg); padding:22px 20px 20px; margin-bottom:22px;
}
.affirm .eyebrow{ color:var(--accent); margin-bottom:10px; }
.affirm blockquote{
  margin:0; font-family:var(--font-display); font-weight:var(--display-weight);
  letter-spacing:var(--display-tracking); font-size:20px; line-height:1.3; text-wrap:balance; color:var(--ink);
}
.affirm-strip{
  width:100%; text-align:left; display:block;
  background:var(--accent-soft); border:var(--border-w) solid var(--line);
  border-radius:var(--radius); padding:13px 15px; margin-bottom:20px;
  transition:transform .18s cubic-bezier(.2,.8,.2,1);
}
.affirm-strip:active{ transform:scale(.985); }
.affirm-strip .eyebrow{ color:var(--accent); display:block; margin-bottom:5px; }
.affirm-strip q{
  font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking);
  font-size:15px; line-height:1.35; quotes:none; color:var(--ink); display:block;
}
.pack-card{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:18px 16px; margin-bottom:14px;
}
.pack-top{ display:flex; align-items:center; gap:12px; margin-bottom:4px; }
.pack-top .habit-emoji{ width:38px; height:38px; font-size:20px; }
.pack-top h3{
  margin:0; font-family:var(--font-display); font-weight:var(--display-weight);
  letter-spacing:var(--display-tracking); font-size:20px; line-height:1.15;
}
.pack-progress{ display:flex; align-items:center; gap:10px; margin:14px 0 6px; }
.pack-progress .pbar{ flex:1; margin-top:0; }
.pack-progress small{ font-size:11px; font-weight:700; color:var(--ink-mute); letter-spacing:.05em; flex:none; }
.phrases{ display:flex; flex-direction:column; }
.phrase{
  display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; width:100%; text-align:left;
  padding:13px 2px; border-bottom:var(--border-w) solid var(--line);
}
.phrase:last-child{ border-bottom:0; }
.phrase .n{
  width:24px; height:24px; flex:none; border-radius:999px; display:grid; place-items:center;
  font-size:11px; font-weight:700; background:var(--surface-2); color:var(--ink-mute);
  font-variant-numeric:tabular-nums; margin-top:1px; transition:background .18s ease, color .18s ease;
}
.phrase[aria-pressed="true"] .n{ background:var(--accent); color:var(--accent-ink); }
.phrase b{ display:block; font-size:15.5px; line-height:1.3; font-weight:700; }
.phrase em{ display:block; margin-top:3px; font-size:12.5px; line-height:1.4; color:var(--ink-mute); font-style:normal; }
.phrase[aria-pressed="true"] b{ color:var(--ink-mute); }
.librow{
  display:grid; grid-template-columns:auto 1fr auto; gap:11px; align-items:center;
  width:100%; text-align:left; padding:11px 2px; border-bottom:var(--border-w) solid var(--line);
}
.librow:last-child{ border-bottom:0; }
.librow .habit-emoji{ width:34px; height:34px; font-size:17px; border-radius:10px; }
.librow b{ display:block; font-size:14.5px; line-height:1.25; font-weight:600; overflow-wrap:anywhere; }
.librow em{ display:block; font-style:normal; font-size:11.5px; color:var(--ink-mute); margin-top:3px; }
.librow .plus{
  width:32px; height:32px; flex:none; border-radius:999px; display:grid; place-items:center;
  border:var(--border-w) solid var(--line); color:var(--accent); font-size:19px; line-height:1;
  transition:background .18s ease, color .18s ease, border-color .18s ease;
}
.librow.have{ opacity:.55; }
.librow.have .plus{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-size:14px; }
.libcount{ font-size:12.5px; color:var(--ink-mute); margin:0 0 10px; }
.packlist{ display:flex; flex-direction:column; gap:1px; }
.packrow{
  display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; width:100%; text-align:left;
  padding:12px 2px; border-bottom:var(--border-w) solid var(--line); font-size:14.5px; font-weight:600;
}
.packrow:last-child{ border-bottom:0; }
.packrow em{ font-style:normal; font-size:11.5px; font-weight:700; color:var(--ink-mute); font-variant-numeric:tabular-nums; }
.packrow .habit-emoji{ width:32px; height:32px; font-size:17px; border-radius:10px; }

/* ============================================================
   RECIPES
   ============================================================ */
.searchbar{ position:relative; margin-bottom:12px; }
.searchbar input{
  width:100%; padding:12px 14px 12px 40px; border-radius:999px;
  border:var(--border-w) solid var(--line); background:var(--surface); color:var(--ink); font-size:15px;
}
.searchbar svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--ink-mute); pointer-events:none; }
.filters{ display:flex; gap:6px; overflow-x:auto; padding:0 0 4px; margin:0 -16px 16px; padding-left:16px; padding-right:16px; scrollbar-width:none; }
.filters::-webkit-scrollbar{ display:none; }
.filters .chip{ flex:none; padding:7px 13px; font-size:12.5px; }

.rec-list{ display:flex; flex-direction:column; gap:10px; }
.rec{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:10px; display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center;
  width:100%; text-align:left; transition:transform .18s cubic-bezier(.2,.8,.2,1);
}
.rec:active{ transform:scale(.985); }
.rec-thumb{
  width:58px; height:58px; flex:none; border-radius:calc(var(--radius) - 3px);
  background:var(--surface-2) center/cover no-repeat; display:grid; place-items:center; font-size:26px;
}
.rec-body{ min-width:0; }
.rec-body b{ display:block; font-size:15px; line-height:1.25; overflow-wrap:anywhere; }
.rec-body p{ margin:5px 0 0; font-size:12px; color:var(--ink-mute); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.rec-cat{ color:var(--accent); font-weight:700; }
.star{ width:34px; height:34px; flex:none; display:grid; place-items:center; color:var(--ink-mute); border-radius:999px; }
.star svg{ width:19px; height:19px; }
.star[aria-pressed="true"]{ color:var(--gold); }
.star[aria-pressed="true"] svg{ fill:currentColor; }

.rec-hero{
  height:190px; border-radius:var(--radius-lg); background:var(--surface-2) center/cover no-repeat;
  display:grid; place-items:center; font-size:56px; margin-bottom:16px; border:var(--border-w) solid var(--line);
}
.backbtn{ display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; color:var(--ink-mute); padding:6px 2px; margin-bottom:10px; }
.backbtn svg{ width:15px; height:15px; }
.rec-title{ font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking); font-size:27px; line-height:1.12; margin:0 0 10px; text-wrap:balance; }
.rec-meta{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:22px; }
.pill{
  padding:6px 12px; border-radius:999px; font-size:12px; font-weight:700;
  background:var(--surface-2); color:var(--ink-soft);
}
.pill.accent{ background:var(--accent-soft); color:var(--accent); }
.rec-block{ margin-bottom:26px; }
.rec-block > .eyebrow{ display:block; margin-bottom:11px; }
.ings{ display:flex; flex-direction:column; gap:1px; }
.ing{
  display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left;
  padding:11px 2px; border-bottom:var(--border-w) solid var(--line); font-size:14.5px; line-height:1.35;
}
.ing:last-child{ border-bottom:0; }
.ing .box{
  width:20px; height:20px; flex:none; margin-top:1px; border-radius:6px;
  border:2px solid var(--line); display:grid; place-items:center; color:transparent;
  transition:background .18s ease, border-color .18s ease, color .18s ease;
}
.ing .box svg{ width:12px; height:12px; }
.ing[aria-pressed="true"] .box{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.ing[aria-pressed="true"] span{ text-decoration:line-through; color:var(--ink-mute); }
.steps{ display:flex; flex-direction:column; gap:16px; counter-reset:step; }
.step{ display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start; }
.step b{
  font-family:var(--font-display); font-weight:var(--display-weight); font-size:17px; line-height:1;
  width:30px; height:30px; flex:none; border-radius:999px; display:grid; place-items:center;
  background:var(--accent-soft); color:var(--accent); letter-spacing:0;
}
.step p{ margin:4px 0 0; font-size:14.5px; line-height:1.5; }
.note{
  background:var(--surface); border:var(--border-w) solid var(--line); border-left:3px solid var(--gold);
  border-radius:var(--radius); padding:13px 15px; font-size:14px; line-height:1.5; color:var(--ink-soft);
}
.photo-row{ display:flex; gap:9px; align-items:center; }
.photo-prev{ width:56px; height:56px; border-radius:var(--radius); background:var(--surface-2) center/cover no-repeat; flex:none; display:grid; place-items:center; font-size:24px; }

/* ============================================================
   TOAST
   ============================================================ */
.toast{
  position:fixed; z-index:60; left:50%; bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translate(-50%, 14px); opacity:0; pointer-events:none;
  background:var(--ink); color:var(--ground);
  padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
  max-width:min(88vw, 420px); text-align:center;
  transition:opacity .25s ease, transform .25s ease;
}
.toast.show{ opacity:1; transform:translate(-50%, 0); }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

/* ---------- Sound: a fanfare built from oscillators, no files needed ---------- */
let AC = null;
function audio(){
  if(state.sound === false) return null;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function note(ac, at, freq, dur, gain, type){
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(gain, at + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(at); o.stop(at + dur + 0.05);
}
function boom(ac, at, gain){
  const len = Math.floor(ac.sampleRate * 0.6);
  const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 2.6);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(2200, at);
  f.frequency.exponentialRampToValueAtTime(110, at + 0.45);
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.6);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(at);
}
function whoosh(ac, at){
  const len = Math.floor(ac.sampleRate * 0.5);
  const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * 0.5;
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 6;
  f.frequency.setValueAtTime(400, at);
  f.frequency.exponentialRampToValueAtTime(2600, at + 0.42);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(0.12, at + 0.1);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.46);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(at);
}
function fanfare(){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + 0.06;
  const C5 = 523.25, E5 = 659.25, G5 = 783.99, C6 = 1046.5, C4 = 261.63, G3 = 196.0;
  [[C5, 0], [E5, 0.11], [G5, 0.22], [C6, 0.33]].forEach(function(n){
    note(ac, t + n[1], n[0], 0.42, 0.16);
    note(ac, t + n[1], n[0] / 2, 0.42, 0.07, 'sine');
  });
  [C5, E5, G5, C6].forEach(function(f){ note(ac, t + 0.58, f, 1.5, 0.12); });
  note(ac, t + 0.58, C4, 1.7, 0.11, 'sine');
  note(ac, t + 0.58, G3, 1.7, 0.08, 'sine');
  [0.02, 0.55, 1.05, 1.55, 2.1, 2.6].forEach(function(d, i){ boom(ac, t + d, 0.5 - i*0.03); });
  [0.5, 1.0, 1.5, 2.05, 2.55].forEach(function(d){ whoosh(ac, t + d - 0.42); });
}

/* ---------- Fireworks ---------- */
let fxRunning = false;
function fireworks(opt){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  opt = opt || {};
  const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cs = getComputedStyle(document.documentElement);
  const COLS = [cs.getPropertyValue('--accent').trim(), cs.getPropertyValue('--gold').trim(),
                '#FF5C8A', '#4FE3C1', '#FFD84D', '#7AA5FF', '#FF9F45', '#FFFFFF'];

  const veilMax = opt.veil == null ? 0.34 : opt.veil;
  const total = opt.duration || 130;
  const parts = [];
  const queue = (opt.bursts || []).slice().sort(function(a, b){ return (a.at||0) - (b.at||0); });

  function spawn(b){
    const n = b.count || 150, power = b.power || 1.6;
    const hue = b.mono ? COLS[(Math.random()*COLS.length)|0] : null;
    for(let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2;
      const v = (1.5 + Math.pow(Math.random(), 0.6) * 9) * power;
      parts.push({
        x: b.x, y: b.y, px: b.x, py: b.y,
        vx: Math.cos(a)*v, vy: Math.sin(a)*v - 1.2*power,
        c: hue || COLS[(Math.random()*COLS.length)|0],
        w: 1.4 + Math.random()*2.8,
        life: 0, max: 55 + Math.random()*55
      });
    }
  }

  let t = 0;
  if(fxRunning) fxRunning = false;
  fxRunning = true;
  (function frame(){
    t++;
    const fade = t < 8 ? t/8 : (t > total - 34 ? Math.max(0, (total - t)/34) : 1);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H);
    if(veilMax > 0){
      ctx.fillStyle = 'rgba(9,7,16,' + (veilMax * fade).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    while(queue.length && (queue[0].at || 0) <= t) spawn(queue.shift());

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for(const p of parts){
      p.life++;
      if(p.life > p.max) continue;
      p.px = p.x; p.py = p.y;
      p.vy += 0.15;
      p.vx *= 0.982; p.vy *= 0.982;
      p.x += p.vx; p.y += p.vy;
      const a = Math.max(0, 1 - p.life / p.max) * fade;
      ctx.strokeStyle = p.c;
      ctx.globalAlpha = a * 0.28;                       // glow
      ctx.lineWidth = p.w * 3.4;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.globalAlpha = a;                              // core
      ctx.lineWidth = p.w;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
    }

    if(t < total && fxRunning) requestAnimationFrame(frame);
    else {
      fxRunning = false;
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.clearRect(0, 0, W, H);
    }
  })();
}

function lookUp(raw, lang){
  const dict = GLOSS[lang]; if(!dict) return null;
  const w = String(raw).toLowerCase().replace(/[\u2019]/g, "'").replace(/^[^a-z\u00e0-\u00ff']+|[^a-z\u00e0-\u00ff']+$/g, '');
  if(!w) return null;
  if(dict[w]) return dict[w];
  const tries = [w.replace(/e?s$/, ''), w.replace(/e?d$/, ''), w.replace(/ing$/, ''),
                 w.replace(/ing$/, 'e'), w.split("'").pop(), w.split("'")[0]];
  for(const t of tries){ if(t && dict[t]) return dict[t]; }
  return null;
}
function wordify(text, lang){
  if(lang === 'ru') return esc(text);
  return String(text).split(/([A-Za-z\u00c0-\u00ff][A-Za-z\u00c0-\u00ff'\u2019-]*)/).map(function(part, i){
    if(i % 2 === 0) return esc(part);
    return '<b class="tw" data-w="' + esc(part) + '">' + esc(part) + '</b>';
  }).join('');
}

  {d:11, lang:'ru', lvl:'native', topic:'История', title:'Как кража сделала «Джоконду» знаменитой',
   body:['До 1911 года «Мона Лиза» была уважаемой картиной Лувра, но не иконой. Утром 21 августа её украл Винченцо Перуджа — итальянский рабочий, который делал для музея защитные короба. Он просто снял её со стены и вынес под халатом.','Пропажу заметили только через сутки. Два года пустая стена собирала очереди: люди приходили смотреть на место, где висела картина. Газеты всего мира печатали репродукции.','Когда в 1913 году Перуджа попытался продать её во Флоренции, «Джоконда» вернулась уже мировой звездой. Славу ей сделала не живопись, а её отсутствие.'],
   q:[['Кто украл картину и почему это было легко?','Винченцо Перуджа, работавший в музее: он снял её со стены и вынес под халатом.'],['Что происходило в Лувре два года?','Люди приходили смотреть на пустую стену, где висела картина.'],['Что на самом деле принесло картине славу?','Её отсутствие и газетная шумиха, а не сама живопись.']],
   w:[['to go missing','пропасть, исчезнуть','The painting went missing for two years.'],['a queue','очередь','The empty wall drew queues.'],['to make headlines','попасть в заголовки','The theft made headlines worldwide.'],['absence','отсутствие','Its fame came from its absence.']],
   say:{prompt:'Расскажи по-английски о картине или месте, которое произвело на тебя впечатление. Почему именно оно?', helpers:['The one that stayed with me is…','What struck me was…','I had not expected it to be so…']}},
  {d:12, lang:'en', lvl:'B2', topic:'Technology', title:'How noise-cancelling actually works',
   src:{name:'The Conversation', url:'https://theconversation.com/noise-cancelling-headphones-earplugs-and-earmuffs-do-they-really-help-neurodivergent-people-230113'},
   body:['A microphone on the outside of the earcup listens to the world. A chip measures the incoming wave and produces a second wave shifted by exactly half a cycle. Where a peak arrives, the headphone sends a dip, and the two cancel each other out.','This works beautifully on low, steady sound: engine noise, air conditioning, the hum of a plane. It works badly on speech, because the chip has to predict the next fraction of a second, and voices are unpredictable.','That is why an open-plan office still gets through while a flight goes quiet. The technology is not silencing noise so much as guessing it in advance.'],
   q:[['What does the outside microphone do?','It listens to incoming sound so the chip can measure the wave.'],['Which sounds are cancelled best?','Low, steady ones, because they are predictable.'],['Why does speech get through?','Voices change too fast for the chip to predict.']],
   w:[['a hum','гул, ровный низкий звук','The hum of a plane disappears.'],['to cancel out','гасить, взаимно уничтожать','The two waves cancel each other out.'],['to get through','пробиваться, просачиваться','An office still gets through.'],['in advance','заранее','Guessing the noise in advance.']],
   say:{prompt:'What noise bothers you most, and what do you do about it?', helpers:['The one that really gets to me is…','I usually deal with it by…','I have got used to…, but not to…']}},
  {d:13, lang:'fr', lvl:'B1+', topic:'Géologie', title:'Quand la Méditerranée s\'est asséchée',
   body:['Il y a six millions d\'années, le détroit de Gibraltar s\'est fermé. La Méditerranée n\'était plus reliée à l\'Atlantique, et elle s\'est évaporée presque entièrement.','Il est resté des plaines de sel, à trois kilomètres sous le niveau de la mer. On l\'a découvert dans les années 1970, en forant sous le fond marin : les couches de sel étaient là, très épaisses.','Puis l\'Atlantique est revenu. Selon les chercheurs, le remplissage a été rapide — peut-être quelques années seulement, avec une cascade plus puissante que tous les fleuves actuels réunis.'],
   q:[['Pourquoi la mer s\'est-elle évaporée ?','Le détroit de Gibraltar s\'est fermé et l\'a coupée de l\'Atlantique.'],['Comment le sait-on ?','On a trouvé d\'épaisses couches de sel en forant sous le fond marin.'],['Le remplissage a-t-il été lent ?','Non, il a probablement duré seulement quelques années.']],
   w:[['s\'assécher','высыхать','La Méditerranée s\'est asséchée.'],['forer','бурить','On l\'a découvert en forant sous le fond marin.'],['une couche','слой','Les couches de sel étaient très épaisses.'],['réuni','вместе взятый','Tous les fleuves actuels réunis.']],
   say:{prompt:'Quel paysage naturel t\'impressionne le plus ? Décris-le en trois phrases.', helpers:['Ce qui m\'impressionne le plus, c\'est…','Quand on est là-bas, on a l\'impression que…','J\'aimerais y retourner parce que…']}},
  {d:14, lang:'en', lvl:'B2', topic:'Neuroscience', title:'Sleep is when the filing happens',
   body:['During the day the hippocampus takes rough notes. At night, especially in deep sleep, it replays the day\'s sequences to the cortex — sometimes twenty times faster than they happened — and the cortex decides what to keep.','The experiments show this clearly. People who learn a task and then sleep do better the next morning than people kept awake for the same number of hours. More than that: the size of the improvement follows the amount of deep sleep they got.','Practice writes the draft. Sleep decides what survives.'],
   q:[['What does the hippocampus do at night?','It replays the day\'s sequences to the cortex, often speeded up.'],['What do the experiments compare?','People who slept after learning against people kept awake.'],['What does the size of the improvement depend on?','How much deep sleep they got.']],
   w:[['to replay','прокручивать заново','It replays the day\'s sequences.'],['to keep','сохранять, оставлять','The cortex decides what to keep.'],['to follow something','зависеть от, идти вслед','The improvement follows the amount of deep sleep.'],['a draft','черновик','Practice writes the draft.']],
   say:{prompt:'Describe your evening routine. What helps you sleep and what ruins it?', helpers:['What actually helps is…','The thing that ruins it is…','On a good night I…']}},
  {d:15, lang:'ru', lvl:'native', topic:'Экология', title:'Мусорное пятно, которое нельзя увидеть',
   body:['Название обманывает. Большое тихоокеанское мусорное пятно — не остров и не плёнка: почти всё это микропластик, взвешенный в толще воды. С борта судна вы, скорее всего, не увидите ничего необычного.','Крупные объекты там тоже есть, и больше половины по массе — это брошенные рыболовные сети. Они опаснее пакетов: в них продолжают запутываться животные.','Отсюда и главная проблема уборки. Вылавливать сети имеет смысл, а процеживать океан от частиц размером с песчинку — нет: вместе с ними вылавливается планктон, то есть основание всей пищевой цепи.'],
   q:[['Почему пятно нельзя увидеть с корабля?','Это в основном микропластик, взвешенный в воде, а не остров.'],['Что составляет больше половины массы?','Брошенные рыболовные сети.'],['Почему нельзя просто процедить океан?','Вместе с частицами вылавливается планктон — основа пищевой цепи.']],
   w:[['misleading','обманчивый, вводящий в заблуждение','The name is misleading.'],['to be suspended in','быть взвешенным в (среде)','Particles suspended in the water.'],['discarded','брошенный, выброшенный','Discarded fishing nets.'],['the food chain','пищевая цепь','Plankton is the base of the food chain.']],
   say:{prompt:'Расскажи по-английски об одной привычке, которую ты поменяла ради экологии — или не смогла поменять.', helpers:['One thing I have actually changed is…','I keep meaning to…, but…','It is easier said than done because…']}},
  {d:16, lang:'fr', lvl:'B1+', topic:'Perception', title:'Pourquoi le bâillement est contagieux',
   src:{name:'The Conversation', url:'https://theconversation.com/pourquoi-a-t-on-envie-de-bailler-lorsque-lon-voit-quelquun-bailler-239646'},
   body:['Il suffit souvent de voir quelqu\'un bâiller pour bâiller à son tour. Parfois, lire le mot suffit aussi.','Ce réflexe apparaît vers quatre ou cinq ans — exactement l\'âge où les enfants commencent à comprendre ce que ressentent les autres. Et il est plus fort entre proches : on bâille plus facilement avec sa famille qu\'avec un inconnu.','Tout cela pousse les chercheurs vers l\'empathie plutôt que vers la fatigue. Dernier détail curieux : le chien bâille aussi quand son maître bâille.'],
   q:[['À quel âge le réflexe apparaît-il ?','Vers quatre ou cinq ans.'],['Avec qui bâille-t-on le plus facilement ?','Avec les proches, la famille et les amis.'],['Quel exemple concerne les animaux ?','Le chien bâille quand son maître bâille.']],
   w:[['bâiller','зевать','Il suffit de voir quelqu\'un bâiller.'],['à son tour','в свою очередь','Bâiller à son tour.'],['un proche','близкий человек','Plus fort entre proches.'],['ressentir','чувствовать, ощущать','Comprendre ce que ressentent les autres.']],
   say:{prompt:'Es-tu quelqu\'un d\'empathique ? Donne un exemple concret.', helpers:['Je dirais que oui, surtout quand…','Par exemple, il m\'arrive de…','Par contre, j\'ai du mal à…']}},
  {d:17, lang:'en', lvl:'B2', topic:'Chemistry', title:'A perfume is built in three layers',
   body:['Perfumers talk about a pyramid. Top notes are the small, light molecules — citrus, mint — that arrive first and vanish within twenty minutes. Heart notes, usually floral or spiced, hold the middle hour. Base notes are heavy and slow: wood, resin, musk, still there at the end of the day.','The order is simply physics. Lighter molecules evaporate faster, so a perfume unfolds in the order of its own molecular weights.','This is why testing on paper misleads you. Paper gives you the opening. Skin, warm and slightly oily, gives you everything after it.'],
   q:[['How long do top notes last?','Around twenty minutes.'],['Why does a scent change over time?','Lighter molecules evaporate first, heavier ones stay.'],['Why is paper a poor test?','It only shows the opening, not how the base develops on skin.']],
   w:[['to vanish','исчезать','Top notes vanish within twenty minutes.'],['to evaporate','испаряться','Lighter molecules evaporate faster.'],['to unfold','разворачиваться, раскрываться','A perfume unfolds over hours.'],['to mislead','вводить в заблуждение','Testing on paper misleads you.']],
   say:{prompt:'Describe a smell that takes you somewhere. Where does it take you?', helpers:['As soon as I smell…, I am back in…','It reminds me of…','I cannot explain why, but…']}},
  {d:18, lang:'ru', lvl:'native', topic:'Лингвистика', title:'Откуда взялась раскладка QWERTY',
   body:['Расхожая версия: буквы расставили так, чтобы замедлить машинистку и уберечь рычаги от заклинивания. Это в лучшем случае половина правды.','Историки языка показали другое: раскладка складывалась постепенно, под влиянием телеграфистов, которые принимали азбуку Морзе на слух и жаловались на путаницу между похожими сочетаниями. Часть перестановок сделана ради них.','Разводить часто соседствующие пары букв действительно было нужно — но ради скорости, а не против неё: заклинивший рычаг останавливает работу полностью.'],
   q:[['В чём популярная версия неточна?','Раскладку делали не для замедления печати.'],['Кто повлиял на раскладку?','Телеграфисты, принимавшие Морзе на слух.'],['Зачем всё же разводили пары букв?','Чтобы рычаги не заклинивали и работа не останавливалась.']],
   w:[['a myth','миф, расхожее заблуждение','That is a persistent myth.'],['to jam','заклинивать','The levers would jam.'],['gradually','постепенно','The layout emerged gradually.'],['at best','в лучшем случае','That is at best half true.']],
   say:{prompt:'Расскажи по-английски, каким устройством ты пользуешься каждый день, но которое кажется тебе неудобным.', helpers:['The design that annoys me most is…','You would think that by now…','I have simply learned to live with…']}},
  {d:19, lang:'en', lvl:'B2', topic:'Work and habits', title:'Why every plan takes longer',
   src:{name:'The Conversation', url:'https://theconversation.com/daniel-kahneman-changed-how-we-think-about-human-nature-the-psychologist-remembered-by-a-former-student-226860'},
   body:['Ask people how long a task will take and they will underestimate it. This happens in every study, and it happens even to people who know about the effect. Kahneman and Tversky called it the planning fallacy.','The reason is that we plan the story of the task, not its history. We imagine the smooth version — sit down, do it, finish — and we leave out the interruptions, the false start, the day we were ill, because none of that belongs to the story we are telling.','The fix is boring. Ignore your estimate and look at how long the last three similar things actually took. That number is dull, and it is usually right.'],
   q:[['Who is immune to the planning fallacy?','Nobody — even people who know about it underestimate.'],['What do we leave out when planning?','Interruptions, false starts, illness — everything that spoils the story.'],['What works better than estimating?','Looking at how long similar tasks really took.']],
   w:[['to underestimate','недооценивать','People reliably underestimate.'],['to leave something out','упускать, не учитывать','We leave out the interruptions.'],['a false start','фальстарт, неудачный заход','The false start is never in the plan.'],['dull','скучный, невзрачный','That number is dull, and it is usually right.']],
   say:{prompt:'Think of something that took far longer than planned. What did you leave out?', helpers:['I gave myself a week, and it took…','What I completely forgot to include was…','Next time I would double…']}},
  {d:20, lang:'fr', lvl:'B1+', topic:'Médecine', title:'L\'effet nocebo',
   body:['Tout le monde connaît le placebo : un comprimé sans médicament qui soulage, simplement parce qu\'on attend un soulagement. L\'effet nocebo, c\'est l\'inverse.','Si on prévient un patient qu\'un traitement donne des nausées, une partie du groupe en aura — même sans médicament actif. L\'effet est réel et parfois fort.','Cela pose un problème au médecin : il doit informer des effets secondaires, mais l\'information elle-même peut les provoquer. Certains hôpitaux changent donc la formulation. Ils disent « quatre-vingt-dix patients sur cent le supportent bien » au lieu de « dix sur cent ont des nausées ».'],
   q:[['Qu\'est-ce que l\'effet nocebo ?','Des symptômes qui apparaissent parce qu\'on les attend, sans médicament actif.'],['Quel est le problème pour le médecin ?','Informer des effets secondaires peut les provoquer.'],['Que font certains hôpitaux ?','Ils reformulent la même statistique de façon positive.']],
   w:[['un comprimé','таблетка','Un comprimé sans médicament.'],['soulager','облегчать','Un comprimé qui soulage.'],['prévenir quelqu\'un','предупредить кого-то','Si on prévient un patient…'],['supporter','переносить (лечение)','Quatre-vingt-dix patients le supportent bien.']],
   say:{prompt:'Penses-tu que les mots d\'un médecin changent ce qu\'on ressent ? Donne ton avis.', helpers:['Je pense que oui, parce que…','Il m\'est déjà arrivé de…','Cela dit, il ne faut pas exagérer :…']}},
  {d:21, lang:'en', lvl:'B2+', topic:'Botany', title:'The wood wide web, with an asterisk',
   src:{name:'The Conversation', url:'https://theconversation.com/do-trees-really-stay-in-touch-via-a-wood-wide-web-heres-what-the-evidence-says-199806'},
   body:['Trees are connected underground by fungal threads. Through them, carbon, nitrogen and water can move between plants, and the fungi take sugar in return. That much is well established.','The popular story goes further: mother trees deliberately feeding their seedlings, forests behaving as one organism. In 2023 a review of the evidence found that the most repeated claims rest on very few field studies, and some do not replicate.','So the network is real and remarkable. Whether it is generous is a separate question — and one the data has not answered yet.'],
   q:[['What is well established?','That fungal threads connect trees and that substances move between them.'],['What did the 2023 review find?','The most repeated claims rest on very few studies, and some do not replicate.'],['What is the honest summary?','The network exists; its supposed generosity is unproven.']],
   w:[['well established','твёрдо установленный, доказанный','That much is well established.'],['to rest on something','опираться на что-то','The claims rest on very few studies.'],['to replicate','воспроизводиться (об исследовании)','Some results do not replicate.'],['a separate question','отдельный вопрос','Whether it is generous is a separate question.']],
   say:{prompt:'Have you ever believed a fact for years and then found out it was wrong? Tell the story.', helpers:['For years I was convinced that…','Then I read that…','I still catch myself repeating it.']}},
  {d:22, lang:'ru', lvl:'native', topic:'Деньги и привычки', title:'Почему отменить подписку труднее, чем оформить',
   body:['Оформление занимает два касания, отмена — семь экранов, звонок или письмо. Это не лень разработчиков, а проектное решение: приёмы такого рода называют тёмными паттернами.','Работают они на нашей инерции. Каждое лишнее действие отсеивает часть людей, и компании это измеряют. Отсюда же предвыбранные галочки, кнопка «остаться» крупнее кнопки «уйти» и фраза «вы потеряете все данные».','С 2023–2024 годов регуляторы в ЕС и США начали требовать симметрии: отписка должна быть не сложнее подписки. Пока это работает не везде, и самая надёжная защита прежняя — календарное напоминание за день до списания.'],
   q:[['Почему отмена сложная?','Это спроектировано специально: каждое лишнее действие отсеивает часть людей.'],['Какие ещё приёмы используются?','Предвыбранные галочки, крупная кнопка «остаться», предупреждение о потере данных.'],['Что требуют регуляторы?','Чтобы отписка была не сложнее подписки.']],
   w:[['to cancel a subscription','отменить подписку','It took me an hour to cancel the subscription.'],['a dark pattern','тёмный паттерн (манипулятивный интерфейс)','That is a classic dark pattern.'],['by default','по умолчанию','The box is ticked by default.'],['a reminder','напоминание','Set a reminder the day before.']],
   say:{prompt:'Расскажи по-английски, на что ты подписана и что из этого стоит отменить.', helpers:['I am paying for… and I barely use it.','It renews automatically, which is how…','I keep meaning to cancel…']}},
  {d:23, lang:'fr', lvl:'B2', topic:'Cryptographie', title:'Le manuscrit de Voynich',
   src:{name:'Futura Sciences', url:'https://www.futura-sciences.com/sciences/actualites/series-ete-livre-personne-ne-peut-lire-manuscrit-voynich-defie-encore-monde-136143/'},
   body:['Deux cent quarante pages, une écriture inconnue, des plantes qui n\'existent pas, des femmes dans des bassins reliés par des tuyaux. Le parchemin a été daté au carbone du début du XVe siècle.','Depuis un siècle, cryptographes militaires et linguistes s\'y cassent les dents. Le texte se comporte statistiquement comme une vraie langue — la fréquence des mots suit les lois habituelles — ce qui rend l\'hypothèse du pur charabia difficile à tenir.','Mais aucune lecture proposée n\'a convaincu deux spécialistes à la fois. C\'est peut-être le document le plus étudié et le moins compris d\'Occident.'],
   q:[['De quand date le parchemin ?','Du début du XVe siècle, d\'après la datation au carbone.'],['Pourquoi l\'hypothèse du charabia est-elle difficile ?','Le texte suit les régularités statistiques d\'une vraie langue.'],['Une lecture a-t-elle été acceptée ?','Non, aucune n\'a convaincu deux spécialistes à la fois.']],
   w:[['se casser les dents sur','обломать зубы о (не справиться)','Les linguistes s\'y cassent les dents.'],['le charabia','тарабарщина, бессмыслица','L\'hypothèse du pur charabia.'],['tenir (une hypothèse)','держаться, быть состоятельным','Difficile à tenir.'],['convaincre','убедить','Aucune lecture n\'a convaincu.']],
   say:{prompt:'Y a-t-il un mystère qui te fascine ? Explique lequel et pourquoi.', helpers:['Ce qui me fascine, c\'est…','J\'ai toujours voulu savoir si…','Au fond, j\'aime bien que ça reste inexpliqué.']}},
  {d:24, lang:'en', lvl:'B2+', topic:'Food science', title:'Fermentation, invented everywhere at once',
   body:['Kimchi, sauerkraut, yoghurt, miso, kefir, injera, kvass. Cultures with no contact arrived at the same trick: let controlled microbes eat the sugars first so that nothing dangerous gets a chance.','The chemistry is the same everywhere. Lactic acid bacteria drop the pH below about 4.5, and most spoilage organisms cannot survive there. Preservation came first; the flavour was a side effect people learned to love.','Modern work has added a third argument. These foods arrive with living bacteria, and some of them measurably affect the gut — which the inventors could not have known and got right anyway.'],
   q:[['What problem was fermentation solving?','Keeping food safe by letting harmless microbes take the sugars first.'],['What does lactic acid do?','It drops the pH below about 4.5, where spoilage organisms cannot survive.'],['What is the modern addition to the story?','The live bacteria themselves appear to affect the gut.']],
   w:[['to arrive at something','прийти к чему-то (решению)','Cultures arrived at the same trick.'],['spoilage','порча (продуктов)','Spoilage organisms cannot survive.'],['a side effect','побочный эффект','The flavour was a side effect.'],['measurably','заметно, измеримо','Some measurably affect the gut.']],
   say:{prompt:'Which fermented food do you actually like, and which one can you not get past?', helpers:['I could eat… every day.','I have tried to like…, and I cannot.','It is the texture rather than the taste that…']}},
  {d:25, lang:'ru', lvl:'native', topic:'Хронобиология', title:'Свет как главный будильник',
   body:['Внутренние часы человека идут не ровно сутки — в среднем чуть длиннее. Каждый день их приходится подводить, и делает это свет.','В сетчатке есть особые клетки, не отвечающие за зрение: они реагируют на яркий синеватый свет и сообщают мозгу, что сейчас день. Утренний свет сдвигает фазу назад и помогает раньше засыпать, вечерний — вперёд и мешает.','Практический вывод скучный, но рабочий: десять минут на улице сразу после пробуждения делают для сна больше, чем отказ от экрана поздним вечером.'],
   q:[['Почему часы надо подводить каждый день?','Внутренний цикл длится чуть больше суток.'],['Какие клетки сообщают мозгу о свете?','Особые клетки сетчатки, не участвующие в зрении.'],['Что эффективнее для сна?','Утренний свет на улице — больше, чем отказ от экрана вечером.']],
   w:[['to shift','сдвигать','Morning light shifts the phase.'],['daylight','дневной свет','Ten minutes of daylight.'],['to reset','перенастроить, подвести (часы)','Light resets the internal clock.'],['dull but effective','скучно, но работает','The advice is dull but effective.']],

function wkTypeFor(key){
  const saved = state.workouts[key];
  if(saved && saved.type) return saved.type;
  return WK_WEEK[toDate(key).getDay()];
}
function wkPool(type){ return WORKOUTS.filter(function(w){ return w.type === type; }); }

// five options, always the same target, always a ladder of lengths, rotating day to day
function wkPicks(type, key){
  const pool = wkPool(type).slice().sort(function(a, b){ return a.min - b.min || a.diff.localeCompare(b.diff); });
  if(pool.length <= 5) return pool;
  const seed = Math.floor(Date.parse(key + 'T00:00:00Z') / 86400000);
  const out = [], size = pool.length / 5;
  for(let i = 0; i < 5; i++){
    const from = Math.floor(i * size), to = Math.max(from + 1, Math.floor((i + 1) * size));
    const group = pool.slice(from, to);
    out.push(group[(seed + i) % group.length]);
  }
  return out;
}
function wkSort(list){
  const rank = {easy:0, medium:1, hard:2};
  return list.slice().sort(function(a, b){
    if(wkEnergy === 'low')  return a.min - b.min || rank[a.diff] - rank[b.diff];
    if(wkEnergy === 'high') return b.min - a.min || rank[b.diff] - rank[a.diff];
    return Math.abs(a.min - 25) - Math.abs(b.min - 25) || rank[a.diff] - rank[b.diff];
  });
}
function wkVisible(key){
  const type = wkTypeFor(key);
  const band = WK_BANDS.find(function(b){ return b[0] === wkBand; });
  const base = wkBand === 'all' ? wkPicks(type, key) : wkPool(type).filter(band[2]).slice(0, 6);
  return wkSort(base);
}
function wkById(id){ return WORKOUTS.find(function(w){ return w.id === id; }); }
function wkHabit(){ return state.habits.find(function(h){ return h.id === 'hw'; }); }
function wkWeek(){
  const ws = weekStart(today());
  let n = 0, mins = 0, strength = 0, cardio = 0;
  for(let i = 0; i < 7; i++){
    const rec = state.workouts[shift(ws, i)];
    if(!rec || !rec.doneId) continue;
    const w = wkById(rec.doneId);
    n++; mins += (rec.min || (w ? w.min : 0));
    const kind = w ? WK_TYPES[w.type].kind : 'strength';
    if(kind === 'cardio') cardio++; else if(kind === 'strength') strength++;
  }
  return {n:n, mins:mins, strength:strength, cardio:cardio};
}
