/* ---------- Habit helpers ---------- */
function count(h, key){ const l=state.log[h.id]; return (l && l[key]) || 0; }
function isDone(h, key){ return count(h, key) >= (h.perDay||1); }
function setCount(h, key, n){
  if(!state.log[h.id]) state.log[h.id]={};
  if(n<=0) delete state.log[h.id][key]; else state.log[h.id][key]=n;
}
function streakOf(h){
  let k = today(), n = 0;
  if(!isDone(h,k)) k = shift(k,-1);
  while(isDone(h,k)){ n++; k = shift(k,-1); }
  return n;
}
function weekStart(key){ const d=toDate(key); const w=(d.getDay()+6)%7; return shift(key, -w); }
function weekDone(h){
  const ws = weekStart(today()); let n=0;
  for(let i=0;i<7;i++) if(isDone(h, shift(ws,i))) n++;
  return n;
}
function activeHabits(){ return state.habits.filter(h=>!h.archived); }
function doneToday(){ return activeHabits().filter(h=>isDone(h, today())).length; }

function stats(){
  const hs = activeHabits();
  let total=0;
  for(const id in state.log) for(const k in state.log[id]) total += state.log[id][k];
  let best=0;
  for(const h of state.habits){
    const keys = Object.keys(state.log[h.id]||{}).sort();
    let run=0, prev=null, mx=0;
    for(const k of keys){
      if(!isDone(h,k)) continue;
      run = (prev && shift(prev,1)===k) ? run+1 : 1;
      prev = k; if(run>mx) mx=run;
    }
    if(mx>best) best=mx;
  }
  let perfect=0;
  if(hs.length){
    const seen={};
    for(const h of hs) for(const k in (state.log[h.id]||{})) seen[k]=1;
    for(const k in seen) if(hs.every(h=>isDone(h,k))) perfect++;
  }
  return {total, best, perfect, words: (state.words||[]).length};
}
function levelInfo(){
  let i=0; while(i+1<LEVELS.length && state.xp>=LEVELS[i+1].xp) i++;
  const cur=LEVELS[i], next=LEVELS[i+1];
  const pct = next ? Math.round((state.xp-cur.xp)/(next.xp-cur.xp)*100) : 100;
  return {index:i+1, name:cur.name, pct, next:next?next.xp-state.xp:0};
}

/* ---------- Day ring ---------- */
function ring(){
  const hs = activeHabits(), n = hs.length;
  const R = 54, C = 2*Math.PI*R;
  let segs = '';
  if(n === 0){
    segs = '<circle class="seg off" cx="62" cy="62" r="'+R+'"/>';
  } else {
    const gap = n>1 ? Math.min(14, Math.max(5, C/n*0.26)) : 0;
    const seg = C/n, drawn = Math.max(2, seg-gap);
    hs.forEach((h,i)=>{
      const on = isDone(h, today());
      segs += '<circle class="seg '+(on?'on':'off')+'" cx="62" cy="62" r="'+R+'" '+
              'stroke-dasharray="'+drawn.toFixed(2)+' '+(C-drawn).toFixed(2)+'" '+
              'stroke-dashoffset="'+(-i*seg).toFixed(2)+'"><title>'+esc(h.title)+'</title></circle>';
    });
  }
  return '<div class="ring"><svg viewBox="0 0 124 124" aria-hidden="true">'+segs+'</svg>'+
    '<span class="ring-center"><b class="num">'+doneToday()+'<small>/'+n+'</small></b><span>today</span></span></div>';
}

/* ---------- To-do: the things that are not habits ---------- */
let todoDraft = '';
function todos(){ return state.todos || (state.todos = []); }
function tdSort(list){
  return list.slice().sort(function(a, b){
    if(!!a.done !== !!b.done) return a.done ? 1 : -1;
    const at = a.time || '99:99', bt = b.time || '99:99';
    if(at !== bt) return at < bt ? -1 : 1;
    return (a.made || 0) - (b.made || 0);
  });
}
function tdGroups(){
  const key = today(), tom = shift(key, 1);
  const g = {late:[], today:[], tomorrow:[], later:[], someday:[]};
  todos().forEach(function(t){
    if(!t.date) { g.someday.push(t); return; }
    if(t.date < key) { (t.done ? g.today : g.late).push(t); return; }
    if(t.date === key) { g.today.push(t); return; }
    if(t.date === tom) { g.tomorrow.push(t); return; }
    g.later.push(t);
  });
  Object.keys(g).forEach(function(k){ g[k] = tdSort(g[k]); });
  return g;
}
function tdOpenToday(){
  return todos().filter(function(t){ return !t.done && t.date && t.date <= today(); });
}
function tdWhen(t){
  if(!t.date) return 'no date';
  if(t.date === today()) return 'today';
  if(t.date === shift(today(), 1)) return 'tomorrow';
  const d = toDate(t.date);
  return WDAYS[d.getDay()].slice(0,3) + ', ' + MONTHS[d.getMonth()].slice(0,3) + ' ' + d.getDate();
}

function tdRow(t, showWhen){
  const late = !t.done && t.date && t.date < today();
  const bits = [];
  if(showWhen) bits.push(tdWhen(t));
  if(t.note) bits.push(esc(t.note));
  return '<article class="td'+(t.done ? ' done' : '')+(late ? ' td-late' : '')+'">'+
    '<button class="box" data-act="td-toggle" data-id="'+t.id+'" aria-pressed="'+(t.done?'true':'false')+'" aria-label="Done">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'+
    '</button>'+
    '<button class="td-main" data-act="td-edit" data-id="'+t.id+'"><b>'+esc(t.t)+'</b>'+
      (bits.length ? '<em>'+bits.join(' · ')+'</em>' : '')+'</button>'+
    (t.time ? '<span class="td-time">'+esc(t.time)+'</span>' : '<span></span>')+
    '</article>';
}

  let html = '<div class="td-add">'+

    '<button data-act="td-quick" aria-label="Add">+</button></div>';

  const blocks = [
    ['late', 'Overdue', true],
    ['today', left ? 'Today · ' + left + ' left' : 'Today', false],
    ['tomorrow', 'Tomorrow', false],
    ['later', 'Later', true],
    ['someday', 'No date yet', false]
  ];
  let any = false;
  blocks.forEach(function(b){
    const list = g[b[0]];

    any = true;
    html += '<section class="td-group'+(b[0] === 'late' ? ' late' : '')+'"><p class="eyebrow">'+b[1]+'</p>'+
      '<div class="td-list">'+list.map(function(t){ return tdRow(t, b[2]); }).join('')+'</div></section>';
  });

  if(!any){
    html += '<div class="empty" style="padding:44px 16px"><div style="font-size:42px">📋</div>'+
      '<p>Nothing written down.<br>Type it above — a phone call, an appointment, anything that is not a habit.</p></div>';
  } else {
    html += '<p class="sub" style="text-align:center;margin-top:6px">Tap a task to set a time, a day or a note.</p>';
  }
  view.innerHTML = html;
}

     ctx:'I will keep you posted as soon as the results come in.',

     box:0, seen:0, right:0, last:''}
  ];
}
function escRx(t){ return String(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// "to keep someone posted" has to find "keep you posted" in a real sentence
const PLACEHOLDER = /^(someone|somebody|something|sb|sth|one's|oneself|your|yours|his|her|hers|their|theirs|my|mine|its)$/i;
function termRx(words){
  const parts = words.map(function(w){
    return PLACEHOLDER.test(w)
      ? '(?:(?:the|a|an|my|your|his|her|their|our|its)\\s+)?[\\w\\u2019\\u0027-]+'
      : escRx(w).replace(/\\?['’]/g, '[\\u0027\\u2019]');
  });
  try{ return new RegExp(parts.join('[\\s,]+'), 'i'); }catch(e){ return null; }
}
function findTerm(ctx, term){
  let words = String(term || '').trim().split(/\s+/).filter(Boolean);
  if(!words.length) return null;
  if(words.length > 1 && /^to$/i.test(words[0])) words = words.slice(1);
  for(let drop = 0; drop < words.length; drop++){
    const sub = words.slice(drop).filter(function(w){ return drop === 0 || !PLACEHOLDER.test(w); });
    if(!sub.length) continue;
    const rx = termRx(sub);
    if(!rx) continue;
    const m = rx.exec(ctx);
    if(m && m[0]) return [m.index, m.index + m[0].length];
  }
  return null;
}
function markTerm(ctx, term, mode){
  if(!ctx) return '';
  const r = term ? findTerm(ctx, term) : null;
  if(!r) return esc(ctx);
  const before = esc(ctx.slice(0, r[0])), hit = esc(ctx.slice(r[0], r[1])), after = esc(ctx.slice(r[1]));
  return before + (mode === 'blank' ? '<span class="blank"></span>' : '<mark>' + hit + '</mark>') + after;
}

  return state.words.slice().sort(function(a, b){
    if(a.box !== b.box) return a.box - b.box;
    return (a.last || '').localeCompare(b.last || '');
  });
}

function paintLibList(){

  let rows = '', found = 0;
  LIBRARY.forEach(function(group, gi){
    if(libCat !== 'all' && libCat !== group.cat) return;

      return !q || (group.cat + ' ' + it.t).toLowerCase().replace(/&#39;/g, "'").indexOf(q) !== -1;

function downscale(file, max, cb){
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = function(){
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    try{ cb(c.toDataURL('image/jpeg', 0.7)); }catch(e){ cb(null); }
  };
  img.onerror = function(){ URL.revokeObjectURL(url); cb(null); };
  img.src = url;
}

    if(b.get(s) >= b.goal && !state.claimed[b.id]){ state.claimed[b.id] = true; if(!msg) msg = b.emoji+' '+b.title; }
  }
  if(msg && !silent) setTimeout(()=>toast('Achievement unlocked: '+msg), 700);

function toggleHabit(id, el){
  const h = state.habits.find(x=>x.id===id); if(!h) return;
  const k = today(), per = h.perDay||1, c = count(h,k);
  if(c >= per){
    setCount(h,k,0); state.xp = Math.max(0, state.xp - 10*per); toast('Check-in removed');
  } else {
    setCount(h,k,c+1); state.xp += 10; celebrate(el);
    if(c+1 >= per){
      const box = el && el.querySelector('.check');
      const r = box ? box.getBoundingClientRect() : null;
      const fx = r ? r.left + r.width/2 : innerWidth/2;
      const fy = r ? r.top + r.height/2 : innerHeight/2;
      const st = streakOf(h);

/* ---------- The word bubble ---------- */
let tipT = null;
function hideTip(){
  const t = document.getElementById('tip');
  if(t) t.classList.remove('show');
  document.querySelectorAll('.tw.on').forEach(function(e){ e.classList.remove('on'); });
}
function showTip(el){
  const a = currentRead();
  const raw = el.getAttribute('data-w');
  const tip = document.getElementById('tip');
  if(!tip) return;

  // a word from this article's own list wins — it carries the fuller meaning
  const STOP = ['un','une','le','la','les','des','du','de','au','aux','a','an','the','to','of','in','on','at','for','it','its','and','or','se','que','qui'];
  let hit = null;
  const low = raw.toLowerCase();
  if(STOP.indexOf(low) === -1 && low.length > 2){
    for(const x of (a.w || [])){
      const term = x[0].toLowerCase();
      if(term === low || term.split(/[\s'\u2019]+/).indexOf(low) !== -1){ hit = x[1]; break; }
    }
  }
  const meaning = hit || lookUp(raw, a.lang);

  tip.innerHTML = '<b>' + esc(raw) + '</b>' +
    (meaning ? esc(meaning) : '<i>Нет в словаре — но по контексту обычно понятно.</i>');

  hideTip();
  el.classList.add('on');
  const r = el.getBoundingClientRect();
  tip.style.left = Math.min(Math.max(r.left + r.width/2, 90), innerWidth - 90) + 'px';
  tip.style.top = 'auto';
  tip.style.bottom = (innerHeight - r.top + 6) + 'px';
  tip.classList.add('show');
  clearTimeout(tipT);
  tipT = setTimeout(hideTip, 4200);
}
document.addEventListener('click', function(e){
  const w = e.target.closest && e.target.closest('.tw');
  if(w){ showTip(w); return; }
  hideTip();
}, true);
document.addEventListener('scroll', hideTip, true);

  $('#onboard').classList.add('hidden');
  $('#main').classList.remove('hidden');
  paintHeader(); checkBadges(true); save(); render();
}

if(state.skin){ start(); }
else {
  state.skin = 'peach';
  applySkin(state.skin); applyFont(state.font || 'auto');
  $('#onboard').classList.remove('hidden');
  renderSkinGrid($('#onboardSkins'));
  $('#onboardFonts').innerHTML = fontCards();
  $('#onboardDone').addEventListener('click', function(){
    save(); start(); toast('Theme and typeface live in Settings');
  });
}

/* New day — repaint */
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && state.skin) { paintHeader(); render(); } });

if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
})();
</script>
</body>
</html>
