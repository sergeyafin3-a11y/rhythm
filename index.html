d not sleep that night. A vague feeling of impending misfortune impressed me. My sister and I, you will recollect, were twins, and you know how subtle are the links which bind two souls which are so closely allied. It was a wild night. The wind was howling outside, and the rain was beating and splashing against the windows. Suddenly, amid all the hubbub of the gale, there burst forth the wild scream of a terrified woman. I knew that it was my sister’s voice. I sprang from my bed, wrapped a shawl round me, and rushed into the corridor. As I opened my door I seemed to hear a low whistle, such as my sister described, and a few moments later a clanging sound, as if a mass of metal had fallen. As I ran down the passage, my sister’s door was unlocked, and revolved slowly upon its hinges. I stared at it horror-stricken, not knowing what was about to issue from it. By the light of the corridor-lamp I saw my sister appear at the opening, her face blanched with terror, her hands groping for help, her whole figure swaying to and fro like that of a drunkard. I ran to her and threw my arms round her, but at that moment her knees seemed to give way and she fell to the ground. She writhed as one who is in terrible pain, and her limbs were dreadfully convulsed. At first I thought that she had not recognised me, but as I bent over her she suddenly shrieked out in a voice which I shall never forget, ‘Oh, my God! Helen! It was the band! The speckled band!’ There was something else which she would fain have said, and she stabbed with her finger into the air in the direction of the Doctor’s room, but a fresh convulsion seized her and choked her words. I rushed out, calling loudly for my stepfather, and I met him hastening from his room in his dressing-gown. When he reached my sister’s side she was unconscious, and though he poured brandy down her throat and sent for medical aid from the village, all efforts were in vain, for she slowly sank and died without having recovered her consciousness. Such was the dreadful end of my beloved sister.”','“One moment,” said Holmes, “are you sure about this whistle and metallic sound? Could you swear to it?”','“That was what the county coroner asked me at the inquiry. It is my strong impression that I heard it, and yet, among the crash of the gale and the creaking of an old house, I may possibly have been deceived.”','“Was your sister dressed?”','“No, she was in her night-dress. In her right hand was found the charred stump of a match, and in her left a match-box.”','“Showing that she had struck a light and looked about her when the alarm took place. That is important. And what conclusions did the coroner come to?”','“He investigated the case with great care, for Dr. Roylott’s conduct had long been notorious in the county, but he was unable to find any satisfactory cause of death. My evidence showed that the door had been fastened upon the inner side, and the windows were blocked by old-fashioned shutters with broad iron bars, which were secured every night. The walls were carefully sounded, and were shown to be quite solid all round, and the flooring was also thoroughly examined, with the same result. The chimney is wide, but is barred up by four large staples. It is certain, therefore, that my sister was quite alone when she met her end. Besides, there were no marks of any violence upon her.”','“How about poison?”','“The doctors examined her for it, but without success.”','“What do you think that this unfortunate lady died of, then?”','“It is my belief that she died of pure fear and nervous shock, though what it was that frightened her I cannot imagine.”','“Were there gipsies in the plantation at the time?”','“Yes, there are nearly always some there.”','“Ah, and what did you gather from this allusion to a band—a speckled band?”','“Sometimes I have thought that it was merely the wild talk of delirium, sometimes that it may have referred to some band of people, perhaps to these very gipsies in the plantation. I do not know whether the spotted handkerchiefs which so many of them wear over their heads might have suggested the strange adjective which she used.”','Holmes shook his head like a man who is far from being satisfied.','“These are very deep waters,” said he; “pray go on with your narrative.”','“Two years have passed since then, and my life has been until lately lonelier than ever. A month ago, however, a dear friend, whom I have known for many years, has done me the honour to ask my hand in marriage. His name is Armitage—Percy Armitage—the second son of Mr. Armitage, of Crane Water, near Reading. My stepfather has offered no opposition to the match, and we are to be married in the course of the spring. Two days ago some repairs were started in the west wing of the building, and my bedroom wall has been pierced, so that I have had to move into the chamber in which my sister died, and to sleep in the very bed in which she slept. Imagine, then, my thrill of terror when last night, as I lay awake, thinking over her terrible fate, I suddenly heard in the silence of the night the low whistle which had been the herald of her own death. I sprang up and lit the lamp, but nothing was to be seen in the room. I was too shaken to go to bed again, however, so I dressed, and as soon as it was daylight I slipped down, got a dog-cart at the Crown Inn, which is opposite, and drove to Leatherhead, from whence I have come on this morning with the one object of seeing you and asking your advice.”','“You have done wisely,” said my friend. “But have you told me all?”','“Yes, all.”','“Miss Roylott, you have not. You are screening your stepfather.”','“Why, what do you mean?”','For answer Holmes pushed back the frill of black lace which fringed the hand that lay upon our visitor’s knee. Five little livid spots, the marks of four fingers and a thumb, were printed upon the white wrist.','“You have been cruelly used,” said Holmes.','The lady coloured deeply and covered over her injured wrist. “He is a hard man,” she said, “and perhaps he hardly knows his own strength.”','There was a long silence, during which Holmes leaned his chin upon his hands and stared into the crackling fire.','“This is a very deep business,” he said at last. “There are a thousand details which I should desire to know before I decide upon our course of action. Yet we have not a moment to lose. If we were to come to Stoke Moran to-day, would it be possible for us to see over these rooms without the knowledge of your stepfather?”','“As it happens, he spoke of coming into town to-day upon some most important business. It is probable that he will be away all day, and that there would be nothing to disturb you. We have a housekeeper now, but she is old and foolish, and I could easily get her out of the way.”','“Excellent. You are not averse to this trip, Watson?”','“By no means.”','“Then we shall both come. What are you going to do yourself?”','“I have one or two things which I would wish to do now that I am in town. But I shall return by the twelve o’clock train, so as to be there in time for your coming.”','“And you may expect us early in the afternoon. I have myself some small business matters to attend to. Will you not wait and breakfast?”','“No, I must go. My heart is lightened already since I have confided my trouble to you. I shall look forward to seeing you again this afternoon.” She dropped her thick black veil over her face and glided from the room.','“And what do you think of it all, Watson?” asked Sherlock Holmes, leaning back in his chair.','“It seems to me to be a most dark and sinister business.”','“Dark enough and sinister enough.”','“Yet if the lady is correct in saying that the flooring and walls are sound, and that the door, window, and chimney are impassable, then her sister must have been undoubtedly alone when she met her mysterious end.”','“What becomes, then, of these nocturnal whistles, and what of the very peculiar words of the dying woman?”','“I cannot think.”','“When you combine the ideas of whistles at night, the presence of a band of gipsies who are on intimate terms with this old doctor, the fact that we have every reason to believe that the doctor has an interest in preventing his stepdaughter’s marriage, the dying allusion to a band, and, finally, the fact that Miss Helen Stoner heard a metallic clang, which might have been caused by one of those metal bars that secured the shutters falling back into its place, I think that there is good ground to think that the mystery may be cleared along those lines.”','“But what, then, did the gipsies do?”','“I cannot imagine.”','“I see many objections to any such theory.”','“And so do I. It is precisely for that reason that we are going to Stoke Moran this day. I want to see whether the objections are fatal, or if they may be explained away. But what in the name of the devil!”','The ejaculation had been drawn from my companion by the fact that our door had been suddenly dashed open, and that a huge man had framed himself in the aperture. His costume was a peculiar mixture of the professional and of the agricultural, having a black top-hat, a long frock-coat, and a pair of high gaiters, with a hunting-crop swinging in his hand. So tall was he that his hat actually brushed the cross bar of the doorway, and his breadth seemed to span it across from side to side. A large face, seared with a thousand wrinkles, burned yellow with the sun, and marked with every evil passion, was turned from one to the other of us, while his deep-set, bile-shot eyes, and his high, thin, fleshless nose, gave him somewhat the resemblance to a fierce old bird of prey.','“Which of you is Holmes?” asked this apparition.','“My name, sir; but you have the advantage of me,” said my companion quietly.','“I am Dr. Grimesby Roylott, of Stoke Moran.”','“Indeed, Doctor,” said Holmes blandly. “Pray take a seat.”','“I will do nothing of the kind. My stepdaughter has been here. I have traced her. What has she been saying to you?”','“It is a little cold for the time of the year,” said Holmes.','“What has she been saying to you?” screamed the old man furiously.','“But I have heard that the crocuses promise well,” continued my companion imperturbably.','“Ha! You put me off, do you?” said our new visitor, taking a step forward and shaking his hunting-crop. “I know you, you scoundrel! I have heard of you before. You are Holmes, the meddler.”','My friend smiled.','“Holmes, the busybody!”','His smile broadened.','“Holmes, the Scotland Yard Jack-in-office!”','Holmes chuckled heartily. “Your conversation is most entertaining,” said he. “When you go out close the door, for there is a decided draught.”','“I will go when I have had my say. Don’t you dare to meddle with my affairs. I know that Miss Stoner has been here. I traced her! I am a dangerous man to fall foul of! See here.” He stepped swiftly forward, seized the poker, and bent it into a curve with his huge brown hands.','“See that you keep yourself out of my grip,” he snarled, and hurling the twisted poker into the fireplace he strode out of the room.','“He seems a very amiable person,” said Holmes, laughing. “I am not quite so bulky, but if he had remained I might have shown him that my grip was not much more feeble than his own.” As he spoke he picked up the steel poker and, with a sudden effort, straightened it out again.','“Fancy his having the insolence to confound me with the official detective force! This incident gives zest to our investigation, however, and I only trust that our little friend will not suffer from her imprudence in allowing this brute to trace her. And now, Watson, we shall order breakfast, and afterwards I shall walk down to Doctors’ Commons, where I hope to get some data which may help us in this matter.”','It was nearly one o’clock when Sherlock Holmes returned from his excursion. He held in his hand a sheet of blue paper, scrawled over with notes and figures.','“I have seen the will of the deceased wife,” said he. “To determine its exact meaning I have been obliged to work out the present prices of the investments with which it is concerned. The total income, which at the time of the wife’s death was little short of £ 1,100, is now, through the fall in agricultural prices, not more than £ 750. Each daughter can claim an income of £ 250, in case of marriage. It is evident, therefore, that if both girls had married, this beauty would have had a mere pittance, while even one of them would cripple him to a very serious extent. My morning’s work has not been wasted, since it has proved that he has the very strongest motives for standing in the way of anything of the sort. And now, Watson, this is too serious for dawdling, especially as the old man is aware that we are interesting ourselves in his affairs; so if you are ready, we shall call a cab and drive to Waterloo. I should be very much obliged if you would slip your revolver into your pocket. An Eley’s No. 2 is an excellent argument with gentlemen who can twist steel pokers into knots. That and a tooth-brush are, I think, all that we need.”','At Waterloo we were fortunate in catching a train for Leatherhead, where we hired a trap at the station inn and drove for four or five miles through the lovely Surrey lanes. It was a perfect day, with a bright sun and a few fleecy clouds in the heavens. The trees and wayside hedges were just throwing out their first green shoots, and the air was full of the pleasant smell of the moist earth. To me at least there was a strange contrast between the sweet promise of the spring and this sinister quest upon which we were engaged. My companion sat in the front of the trap, his arms folded, his hat pulled down over his eyes, and his chin sunk upon his breast, buried in the deepest thought. Suddenly, however, he started, tapped me on the shoulder, and pointed over the meadows.','“Look there!” said he.','A heavily timbered park stretched up in a gentle slope, thickening into a grove at the highest point. From amid the branches there jutted out the grey gables and high roof-tree of a very old mansion.','“Stoke Moran?” said he.','“Yes, sir, that be the house of Dr. Grimesby Roylott,” remarked the driver.','“There is some building going on there,” said Holmes; “that is where we are going.”','“There’s the village,” said the driver, pointing to a cluster of roofs some distance to the left; “but if you want to get to the house, you’ll find it shorter to get over this stile, and so by the footpath over the fields. There it is, where the lady is walking.”','“And the lady, I fancy, is Miss Stoner,” observed Holmes, shading his eyes. “Yes, I think we had better do as you suggest.”','We got off, paid our fare, and the trap rattled back on its way to Leatherhead.','“I thought it as well,” said Holmes as we climbed the stile, “that this fellow should think we had come here as architects, or on some definite business. It may stop his gossip. Good-afternoon, Miss Stoner. You see that we have been as good as our word.”','Our client of the morning had hurried forward to meet us with a face which spoke her joy. “I have been waiting so eagerly for you,” she cried, shaking hands with us warmly. “All has turned out splendidly. Dr. Roylott has gone to town, and it is unlikely that he will be back before evening.”','“We have had the pleasure of making the Doctor’s acquaintance,” said Holmes, and in a few words he sketched out what had occurred. Miss Stoner turned white to the lips as she listened.','“Good heavens!” she cried, “he has followed me, then.”','“So it appears.”','“He is so cunning that I never know when I am safe from him. What will he say when he returns?”','“He must guard himself, for he may find that there is someone more cunning than himself upon his track. You must lock yourself up from him to-night. If he is violent, we shall take you away to your aunt’s at Harrow. Now, we must make the best use of our time, so kindly take us at once to the rooms which we are to examine.”','The building was of grey, lichen-blotched stone, with a high central portion and two curving wings, like the claws of a crab, thrown out on each side. In one of these wings the windows were broken and blocked with wooden boards, while the roof was partly caved in, a picture of ruin. The central portion was in little better repair, but the right-hand block was comparatively modern, and the blinds in the windows, with the blue smoke curling up from the chimneys, showed that this was where the family resided. Some scaffolding had been erected against the end wall, and the stone-work had been broken into, but there were no signs of any workmen at the moment of our visit. Holmes walked slowly up and down the ill-trimmed lawn and examined with deep attention the outsides of the windows.','“This, I take it, belongs to the room in which you used to sleep, the centre one to your sister’s, and the one next to the main building to Dr. Roylott’s chamber?”','“Exactly so. But I am now sleeping in the middle one.”','“Pending the alterations, as I understand. By the way, there does not seem to be any very pressing need for repairs at that end wall.”','“There were none. I believe that it was an excuse to move me from my room.”','“Ah! that is suggestive. Now, on the other side of this narrow wing runs the corridor from which these three rooms open. There are windows in it, of course?”','“Yes, but very small ones. Too narrow for anyone to pass through.”','“As you both locked your doors at night, your rooms were unapproachable from that side. Now, would you have the kindness to go into your room and bar your shutters?”','Miss Stoner did so, and Holmes, after a careful examination through the open window, endeavoured in every way to force the shutter open, but without success. There was no slit through which a knife could be passed to raise the bar. Then with his lens he tested the hinges, but they were of solid iron, built firmly into the massive masonry. “Hum!” said he, scratching his chin in some perplexity, “my theory certainly presents some difficulties. No one could pass these shutters if they were bolted. Well, we shall see if the inside throws any light upon the matter.”','A small side door led into the whitewashed corridor from which the three bedrooms opened. Holmes refused to examine the third chamber, so we passed at once to the second, that in which Miss Stoner was now sleeping, and in which her sister had met with her fate. It was a homely little room, with a low ceiling and a gaping fireplace, after the fashion of old country-houses. A brown chest of drawers stood in one corner, a narrow white-counterpaned bed in another, and a dressing-table on the left-hand side of the window. These articles, with two small wicker-work chairs, made up all the furniture in the room save for a square of Wilton carpet in the centre. The boards round and the panelling of the walls were of brown, worm-eaten oak, so old and discoloured that it may have dated from the original building of the house. Holmes drew one of the chairs into a corner and sat silent, while his eyes travelled round and round and up and down, taking in every detail of the apartment.','“Where does that bell communicate with?” he asked at last pointing to a thick bell-rope which hung down beside the bed, the tassel actually lying upon the pillow.','“It goes to the housekeeper’s room.”','“It looks newer than the other things?”','“Yes, it was only put there a couple of years ago.”','“Your sister asked for it, I suppose?”','“No, I never heard of her using it. We used always to get what we wanted for ourselves.”','“Indeed, it seemed unnecessary to put so nice a bell-pull there. You will excuse me for a few minutes while I satisfy myself as to this floor.” He threw himself down upon his face with his lens in his hand and crawled swiftly backward and forward, examining minutely the cracks between the boards. Then he did the same with the wood-work with which the chamber was panelled. Finally he walked over to the bed and spent some time in staring at it and in running his eye up and down the wall. Finally he took the bell-rope in his hand and gave it a brisk tug.','“Why, it’s a dummy,” said he.','“Won’t it ring?”','“No, it is not even attached to a wire. This is very interesting. You can see now that it is fastened to a hook just above where the little opening for the ventilator is.”','“How very absurd! I never noticed that before.”','“Very strange!” muttered Holmes, pulling at the rope. “There are one or two very singular points about this room. For example, what a fool a builder must be to open a ventilator into another room, when, with the same trouble, he might have communicated with the outside air!”','“That is also quite modern,” said the lady.','“Done about the same time as the bell-rope?” remarked Holmes.','“Yes, there were several little changes carried out about that time.”','“They seem to have been of a most interesting character—dummy bell-ropes, and ventilators which do not ventilate. With your permission, Miss Stoner, we shall now carry our researches into the inner apartment.”','Dr. Grimesby Roylott’s chamber was larger than that of his step-daughter, but was as plainly furnished. A camp-bed, a small wooden shelf full of books, mostly of a technical character, an armchair beside the bed, a plain wooden chair against the wall, a round table, and a large iron safe were the principal things which met the eye. Holmes walked slowly round and examined each and all of them with the keenest interest.','“What’s in here?” he asked, tapping the safe.','“My stepfather’s business papers.”','“Oh! you have seen inside, then?”','“Only once, some years ago. I remember that it was full of papers.”','“There isn’t a cat in it, for example?”','“No. What a strange idea!”','“Well, look at this!” He took up a small saucer of milk which stood on the top of it.','“No; we don’t keep a cat. But there is a cheetah and a baboon.”','“Ah, yes, of course! Well, a cheetah is just a big cat, and yet a saucer of milk does not go very far in satisfying its wants, I daresay. There is one point which I should wish to determine.” He squatted down in front of the wooden chair and examined the seat of it with the greatest attention.','“Thank you. That is quite settled,” said he, rising and putting his lens in his pocket. “Hullo! Here is something interesting!”','The object which had caught his eye was a small dog lash hung on one corner of the bed. The lash, however, was curled upon itself and tied so as to make a loop of whipcord.','“What do you make of that, Watson?”','“It’s a common enough lash. But I don’t know why it should be tied.”','“That is not quite so common, is it? Ah, me! it’s a wicked world, and when a clever man turns his brains to crime it is the worst of all. I think that I have seen enough now, Miss Stoner, and with your permission we shall walk out upon the lawn.”','I had never seen my friend’s face so grim or his brow so dark as it was when we turned from the scene of this investigation. We had walked several times up and down the lawn, neither Miss Stoner nor myself liking to break in upon his thoughts before he roused himself from his reverie.','“It is very essential, Miss Stoner,” said he, “that you should absolutely follow my advice in every respect.”','“I shall most certainly do so.”','“The matter is too serious for any hesitation. Your life may depend upon your compliance.”','“I assure you that I am in your hands.”','“In the first place, both my friend and I must spend the night in your room.”','Both Miss Stoner and I gazed at him in astonishment.','“Yes, it must be so. Let me explain. I believe that that is the village inn over there?”','“Yes, that is the Crown.”','“Very good. Your windows would be visible from there?”','“Certainly.”','“You must confine yourself to your room, on pretence of a headache, when your stepfather comes back. Then when you hear him retire for the night, you must open the shutters of your window, undo the hasp, put your lamp there as a signal to us, and then withdraw quietly with everything which you are likely to want into the room which you used to occupy. I have no doubt that, in spite of the repairs, you could manage there for one night.”','“Oh, yes, easily.”','“The rest you will leave in our hands.”','“But what will you do?”','“We shall spend the night in your room, and we shall investigate the cause of this noise which has disturbed you.”','“I believe, Mr. Holmes, that you have already made up your mind,” said Miss Stoner, laying her hand upon my companion’s sleeve.','“Perhaps I have.”','“Then, for pity’s sake, tell me what was the cause of my sister’s death.”','“I should prefer to have clearer proofs before I speak.”','“You can at least tell me whether my own thought is correct, and if she died from some sudden fright.”','“No, I do not think so. I think that there was probably some more tangible cause. And now, Miss Stoner, we must leave you for if Dr. Roylott returned and saw us our journey would be in vain. Good-bye, and be brave, for if you will do what I have told you, you may rest assured that we shall soon drive away the dangers that threaten you.”','Sherlock Holmes and I had no difficulty in engaging a bedroom and sitting-room at the Crown Inn. They were on the upper floor, and from our window we could command a view of the avenue gate, and of the inhabited wing of Stoke Moran Manor House. At dusk we saw Dr. Grimesby Roylott drive past, his huge form looming up beside the little figure of the lad who drove him. The boy had some slight difficulty in undoing the heavy iron gates, and we heard the hoarse roar of the Doctor’s voice and saw the fury with which he shook his clinched fists at him. The trap drove on, and a few minutes later we saw a sudden light spring up among the trees as the lamp was lit in one of the sitting-rooms.','“Do you know, Watson,” said Holmes as we sat together in the gathering darkness, “I have really some scruples as to taking you to-night. There is a distinct element of danger.”','“Can I be of assistance?”','“Your presence might be invaluable.”','“Then I shall certainly come.”','“It is very kind of you.”','“You speak of danger. You have evidently seen more in these rooms than was visible to me.”','“No, but I fancy that I may have deduced a little more. I imagine that you saw all that I did.”','“I saw nothing remarkable save the bell-rope, and what purpose that could answer I confess is more than I can imagine.”','“You saw the ventilator, too?”','“Yes, but I do not think that it is such a very unusual thing to have a small opening between two rooms. It was so small that a rat could hardly pass through.”','“I knew that we should find a ventilator before ever we came to Stoke Moran.”','“My dear Holmes!”','“Oh, yes, I did. You remember in her statement she said that her sister could smell Dr. Roylott’s cigar. Now, of course that suggested at once that there must be a communication between the two rooms. It could only be a small one, or it would have been remarked upon at the coroner’s inquiry. I deduced a ventilator.”','“But what harm can there be in that?”','“Well, there is at least a curious coincidence of dates. A ventilator is made, a cord is hung, and a lady who sleeps in the bed dies. Does not that strike you?”','“I cannot as yet see any connection.”','“Did you observe anything very peculiar about that bed?”','“No.”','“It was clamped to the floor. Did you ever see a bed fastened like that before?”','“I cannot say that I have.”','“The lady could not move her bed. It must always be in the same relative position to the ventilator and to the rope—or so we may call it, since it was clearly never meant for a bell-pull.”','“Holmes,” I cried, “I seem to see dimly what you are hinting at. We are only just in time to prevent some subtle and horrible crime.”','“Subtle enough and horrible enough. When a doctor does go wrong he is the first of criminals. He has nerve and he has knowledge. Palmer and Pritchard were among the heads of their profession. This man strikes even deeper, but I think, Watson, that we shall be able to strike deeper still. But we shall have horrors enough before the night is over; for goodness’ sake let us have a quiet pipe and turn our minds for a few hours to something more cheerful.”','About nine o’clock the light among the trees was extinguished, and all was dark in the direction of the Manor House. Two hours passed slowly away, and then, suddenly, just at the stroke of eleven, a single bright light shone out right in front of us.','“That is our signal,” said Holmes, springing to his feet; “it comes from the middle window.”','As we passed out he exchanged a few words with the landlord, explaining that we were going on a late visit to an acquaintance, and that it was possible that we might spend the night there. A moment later we were out on the dark road, a chill wind blowing in our faces, and one yellow light twinkling in front of us through the gloom to guide us on our sombre errand.','There was little difficulty in entering the grounds, for unrepaired breaches gaped in the old park wall. Making our way among the trees, we reached the lawn, crossed it, and were about to enter through the window when out from a clump of laurel bushes there darted what seemed to be a hideous and distorted child, who threw itself upon the grass with writhing limbs and then ran swiftly across the lawn into the darkness.','“My God!” I whispered; “did you see it?”','Holmes was for the moment as startled as I. His hand closed like a vice upon my wrist in his agitation. Then he broke into a low laugh and put his lips to my ear.','“It is a nice household,” he murmured. “That is the baboon.”','I had forgotten the strange pets which the Doctor affected. There was a cheetah, too; perhaps we might find it upon our shoulders at any moment. I confess that I felt easier in my mind when, after following Holmes’ example and slipping off my shoes, I found myself inside the bedroom. My companion noiselessly closed the shutters, moved the lamp onto the table, and cast his eyes round the room. All was as we had seen it in the daytime. Then creeping up to me and making a trumpet of his hand, he whispered into my ear again so gently that it was all that I could do to distinguish the words:','“The least sound would be fatal to our plans.”','I nodded to show that I had heard.','“We must sit without light. He would see it through the ventilator.”','I nodded again.','“Do not go asleep; your very life may depend upon it. Have your pistol ready in case we should need it. I will sit on the side of the bed, and you in that chair.”','I took out my revolver and laid it on the corner of the table.','Holmes had brought up a long thin cane, and this he placed upon the bed beside him. By it he laid the box of matches and the stump of a candle. Then he turned down the lamp, and we were left in darkness.','How shall I ever forget that dreadful vigil? I could not hear a sound, not even the drawing of a breath, and yet I knew that my companion sat open-eyed, within a few feet of me, in the same state of nervous tension in which I was myself. The shutters cut off the least ray of light, and we waited in absolute darkness.','From outside came the occasional cry of a night-bird, and once at our very window a long drawn catlike whine, which told us that the cheetah was indeed at liberty. Far away we could hear the deep tones of the parish clock, which boomed out every quarter of an hour. How long they seemed, those quarters! Twelve struck, and one and two and three, and still we sat waiting silently for whatever might befall.','Suddenly there was the momentary gleam of a light up in the direction of the ventilator, which vanished immediately, but was succeeded by a strong smell of burning oil and heated metal. Someone in the next room had lit a dark-lantern. I heard a gentle sound of movement, and then all was silent once more, though the smell grew stronger. For half an hour I sat with straining ears. Then suddenly another sound became audible—a very gentle, soothing sound, like that of a small jet of steam escaping continually from a kettle. The instant that we heard it, Holmes sprang from the bed, struck a match, and lashed furiously with his cane at the bell-pull.','“You see it, Watson?” he yelled. “You see it?”','But I saw nothing. At the moment when Holmes struck the light I heard a low, clear whistle, but the sudden glare flashing into my weary eyes made it impossible for me to tell what it was at which my friend lashed so savagely. I could, however, see that his face was deadly pale and filled with horror and loathing. He had ceased to strike and was gazing up at the ventilator when suddenly there broke from the silence of the night the most horrible cry to which I have ever listened. It swelled up louder and louder, a hoarse yell of pain and fear and anger all mingled in the one dreadful shriek. They say that away down in the village, and even in the distant parsonage, that cry raised the sleepers from their beds. It struck cold to our hearts, and I stood gazing at Holmes, and he at me, until the last echoes of it had died away into the silence from which it rose.','“What can it mean?” I gasped.','“It means that it is all over,” Holmes answered. “And perhaps, after all, it is for the best. Take your pistol, and we will enter Dr. Roylott’s room.”','With a grave face he lit the lamp and led the way down the corridor. Twice he struck at the chamber door without any reply from within. Then he turned the handle and entered, I at his heels, with the cocked pistol in my hand.','It was a singular sight which met our eyes. On the table stood a dark-lantern with the shutter half open, throwing a brilliant beam of light upon the iron safe, the door of which was ajar. Beside this table, on the wooden chair, sat Dr. Grimesby Roylott clad in a long grey dressing-gown, his bare ankles protruding beneath, and his feet thrust into red heelless Turkish slippers. Across his lap lay the short stock with the long lash which we had noticed during the day. His chin was cocked upward and his eyes were fixed in a dreadful, rigid stare at the corner of the ceiling. Round his brow he had a peculiar yellow band, with brownish speckles, which seemed to be bound tightly round his head. As we entered he made neither sound nor motion.','“The band! the speckled band!” whispered Holmes.','I took a step forward. In an instant his strange headgear began to move, and there reared itself from among his hair the squat diamond-shaped head and puffed neck of a loathsome serpent.','“It is a swamp adder!” cried Holmes; “the deadliest snake in India. He has died within ten seconds of being bitten. Violence does, in truth, recoil upon the violent, and the schemer falls into the pit which he digs for another. Let us thrust this creature back into its den, and we can then remove Miss Stoner to some place of shelter and let the county police know what has happened.”','As he spoke he drew the dog-whip swiftly from the dead man’s lap, and throwing the noose round the reptile’s neck he drew it from its horrid perch and, carrying it at arm’s length, threw it into the iron safe, which he closed upon it.','Such are the true facts of the death of Dr. Grimesby Roylott, of Stoke Moran. It is not necessary that I should prolong a narrative which has already run to too great a length by telling how we broke the sad news to the terrified girl, how we conveyed her by the morning train to the care of her good aunt at Harrow, of how the slow process of official inquiry came to the conclusion that the doctor met his fate while indiscreetly playing with a dangerous pet. The little which I had yet to learn of the case was told me by Sherlock Holmes as we travelled back next day.','“I had,” said he, “come to an entirely erroneous conclusion which shows, my dear Watson, how dangerous it always is to reason from insufficient data. The presence of the gipsies, and the use of the word ‘band,’ which was used by the poor girl, no doubt, to explain the appearance which she had caught a hurried glimpse of by the light of her match, were sufficient to put me upon an entirely wrong scent. I can only claim the merit that I instantly reconsidered my position when, however, it became clear to me that whatever danger threatened an occupant of the room could not come either from the window or the door. My attention was speedily drawn, as I have already remarked to you, to this ventilator, and to the bell-rope which hung down to the bed. The discovery that this was a dummy, and that the bed was clamped to the floor, instantly gave rise to the suspicion that the rope was there as a bridge for something passing through the hole and coming to the bed. The idea of a snake instantly occurred to me, and when I coupled it with my knowledge that the doctor was furnished with a supply of creatures from India, I felt that I was probably on the right track. The idea of using a form of poison which could not possibly be discovered by any chemical test was just such a one as would occur to a clever and ruthless man who had had an Eastern training. The rapidity with which such a poison would take effect would also, from his point of view, be an advantage. It would be a sharp-eyed coroner, indeed, who could distinguish the two little dark punctures which would show where the poison fangs had done their work. Then I thought of the whistle. Of course he must recall the snake before the morning light revealed it to the victim. He had trained it, probably by the use of the milk which we saw, to return to him when summoned. He would put it through this ventilator at the hour that he thought best, with the certainty that it would crawl down the rope and land on the bed. It might or might not bite the occupant, perhaps she might escape every night for a week, but sooner or later she must fall a victim.','“I had come to these conclusions before ever I had entered his room. An inspection of his chair showed me that he had been in the habit of standing on it, which of course would be necessary in order that he should reach the ventilator. The sight of the safe, the saucer of milk, and the loop of whipcord were enough to finally dispel any doubts which may have remained. The metallic clang heard by Miss Stoner was obviously caused by her stepfather hastily closing the door of his safe upon its terrible occupant. Having once made up my mind, you know the steps which I took in order to put the matter to the proof. I heard the creature hiss as I have no doubt that you did also, and I instantly lit the light and attacked it.”','“With the result of driving it through the ventilator.”','“And also with the result of causing it to turn upon its master at the other side. Some of the blows of my cane came home and roused its snakish temper, so that it flew upon the first person it saw. In this way I am no doubt indirectly responsible for Dr. Grimesby Roylott’s death, and I cannot say that it is likely to weigh very heavily upon my conscience.”']},
  {id:'magi', lang:'en', title:'The Gift of the Magi', by:'O. Henry', year:'1905', mins:'12 min', words:2060,
   p:['by O. Henry','One dollar and eighty-seven cents. That was all. And sixty cents of it was in pennies. Pennies saved one and two at a time by bulldozing the grocer and the vegetable man and the butcher until one’s cheeks burned with the silent imputation of parsimony that such close dealing implied. Three times Della counted it. One dollar and eighty-seven cents. And the next day would be Christmas.','There was clearly nothing to do but flop down on the shabby little couch and howl. So Della did it. Which instigates the moral reflection that life is made up of sobs, sniffles, and smiles, with sniffles predominating.','While the mistress of the home is gradually subsiding from the first stage to the second, take a look at the home. A furnished flat at $8 per week. It did not exactly beggar description, but it certainly had that word on the lookout for the mendicancy squad.','In the vestibule below was a letter-box into which no letter would go, and an electric button from which no mortal finger could coax a ring. Also appertaining thereunto was a card bearing the name “Mr. James Dillingham Young.”','The “Dillingham” had been flung to the breeze during a former period of prosperity when its possessor was being paid $30 per week. Now, when the income was shrunk to $20, though, they were thinking seriously of contracting to a modest and unassuming D. But whenever Mr. James Dillingham Young came home and reached his flat above he was called “Jim” and greatly hugged by Mrs. James Dillingham Young, already introduced to you as Della. Which is all very good.','Della finished her cry and attended to her cheeks with the powder rag. She stood by the window and looked out dully at a gray cat walking a gray fence in a gray backyard. Tomorrow would be Christmas Day, and she had only $1.87 with which to buy Jim a present. She had been saving every penny she could for months, with this result. Twenty dollars a week doesn’t go far. Expenses had been greater than she had calculated. They always are. Only $1.87 to buy a present for Jim. Her Jim. Many a happy hour she had spent planning for something nice for him. Something fine and rare and sterling—something just a little bit near to being worthy of the honor of being owned by Jim.','There was a pier glass between the windows of the room. Perhaps you have seen a pier glass in an $8 flat. A very thin and very agile person may, by observing his reflection in a rapid sequence of longitudinal strips, obtain a fairly accurate conception of his looks. Della, being slender, had mastered the art.','Suddenly she whirled from the window and stood before the glass. Her eyes were shining brilliantly, but her face had lost its color within twenty seconds. Rapidly she pulled down her hair and let it fall to its full length.','Now, there were two possessions of the James Dillingham Youngs in which they both took a mighty pride. One was Jim’s gold watch that had been his father’s and his grandfather’s. The other was Della’s hair. Had the queen of Sheba lived in the flat across the airshaft, Della would have let her hair hang out the window some day to dry just to depreciate Her Majesty’s jewels and gifts. Had King Solomon been the janitor, with all his treasures piled up in the basement, Jim would have pulled out his watch every time he passed, just to see him pluck at his beard from envy.','So now Della’s beautiful hair fell about her rippling and shining like a cascade of brown waters. It reached below her knee and made itself almost a garment for her. And then she did it up again nervously and quickly. Once she faltered for a minute and stood still while a tear or two splashed on the worn red carpet.','On went her old brown jacket; on went her old brown hat. With a whirl of skirts and with the brilliant sparkle still in her eyes, she fluttered out the door and down the stairs to the street.','Where she stopped the sign read: “Mme. Sofronie. Hair Goods of All Kinds.” One flight up Della ran, and collected herself, panting. Madame, large, too white, chilly, hardly looked the “Sofronie.”','“Will you buy my hair?” asked Della.','“I buy hair,” said Madame. “Take yer hat off and let’s have a sight at the looks of it.”','Down rippled the brown cascade.','“Twenty dollars,” said Madame, lifting the mass with a practised hand.','“Give it to me quick,” said Della.','Oh, and the next two hours tripped by on rosy wings. Forget the hashed metaphor. She was ransacking the stores for Jim’s present.','She found it at last. It surely had been made for Jim and no one else. There was no other like it in any of the stores, and she had turned all of them inside out. It was a platinum fob chain simple and chaste in design, properly proclaiming its value by substance alone and not by meretricious ornamentation—as all good things should do. It was even worthy of The Watch. As soon as she saw it she knew that it must be Jim’s. It was like him. Quietness and value—the description applied to both. Twenty-one dollars they took from her for it, and she hurried home with the 87 cents. With that chain on his watch Jim might be properly anxious about the time in any company. Grand as the watch was, he sometimes looked at it on the sly on account of the old leather strap that he used in place of a chain.','When Della reached home her intoxication gave way a little to prudence and reason. She got out her curling irons and lighted the gas and went to work repairing the ravages made by generosity added to love. Which is always a tremendous task, dear friends—a mammoth task.','Within forty minutes her head was covered with tiny, close-lying curls that made her look wonderfully like a truant schoolboy. She looked at her reflection in the mirror long, carefully, and critically.','“If Jim doesn’t kill me,” she said to herself, “before he takes a second look at me, he’ll say I look like a Coney Island chorus girl. But what could I do—oh! what could I do with a dollar and eighty-seven cents?”','At 7 o’clock the coffee was made and the frying-pan was on the back of the stove hot and ready to cook the chops.','Jim was never late. Della doubled the fob chain in her hand and sat on the corner of the table near the door that he always entered. Then she heard his step on the stair away down on the first flight, and she turned white for just a moment. She had a habit of saying a little silent prayer about the simplest everyday things, and now she whispered: “Please God, make him think I am still pretty.”','The door opened and Jim stepped in and closed it. He looked thin and very serious. Poor fellow, he was only twenty-two—and to be burdened with a family! He needed a new overcoat and he was without gloves.','Jim stopped inside the door, as immovable as a setter at the scent of quail. His eyes were fixed upon Della, and there was an expression in them that she could not read, and it terrified her. It was not anger, nor surprise, nor disapproval, nor horror, nor any of the sentiments that she had been prepared for. He simply stared at her fixedly with that peculiar expression on his face.','Della wriggled off the table and went for him.','“Jim, darling,” she cried, “don’t look at me that way. I had my hair cut off and sold because I couldn’t have lived through Christmas without giving you a present. It’ll grow out again—you won’t mind, will you? I just had to do it. My hair grows awfully fast. Say ‘Merry Christmas!’ Jim, and let’s be happy. You don’t know what a nice—what a beautiful, nice gift I’ve got for you.”','“You’ve cut off your hair?” asked Jim, laboriously, as if he had not arrived at that patent fact yet even after the hardest mental labor.','“Cut it off and sold it,” said Della. “Don’t you like me just as well, anyhow? I’m me without my hair, ain’t I?”','Jim looked about the room curiously.','“You say your hair is gone?” he said, with an air almost of idiocy.','“You needn’t look for it,” said Della. “It’s sold, I tell you—sold and gone, too. It’s Christmas Eve, boy. Be good to me, for it went for you. Maybe the hairs of my head were numbered,” she went on with sudden serious sweetness, “but nobody could ever count my love for you. Shall I put the chops on, Jim?”','Out of his trance Jim seemed quickly to wake. He enfolded his Della. For ten seconds let us regard with discreet scrutiny some inconsequential object in the other direction. Eight dollars a week or a million a year—what is the difference? A mathematician or a wit would give you the wrong answer. The magi brought valuable gifts, but that was not among them. This dark assertion will be illuminated later on.','Jim drew a package from his overcoat pocket and threw it upon the table.','“Don’t make any mistake, Dell,” he said, “about me. I don’t think there’s anything in the way of a haircut or a shave or a shampoo that could make me like my girl any less. But if you’ll unwrap that package you may see why you had me going a while at first.”','White fingers and nimble tore at the string and paper. And then an ecstatic scream of joy; and then, alas! a quick feminine change to hysterical tears and wails, necessitating the immediate employment of all the comforting powers of the lord of the flat.','For there lay The Combs—the set of combs, side and back, that Della had worshipped long in a Broadway window. Beautiful combs, pure tortoise shell, with jewelled rims—just the shade to wear in the beautiful vanished hair. They were expensive combs, she knew, and her heart had simply craved and yearned over them without the least hope of possession. And now, they were hers, but the tresses that should have adorned the coveted adornments were gone.','But she hugged them to her bosom, and at length she was able to look up with dim eyes and a smile and say: “My hair grows so fast, Jim!”','And then Della leaped up like a little singed cat and cried, “Oh, oh!”','Jim had not yet seen his beautiful present. She held it out to him eagerly upon her open palm. The dull precious metal seemed to flash with a reflection of her bright and ardent spirit.','“Isn’t it a dandy, Jim? I hunted all over town to find it. You’ll have to look at the time a hundred times a day now. Give me your watch. I want to see how it looks on it.”','Instead of obeying, Jim tumbled down on the couch and put his hands under the back of his head and smiled.','“Dell,” said he, “let’s put our Christmas presents away and keep ’em a while. They’re too nice to use just at present. I sold the watch to get the money to buy your combs. And now suppose you put the chops on.”','The magi, as you know, were wise men—wonderfully wise men—who brought gifts to the Babe in the manger. They invented the art of giving Christmas presents. Being wise, their gifts were no doubt wise ones, possibly bearing the privilege of exchange in case of duplication. And here I have lamely related to you the uneventful chronicle of two foolish children in a flat who most unwisely sacrificed for each other the greatest treasures of their house. But in a last word to the wise of these days let it be said that of all who give gifts these two were the wisest. Of all who give and receive gifts, such as they are wisest. Everywhere they are wisest. They are the magi.']},
  {id:'vendetta', lang:'fr', title:'Une vendetta', by:'Guy de Maupassant', year:'1883', mins:'10 min', words:1374,
   p:['Dans tout le pays environnant on appelait la ferme des Lucas «la Métairie». On n\'aurait su dire pourquoi. Les paysans, sans doute, attachaient à ce mot «métairie» une idée de richesse et de grandeur, car cette ferme était assurément la plus vaste, la plus opulente et la plus ordonnée de la contrée.','La cour, immense, entourée de cinq rangs d\'arbres magnifiques pour abriter contre le vent violent de la plaine les pommiers trapus et délicats, enfermait de longs bâtiments couverts en tuiles pour conserver les fourrages et les grains, de belles étables bâties en silex, des écuries pour trente chevaux, et une maison d\'habitation en brique rouge, qui ressemblait à un petit château.','Les fumiers étaient bien tenus; les chiens de garde habitaient en des niches, un peuple de volailles circulait dans l\'herbe haute.','Chaque midi, quinze personnes, maîtres, valets et servantes, prenaient place autour de la longue table de cuisine où fumait la soupe dans un grand vase de faïence à fleurs bleues.','Les bêtes, chevaux, vaches, porcs et moutons, étaient grasses, soignées et propres; et maître Lucas, un grand homme qui prenait du ventre, faisait sa ronde trois fois par jour, veillant sur tout et pensant à tout.','On conservait, par charité, dans le fond de l\'écurie, un très vieux cheval blanc que la maîtresse voulait nourrir jusqu\'à sa mort naturelle, parce qu\'elle l\'avait élevé, gardé toujours, et qu\'il lui rappelait des souvenirs.','Un goujat de quinze ans, nommé Isidore Duval, et appelé plus simplement Zidore, prenait soin de cet invalide, lui donnait, pendant l\'hiver, sa mesure d\'avoine et son fourrage, et devait aller, quatre fois par jour, en été, le déplacer dans la côte où on l\'attachait, afin qu\'il eût en abondance de l\'herbe fraîche.','L\'animal, presque perclus, levait avec peine ses jambes lourdes, grosses des genoux et enflées au-dessus des sabots. Ses poils, qu\'on n\'étrillait plus jamais, avaient l\'air de cheveux blancs, et des cils très longs donnaient à ses yeux un air triste.','Quand Zidore le menait à l\'herbe, il lui fallait tirer sur la corde, tant la bête allait lentement; et le gars, courbé, haletant, jurait contre elle, s\'exaspérant d\'avoir à soigner cette vieille rosse.','Les gens de la ferme, voyant cette colère du goujat contre Coco, s\'en amusaient, parlaient sans cesse du cheval à Zidore, pour exaspérer le gamin. Ses camarades le plaisantaient. On l\'appelait dans le village Coco-Zidore.','Le gars rageait, sentant naître en lui le désir de se venger du cheval. C\'était un maigre enfant haut sur jambes, très sale, coiffé de cheveux roux, épais, durs et hérissés. Il semblait stupide, parlait en bégayant, avec une peine infinie, comme si les idées n\'eussent pu se former dans son âme épaisse de brute.','Depuis longtemps déjà, il s\'étonnait qu\'on gardât Coco, s\'indignant de voir perdre du bien pour cette bête inutile. Du moment qu\'elle ne travaillait plus, il lui semblait injuste de la nourrir, il lui semblait révoltant de gaspiller de l\'avoine, de l\'avoine qui coûtait si cher, pour ce bidet paralysé. Et souvent même, malgré les ordres de maître Lucas, il économisait sur la nourriture du cheval, ne lui versant qu\'une demi-mesure, ménageant sa litière et son foin. Et une haine grandissait en son esprit confus d\'enfant, une haine de paysan rapace, de paysan sournois, féroce, brutal et lâche.','Lorsque revint l\'été, il lui fallut aller remuer la bête dans sa côte. C\'était loin. Le goujat, plus furieux chaque matin, partait de son pas lourd à travers les blés. Les hommes qui travaillaient dans les terres lui criaient, par plaisanterie:','--Hé Zidore, tu f\'ras mes compliments à Coco.','Il ne répondait point; mais il cassait, en passant, une baguette dans une haie et, dès qu\'il avait déplacé l\'attache du vieux cheval, il le laissait se remettre à brouter; puis approchant traîtreusement, il lui cinglait les jarrets. L\'animal essayait de fuir, de ruer, d\'échapper aux coups, et il tournait au bout de sa corde comme s\'il eût été enfermé dans une piste. Et le gars le frappait avec rage, courant derrière, acharné, les dents serrées par la colère.','Puis il s\'en allait lentement, sans se retourner, tandis que le cheval le regardait partir de son oeil de vieux, les côtes saillantes, essoufflé d\'avoir trotté. Et il ne rebaissait vers l\'herbe sa tête osseuse et blanche qu\'après avoir vu disparaître au loin la blouse bleue du jeune paysan.','Comme les nuits étaient chaudes, on laissait maintenant Coco coucher dehors, là-bas, au bord de la ravine, derrière le bois. Zidore seul allait le voir.','L\'enfant s\'amusait encore à lui jeter des pierres. Il s\'asseyait à dix pas de lui, sur un talus, et il restait là une demi-heure, lançant de temps en temps un caillou tranchant au bidet, qui demeurait debout, enchaîné devant son ennemi, et le regardant sans cesse, sans oser paître avant qu\'il fût reparti.','Mais toujours cette pensée restait plantée dans l\'esprit du goujat: «Pourquoi nourrir ce cheval qui ne faisait plus rien?» Il lui semblait que cette misérable rosse volait le manger des autres, volait l\'avoir des hommes, le bien du bon Dieu, le volait même aussi, lui, Zidore, qui travaillait.','Alors, peu à peu, chaque jour, le gars diminua la bande de pâturage qu\'il lui donnait en avançant le piquet de bois où était fixée la corde.','La bête jeûnait, maigrissait, dépérissait. Trop faible pour casser son attache, elle tendait la tête vers la grande herbe verte et luisante, si proche, et dont l\'odeur lui venait sans qu\'elle y pût toucher.','Mais, un matin, Zidore eut une idée: c\'était de ne plus remuer Coco. Il en avait assez d\'aller si loin pour cette carcasse.','Il vint cependant, pour savourer sa vengeance. La bête inquiète le regardait. Il ne la battit pas ce jour-là. Il tournait autour, les mains dans les poches. Même il fit mine de la changer de place, mais il renfonça le piquet juste dans le même trou, et il s\'en alla, enchanté de son invention.','Le cheval, le voyant partir, hennit pour le rappeler; mais le goujat se mit à courir, le laissant seul, tout seul, dans son vallon, bien attaché, et sans un brin d\'herbe à portée de la mâchoire.','Affamé, il essaya d\'atteindre la grasse verdure qu\'il touchait du bout de ses naseaux. Il se mit sur les genoux, tendant le cou, allongeant ses grandes lèvres baveuses. Ce fut en vain. Tout le jour, elle s\'épuisa, la vieille bête, en efforts inutiles, en efforts terribles. La faim la dévorait, rendue plus affreuse par la vue de toute la verte nourriture qui s\'étendait par l\'horizon.','Le goujat ne revint point ce jour-là. Il vagabonda par les bois pour chercher des nids.','Il reparut le lendemain. Coco, exténué, s\'était couché. Il se leva en apercevant l\'enfant, attendant enfin, d\'être changé de place.','Mais le petit paysan ne toucha même pas au maillet jeté dans l\'herbe. Il s\'approcha, regarda l\'animal, lui lança dans le nez une motte de terre qui s\'écrasa sur le poil blanc, et il repartit en sifflant.','Le cheval resta debout tant qu\'il put l\'apercevoir encore; puis sentant bien que ses tentatives pour atteindre l\'herbe voisine seraient inutiles, il s\'étendit de nouveau sur le flanc et ferma les yeux.','Le lendemain, Zidore ne vint pas.','Quand il approcha, le jour suivant, de Coco toujours étendu, il s\'aperçut qu\'il était mort.','Alors il demeura debout, le regardant, content de son oeuvre, étonné en même temps que ce fût déjà fini. Il le toucha du pied, leva une de ses jambes, puis la laissa retomber, s\'assit dessus, et resta là, les yeux fixés dans l\'herbe et sans penser à rien.','Il revint à la ferme, mais il ne dit pas l\'accident, car il voulait vagabonder encore aux heures où, d\'ordinaire, il allait changer de place le cheval.','Il alla le voir le lendemain. Des corbeaux s\'envolèrent à son approche. Des mouches innombrables se promenaient sur le cadavre et bourdonnaient à l\'entour.','En rentrant il annonça la chose. La bête était si vieille que personne ne s\'étonna. Le maître dit à deux valets:','Prenez vos pelles, vous f\'rez un trou là ous qu\'il est.','Et les hommes enfouirent le cheval juste à la place où il était mort de faim.','Et l\'herbe poussa drue, verdoyante, vigoureuse, nourrie par le pauvre corps.']},
  {id:'lamain', lang:'fr', title:'La Main', by:'Guy de Maupassant', year:'1883', mins:'15 min', words:1984,
   p:['On faisait cercle autour de M. Bermutier, juge d\'instruction, qui donnait son avis sur l\'affaire mystérieuse de Saint-Cloud. Depuis un mois, cet inexplicable crime affolait Paris. Personne n\'y comprenait rien.','M. Bermutier, debout, le dos à la cheminée, parlait, assemblait les preuves, discutait les diverses opinions, mais ne concluait pas.','Plusieurs femmes s\'étaient levées pour s\'approcher et demeuraient debout, l\'oeil fixé sur la bouche rasée du magistrat d\'où sortaient les paroles graves. Elles frissonnaient, vibraient, crispées par leur peur curieuse, par l\'avide et insatiable besoin d\'épouvante qui hante leur âme, les torture comme une faim.','Une d\'elles, plus pâle que les autres, prononça pendant un silence:','--C\'est affreux. Cela touche au «surnaturel». On ne saura jamais rien.','Le magistrat se tourna vers elle:','--Oui, madame, il est probable qu\'on ne saura jamais rien. Quant au mot surnaturel que vous venez d\'employer, il n\'a rien à faire ici. Nous sommes en présence d\'un crime fort habilement conçu, fort habilement exécuté, si bien enveloppé de mystère que nous ne pouvons le dégager des circonstances impénétrables qui l\'entourent. Mais j\'ai eu, moi, autrefois, à suivre une affaire où vraiment semblait se mêler quelque chose de fantastique. Il a fallu l\'abandonner d\'ailleurs, faute de moyens de l\'éclaircir.','Plusieurs femmes prononcèrent en même temps, si vite que leurs voix n\'en firent qu\'une:','--Oh! dites-nous cela.','M. Bermutier sourit gravement, comme doit sourire un juge d\'instruction. Il reprit:','--N\'allez pas croire, au moins, que j\'aie pu, même un instant, supposer en cette aventure quelque chose de surhumain. Je ne crois qu\'aux causes normales. Mais si, au lieu d\'employer le mot «surnaturel» pour exprimer ce que nous ne comprenons pas, nous nous servions simplement du mot «inexplicable», cela vaudrait beaucoup mieux. En tout cas, dans l\'affaire que je vais vous dire, ce sont surtout les circonstances environnantes, les circonstances préparatoires qui m\'ont ému. Enfin, voici les faits:','J\'étais alors juge d\'instruction à Ajaccio, une petite ville blanche, couchée au bord d\'un admirable golfe qu\'entourent partout de hautes montagnes.','Ce que j\'avais surtout à poursuivre là-bas, c\'étaient les affaires de vendetta. Il y en a de superbes, de dramatiques au possible, de féroces, d\'héroïques. Nous retrouvons là les plus beaux sujets de vengeance qu\'on puisse rêver, les haines séculaires, apaisées un moment, jamais éteintes, les ruses abominables, les assassinats devenant des massacres et presque des actions glorieuses. Depuis deux ans, je n\'entendais parler que du prix du sang, que de ce terrible préjugé corse qui force à venger toute injure sur la personne qui l\'a faite, sur ses descendants et ses proches. J\'avais vu égorger des vieillards, des enfants, des cousins, j\'avais la tête pleine de ces histoires.','Or, j\'appris un jour qu\'un Anglais venait de louer pour plusieurs années une petite villa au fond du golfe. Il avait amené avec lui un domestique français, pris à Marseille en passant.','Bientôt tout le monde s\'occupa de ce personnage singulier, qui vivait seul dans sa demeure, ne sortant que pour chasser et pour pêcher. Il ne parlait à personne, ne venait jamais à la ville, et, chaque matin, s\'exerçait pendant une heure ou deux, à tirer au pistolet et à la carabine.','Des légendes se firent autour de lui. On prétendit que c\'était un haut personnage fuyant sa patrie pour des raisons politiques; puis on affirma qu\'il se cachait après avoir commis un crime épouvantable. On citait même des circonstances particulièrement horribles.','Je voulus, en ma qualité de juge d\'instruction, prendre quelques renseignements sur cet homme; mais il me fut impossible de rien apprendre. Il se faisait appeler sir John Rowell.','Je me contentai donc de le surveiller de près; mais on ne me signalait, en réalité, rien de suspect à son égard.','Cependant, comme les rumeurs sur son compte continuaient, grossissaient, devenaient générales, je résolus d\'essayer de voir moi-même cet étranger, et je me mis à chasser régulièrement dans les environs de sa propriété.','J\'attendis longtemps une occasion. Elle se présenta enfin sous la forme d\'une perdrix que je tirai et que je tuai devant le nez de l\'Anglais. Mon chien me la rapporta; mais, prenant aussitôt le gibier, j\'allai m\'excuser de mon inconvenance et prier sir John Rowell d\'accepter l\'oiseau mort.','C\'était un grand homme à cheveux rouges, à barbe rouge, très haut, très large, une sorte d\'hercule placide et poli. Il n\'avait rien de la raideur dite britannique et il me remercia vivement de ma délicatesse en un français accentué d\'outre-Manche. Au bout d\'un mois, nous avions causé ensemble cinq ou six fois.','Un soir enfin, comme je passais devant sa porte, je l\'aperçus qui fumait sa pipe, à cheval sur une chaise, dans son jardin. Je le saluai, et il m\'invita à entrer pour boire un verre de bière. Je ne me le fis pas répéter.','Il me reçut avec toute la méticuleuse courtoisie anglaise, parla avec éloge de la France, de la Corse, déclara qu\'il aimait beaucoup cette pays, et cette rivage.','Alors je lui posai, avec de grandes précautions et sous la forme d\'un intérêt très vif, quelques questions sur sa vie, sur ses projets. Il répondit sans embarras, me raconta qu\'il avait beaucoup voyagé, en Afrique, dans les Indes, en Amérique. Il ajouta en riant:','--J\'avé eu bôcoup d\'aventures, oh! yes.','Puis je me remis à parler chasse, et il me donna des détails les plus curieux sur la chasse à l\'hippopotame, au tigre, à l\'éléphant et même la chasse au gorille.','Je dis:','--Tous ces animaux sont redoutables.','Il sourit:','--Oh! nô, le plus mauvais c\'été l\'homme.','Il se mit à rire tout à fait, d\'un bon rire de gros Anglais content:','--J\'avé beaucoup chassé l\'homme aussi.','Puis il parla d\'armes, et il m\'offrit d\'entrer chez lui pour me montrer des fusils de divers systèmes.','Son salon était tendu de noir, de soie noire brodée d\'or. De grandes fleurs jaunes couraient sur l\'étoffe sombre, brillaient comme du feu.','Il annonça:','--C\'été une drap japonaise.','Mais, au milieu du plus large panneau, une chose étrange me tira l\'oeil. Sur un carré de velours rouge, un objet noir se détachait. Je m\'approchai: c\'était une main, une main d\'homme. Non pas une main de squelette, blanche et propre, mais une main noire desséchée, avec les ongles jaunes, les muscles à nu et des traces de sang ancien, de sang pareil à une crasse, sur les os coupés net, comme d\'un coup de hache, vers le milieu de l\'avant-bras.','Autour du poignet, une énorme chaîne de fer, rivée, soudée à ce membre mal propre, l\'attachait au mur par un anneau assez fort pour tenir un éléphant en laisse.','Je demandai:','--Qu\'est-ce que cela?','L\'Anglais répondit tranquillement:','--C\'été ma meilleur ennemi. Il vené d\'Amérique. Il avé été fendu avec le sabre et arraché la peau avec une caillou coupante, et séché dans le soleil pendant huit jours. Aoh, très bonne pour moi, cette.','Je touchai ce débris humain qui avait dû appartenir à un colosse. Les doigts, démesurément longs, étaient attachés par des tendons énormes que retenaient des lanières de peau par places. Cette main était affreuse à voir, écorchée ainsi, elle faisait penser naturellement à quelque vengeance de sauvage.','Je dis:','--Cet homme devait être très fort.','L\'Anglais prononça avec douceur:','--Aoh yes; mais je été plus fort que lui. J\'avé mis cette chaîne pour le tenir.','Je crus qu\'il plaisantait. Je dis:','--Cette chaîne maintenant est bien inutile, la main ne se sauvera pas.','Sir John Rowell reprit gravement:','--Elle voulé toujours s\'en aller. Cette chaîne été nécessaire.','D\'un coup d\'oeil rapide j\'interrogeai son visage, me demandant:','--Est-ce un fou, ou un mauvais plaisant?','Mais la figure demeurait impénétrable, tranquille et bienveillante. Je parlai d\'autre chose et j\'admirai les fusils.','Je remarquai cependant que trois revolvers chargés étaient posés sur les meubles, comme si cet homme eût vécu dans la crainte constante d\'une attaque.','Je revins plusieurs fois chez lui; Puis je n\'y allai plus. On s\'était, accoutumé à sa présence; il était devenu indifférent à tous.','* * * * *','Une année entière s\'écoula. Or un matin, vers la fin de novembre, mon domestique me réveilla en m\'annonçant que sir John Rowell avait été assassiné dans la nuit.','Une demi-heure plus tard, je pénétrais dans la maison de l\'Anglais avec le commissaire central et le capitaine de gendarmerie. Le valet, éperdu et désespéré pleurait devant la porte. Je soupçonnai d\'abord cet homme, mais il était innocent.','On ne put jamais trouver le coupable.','En entrant dans le salon de sir John, j\'aperçus du premier coup d\'oeil le cadavre étendu sur le dos, au milieu de la pièce.','Le gilet était déchiré, une manche arrachée pendait, tout annonçait qu\'une lutte terrible avait eu lieu.','L\'Anglais était mort étranglé! Sa figure noire et gonflée, effrayante, semblait exprimer une épouvante abominable; il tenait entre ses dents serrées quelque chose; et le cou, percé de cinq trous qu\'on aurait dits faits avec des pointes de fer, était couvert de sang.','Un médecin nous rejoignit. Il examina longtemps les traces des doigts dans la chair et prononça ces étranges paroles:','--On dirait qu\'il a été étranglé par un squelette.','Un frisson me passa dans le dos, et je jetai les yeux sur le mur, à la place où j\'avais vu jadis l\'horrible main d\'écorché. Elle n\'y était plus. La chaîne, brisée, pendait.','Alors je me baissai vers le mort, et je trouvai dans sa bouche crispée un des doigts de cette main disparue, coupé ou plutôt scié par les dents juste à la deuxième phalange.','Puis on procéda aux constatations. On ne découvrit rien. Aucune porte n\'avait été forcée, aucune fenêtre, aucun meuble. Les deux chiens de garde ne s\'étaient pas réveillés.','Voici, en quelques mots, la déposition du domestique:','Depuis un mois, son maître semblait agité. Il avait reçu beaucoup de lettres, brûlées à mesure.','Souvent, prenant une cravache, dans une colère qui semblait de la démence, il avait frappé avec fureur cette main séchée, scellée au mur et enlevée, on ne sait comment, à l\'heure même du crime.','Il se couchait fort tard et s\'enfermait avec soin. Il avait toujours des armes à portée du bras. Souvent, la nuit, il parlait haut, comme s\'il se fût querellé avec quelqu\'un.','Cette nuit-là, par hasard, il n\'avait fait aucun bruit, et c\'est seulement en venant ouvrir les fenêtres que le serviteur avait trouvé sir John assassiné. Il ne soupçonnait personne.','Je communiquai ce que je savais du mort aux magistrats et aux officiers de la force publique, et on fit dans toute l\'île une enquête minutieuse. On ne découvrit rien.','Or, une nuit, trois mois après le crime, j\'eus un affreux cauchemar. Il me sembla que je voyais la main, l\'horrible main, courir comme un scorpion ou comme une araignée le long de mes rideaux et de mes murs. Trois fois, je me réveillai, trois fois je me rendormis, trois fois je revis le hideux débris galoper autour de ma chambre en remuant les doigts comme des pattes.','Le lendemain, on me l\'apporta, trouvé dans le cimetière, sur la tombe de sir John Rowell, enterré là; car on n\'avait pu découvrir sa famille. L\'index manquait.','Voilà, mesdames, mon histoire. Je ne sais rien de plus.','* * * * *','Les femmes, éperdues, étaient pâles, frissonnantes. Une d\'elles s\'écria:','--Mais ce n\'est pas un dénouement cela, ni une explication! Nous n\'allons pas dormir si vous ne nous dites pas ce qui s\'était passé, selon vous.','Le magistrat sourit avec sévérité:','--Oh! moi, mesdames, je vais gâter, certes, vos rêves terribles. Je pense tout simplement que le légitime propriétaire de la main n\'était pas mort, qu\'il est venu la chercher avec celle qui lui restait. Mais je n\'ai pu savoir comment il a fait, par exemple. C\'est là une sorte de vendetta.','Une des femmes murmura:','--Non, ça ne doit pas être ainsi.','Et le juge d\'instruction, souriant toujours, conclut:','--Je vous avais bien dit que mon explication ne vous irait pas.']},
  {id:'adieu', lang:'fr', title:'Adieu', by:'Guy de Maupassant', year:'1884', mins:'12 min', words:1555,
   p:['Les deux amis achevaient de dîner. De la fenêtre du café ils voyaient le boulevard couvert de monde. Ils sentaient passer ces souffles tièdes qui courent dans Paris par les douces nuits d\'été, et font lever la tête aux passants et donnent envie de partir, d\'aller là-bas, on ne sait où, sous des feuilles, et font rêver de rivières éclairées par la lune, de vers luisants et de rossignols.','L\'un d\'eux, Henri Simon, prononça, en soupirant profondément:','--Ah! je vieillis. C\'est triste. Autrefois, par des soirs pareils, je me sentais le diable au corps. Aujourd\'hui je ne me sens plus que des regrets. Ça va vite, la vie!','Il était un peu gros déjà, vieux de quarante-cinq ans peut-être et très chauve.','L\'autre, Pierre Carnier, un rien plus âgé, mais plus maigre et plus vivant, reprit:','--Moi, mon cher, j\'ai vieilli sans m\'en apercevoir le moins du monde. J\'étais toujours gai, gaillard, vigoureux et le reste. Or, comme on se regarde chaque jour dans son miroir, on ne voit pas le travail de l\'âge s\'accomplir, car il est lent, régulier, et il modifie le visage si doucement que les transitions sont insensibles. C\'est uniquement pour cela que nous ne mourons pas de chagrin après deux ou trois ans seulement de ravages. Car nous ne les pouvons apprécier. Il faudrait, pour s\'en rendre compte, rester six mois sans regarder sa figure--oh! alors quel coup?','Et les femmes, mon cher, comme je les plains, les pauvres êtres. Tout leur bonheur, toute leur puissance, toute leur vie sont dans leur beauté qui dure dix ans.','Donc, moi, j\'ai vieilli sans m\'en douter, je me croyais presque un adolescent alors que j\'avais près de cinquante ans. Ne me sentant aucune infirmité d\'aucune sorte, j\'allais, heureux et tranquille.','--La révélation de ma décadence m\'est venue d\'une façon simple et terrible qui m\'a atterré pendant près de six mois... puis j\'en ai pris mon parti.','--J\'ai été souvent amoureux, comme tous les hommes, mais principalement une fois.','Je l\'avais rencontrée au bord de la mer, à Étretat, voici douze ans environ, un peu après la guerre. Rien de gentil comme cette plage, le matin, à l\'heure des bains. Elle est petite, arrondie en fer à cheval, encadrée par ces hautes falaises blanches percées de ces trous singuliers qu\'on nomme les Portes, l\'une énorme, allongeant dans la mer sa jambe de géante, l\'autre en face, accroupie et ronde; la foule des femmes se rassemble, se masse sur l\'étroite langue de galets qu\'elle couvre d\'un éclatant jardin de toilettes claires, dans ce cadre de hauts rochers. Le soleil tombe en plein sur les côtes, sur les ombrelles de toute nuance, sur la mer d\'un bleu verdâtre; et tout cela est gai, charmant, sourit aux yeux. On va s\'asseoir tout contre l\'eau, et on regarde les baigneuses. Elles descendent, drapées dans un peignoir de flanelle qu\'elles rejettent d\'un joli mouvement en atteignant la frange d\'écume des courtes vagues; et elles entrent dans la mer, d\'un petit pas rapide qu\'arrête parfois un frisson de froid délicieux, une courte suffocation.','Bien peu résistent à cette épreuve du bain. C\'est là qu\'on les juge, depuis le mollet jusqu\'à la gorge. La sortie surtout révèle les faibles, bien que l\'eau de mer soit d\'un puissant secours aux chairs amollies.','La première fois que je vis ainsi cette, jeune femme, je fus ravi et séduit. Elle tenait bon, elle tenait ferme. Puis il y a des figures dont le charme entre en nous brusquement, nous envahit tout d\'un coup. Il semble qu\'on trouve la femme qu\'on était né pour aimer. J\'ai eu cette sensation et cette secousse.','Je me fis présenter et je fus bientôt pincé comme je ne l\'avais jamais été. Elle me ravageait le coeur. C\'est une chose effroyable et délicieuse que de subir ainsi la domination d\'une femme. C\'est presque un supplice et, en même temps, un incroyable bonheur. Son regard, son sourire, les cheveux de sa nuque quand la brise les soulevait, toutes les plus petites lignes de son visage, les moindres mouvements de ses traits, me ravissaient, me bouleversaient, m\'affolaient. Elle me possédait par toute ma personne, par ses gestes, par ses attitudes, même par les choses qu\'elle portait qui devenaient ensorcelantes. Je m\'attendrissais à voir sa voilette sur un meuble, ses gants jetés sur un fauteuil. Ses toilettes me semblaient inimitables. Personne n\'avait des chapeaux pareils aux siens.','Elle était mariée, mais l\'époux venait tous les samedis pour repartir les lundis. Il me laissait d\'ailleurs indifférent. Je n\'en étais point jaloux, je ne sais pourquoi, jamais un être ne me parut avoir aussi peu d\'importance dans la vie, n\'attira moins mon attention que cet homme.','Comme je l\'aimais, elle! Et comme elle était belle, gracieuse et jeune! C\'était la jeunesse, l\'élégance et la fraîcheur même. Jamais je n\'avais senti de cette façon comme la femme est un être joli, fin, distingué, délicat, fait de charme et de grâce. Jamais je n\'avais compris ce qu\'il y a de beauté séduisante dans la courbe d\'une joue, dans le mouvement d\'une lèvre, dans les plis ronds d\'une petite oreille, dans la forme de ce sot organe qu\'on nomme le nez.','Cela dura trois mois, puis je partis pour l\'Amérique, le coeur broyé de désespoir. Mais sa pensée demeura en moi, persistante, triomphante. Elle me possédait de loin comme elle m\'avait possédé de près. Des années passèrent. Je ne l\'oubliais point. Son image charmante restait devant mes yeux et dans mon coeur. Et ma tendresse lui demeurait fidèle, une tendresse tranquille, maintenant, quelque chose comme le souvenir aimé de ce que j\'avais rencontré de plus beau et de plus séduisant dans la vie.','* * * * *','Douze ans sont si peu de chose dans l\'existence d\'un homme! On ne les sent point passer! Elles vont l\'une après l\'autre, les années, doucement et vite, lentes et pressées, chacune est longue et si tôt finie! Et elles s\'additionnent si promptement, elles laissent si peu de trace derrière elles, elles s\'évanouissent si complètement qu\'en se retournant pour voir le temps parcouru on n\'aperçoit plus rien, et on ne comprend pas comment il se fait qu\'on soit vieux.','Il me semblait vraiment que quelques mois à peine me séparaient de cette saison charmante sur le galet d\'Étretat.','J\'allais au printemps dernier dîner à Maisons-Laffitte, chez des amis.','Au moment où le train partait, une grosse dame monta dans mon wagon, escortée de quatre petites filles. Je jetai à peine un coup d\'oeil sur cette mère poule très large, très ronde, avec une face de pleine lune qu\'encadrait un chapeau enrubanné.','Elle respirait fortement, essoufflée d\'avoir marché vite. Et les enfants se mirent à babiller. J\'ouvris mon journal et je commençai à lire.','Nous venions de passer Asnières, quand ma voisine me dit tout à coup:','--Pardon, monsieur, n\'êtes-vous pas monsieur Carnier?','--Oui, madame.','Alors elle se mit à rire, d\'un rire content de brave femme, et un peu triste pourtant.','--Vous ne me reconnaissez pas?','J\'hésitais. Je croyais bien en effet avoir vu quelque part ce visage; mais où? mais quand? Je répondis:','--Oui... et non... Je vous connais certainement, sans retrouver votre nom.','Elle rougit un peu.','--Madame Julie Lefèvre.','Jamais je ne reçus un pareil coup. Il me sembla en une seconde que tout était fini pour moi! Je sentais seulement qu\'un voile s\'était déchiré devant mes yeux et que j\'allais découvrir des choses affreuses et navrantes.','C\'était elle! cette grosse femme commune, elle? Et elle avait pondu ces quatre filles depuis que je ne l\'avais vue. Et ces petits êtres m\'étonnaient autant que leur mère elle-même. Ils sortaient d\'elle; ils étaient grands déjà, ils avaient pris place dans la vie. Tandis qu\'elle ne comptait plus, elle, cette merveille de grâce coquette et fine. Je l\'avais vue hier, me semblait-il, et je la retrouvais ainsi! Était-ce possible? Une douleur violente m\'étreignait le coeur, et aussi une révolte contre la nature même, une i
