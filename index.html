/* ---------- Sound: a fanfare built from oscillators, no files needed ---------- */
let AC = null;
function audio(){
  if(state.sound === false) return null;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function note(ac, at, freq, dur, gain, type){
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(gain, at + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(at); o.stop(at + dur + 0.05);
}
function boom(ac, at, gain){
  const len = Math.floor(ac.sampleRate * 0.6);
  const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 2.6);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(2200, at);
  f.frequency.exponentialRampToValueAtTime(110, at + 0.45);
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.6);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(at);
}
function whoosh(ac, at){
  const len = Math.floor(ac.sampleRate * 0.5);
  const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * 0.5;
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 6;
  f.frequency.setValueAtTime(400, at);
  f.frequency.exponentialRampToValueAtTime(2600, at + 0.42);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(0.12, at + 0.1);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.46);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(at);
}
function fanfare(){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + 0.06;
  const C5 = 523.25, E5 = 659.25, G5 = 783.99, C6 = 1046.5, C4 = 261.63, G3 = 196.0;
  [[C5, 0], [E5, 0.11], [G5, 0.22], [C6, 0.33]].forEach(function(n){
    note(ac, t + n[1], n[0], 0.42, 0.16);
    note(ac, t + n[1], n[0] / 2, 0.42, 0.07, 'sine');
  });
  [C5, E5, G5, C6].forEach(function(f){ note(ac, t + 0.58, f, 1.5, 0.12); });
  note(ac, t + 0.58, C4, 1.7, 0.11, 'sine');
  note(ac, t + 0.58, G3, 1.7, 0.08, 'sine');
  [0.02, 0.55, 1.05, 1.55, 2.1, 2.6].forEach(function(d, i){ boom(ac, t + d, 0.5 - i*0.03); });
  [0.5, 1.0, 1.5, 2.05, 2.55].forEach(function(d){ whoosh(ac, t + d - 0.42); });
}

/* ---------- Fireworks ---------- */
let fxRunning = false;
function fireworks(opt){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  opt = opt || {};
  const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cs = getComputedStyle(document.documentElement);
  const COLS = [cs.getPropertyValue('--accent').trim(), cs.getPropertyValue('--gold').trim(),
                '#FF5C8A', '#4FE3C1', '#FFD84D', '#7AA5FF', '#FF9F45', '#FFFFFF'];

  const veilMax = opt.veil == null ? 0.34 : opt.veil;
  const total = opt.duration || 130;
  const parts = [];
  const queue = (opt.bursts || []).slice().sort(function(a, b){ return (a.at||0) - (b.at||0); });

  function spawn(b){
    const n = b.count || 150, power = b.power || 1.6;
    const hue = b.mono ? COLS[(Math.random()*COLS.length)|0] : null;
    for(let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2;
      const v = (1.5 + Math.pow(Math.random(), 0.6) * 9) * power;
      parts.push({
        x: b.x, y: b.y, px: b.x, py: b.y,
        vx: Math.cos(a)*v, vy: Math.sin(a)*v - 1.2*power,
        c: hue || COLS[(Math.random()*COLS.length)|0],
        w: 1.4 + Math.random()*2.8,
        life: 0, max: 55 + Math.random()*55
      });
    }
  }

  let t = 0;
  if(fxRunning) fxRunning = false;
  fxRunning = true;
  (function frame(){
    t++;
    const fade = t < 8 ? t/8 : (t > total - 34 ? Math.max(0, (total - t)/34) : 1);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H);
    if(veilMax > 0){
      ctx.fillStyle = 'rgba(9,7,16,' + (veilMax * fade).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    while(queue.length && (queue[0].at || 0) <= t) spawn(queue.shift());

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for(const p of parts){
      p.life++;
      if(p.life > p.max) continue;
      p.px = p.x; p.py = p.y;
      p.vy += 0.15;
      p.vx *= 0.982; p.vy *= 0.982;
      p.x += p.vx; p.y += p.vy;
      const a = Math.max(0, 1 - p.life / p.max) * fade;
      ctx.strokeStyle = p.c;
      ctx.globalAlpha = a * 0.28;                       // glow
      ctx.lineWidth = p.w * 3.4;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.globalAlpha = a;                              // core
      ctx.lineWidth = p.w;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
    }

    if(t < total && fxRunning) requestAnimationFrame(frame);
    else {
      fxRunning = false;
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.clearRect(0, 0, W, H);
    }
  })();
}

/* ---------- Word test: five of her own saved words, once a day ----------
   The words are the ones she saves in the speaking roulette or types in herself —
   nothing else. Questions alternate between «what does it mean» and «fill the gap»;
   a word she gets right moves up a box and comes back less often. */
/* wq:pure */
const WQ_LEN = 5, WQ_MIN = 4;
function wqClean(s){ s = String(s == null ? '' : s).trim(); return s === '—' ? '' : s; }
function wqMeaning(w){ return wqClean(w.ru) || wqClean(w.mean); }
/* a saved dialogue reply is a whole sentence with an instruction for a meaning: it joins the cards, not the word test */
function wqUsable(words){ return (words || []).filter(function(w){ return wqClean(w.term) && wqMeaning(w) && w.src !== 'dialogue'; }); }
function wqShuffle(a, rnd){
  const b = a.slice();
  for(let i = b.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)), t = b[i]; b[i] = b[j]; b[j] = t; }
  return b;
}
/* the sentence with the word hidden — «ghost» also finds «ghosted», every occurrence goes — or null when it is not there.
   A word of three letters or fewer matches only as a whole word, so «in» never blanks «interesting». */
function wqBlank(ctx, term){
  const norm = function(x){ return String(x == null ? '' : x).replace(/[‘’]/g, "'"); };
  const s = norm(ctx), full = norm(term).trim();
  const core = full.replace(/^(to|a|an|the)\s+/i, '').replace(/\s+(someone|somebody|something|sb|sth)$/i, '');
  const esc2 = function(x){ return x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
  /* the phrase as typed first, then without a leading «to»/«a» and a trailing «someone» */
  const tries = [full, core].filter(function(x, i, a){ return x && a.indexOf(x) === i; });
  for(let t = 0; t < tries.length; t++){
    const parts = tries[t].split(/\s+/);
    const first = esc2(parts[0]) + (parts[0].length > 3 ? "[a-z']*" : '\\b');
    let re;
    try{ re = new RegExp('\\b' + first + parts.slice(1).map(function(x){ return '\\s+' + esc2(x) + '\\b'; }).join(''), 'ig'); }catch(e){ continue; }
    if(re.test(s)) return s.replace(re, '____');
  }
  return null;
}
function wqBuild(words, n, today, rnd){
  const pool = wqUsable(words);
  if(pool.length < WQ_MIN) return [];
  /* the weakest first, then the longest unseen; one already asked today waits its turn */
  const order = wqShuffle(pool, rnd).sort(function(a, b){
    const ta = a.last === today ? 1 : 0, tb = b.last === today ? 1 : 0;
    if(ta !== tb) return ta - tb;
    if((a.box || 0) !== (b.box || 0)) return (a.box || 0) - (b.box || 0);
    return String(a.last || '').localeCompare(String(b.last || ''));
  });
  return order.slice(0, Math.min(n, pool.length)).map(function(w){
    const gap = wqBlank(w.ctx, w.term), useGap = !!gap && rnd() < 0.5;
    const right = useGap ? String(w.term).trim() : wqMeaning(w);
    const wrong = [], seen = {};
    seen[right.toLowerCase()] = true;
    wqShuffle(pool.filter(function(x){ return x.id !== w.id; }), rnd).forEach(function(x){
      const t = useGap ? String(x.term).trim() : wqMeaning(x);
      if(wrong.length < 3 && !seen[t.toLowerCase()]){ seen[t.toLowerCase()] = true; wrong.push(t); }
    });
    if(wrong.length < 2) return null;
    const options = wqShuffle([{t:right, ok:true}].concat(wrong.map(function(t){ return {t:t, ok:false}; })), rnd);
    return {wid:w.id, kind:useGap ? 'blank' : 'mean', prompt:useGap ? gap : String(w.term).trim(), hint:useGap ? wqMeaning(w) : '', answer:right, options:options};
  }).filter(Boolean);
}
/* the word after an answer: right moves it up a box, wrong sends it back to the start */
function wqGrade(w, ok, today){
  const r = Object.assign({}, w);
  r.seen = (r.seen || 0) + 1;
  if(ok){ r.right = (r.right || 0) + 1; r.box = Math.min(4, (r.box || 0) + 1); }
  else r.box = 0;
  r.last = today;
  return r;
}
/* today's score: another round never lowers the one already earned */
function wqBest(prev, right, n){
  if(prev && prev.n && prev.right / prev.n >= right / n) return prev;
  return {n:n, right:right};
}
/* wq:end */

function wqState(){
  if(!state.wq) state.wq = {days:{}};
  if(!state.wq.days) state.wq.days = {};
  return state.wq;
}
let wq = null;
function wqTodayCard(){
  const have = wqUsable(state.words).length, day = wqState().days[today()];
  if(have < WQ_MIN){
    return '<section class="wq-card"><p class="eyebrow">📚 Word test</p><h3>A quick test on your own words</h3>'+
      '<p class="fd-sub">Save a few words in the speaking roulette, or type in your own — with '+WQ_MIN+' of them a test appears here every day.'+
      (have ? ' You have '+have+' so far.' : '')+'</p>'+
      '<button class="btn btn-full" data-act="sw-add">+ Add a word</button></section>';
  }
  if(day){
    return '<section class="wq-card done"><div class="wq-row"><span><p class="eyebrow">📚 Word test</p>'+
      '<p class="wq-score">✓ Today: '+day.right+' of '+day.n+'</p></span>'+
      '<button class="btn btn-ghost btn-sm" data-act="wq-start">Another round</button></div></section>';
  }
  return '<section class="wq-card"><p class="eyebrow">📚 Word test</p><h3>'+Math.min(WQ_LEN, have)+' questions, about a minute</h3>'+
    '<p class="fd-sub">From the '+have+' words you saved. The ones you know least come first.</p>'+
    '<button class="btn btn-primary btn-full" data-act="wq-start">Start</button></section>';
}
function wqBack(){
  return '<button class="backbtn" data-act="wq-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Back to today</button>';
}
function wqWordCard(w){
  if(!w) return '';
  return '<article class="tk-word tk-single"><div class="tk-wtop"><b>'+esc(w.term)+'</b><span class="tk-ru-big" lang="ru">'+esc(wqMeaning(w))+'</span></div>'+
    (w.ctx ? '<p class="tk-ex">'+swMark(w.ctx, w.term)+'</p>' : '')+'</article>';
}
function renderWordTest(){
  if(!wq) { todayView = 'main'; return renderToday(); }
  if(wq.finished){
    const missed = wq.missed.map(function(id){ return (state.words || []).find(function(w){ return w.id === id; }); }).filter(Boolean);
    return void (view.innerHTML = wqBack()+
      '<p class="eyebrow" style="margin:14px 2px 0">Word test · done</p>'+
      '<h2 class="rec-title">'+wq.right+' of '+wq.qs.length+'</h2>'+
      (missed.length
        ? '<p class="fd-sub">These will come back sooner:</p><div class="wq-missed">'+missed.map(wqWordCard).join('')+'</div>'
        : '<p class="fd-sub">All of them right — those words will wait longer before they come back.</p>')+
      '<button class="btn btn-primary btn-full" data-act="wq-close" style="margin-top:16px">Done</button>');
  }
  const q = wq.qs[wq.i], w = (state.words || []).find(function(x){ return x.id === q.wid; });
  const picked = wq.picked, answered = picked != null;
  let h = wqBack()+'<p class="eyebrow" style="margin:14px 2px 8px">Word test · '+(wq.i + 1)+' of '+wq.qs.length+'</p>';
  if(q.kind === 'mean') h += '<p class="wq-word">'+esc(q.prompt)+'</p><p class="fd-sub" style="margin-top:0">What does it mean?</p>';
  else h += '<p class="pd-q">'+esc(q.prompt)+'</p>'+(q.hint ? '<p class="fd-sub" style="margin-top:-6px" lang="ru">'+esc(q.hint)+'</p>' : '');
  h += '<div class="pd-opts">'+q.options.map(function(o, i){
    const cls = !answered ? '' : o.ok ? ' right' : i === picked ? ' wrong' : ' dim';
    return '<button class="pd-opt'+cls+'" data-act="wq-pick" data-i="'+i+'"'+(answered ? ' disabled' : '')+'><span class="k">'+'ABCD'[i]+'</span><span>'+esc(o.t)+'</span></button>';
  }).join('')+'</div>';
  if(answered){
    h += '<div class="wq-fb">'+(q.options[picked].ok ? '<p class="wq-ok">✓ Right</p>' : '<p class="wq-no">Not quite</p>')+wqWordCard(w)+'</div>'+
      '<button class="btn btn-primary btn-full" data-act="wq-next" style="margin-top:14px">'+(wq.i + 1 < wq.qs.length ? 'Next' : 'See the result')+'</button>';
  }
  view.innerHTML = h;
}

/* ---------- Winter Arc: 4 October to 31 December ----------
   Yoga stays the daily base; two small habits (a walk, a journal); a tracker of what was
   done day by day, a quiet «day N of 89» and a short check-in every Wednesday. No points,
   no streak numbers. */
/* arc:pure */
const ARC_START = '2026-10-04', ARC_END = '2026-12-31';
const ARC_HABITS = [
  {id:'a-walk',  title:'Walk 15–20 minutes', emoji:'🚶', perDay:1, weekGoal:7, when:'day',     arc:'body', why:''},
  {id:'a-worry', title:'Keep a journal',     emoji:'📓', perDay:1, weekGoal:7, when:'evening', arc:'head', why:''}
];
/* the first version of the Arc had six habits; these four are gone */
const ARC_GONE = ['a-core', 'a-avoid', 'a-no', 'a-bed'];
function arcUtc(key){ const p = String(key).split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
function arcDiff(a, b){ return Math.round((arcUtc(b) - arcUtc(a)) / 86400000); }
function arcKeyAdd(key, n){
  const d = new Date(arcUtc(key) + n * 86400000);
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}
function arcTotal(arc){ return arcDiff(arc.start, arc.end) + 1; }
function arcDayNo(arc, key){ return arcDiff(arc.start, key) + 1; }
function arcPhase(arc, key){ const n = arcDayNo(arc, key); return n < 1 ? 'before' : n > arcTotal(arc) ? 'after' : 'in'; }
function arcMonday(key){ return arcKeyAdd(key, -((new Date(arcUtc(key)).getUTCDay() + 6) % 7)); }
/* starting: the habits are added once, nothing she has is touched, and one she deletes stays deleted */
function arcEnsure(st, key){
  let changed = false;
  if(!st.arc){
    if(key > ARC_END) return false;
    st.arc = {start:ARC_START, end:ARC_END, reviews:{}, seeded:false, simple:true}; changed = true;
  }
  if(!st.arc.reviews) st.arc.reviews = {};
  if(!st.arc.seeded){
    ARC_HABITS.forEach(function(h){ if(!st.habits.some(function(x){ return x.id === h.id; })) st.habits.push(Object.assign({}, h)); });
    st.arc.seeded = true; changed = true;
  }
  if(arcSimplify(st)) changed = true;
  return changed;
}
/* the first version of the Arc, already on her phone, becomes the simple one — once */
function arcSimplify(st){
  if(!st.arc || st.arc.simple) return false;
  st.habits = st.habits.filter(function(h){ return ARC_GONE.indexOf(h.id) < 0; });
  ARC_GONE.forEach(function(id){ if(st.log) delete st.log[id]; });
  st.habits.forEach(function(h){
    if(h.id === 'a-worry'){ if(/worries/i.test(h.title || '')){ h.title = 'Keep a journal'; h.emoji = '📓'; } h.weekGoal = 7; }
    if(h.id === 'a-walk') h.weekGoal = 7;
  });
  delete st.strength;
  st.arc.simple = true;
  return true;
}
/* a check-in can be made from Wednesday to Sunday, and not before the fourth day of the Arc */
function arcCanReview(arc, key){
  if(arcPhase(arc, key) !== 'in' || arcDayNo(arc, key) < 4) return false;
  return (new Date(arcUtc(key)).getUTCDay() + 6) % 7 >= 2;
}
/* ... and it is due until it has been done */
function arcReviewDue(arc, key){ return arcCanReview(arc, key) && !arc.reviews[arcMonday(key)]; }
const ARC_ADVICE = {
  body:   {title:'Build the core',      text:'Pick a strength-focused yoga class on two days this week, and hold every pose one breath longer than feels comfortable.'},
  calm:   {title:'Quieter evenings',    text:'Write the evening down in your journal, and next to every worry put one line: “one step I can take” or “let it go”.'},
  energy: {title:'Protect your energy', text:'Pick one thing that drains you and do less of it this week, and take a short walk after your first meal.'},
  home:   {title:'One small order',     text:'Choose one corner or one overdue task and give it ten minutes a day; stop when the timer ends, even mid-thought.'},
  keep:   {title:'Hold the line',       text:'It is going well. Keep the same week and notice what has become easy — that is the progress.'}
};
/* what to change next week: the weakest of the four areas */
function arcFocus(r){
  const order = ['body', 'calm', 'energy', 'home'];
  let key = order[0];
  order.forEach(function(k){ if((r[k] || 0) < (r[key] || 0)) key = k; });
  if((r[key] || 0) >= 4) key = 'keep';
  return {key:key, title:ARC_ADVICE[key].title, text:ARC_ADVICE[key].text};
}
function arcDone(h, log, key){ return (((log[h.id] || {})[key]) || 0) >= (h.perDay || 1); }
/* the week that contains `key`, Monday to Sunday, one row per habit */
function arcWeek(habits, log, key){
  const mon = arcMonday(key);
  return habits.filter(function(h){ return !h.archived; }).map(function(h){
    const cells = [];
    for(let i = 0; i < 7; i++){ const k = arcKeyAdd(mon, i); cells.push({key:k, done:arcDone(h, log, k), future:k > key, today:k === key}); }
    return {id:h.id, title:h.title, emoji:h.emoji, weekly:(h.weekGoal || 7) < 5, cells:cells};
  });
}
/* how much of the day was done, 0–4; the weekly habit does not count against a day */
function arcDayLevel(habits, log, key){
  const hs = habits.filter(function(h){ return !h.archived && (h.weekGoal || 7) >= 5; });
  if(!hs.length) return 0;
  const f = hs.filter(function(h){ return arcDone(h, log, key); }).length / hs.length;
  return f === 0 ? 0 : f < 0.34 ? 1 : f < 0.67 ? 2 : f < 1 ? 3 : 4;
}
function arcHeat(arc, habits, log, key){
  const out = [], n = arcTotal(arc);
  for(let i = 0; i < n; i++){ const k = arcKeyAdd(arc.start, i); out.push({key:k, level:k > key ? -1 : arcDayLevel(habits, log, k)}); }
  return out;
}
/* arc:end */

const ARC_REVIEW_Q = [
  ['energy', 'Energy', 'How was your energy this week?', ['😴', '🥱', '😐', '🙂', '⚡']],
  ['body',   'Body',   'Do you feel stronger in your body?', ['1', '2', '3', '4', '5']],
  ['calm',   'Calm',   'How quiet was your mind?', ['1', '2', '3', '4', '5']],
  ['home',   'Home',   'How much in order are home and tasks?', ['1', '2', '3', '4', '5']]
];
let arcDraft = null;
document.addEventListener('input', function(e){ if(e.target && e.target.id === 'arcNote' && arcDraft) arcDraft.note = e.target.value; });
function arcState(){ arcEnsure(state, today()); return state.arc || null; }
function arcTodayCard(){
  const a = arcState();
  if(!a) return '';
  const key = today(), ph = arcPhase(a, key), total = arcTotal(a);
  if(ph === 'before') return '';
  const n = Math.min(arcDayNo(a, key), total), pct = Math.round(n / total * 100);
  const due = arcReviewDue(a, key);
  return '<button class="arc-card" data-act="arc-open"><span class="arc-top"><span class="eyebrow">❄️ Winter Arc</span><span class="go">Open →</span></span>'+
    '<span class="arc-day">'+(ph === 'after' ? 'The Arc is finished' : 'Day <b class="num">'+n+'</b> of '+total)+'</span>'+
    '<span class="pbar"><i style="width:'+pct+'%"></i></span>'+
    '<span class="arc-sub">'+(due ? '✨ Your Wednesday check-in is ready' : 'Stronger, calmer, lighter by 1 January')+'</span></button>';
}
function arcBack(act, label){
  return '<button class="backbtn" data-act="'+act+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>'+label+'</button>';
}
function renderArc(){
  const a = arcState();
  if(!a){ todayView = 'main'; return renderToday(); }
  const key = today(), total = arcTotal(a), n = Math.min(Math.max(arcDayNo(a, key), 1), total);
  const habits = activeHabits(), due = arcReviewDue(a, key);
  let h = arcBack('arc-close', 'Back to today')+
    '<p class="eyebrow" style="margin:14px 2px 0">❄️ Winter Arc</p>'+
    '<h2 class="rec-title">Day '+n+' of '+total+'</h2>'+
    '<div class="pbar" style="margin:10px 0 4px"><i style="width:'+Math.round(n / total * 100)+'%"></i></div>'+
    '<p class="fd-sub" style="margin-top:6px">'+arcFmt(a.start)+' → '+arcFmt(a.end)+'. Yoga stays the base of every day.</p>';
  /* the week */
  h += '<div class="section-head"><p class="eyebrow">This week</p></div><p class="fd-sub" style="margin-top:-4px">Tap a day to mark or unmark it.</p><div class="arc-week">'+
    arcWeek(habits, state.log, key).map(function(r){
      return '<div class="arc-habit"><p class="arc-wname">'+esc(r.emoji || '⭐️')+' '+esc(r.title)+(r.weekly ? ' <small>weekly</small>' : '')+'</p><div class="arc-cells">'+
        r.cells.map(function(c, i){
          return '<button type="button" class="arc-cell'+(c.done ? ' on' : '')+(c.today ? ' today' : '')+(c.future ? ' future' : '')+'" data-act="arc-cell" data-id="'+esc(r.id)+'" data-d="'+c.key+'"'+(c.future ? ' disabled' : '')+(c.today ? ' aria-current="date"' : '')+
            ' aria-label="'+esc(r.title)+', '+esc(arcFmt(c.key))+(c.done ? ', done' : '')+'"><span class="d">'+WSHORT[i]+'</span><span class="n">'+(+c.key.slice(8))+'</span></button>';
        }).join('')+'</div></div>';
    }).join('')+'</div>';
  /* the whole Arc */
  h += '<div class="section-head"><p class="eyebrow">The whole Arc</p></div><div class="arc-heat">'+
    arcHeat(a, habits, state.log, key).map(function(c){
      return '<i class="l'+(c.level < 0 ? 'f' : c.level)+(c.key === key ? ' today' : '')+'" title="'+esc(arcFmt(c.key))+'"></i>';
    }).join('')+'</div><p class="fd-sub">Every square is a day; the darker, the more of it you did.</p>';
  /* the check-in */
  const last = Object.keys(a.reviews).sort().pop(), lr = last && a.reviews[last];
  h += '<div class="section-head"><p class="eyebrow">Wednesday check-in</p></div>';
  if(due) h += '<button class="btn btn-primary btn-full" data-act="arc-review">Start the check-in · 2 minutes</button>';
  else {
    if(lr){ const f = arcFocus(lr); h += '<article class="arc-goal"><b>Last time: '+esc(f.title)+'</b><p>'+esc(f.text)+'</p>'+(lr.note ? '<p class="arc-note">“'+esc(lr.note)+'”</p>' : '')+'</article>'; }
    if(arcCanReview(a, key)) h += '<button class="btn btn-ghost btn-full" data-act="arc-review" style="margin-top:10px">'+(lr ? 'Check in again' : 'Check in now')+'</button>'+
      '<p class="fd-sub">It opens by itself on Wednesday.</p>';
    else h += '<p class="fd-sub">The check-in opens on Wednesday, so there is a week to look back on.</p>';
  }
  view.innerHTML = h;
}
function arcFmt(k){ const d = toDate(k); return MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate(); }
function renderArcReview(){
  const a = arcState();
  if(!a){ todayView = 'main'; return renderToday(); }
  const d = arcDraft || (arcDraft = {week: arcMonday(today())});
  if(d.saved){
    const f = arcFocus(d.saved);
    return void (view.innerHTML = arcBack('arc-close', 'Back to today')+
      '<p class="eyebrow" style="margin:14px 2px 0">Wednesday check-in · done</p><h2 class="rec-title">Next week</h2>'+
      '<article class="arc-goal arc-focus"><b>'+esc(f.title)+'</b><p>'+esc(f.text)+'</p></article>'+
      (d.saved.note ? '<p class="arc-note">“'+esc(d.saved.note)+'”</p>' : '')+
      '<button class="btn btn-primary btn-full" data-act="arc-close" style="margin-top:14px">Done</button>');
  }
  const pick = function(k, v){ return d[k] === v ? 'true' : 'false'; };
  let h = arcBack('arc-open', 'Winter Arc')+'<p class="eyebrow" style="margin:14px 2px 0">Wednesday check-in</p><h2 class="rec-title">How was the week?</h2>'+
    '<p class="fd-sub">Two minutes. Tap what is closest — there are no right answers.</p>';
  ARC_REVIEW_Q.forEach(function(q){
    h += '<section class="arc-sec"><p class="arc-q">'+q[2]+'</p><div class="arc-scale">'+q[3].map(function(e, i){
      return '<button type="button" data-act="arc-set" data-k="'+q[0]+'" data-v="'+(i + 1)+'" aria-pressed="'+pick(q[0], i + 1)+'">'+e+'</button>';

/* ---------- Dates ---------- */
/* day:pure */
function dk(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/* the day turns over at 4 a.m., not at midnight: a habit ticked at 1 a.m. still belongs to the day that has not been slept off yet */
const DAY_STARTS_AT = 4;
function logicalNow(ms){ const d = new Date(ms == null ? Date.now() : ms); d.setHours(d.getHours() - DAY_STARTS_AT); return d; }
function dayKeyAt(ms){ return dk(logicalNow(ms)); }
/* day:end */
/* a past day chosen with ‹ › on Today (null = the real today); every habit tick, yoga log and rotation follows it */
let selDay = null;
function realToday(){ return dayKeyAt(); }
function today(){ return selDay || dayKeyAt(); }
/* daynav:pure */
function dnAdd(key, n){
  const p = String(key).split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}
const DN_BACK = 365;
/* ‹ : one day earlier, never more than a year back */
function dnPrev(sel, real){ const cur = sel || real, p = dnAdd(cur, -1); return p < dnAdd(real, -DN_BACK) ? cur : p; }
/* › : one day later; reaching today means «today» (null), and never past it */
function dnNext(sel, real){ if(!sel) return null; const n = dnAdd(sel, 1); return n >= real ? null : n; }
function dnLabel(sel, real){
  if(!sel) return 'Today';
  const a = String(sel).split('-').map(Number), b = String(real).split('-').map(Number);
  const d = Math.round((Date.UTC(b[0], b[1] - 1, b[2]) - Date.UTC(a[0], a[1] - 1, a[2])) / 86400000);
  return d === 1 ? 'Yesterday' : d + ' days ago';
}
function dnCanMark(key, real){ return key <= real; }
/* daynav:end */
function shift(key, n){ const p=key.split('-').map(Number); return dk(new Date(p[0], p[1]-1, p[2]+n)); }
function toDate(key){ const p=key.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }

let tdArch = false;

function todos(){ return state.todos || (state.todos = []); }
function tdSort(list){
  return list.slice().sort(function(a, b){
    if(!!a.done !== !!b.done) return a.done ? 1 : -1;
    const at = a.time || '99:99', bt = b.time || '99:99';
    if(at !== bt) return at < bt ? -1 : 1;
    return (a.made || 0) - (b.made || 0);
  });
}
/* archive:pure */
/* finished tasks leave the lists and wait in the archive, the latest first; nothing is ever deleted by finishing */
function tdSplit(list){
  return {
    open: list.filter(function(t){ return !t.done; }),
    archive: list.filter(function(t){ return t.done; }).sort(function(a, b){
      return String(b.doneAt || '').localeCompare(String(a.doneAt || '')) || (b.made || 0) - (a.made || 0);
    })
  };
}
/* archive:end */
function tdGroups(){
  const key = today(), tom = shift(key, 1);
  const g = {late:[], today:[], tomorrow:[], later:[], someday:[]};
  tdSplit(todos()).open.forEach(function(t){
    if(!t.date) { g.someday.push(t); return; }
    if(t.date < key) { g.late.push(t); return; }
    if(t.date === key) { g.today.push(t); return; }
    if(t.date === tom) { g.tomorrow.push(t); return; }
    g.later.push(t);
  });
  Object.keys(g).forEach(function(k){ g[k] = tdSort(g[k]); });
  return g;
}
/* plans:pure */
function plansSort(a, b){
  const at = a.time || '99:99', bt = b.time || '99:99';
  if(at !== bt) return at < bt ? -1 : 1;
  return (a.made || 0) - (b.made || 0);
}
/* what the card at the top of Today shows: today's open tasks (overdue ones first, oldest day first, marked late),
   tomorrow's, and what she has already ticked today (kept, struck through, so a tick can be undone) */
function plansBuild(list, key, tomorrow){
  const open = list.filter(function(t){ return !t.done && t.date; });
  const byDay = function(a, b){ return a.date !== b.date ? (a.date < b.date ? -1 : 1) : plansSort(a, b); };
  const late = open.filter(function(t){ return t.date < key; }).sort(byDay).map(function(t){ return Object.assign({}, t, {late:true}); });
  const doneList = list.filter(function(t){ return t.done && (t.date === key || t.doneAt === key); }).sort(plansSort);
  return {
    today: late.concat(open.filter(function(t){ return t.date === key; }).sort(plansSort)),
    tomorrow: open.filter(function(t){ return t.date === tomorrow; }).sort(plansSort),
    overdue: late.length,
    doneList: doneList,
    doneToday: doneList.length
  };
}

/* cal:pure */
const CAL_HEAD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
function calKey(y, m, d){ return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }
/* the weeks of a month, Monday first: whole weeks only (four to six), the days around the month are marked outside it */
function calMonth(y, m){
  const lead = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate(), n = Math.ceil((lead + days) / 7) * 7, out = [];
  for(let i = 0; i < n; i++){
    const d = new Date(y, m, 1 - lead + i);
    out.push({key:calKey(d.getFullYear(), d.getMonth(), d.getDate()), day:d.getDate(), inMonth:d.getMonth() === m});
  }
  return out;
}
function calShift(y, m, n){ const d = new Date(y, m + n, 1); return {y:d.getFullYear(), m:d.getMonth()}; }
/* open tasks per day: how many, and whether the day is already behind us */
function calDots(list, today){
  const r = {};

    if(t.done || !t.date) return;
    const c = r[t.date] || (r[t.date] = {n:0, late:t.date < today});

}
/* cal:end */
/* the calendar shows a month and a chosen day; opening the tab always starts on today */
let tdSel = null, tdMon = null;

function tdSelKey(){

}
function tdMonth(){

  return tdMon;
}
function tdDayLabel(k){

  const d = toDate(k);
  return WDAYS[d.getDay()].slice(0, 3) + ', ' + MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate() + (d.getFullYear() !== toDate(t).getFullYear() ? ', ' + d.getFullYear() : '');

    '<button class="cal-nav" data-act="cal-next" aria-label="Next month">›</button></div>'+

function renderTodos(){

function srsShuffle(a, rnd){
  const b = a.slice();
  for(let i = b.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)), t = b[i]; b[i] = b[j]; b[j] = t; }
  return b;
}
/* srs:end */

  const pick = function(rx, local){ return en.find(function(v){ return rx.test(v.lang) && (!local || v.localService); }); };
  return pick(/^en[-_]GB/i, true) || pick(/^en[-_]GB/i) || pick(/^en[-_]US/i, true) || pick(/^en[-_]US/i) || en[0] || null;
}
function engSpeak(text, slow){

let en = null;
const enMic = {rec:null, url:null, timer:null, no:false, busy:false};
function enMicReset(){
  enMic.tok = (enMic.tok || 0) + 1;
  clearTimeout(enMic.timer); enMic.timer = null;
  if(enMic.rec && enMic.rec.state !== 'inactive'){ enMic.rec.onstop = null; try{ enMic.rec.stop(); enMic.rec.stream.getTracks().forEach(function(x){ x.stop(); }); }catch(e){} }
  enMic.rec = null; enMic.busy = false;
  if(enMic.url){ URL.revokeObjectURL(enMic.url); enMic.url = null; }
}
function enMicStart(maxMs){
  enMicReset(); enMic.no = false;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ enMic.no = true; enRender(); return; }
  enMic.busy = true; enRender();
  const tok = enMic.tok;
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    if(!enMic.busy || tok !== enMic.tok){ stream.getTracks().forEach(function(x){ x.stop(); }); return; }
    const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(function(x){ return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(x); });
    let rec;
    try{ rec = new MediaRecorder(stream, type ? {mimeType:type} : undefined); }
    catch(e){ stream.getTracks().forEach(function(x){ x.stop(); }); enMic.no = true; enMic.busy = false; enRender(); return; }
    const chunks = [];
    rec.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = function(){
      stream.getTracks().forEach(function(x){ x.stop(); });
      enMic.busy = false; enMic.rec = null; crsStopListen();
      if(chunks.length) enMic.url = URL.createObjectURL(new Blob(chunks, {type:rec.mimeType || type || 'audio/mp4'}));
      if(tab === 'english') enRender();
    };
    rec.start(); enMic.rec = rec; enRender();
    enMic.timer = setTimeout(enMicStop, maxMs || 10000);
  }).catch(function(){ if(tok !== enMic.tok) return; enMic.no = true; enMic.busy = false; enRender(); });
}
function enMicStop(){
  clearTimeout(enMic.timer); enMic.timer = null;
  if(enMic.rec && enMic.rec.state !== 'inactive'){ try{ enMic.rec.stop(); }catch(e){} }
}


/* ---- English lessons: a self-study course with a tutor's structure ----
   Six lessons so far, two parts each, a unit test after every unit. The logic that decides what is next, what a test
   asks and how a speaking answer looks is pure and tested; the screens come after it. */
/* course:pure */
const CRS_TEST_N = 12;
/* the course in order: the lessons of each unit, then that unit's test */
function crsOrder(data){
  const out = [];
  data.units.forEach(function(u){
    u.lessons.forEach(function(id){ out.push({kind:'lesson', id:id}); });
    out.push({kind:'test', id:u.id});
  });
  return out;
}
/* where she is: the first item not finished; part 2 opens on a later day than part 1 (she can still press "Do it now") */
function crsStatus(c, order, today){
  let cur = null, doneCount = 0, total = 0;
  order.forEach(function(x){
    const done = x.kind === 'lesson' ? !!(c.done && c.done[x.id]) : !!(c.tests && c.tests[x.id]);
    if(x.kind === 'lesson'){ total++; if(done) doneCount++; }
    if(!done && !cur) cur = x;
  });
  const p = cur && cur.kind === 'lesson' && c.parts && c.parts[cur.id];
  const part = p && p[1] ? 2 : 1;
  return {cur:cur, part:part, part2Open:!!(p && p[1] && p[1].day < today), doneCount:doneCount, total:total};
}
/* a part is finished; the day of the first finish is kept; finishing part 2 ends the lesson */
function crsFinishPart(c, lid, part, today, score){
  if(!c.parts) c.parts = {};
  if(!c.done) c.done = {};
  const p = c.parts[lid] || (c.parts[lid] = {});
  if(!p[part]) p[part] = {day:today};
  if(part === 2 && !c.done[lid]) c.done[lid] = {date:today, score:score || {right:0, n:0}};
}
/* the lesson score: the first attempts of its quiz and gap steps */
function crsScore(lesson, ans){
  let right = 0, n = 0;
  lesson.parts.forEach(function(p, pi){
    p.steps.forEach(function(s, si){
      const a = ans && ans[pi + 1] && ans[pi + 1][si];
      if((s.t === 'quiz' || s.t === 'gap') && a && a.checked && a.res){ a.res.forEach(function(ok){ n++; if(ok) right++; }); }
    });
  });
  return {right:right, n:n};
}
function crsNorm(s){ return String(s == null ? '' : s).toLowerCase().replace(/[’‘]/g, "'").replace(/'/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function crsGapOk(typed, answers){
  const t = crsNorm(typed), te = crsNorm(crsExpand(typed));
  return !!t && answers.some(function(a){ return crsNorm(a) === t || crsNorm(crsExpand(a)) === te; });
}
/* three options for «which phrase means …»: the right one and two others from the same lesson words */
/* two Russian glosses that share a word of five letters or more describe look-alike phrases: never offer them together */
function crsAlike(a, b){
  const st = function(x){ return (String(x || '').toLowerCase().match(/[а-яё]{5,}/g) || []).map(function(y){ return y.slice(0, 5); }); };
  const sb = st(b);
  return st(a).some(function(x){ return sb.indexOf(x) >= 0; });
}
function crsPhraseQ(w, pool, rnd){
  let cand = pool.filter(function(x){ return x.w !== w.w; });
  const apart = cand.filter(function(x){ return !crsAlike(w.ru, x.ru); });
  if(apart.length >= 2) cand = apart;
  const others = [];
  srsShuffle(cand, rnd).forEach(function(x){ if(others.length < 2 && !others.some(function(y){ return crsAlike(x.ru, y.ru); })) others.push(x); });
  srsShuffle(cand, rnd).forEach(function(x){ if(others.length < 2 && others.indexOf(x) < 0) others.push(x); });
  return {kind:'mc', q:'Which phrase means “'+w.ru+'”?', options:srsShuffle([{t:w.w, ok:true}].concat(others.map(function(x){ return {t:x.w, ok:false}; })), rnd), why:w.ex};
}
function crsRecall(words, rnd, n){
  if(words.length < 3) return [];
  return srsShuffle(words, rnd).slice(0, n).map(function(w){ return crsPhraseQ(w, words, rnd); });
}
/* a unit test: twelve questions drawn from the unit's own quiz questions, gap exercises and phrases */
function crsTest(lessons, unit, rnd){
  const quiz = [], gap = [], words = [];
  unit.lessons.forEach(function(id){
    const l = lessons.find(function(x){ return x.id === id; });
    if(!l) return;
    const lw = [];
    l.parts.forEach(function(p){ p.steps.forEach(function(s){
      if(s.t === 'quiz') s.qs.forEach(function(q){ quiz.push({kind:'mc', q:q.q, options:srsShuffle(q.o.map(function(t, i){ return {t:t, ok:i === q.a}; }), rnd), why:q.why || '', from:id}); });
      else if(s.t === 'gap') s.items.forEach(function(g){ gap.push({kind:'gap', s:g.s, answers:g.a, hint:g.hint || '', from:id}); });
      else if(s.t === 'words') s.items.forEach(function(w){ lw.push(w); });
    }); });
    if(lw.length >= 3) lw.forEach(function(w){ const q = crsPhraseQ(w, lw, rnd); q.from = id; words.push(q); });
  });
  const pools = [srsShuffle(quiz, rnd), srsShuffle(words, rnd), srsShuffle(gap, rnd)];
  const out = [];
  pools.forEach(function(p){ p.slice(0, CRS_TEST_N / 3).forEach(function(q){ out.push(q); }); });
  pools.forEach(function(p){ p.slice(CRS_TEST_N / 3).forEach(function(q){ if(out.length < CRS_TEST_N) out.push(q); }); });
  return srsShuffle(out, rnd);
}
/* the speaking analysis: counts only, it never pretends to grade */
const CRS_IRREG = {be:['am', 'is', 'are', 'was', 'were', 'been', 'being'], go:['went', 'gone', 'goes', 'going'], feel:['felt'], get:['got', 'gotten'], make:['made'], take:['took', 'taken'], have:['has', 'had'], do:['did', 'done', 'does'], say:['said'], see:['saw', 'seen'], think:['thought'], bring:['brought'], buy:['bought'], come:['came'], give:['gave', 'given'], keep:['kept'], know:['knew', 'known'], leave:['left'], lose:['lost'], meet:['met'], pay:['paid'], run:['ran'], sell:['sold'], tell:['told'], hold:['held'], break:['broke', 'broken'], fall:['fell', 'fallen'], find:['found'], sit:['sat'], put:['putting'], cut:['cutting'], sleep:['slept'], draw:['drew', 'drawn'], hang:['hung'], ring:['rang', 'rung'], spend:['spent'], build:['built'], send:['sent'], stand:['stood'], speak:['spoke', 'spoken'], write:['wrote', 'written'], wear:['wore', 'worn'], win:['won'], teach:['taught'], catch:['caught']};
const CRS_PLACE = ['someone', 'somebody', 'something', 'ones', 'your', 'my', 'his', 'her', 'their', 'our'];
const CRS_CONNECT = ['because', 'although', 'however', 'so', 'but', 'while', 'whereas', 'therefore', 'also', 'then', 'as a result', 'even though', 'in fact', 'unless', 'instead', 'besides', 'anyway', 'after that'];
function crsForms(w){
  const out = [w].concat(CRS_IRREG[w] || []), stem = w.replace(/e$/, ''), last = w.slice(-1);
  ['s', 'es', 'ed', 'd', 'ing'].forEach(function(suf){ out.push(stem + suf, w + suf); });
  out.push(w + last + 'ed', w + last + 'ing');
  if(/y$/.test(w)) out.push(w.slice(0, -1) + 'ied', w.slice(0, -1) + 'ies');
  return out;
}
/* contractions and full forms read the same: must've / must have, I'm / I am, it's / it is */
function crsExpand(s){
  return String(s || '').toLowerCase().replace(/[’‘]/g, "'")
    .replace(/\b(it|he|she|that|there|what|here|who|how|where)'s\b/g, '$1 is').replace(/\blet's\b/g, 'let us')
    .replace(/\bwon't\b/g, 'will not').replace(/\bcan't\b/g, 'can not').replace(/n't\b/g, ' not')
    .replace(/'m\b/g, ' am').replace(/'re\b/g, ' are').replace(/'ve\b/g, ' have').replace(/'ll\b/g, ' will').replace(/'d\b/g, ' would').replace(/'s\b/g, '');
}
function crsToks(s){ return crsExpand(s).match(/[\p{L}\p{N}]+/gu) || []; }
/* a phrase is found whole: its words in order, next to each other (up to two extra words, like «a bit» or «do not»), «your / someone» standing for any 1–3 words */
function crsMatchAt(slots, toks, si, ti){
  if(si === slots.length) return true;
  const s = slots[si];
  if(s.any){
    for(let k = 1; k <= 3; k++) if(ti + k <= toks.length && crsMatchAt(slots, toks, si + 1, ti + k)) return true;
    return false;
  }
  for(let gap = 0; gap <= (si ? 2 : 0); gap++){
    const j = ti + gap;
    if(j < toks.length && s.forms.indexOf(toks[j]) >= 0 && crsMatchAt(slots, toks, si + 1, j + 1)) return true;
  }
  return false;
}
function crsHit(target, toks){
  const slots = crsToks(target).map(function(w){ return CRS_PLACE.indexOf(w) >= 0 ? {any:true} : {forms:crsForms(w)}; });
  if(!slots.length) return false;
  for(let i = 0; i < toks.length; i++) if(crsMatchAt(slots, toks, 0, i)) return true;
  return false;
}
function speakAnalyze(text, targets, secs){
  const raw = (String(text || '').toLowerCase().replace(/[’‘]/g, "'").match(/[\p{L}\p{N}']+/gu) || []).map(function(t){ return t.replace(/^'+|'+$/g, ''); }).filter(Boolean);
  const toks = crsToks(text), joined = ' ' + raw.join(' ') + ' ', seen = {};
  raw.forEach(function(t){ seen[t] = true; });

  targets.forEach(function(t){ (crsHit(t, toks) ? used : missed).push(t); });
  let fillers = raw.filter(function(t){ return /^(um+|uh+|er+|erm+|ehm)$/.test(t); }).length;
  ['you know', 'i mean', 'kind of', 'sort of'].forEach(function(p){ fillers += joined.split(' ' + p + ' ').length - 1; });

function crsState(){

function crsAddWord(w){

function crsGo(lid, part, step, review){

function crsOpen(force){

function crsCanNext(st, a){

/* speech recognition, when the browser has it, types the transcript for her */
let crsSR = null;
function crsAppend(txt){
  const ta = document.getElementById('crsSpeak');
  const cur = ((ta ? ta.value : '') + ' ' + txt).trim();
  if(ta) ta.value = cur;
  if(en && en.stage === 'crs'){ const k = crsCur(); if(k) crsAns(k.cr.lid, k.cr.part, k.cr.step).text = cur; }
  else if(en && en.stage === 'crs-check') en.check.texts[en.check.i] = cur;
}
function crsListen(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  try{
    const r = new SR(); r.lang = 'en-US'; r.continuous = true; r.interimResults = false;
    r.onresult = function(e){
      let add = '';
      for(let i = e.resultIndex; i < e.results.length; i++) if(e.results[i].isFinal) add += e.results[i][0].transcript.trim() + ' ';
      if(add) crsAppend(add);
    };
    r.onerror = function(e){ if(e && /not-allowed|service-not-allowed|network|audio-capture/.test(e.error)) r.dead = true; };
    r.onend = function(){ if(crsSR === r && enMic.busy && !r.dead){ try{ r.start(); }catch(e){} } };
    r.start(); crsSR = r;
  }catch(e){}
}

/* ---- Speaking roulette: spin, talk for a minute unaided, see the phrases, talk again ---- */
const TALK_CATS = {
  choice:{n:'This or that', e:'⚖️'}, advice:{n:'Advice', e:'💡'}, work:{n:'Work', e:'💼'},
  learning:{n:'Learning', e:'🎓'}, tech:{n:'Technology', e:'📱'}, travel:{n:'Travel', e:'✈️'},
  life:{n:'Everyday life', e:'🍲'}, money:{n:'Money', e:'💳'}, health:{n:'Health', e:'🌿'},
  people:{n:'People', e:'🤝'}, society:{n:'Society', e:'🌍'}, culture:{n:'Culture', e:'🎬'},
  whatif:{n:'What if', e:'🔮'}, story:{n:'Your story', e:'📖'}
};
const TALK_ORDER = Object.keys(TALK_CATS);
const TALK_SECS = 60, TALK_RING = 326.73;
let TALK = null, talkLoading = false, talkFailed = false;
/* the current round lives only in memory: recordings are never stored */
const tk = {id:null, stage:'idle', take:1, takes:{}, rec:null, started:0, timer:null, noMic:false, angle:0, spinning:false, used:{}};

function talkLoad(){
  if(TALK || talkLoading || talkFailed) return;
  talkLoading = true; talkFailed = false;
  fetch('english/talk.json').then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      d.byId = {};
      d.topics.forEach(function(t){ d.byId[t.id] = t; });
      TALK = d; talkLoading = false;
      if(tab === 'english') renderEnglish();
    })
    .catch(function(){ talkLoading = false; talkFailed = true; if(tab === 'english') renderEnglish(); });
}
function talkDone(){
  if(!state.talk) state.talk = {done:{}};
  if(!state.talk.done) state.talk.done = {};
  return state.talk.done;
}
function talkClock(s){ s = Math.ceil(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

function tkWheel(){
  const n = TALK_ORDER.length, a = 360 / n, r = 146, c = 150, rad = Math.PI / 180;
  let s = '<div class="tk-wheel"><span class="tk-ptr" aria-hidden="true"></span>'+
    '<svg viewBox="0 0 300 300" aria-hidden="true" style="transform:rotate('+tk.angle+'deg)">';
  TALK_ORDER.forEach(function(k, i){
    const x0 = c + r * Math.sin(i * a * rad), y0 = c - r * Math.cos(i * a * rad);
    const x1 = c + r * Math.sin((i + 1) * a * rad), y1 = c - r * Math.cos((i + 1) * a * rad);
    const m = (i + .5) * a, tx = (c + 108 * Math.sin(m * rad)).toFixed(1), ty = (c - 108 * Math.cos(m * rad)).toFixed(1);
    s += '<path class="'+(i % 2 ? 'sa' : 'sb')+'" d="M'+c+' '+c+' L'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+r+' '+r+' 0 0 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+' Z"/>'+
         '<text x="'+tx+'" y="'+ty+'" transform="rotate('+m.toFixed(1)+' '+tx+' '+ty+')">'+TALK_CATS[k].e+'</text>';
  });
  return s + '<circle class="hub" cx="150" cy="150" r="26"/></svg></div>';
}

      }).join('')+'</div>'+

      '<div class="tk-row"><button class="btn btn-ghost" data-act="tk-go" data-n="2">Once more</button>'+
      '<button class="btn btn-ghost" data-act="tk-again">'+(done[t.id] ? 'Back to the wheel' : 'Back to the wheel, keep it')+'</button></div></section>';
  }

  h += '<p class="tk-legend"><span class="lv lv-B1">B1</span><span class="lv lv-B2">B2</span><span class="lv lv-C1">C1</span> Tap a highlighted phrase — or any word</p>'+
    '<section class="tk-model"><p class="eyebrow">How it could sound</p><p class="tk-text">'+tkModel(t)+'</p><div class="tk-pop"></div></section>';

  h += '<section class="rd-block"><p class="eyebrow">The phrases · + saves one</p><div class="tk-words">'+

      (done[t.id]

        : '<div class="tk-row"><button class="btn btn-ghost" data-act="tk-done">✓ Done with this topic</button>'+
          '<button class="btn btn-ghost" data-act="tk-again">Back to the wheel</button></div>')+
      '</section>';

function tkModel(t){

function talkLeft(){ return Math.max(0, TALK_SECS - (Date.now() - tk.started) / 1000); }
function talkStart(n){
  const t = TALK && TALK.byId[tk.id];
  if(!t) return;
  clearInterval(tk.timer);
  tk.take = n; tk.stage = 'rec'; tk.started = 0; tk.noMic = false; tk.rec = null;
  if(n === 2) tk.used = {};
  window.scrollTo(0,0); renderEnglish();
  function go(){
    if(tk.stage !== 'rec' || tk.take !== n) return;
    tk.started = Date.now();
    const st = document.getElementById('tkStatus');
    if(st) st.innerHTML = tkStatus();
    tk.timer = setInterval(talkTick, 250);
    if(state.talk && state.talk.tr) tkListen(n);
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ tk.noMic = true; go(); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    if(tk.stage !== 'rec' || tk.take !== n){ stream.getTracks().forEach(function(x){ x.stop(); }); return; }
    const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(function(x){
      return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(x);
    });
    let rec;
    try{ rec = new MediaRecorder(stream, type ? {mimeType:type} : undefined); }
    catch(e){ stream.getTracks().forEach(function(x){ x.stop(); }); tk.noMic = true; go(); return; }
    const chunks = [];
    rec.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = function(){
      stream.getTracks().forEach(function(x){ x.stop(); });
      if(!chunks.length) return;
      if(tk.takes[n]) URL.revokeObjectURL(tk.takes[n]);
      const blob = new Blob(chunks, {type: rec.mimeType || type || 'audio/mp4'});
      if(!tk.blobs) tk.blobs = {};
      tk.blobs[n] = blob;
      tk.takes[n] = URL.createObjectURL(blob);
      if(tab === 'english' && state.enView === 'speak' && tk.stage !== 'rec') renderEnglish();
    };
    rec.start();
    tk.rec = rec;
    go();
  }).catch(function(){ tk.noMic = true; go(); });
}
/* optional: the browser writes down what she says while the recording runs */
function tkListen(n){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  try{
    const r = new SR(); r.lang = 'en-US'; r.continuous = true; r.interimResults = false;
    if(!tk.said) tk.said = {};
    tk.said[n] = '';
    r.onresult = function(e){
      for(let i = e.resultIndex; i < e.results.length; i++) if(e.results[i].isFinal) tk.said[n] += (tk.said[n] ? ' ' : '') + e.results[i][0].transcript.trim();
      const ta = document.getElementById('tkSaid'); if(ta && tk.stage !== 'rec') ta.value = tk.said[n];
    };
    r.onerror = function(){};
    r.onend = function(){ if(tk.stage === 'rec' && tk.take === n){ try{ r.start(); }catch(e){} } };
    r.start(); tk.sr = r;
  }catch(e){}
}
function talkTick(){
  const left = talkLeft();
  const c = document.getElementById('tkClock'), r = document.getElementById('tkRing');
  if(c) c.textContent = talkClock(left);
  if(r) r.style.strokeDashoffset = (TALK_RING * (1 - left / TALK_SECS)).toFixed(1);
  if(left <= 0) talkStop();
}
function talkStop(){
  clearInterval(tk.timer); tk.timer = null;
  if(tk.stage !== 'rec') return;
  tk.stage = tk.take === 1 ? 'review1' : 'review2';
  if(tk.sr){ const r = tk.sr; tk.sr = null; r.onend = null; try{ r.stop(); }catch(e){} }
  if(tk.rec && tk.rec.state !== 'inactive'){ try{ tk.rec.stop(); }catch(e){} }
  tk.rec = null;
  if(navigator.vibrate) try{ navigator.vibrate(30); }catch(e){}
  if(tab === 'english' && state.enView === 'speak'){ window.scrollTo(0,0); renderEnglish(); }
}
function talkReset(){
  clearInterval(tk.timer); tk.timer = null;
  if(tk.rec && tk.rec.state !== 'inactive'){ tk.rec.onstop = null; try{ tk.rec.stop(); tk.rec.stream.getTracks().forEach(function(x){ x.stop(); }); }catch(e){} }

  tk.id = null; tk.stage = 'idle'; tk.takes = {}; tk.blobs = {}; tk.said = {}; tk.rec = null; tk.started = 0; tk.used = {};
}

function swHas(term){

/* finds «try them on» for «to try something on», so the phrase stands out in its sentence */
function swMark(s, phrase){
  const skip = /^(to|a|an|the|someone|somebody|something|sb|sth|one's|oneself|be|a\/b|A|B|doing|do)$/;
  const toks = String(phrase).replace(/[()…]/g, ' ').split(/\s+/).filter(function(x){ return x && !skip.test(x) && /[a-z]/i.test(x); });
  if(!toks.length) return esc(s);
  const parts = toks.map(function(x){
    const base = x.replace(/[^a-z'-]/gi, '');
    const stem = base.length > 6 ? base.slice(0, -2) : base.length > 4 ? base.slice(0, -1) : base;
    return stem.replace(/[-']/g, '\\$&') + "[a-z'-]*";
  });
  let m = null;
  try{ m = new RegExp('\\b' + parts.join("(?:[^a-z]+[a-z'-]+){0,3}?[^a-z]+"), 'i').exec(s); }catch(e){}
  if(!m) return esc(s);
  return esc(s.slice(0, m.index)) + '<mark>' + esc(m[0]) + '</mark>' + esc(s.slice(m.index + m[0].length));
}

  openSheet('<h2>'+(h?'Habit':'New habit')+'</h2>'+
    '<p class="sub">'+(h?'Change anything you like — your check-ins stay.':'Word it so you understand it in one second.')+'</p>'+
    '<div class="field"><label for="tIn">Name</label>'+
    '<input type="text" id="tIn" maxlength="60" placeholder="20 minutes of reading, for example" value="'+(h?esc(h.title):'')+'"></div>'+
    '<div class="field"><label>Icon</label><div class="emojis" id="emojiPick">'+emojis+'</div></div>'+
    '<div class="field"><label for="hWhy">Why this one</label>'+
    '<textarea id="hWhy" rows="2" placeholder="So my back stops aching by Friday">'+(h?esc(h.why||''):'')+'</textarea></div>'+
    '<div class="field"><label>Time of day</label><div class="chips" id="whenPick">'+whenChips+'</div></div>'+
    '<div class="field"><label>Times per day</label><div class="chips" id="perPick">'+perChips+'</div></div>'+
    '<div class="field"><label>Days per week</label><div class="chips" id="wgPick">'+wgChips+'</div></div>'+
    '<div class="sheet-actions">'+
      (h?'<button class="btn btn-danger" data-act="del-habit" data-id="'+h.id+'">Delete</button>':'')+
      '<button class="btn btn-primary" data-act="save-habit" data-id="'+(h?h.id:'')+'">Save</button>'+
    '</div>');
}

/* ---------- Actions ---------- */
function celebrate(el){
  if(el){ el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'), 200); }
  if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
}
function toggleHabit(id, el){
  const h = state.habits.find(x=>x.id===id); if(!h) return;
  const k = today(), per = h.perDay||1, c = count(h,k);
  if(c >= per){
    setCount(h,k,0); state.xp = Math.max(0, state.xp - 10*per); toast('Check-in removed');
  } else {
    setCount(h,k,c+1); state.xp += 10; celebrate(el);
    if(c+1 >= per){
      const box = el && el.querySelector('.check');
      const r = box ? box.getBoundingClientRect() : null;
      const fx = r ? r.left + r.width/2 : innerWidth/2;
      const fy = r ? r.top + r.height/2 : innerHeight/2;
      if(!selDay && doneToday() === activeHabits().length){
        const W = innerWidth, H = innerHeight;
        fanfare();
        fireworks({
          veil: 0.72, duration: 330,
          bursts: [
            {x: fx,     y: fy,     count: 200, power: 1.9, at: 1},
            {x: W*0.22, y: H*0.26, count: 200, power: 2.1, at: 34},
            {x: W*0.78, y: H*0.20, count: 200, power: 2.1, at: 64},
            {x: W*0.50, y: H*0.42, count: 240, power: 2.4, at: 96},
            {x: W*0.16, y: H*0.50, count: 180, power: 2.0, at: 128},
            {x: W*0.84, y: H*0.46, count: 180, power: 2.0, at: 158},
            {x: W*0.50, y: H*0.24, count: 280, power: 2.7, at: 192}
          ]
        });
        toast('✨ Every habit is closed for today');
      } else {
        fireworks({
          veil: 0.3, duration: 125,
          bursts: [
            {x: fx, y: fy, count: 190, power: 1.7, at: 1},
            {x: innerWidth*(0.18 + Math.random()*0.64), y: innerHeight*(0.14 + Math.random()*0.24),
             count: 150, power: 1.95, at: 18}
          ]
        });
      }
    }
  }
  ygHabitChanged(h); fcHabitChanged(h);
  practiceSync(state, h, today(), isDone(h, today()));
  save(); renderToday();
}

document.addEventListener('click', function(e){
  const pick = e.target.closest('[data-skin-pick]');
  if(pick){
    state.skin = pick.getAttribute('data-skin-pick'); applySkin(state.skin); save();
    document.querySelectorAll('.skins').forEach(renderSkinGrid);
    return;
  }
  const em = e.target.closest('[data-emoji]');
  if(em){ em.parentElement.querySelectorAll('[data-emoji]').forEach(b=>b.setAttribute('aria-pressed','false'));
          em.setAttribute('aria-pressed','true'); return; }
  const chip = e.target.closest('.chip[data-per],.chip[data-wg],.chip[data-kind],.chip[data-cat],.chip[data-when]');
  if(chip){ chip.parentElement.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed','false'));
            chip.setAttribute('aria-pressed','true'); return; }

  const btn = e.target.closest('[data-act]'); if(!btn) return;
  const act = btn.getAttribute('data-act'), id = btn.getAttribute('data-id');

  if(act==='toggle') toggleHabit(id, btn.closest('.habit'));
  else if(act==='new-habit'){
    if(sheet.classList.contains('open')){ closeSheet(); setTimeout(sheetLibrary, 140); }
    else sheetLibrary();
  }
  else if(act==='custom-habit'){ closeSheet(); setTimeout(()=>sheetHabit(null), 140); }
  else if(act==='libcat'){ libCat = btn.getAttribute('data-c'); sheetLibrary(); }
  else if(act==='add-lib'){
    if(btn.getAttribute('aria-disabled') === 'true'){ toast('Already on your list'); return; }
    const parts = btn.getAttribute('data-i').split(':');
    const it = LIBRARY[+parts[0]].items[+parts[1]];
    const title = it.t.replace(/&#39;/g, "'");
    state.habits.push({id:'h'+Date.now().toString(36), title:title, emoji:it.e, perDay:it.p, weekGoal:it.w, when:(it.d || guessWhen(title))});
    save(); paintLibList(); render(); toast('Added — ' + title);
  }
  else if(act==='edit-habit') sheetHabit(id);
  else if(act==='skins') sheetSkins();
  else if(act==='fonts') sheetFonts();
  else if(act==='toggle-sound'){
    state.sound = state.sound === false;
    save(); sheetSettings();
    if(state.sound){ fanfare(); toast('Sound on — that is the fanfare'); } else toast('Sound off');
  }
  else if(act==='pick-font'){
    state.font = btn.getAttribute('data-f');
    applyFont(state.font); save();
    if(sheet.classList.contains('open')) sheetFonts();
    const ob = document.getElementById('onboardFonts');
    if(ob) ob.innerHTML = fontCards();
    render();
  }
  else if(act==='close') closeSheet();
  else if(act==='data') sheetData();

  else if(act==='save-settings'){
    const v = $('#nameIn'); if(v) state.name = v.value.trim();
    save(); closeSheet(); paintHeader(); toast('Saved');
  }
  else if(act==='save-habit'){
    const title = ($('#tIn').value||'').trim();
    if(!title){ toast('Give it a name'); $('#tIn').focus(); return; }
    const emoji = (sheet.querySelector('#emojiPick [aria-pressed="true"]')||{}).dataset?.emoji || '⭐️';
    const per = +(sheet.querySelector('#perPick [aria-pressed="true"]')||{dataset:{per:1}}).dataset.per;
    const wg  = +(sheet.querySelector('#wgPick [aria-pressed="true"]')||{dataset:{wg:7}}).dataset.wg;
    const wh  = (sheet.querySelector('#whenPick [aria-pressed="true"]')||{dataset:{when:'day'}}).dataset.when;
    if(id){ const h = state.habits.find(x=>x.id===id); Object.assign(h,{title,emoji,perDay:per,weekGoal:wg,when:wh,why:($('#hWhy').value||'').trim()}); }
    else state.habits.push({id:'h'+Date.now().toString(36), title, emoji, perDay:per, weekGoal:wg, when:wh, why:($('#hWhy').value||'').trim()});
    save(); closeSheet(); render(); toast(id ? 'Updated' : 'Habit added');
  }
  else if(act==='del-habit'){
    if(!confirm('Delete this habit and its whole history?')) return;
    state.habits = state.habits.filter(x=>x.id!==id); delete state.log[id];
    save(); closeSheet(); render(); toast('Deleted');
  }
  else if(act==='go-todo'){ go('todo'); const d = btn.getAttribute('data-d'); if(d){ tdSel = d; tdMon = null; renderTodos(); } }
  else if(act==='sk-view'){ skView = btn.getAttribute('data-v'); window.scrollTo(0,0); renderSkills(); }
  else if(act==='pd-retry'){ pddFailed = false; renderSkills(); }
  else if(act==='pd-start'){
    if(!PDD || !LEARN) return;
    pddStart(btn.getAttribute('data-m'), btn.getAttribute('data-x'));
    window.scrollTo(0,0); renderSkills();
  }
  else if(act==='pd-pick'){
    if(!quiz || quiz.done) return;
    const qid = quiz.items[quiz.i], o = +btn.getAttribute('data-o');
    if(quiz.mode === 'exam'){ quiz.picks[qid] = o; renderSkills(); return; }
    if(quiz.picks[qid]) return;
    quiz.picks[qid] = o;
    pddRecord(qid, o === PDD.byId[qid][4]); save(); renderSkills();
  }
  else if(act==='pd-next'){
    if(!quiz) return;
    if(quiz.i + 1 < quiz.items.length) quiz.i++;
    else { quiz.done = true; save(); }
    window.scrollTo(0,0); renderSkills();
  }
  else if(act==='pd-jump'){
    if(!quiz) return;
    quiz.i = Math.max(0, Math.min(quiz.items.length - 1, +btn.getAttribute('data-i')));
    window.scrollTo(0,0); renderSkills();
  }
  else if(act==='pd-finish'){
    if(!quiz) return;
    const open = quiz.items.filter(function(x){ return !quiz.picks[x]; }).length;
    if(open && !confirm(open + (open === 1 ? ' question is' : ' questions are') + ' still unanswered. Finish anyway?')) return;
    pdFinish(); window.scrollTo(0,0); renderSkills();
  }
  else if(act==='pd-quit'){
    if(quiz && quiz.mode === 'exam' && !quiz.done && !confirm('Leave the exam? This attempt will not count.')) return;
    clearInterval(pdTimer); pdTimer = null;
    if(quiz && quiz.from != null) lnCh = quiz.from;
    quiz = null; window.scrollTo(0,0); renderSkills();
  }
  else if(act==='ln-open'){
    const lid = btn.getAttribute('data-l');
    if(!LEARN || !LEARN.byLesson[lid]) return;
    lnFromQuiz = btn.getAttribute('data-from') === 'quiz' && !!quiz;
    if(!lnFromQuiz && quiz){ clearInterval(pdTimer); pdTimer = null; quiz = null; }
    lnLesson = lid;
    if(!lnFromQuiz) lnCh = LEARN.byLesson[lid].c;
    window.scrollTo(0,0); renderSkills();
  }
  else if(act==='ln-back'){
    lnLesson = null; lnFromQuiz = false;
    window.scrollTo(0,0); renderSkills();
  }
  else if(act==='ln-ch'){ lnCh = +btn.getAttribute('data-c'); window.scrollTo(0,0); renderSkills(); }
  else if(act==='ln-home'){ lnCh = null; window.scrollTo(0,0); renderSkills(); }
  else if(act==='ln-done'){
    lnLearned()[btn.getAttribute('data-l')] = today(); practiceMark(state, 'hp-drive', today(), true); save(); celebrate(btn); renderSkills();
    toast('Learned — its questions join your daily practice');
  }
  else if(act==='ln-undo'){
    delete lnLearned()[btn.getAttribute('data-l')];
    if(!Object.keys(lnLearned()).some(function(k){ return lnLearned()[k] === today(); })) practiceMark(state, 'hp-drive', today(), false);
    save(); renderSkills();
  }
  else if(act==='ln-flip'){
    const k = btn.getAttribute('data-k');
    lnOpen[k] = !lnOpen[k];
    btn.classList.toggle('open', lnOpen[k]);
  }
  else if(act==='ln-hot'){
    const fig = btn.closest('.ln-svg');
    if(!fig || !LEARN) return;
    const key = fig.getAttribute('data-k'), parts = key.split('|'), h = +btn.getAttribute('data-h');
    const inf = LEARN.byLesson[parts[0]], b = inf && inf.l.blocks[+parts[1]];
    if(!b || !b.hot || !b.hot[h]) return;
    lnHot[key] = h;
    fig.querySelectorAll('[data-h]').forEach(function(g){ g.classList.toggle('on', g === btn); });
    const out = fig.querySelector('.ln-hot-out');
    if(out){ out.className = 'ln-hot-out'; out.removeAttribute('lang'); out.innerHTML = '<b>'+lnMd(b.hot[h][0])+'</b>'+lnMd(b.hot[h][1]); }
  }
  else if(act==='ln-pick'){
    const box = btn.closest('.ln-check');
    if(!box || !PDD) return;
    const qid = box.getAttribute('data-q'), q = PDD.byId[qid];
    if(!q || lnPicks[qid]) return;
    const o = +btn.getAttribute('data-o');
    lnPicks[qid] = o;
    pddRecord(qid, o === q[4]); save();
    box.outerHTML = lnCheckHtml(qid);
    paintTabDots();
  }
  else if(act==='dc-done'){ if(!state.diction) state.diction = {}; state.diction[today()] = true; practiceMark(state, 'hp-diction', today(), true); save(); celebrate(btn); renderSkills(); toast('Diction done for today'); }
  else if(act==='dc-undo'){ if(!state.diction) state.diction = {}; delete state.diction[today()]; practiceMark(state, 'hp-diction', today(), false, true); save(); renderSkills(); }
  else if(act==='td-quick'){
    const f = $('#tdQuick'); const v = (f ? f.value : '').trim();
    if(!v){ if(f) f.focus(); return; }
    todos().push({id:'t'+Date.now().toString(36), t:v, date:tdSelKey(), time:'', note:'', done:false, made:Date.now()});
    todoDraft = ''; save(); renderTodos();
    const f2 = $('#tdQuick'); if(f2) f2.focus();
  }
  else if(act==='td-toggle'){
    const t = todos().find(function(x){ return x.id === id; });
    if(!t) return;
    t.done = !t.done; t.doneAt = t.done ? today() : '';
    if(t.done){ state.xp += 5; celebrate(btn.closest('.td') || btn.closest('.plans-row')); }
    save(); render();
    if(t.done) toastUndo('Done — moved to the archive', t.id); else toast('Back on your list');
  }
  else if(act==='td-edit') sheetTodo(id);
  else if(act==='td-undo'){
    const t = todos().find(function(x){ return x.id === id; });
    if(!t || !t.done) return;
    t.done = false; t.doneAt = '';
    save(); render(); toast('Back on your list');
  }
  else if(act==='cal-pick'){
    const d = btn.getAttribute('data-d');
    if(d){ tdSel = d; const x = toDate(d); tdMon = {y:x.getFullYear(), m:x.getMonth()}; renderTodos(); const hd = view.querySelector('.td-day .eyebrow'); if(hd) hd.scrollIntoView({block:'nearest'}); }
  }
  else if(act==='cal-prev' || act==='cal-next'){ const mo = tdMonth(); tdMon = calShift(mo.y, mo.m, act === 'cal-next' ? 1 : -1); renderTodos(); }
  else if(act==='cal-today'){ tdSel = null; tdMon = null; renderTodos(); }
  else if(act==='td-archive'){ tdArch = !tdArch; renderTodos(); }
  else if(act==='td-day'){
    const f = $('#tdDate'); if(f) f.value = btn.getAttribute('data-d');
    sheet.querySelectorAll('[data-act="td-day"]').forEach(function(b){ b.setAttribute('aria-pressed','false'); });
    btn.setAttribute('aria-pressed','true');
  }
  else if(act==='td-save'){
    const t = todos().find(function(x){ return x.id === id; });
    if(!t) return;
    const v = ($('#tdT').value || '').trim();
    if(!v){ toast('Give it a name'); $('#tdT').focus(); return; }
    t.t = v; t.date = $('#tdDate').value || ''; t.time = $('#tdTime').value || '';
    t.note = ($('#tdNote').value || '').trim();
    if(tab === 'todo' && t.date){ tdSel = t.date; const x = toDate(t.date); tdMon = {y:x.getFullYear(), m:x.getMonth()}; }
    save(); closeSheet(); render(); toast('Saved');
  }
  else if(act==='td-del'){
    if(!confirm('Delete this task?')) return;
    state.todos = todos().filter(function(x){ return x.id !== id; });
    save(); closeSheet(); render(); toast('Deleted');
  }
  else if(act==='go-drive'){ skView = 'pdd'; go('practice'); }
  else if(act==='go-diction'){ skView = 'diction'; go('practice'); }
  else if(act==='day-prev'){ selDay = dnPrev(selDay, realToday()); paintHeader(); renderToday(); }
  else if(act==='day-next'){ selDay = dnNext(selDay, realToday()); paintHeader(); renderToday(); }
  else if(act==='day-today'){ selDay = null; paintHeader(); renderToday(); }
  else if(act==='arc-cell'){
    const id = btn.getAttribute('data-id'), d = btn.getAttribute('data-d');
    if(!id || !d || !dnCanMark(d, realToday())) return;
    const hb = state.habits.find(function(x){ return x.id === id; });
    if(!hb) return;
    const per = hb.perDay || 1;
    selDay = d === realToday() ? null : d;
    try{
      if(per > 1){
        /* several ticks a day: one tap on the square means all of them, or none */
        const c = ((state.log[id] || {})[d]) || 0;
        state.xp = Math.max(0, state.xp + (c >= per ? -10 * per : 10 * (per - c)));
        setCount(hb, d, c >= per ? 0 : per);
        ygHabitChanged(hb); fcHabitChanged(hb);
        save();
      } else toggleHabit(id, null);
    } finally { selDay = null; }
    paintHeader(); renderToday();
  }
  else if(act==='go-speak'){ state.enView = 'speak'; save(); go('english'); }
  else if(act==='tk-w'){
    const t = TALK && TALK.byId[tk.id], pop = document.querySelector('.tk-pop');
    if(!t || !pop) return;
    const was = btn.classList.contains('on');
    document.querySelectorAll('.tk-w.on, .tk-hl.on').forEach(function(x){ x.classList.remove('on'); });
    if(was){ pop.innerHTML = ''; return; }
    btn.classList.add('on');
    pop.innerHTML = tkWordCard(t, btn.textContent);
  }
  else if(act==='tk-wsave'){
    const t = TALK && TALK.byId[tk.id], word = btn.getAttribute('data-w');
    if(!t || !word) return;
    if(!state.words) state.words = [];
    if(swHas(word)){
      state.words = state.words.filter(function(x){ return String(x.term).toLowerCase() !== word.toLowerCase(); });
      toast('Removed from saved');
    } else {
      const key = word.toLowerCase().replace(/’/g, "'");
      state.words.push({id:'w'+Date.now().toString(36), term:word, ctx:tkSentence(t, word), mean:'', ru:(t.gl && t.gl[key]) || TK_STOP[key] || '',
                        src:t.id, box:0, seen:0, right:0, last:''});
      toast('Saved — ' + word);
    }
    save();
    const on = swHas(word);
    btn.classList.toggle('on', on); btn.textContent = on ? '✓' : '+';
    const tabBtn = document.querySelector('[data-act="en-view"][data-v="words"]'), cnt = state.words.length;
    if(tabBtn) tabBtn.innerHTML = 'Saved words' + (cnt ? ' <small>'+cnt+'</small>' : '');
  }
  else if(act==='tk-share'){
    const n = +btn.getAttribute('data-n'), b = tk.blobs && tk.blobs[n], t = TALK && TALK.byId[tk.id];
    if(!b || !t) return;
    const file = new File([b], 'speaking-'+t.id+'-take'+n+'.'+tkExt(n), {type:b.type || 'audio/mp4'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:'My speaking practice', text:tkAskText(t, n)}).catch(function(){});
    } else toast('This phone can’t send audio files from here — use Save');
  }
  else if(act==='tk-ask'){
    const t = TALK && TALK.byId[tk.id];
    if(!t) return;
    const txt = tkAskText(t, tk.take);
    const done = function(){ toast('Copied — paste it into ChatGPT or Claude'); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(function(){ window.prompt('Copy this:', txt); });
    else window.prompt('Copy this:', txt);
  }
  else if(act==='tk-tr'){
    if(!state.talk) state.talk = {done:{}};
    state.talk.tr = !state.talk.tr; save();
    btn.setAttribute('aria-pressed', state.talk.tr ? 'true' : 'false');
  }
  else if(act==='wq-start'){
    const qs = wqBuild(state.words, WQ_LEN, today(), Math.random);
    if(!qs.length){ toast('Add a few more words first'); return; }
    wq = {qs:qs, i:0, right:0, picked:null, missed:[], finished:false};
    todayView = 'wq'; window.scrollTo(0,0); renderToday();
  }
  else if(act==='wq-close'){ wq = null; todayView = 'main'; window.scrollTo(0,0); renderToday(); }
  else if(act==='wq-pick'){
    if(!wq || wq.picked != null) return;
    const q = wq.qs[wq.i], i = +btn.getAttribute('data-i'), ok = !!(q.options[i] && q.options[i].ok);
    wq.picked = i;
    if(ok) wq.right++; else wq.missed.push(q.wid);
    const w = (state.words || []).find(function(x){ return x.id === q.wid; });
    if(w) Object.assign(w, wqGrade(w, ok, today()));
    save(); renderToday();
  }
  else if(act==='wq-next'){
    if(!wq || wq.picked == null) return;
    wq.i++; wq.picked = null;
    if(wq.i >= wq.qs.length){
      wq.finished = true;
      wqState().days[today()] = wqBest(wqState().days[today()], wq.right, wq.qs.length);
      save();
    }
    window.scrollTo(0,0); renderToday();
  }
  else if(act==='sw-add'){ sheetAddWord(); }
  else if(act==='sw-save'){
    const term = (($('#awTerm') || {}).value || '').trim(), ru = (($('#awRu') || {}).value || '').trim(), ctx = (($('#awCtx') || {}).value || '').trim();
    if(!term || !ru){ toast('Add the word and what it means'); return; }
    if(swHas(term)){ toast('You already have “' + term + '”'); return; }
    if(!state.words) state.words = [];
    state.words.push({id:'w'+Date.now().toString(36), term:term, ctx:ctx, mean:'', ru:ru, src:'own', box:0, seen:0, right:0, last:''});
    save(); closeSheet(); render(); toast('Saved — ' + term);
  }
  else if(act==='arc-open'){ arcDraft = null; todayView = 'arc'; window.scrollTo(0,0); renderToday(); }
  else if(act==='arc-close'){ arcDraft = null; todayView = 'main'; window.scrollTo(0,0); renderToday(); }
  else if(act==='arc-review'){ arcDraft = {week: arcMonday(today())}; todayView = 'arc-review'; window.scrollTo(0,0); renderToday(); }
  else if(act==='arc-set'){
    if(!arcDraft) arcDraft = {};

/* ---------- Practice tab: driving theory and diction ---------- */
let skView = 'pdd';

/* ---- Driving theory: the official Armenian Road Police bank, in Russian ---- */
const PDD_DAILY = 15;
const PDD_EXAM = {n:20, sec:30*60, maxWrong:2};
let PDD = null, pddLoading = false, pddFailed = false, quiz = null, pdTimer = null;
/* the textbook: chapters of lessons, plus a short explanation for every question */
let LEARN = null, lnCh = null, lnLesson = null, lnFromQuiz = false;
const lnPicks = {}, lnOpen = {}, lnHot = {};

function pddState(){
  if(!state.pdd) state.pdd = {};
  const p = state.pdd;
  if(!p.s) p.s = {}; if(!p.miss) p.miss = {}; if(!p.day) p.day = {}; if(!p.exams) p.exams = []; if(!p.learned) p.learned = {};
  return p;
}
function pddLoad(){
  if((PDD && LEARN) || pddLoading) return;
  pddLoading = true; pddFailed = false;
  function get(url){ return fetch(url).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }
  Promise.all([PDD || get('pdd/q.json'), LEARN || get('pdd/learn.json')])
    .then(function(res){
      if(!PDD){
        const data = res[0];
        data.byId = {};
        data.q.forEach(function(x){ data.byId[x[0]] = x; });
        PDD = data;
      }
      if(!LEARN) LEARN = lnIndex(res[1]);
      pddLoading = false;
      if(tab === 'practice') renderSkills();
    })
    .catch(function(){ pddLoading = false; pddFailed = true; if(tab === 'practice') renderSkills(); });
}
/* lookups the screens need: a lesson by id, the lesson behind every question, the reading order */
function lnIndex(d){
  d.byLesson = {}; d.lessonOf = {}; d.order = [];
  d.chapters.forEach(function(c, ci){
    c.lessons.forEach(function(l, li){
      d.byLesson[l.id] = {c:ci, i:li, l:l};
      d.order.push(l.id);
      l.covers.forEach(function(q){ d.lessonOf[q] = l.id; });
    });
  });
  return d;
}
function lnLearned(){ return pddState().learned; }
function lnLearnedToday(){
  const L = (state.pdd && state.pdd.learned) || {};
  return Object.keys(L).some(function(k){ return L[k] === today(); });
}
/* the questions of every finished lesson — of the whole textbook, or of one chapter */
function lnPool(ci){
  const L = lnLearned(), out = [];
  LEARN.chapters.forEach(function(c, k){
    if(ci != null && k !== ci) return;
    c.lessons.forEach(function(l){
      if(L[l.id]) l.covers.forEach(function(id){ if(PDD.byId[id]) out.push(PDD.byId[id]); });
    });
  });
  return out;
}
function pddToday(){ return pddState().day[today()] || 0; }
function pddMissCount(){ return Object.keys(pddState().miss).length; }
function pddRightIn(list){ const s = pddState().s; return list.filter(function(q){ return s[q[0]] && s[q[0]][0] > 0; }).length; }
function pddShuffle(a){
  const x = a.slice();
  for(let i = x.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = x[i]; x[i] = x[j]; x[j] = t; }
  return x;
}
/* mistakes first, then questions never seen, then the ones seen longest ago */
function pddPick(pool, n){
  const st = pddState();
  const miss  = pddShuffle(pool.filter(function(q){ return st.miss[q[0]]; }));
  const fresh = pddShuffle(pool.filter(function(q){ return !st.s[q[0]]; }));
  const old   = pool.filter(function(q){ return st.s[q[0]] && !st.miss[q[0]]; })
                    .sort(function(a, b){ return st.s[a[0]][2] - st.s[b[0]][2]; });
  const order = miss.slice(0, 5).concat(fresh, miss.slice(5), old);
  const seen = {}, out = [];
  for(const q of order){ if(!seen[q[0]]){ seen[q[0]] = 1; out.push(q[0]); } if(out.length >= n) break; }
  return out;
}
function pddRecord(id, ok){
  const st = pddState();
  const r = st.s[id] || (st.s[id] = [0, 0, 0]);
  if(ok){ r[0]++; delete st.miss[id]; } else { r[1]++; st.miss[id] = 1; }
  r[2] = dayIndex();
  st.day[today()] = (st.day[today()] || 0) + 1;
  const keys = Object.keys(st.day).sort();
  while(keys.length > 60) delete st.day[keys.shift()];
}
function pddStart(mode, x){
  let items, title, from = null;
  if(mode === 'exam'){ items = pddShuffle(PDD.q).slice(0, PDD_EXAM.n).map(function(q){ return q[0]; }); title = 'Exam ticket'; }
  else if(mode === 'miss'){ items = pddShuffle(Object.keys(pddState().miss).filter(function(id){ return PDD.byId[id]; })).slice(0, PDD_DAILY); title = 'Mistakes'; }
  else if(mode === 'lesson'){
    const inf = LEARN.byLesson[x];
    if(!inf) return;
    items = pddPick(inf.l.covers.map(function(id){ return PDD.byId[id]; }).filter(Boolean), 20);
    title = inf.l.t; from = inf.c;
  }
  else if(mode === 'chapter'){
    const ci = +x;
    if(!LEARN.chapters[ci]) return;
    items = pddPick(lnPool(ci), PDD_DAILY); title = LEARN.chapters[ci].t; from = ci;
    if(!items.length){ toast('Finish a lesson of this chapter first'); return; }
  }
  else {
    items = pddPick(lnPool(), PDD_DAILY); title = 'Today’s questions';
    if(!items.length){ toast('Finish a lesson first — its questions come here'); return; }
  }
  if(!items.length){ toast(mode === 'miss' ? 'No mistakes to fix' : 'Nothing to practise here'); return; }
  quiz = {mode:mode, title:title, items:items, i:0, picks:{}, done:false, started:Date.now(), from:from, x:x};
  lnLesson = null; lnFromQuiz = false;
  if(mode === 'exam'){ clearInterval(pdTimer); pdTimer = setInterval(pdTick, 1000); }
}
function pdLeft(){ return Math.max(0, PDD_EXAM.sec - Math.floor((Date.now() - quiz.started) / 1000)); }
function pdClock(s){ return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function pdTick(){
  if(!quiz || quiz.mode !== 'exam' || quiz.done){ clearInterval(pdTimer); pdTimer = null; return; }
  const left = pdLeft(), el = document.getElementById('pdClock');
  if(el){ el.textContent = pdClock(left); el.classList.toggle('low', left < 300); }
  if(left <= 0){ pdFinish(); if(tab === 'practice') renderSkills(); }
}
function pdFinish(){
  if(!quiz || quiz.done) return;
  quiz.done = true; clearInterval(pdTimer); pdTimer = null;
  if(quiz.mode === 'exam'){
    let ok = 0;
    quiz.items.forEach(function(id){
      const q = PDD.byId[id], p = quiz.picks[id], right = p === q[4];
      if(right) ok++;
      if(p) pddRecord(id, right); else { pddState().miss[id] = 1; }
    });
    const wrong = quiz.items.length - ok;
    const st = pddState();
    st.exams.push({d:today(), ok:ok, n:quiz.items.length, pass: wrong <= PDD_EXAM.maxWrong,
                   sec: Math.min(PDD_EXAM.sec, Math.floor((Date.now() - quiz.started) / 1000))});
    while(st.exams.length > 20) st.exams.shift();
  }
  save();
}

function renderSkills(){

}
