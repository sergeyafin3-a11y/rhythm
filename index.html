<!doctype html>
<html lang="ru" data-skin="peach">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhythm</title>
<meta name="description" content="Daily habits, English and recipes">
<meta name="theme-color" content="#FBE9DE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rhythm">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600;7..72,700&family=Manrope:wght@400;500;700&family=Nunito:wght@400;600;700;800&family=Oswald:wght@500;600&family=Pangolin&family=Caveat:wght@600;700&family=Philosopher:wght@700&family=Prata&family=Unbounded:wght@700;800&display=swap">
<style>
/* ============================================================
   THEMES — each with its own palette and typeface
   ============================================================ */
:root,
[data-skin="orangery"]{
  color-scheme: light;
  --ok:#2F7A55; --bad:#C0392B;
  --font-display: 'Literata', Georgia, serif;
  --font-body: 'Golos Text', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 700;
  --display-tracking: -0.015em;
  --ground:#E7EDE4; --surface:#F6F9F3; --surface-2:#DEE7D9; --line:#C9D6C2;
  --ink:#1F2C24; --ink-soft:#46584C; --ink-mute:#7A8C7F;
  --accent:#2F6B4F; --accent-ink:#F6F9F3; --accent-soft:#CFE0D2;
  --gold:#B0862F; --shadow: 0 1px 2px rgba(31,44,36,.06), 0 8px 24px -12px rgba(31,44,36,.18);
  --radius:14px; --radius-lg:22px; --border-w:1px;
}
[data-skin="midnight"]{
  color-scheme: dark;
  --font-display: 'Prata', Georgia, serif;
  --font-body: 'Manrope', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 400; --display-tracking: 0em;
  --ground:#0D1220; --surface:#161E30; --surface-2:#1F2940; --line:#2B3752;
  --ink:#E6EBF5; --ink-soft:#A9B4CC; --ink-mute:#6C7893;
  --accent:#8FA7FF; --accent-ink:#0D1220; --accent-soft:#26304C;
  --gold:#F0B45E; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.8);
  --radius:14px; --radius-lg:22px; --border-w:1px;
}
[data-skin="peach"]{
  color-scheme: light;
  --font-display: 'Comfortaa', ui-rounded, sans-serif;
  --font-body: 'Nunito', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 700; --display-tracking: -0.01em;
  --ground:#FBE9DE; --surface:#FFF7F2; --surface-2:#F6DACB; --line:#EBC5B2;
  --ink:#40272A; --ink-soft:#7A5157; --ink-mute:#A9807F;
  --accent:#C4566B; --accent-ink:#FFF7F2; --accent-soft:#F7D3D6;
  --gold:#D98E3C; --shadow: 0 1px 2px rgba(64,39,42,.06), 0 10px 26px -14px rgba(64,39,42,.3);
  --radius:18px; --radius-lg:28px; --border-w:1px;
}
[data-skin="riso"]{
  color-scheme: light;
  --font-display: 'Unbounded', 'Golos Text', sans-serif;
  --font-body: 'Golos Text', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 800; --display-tracking: -0.03em;
  --ground:#F7F3EA; --surface:#FFFFFF; --surface-2:#EDE7DA; --line:#141414;
  --ink:#141414; --ink-soft:#4A4A4A; --ink-mute:#8A8A8A;
  --accent:#2B44FF; --accent-ink:#FFFFFF; --accent-soft:#D9DEFF;
  --gold:#FF4D8D; --shadow: 3px 3px 0 #141414;
  --radius:4px; --radius-lg:6px; --border-w:2px;
}
[data-skin="dusk"]{
  color-scheme: light;
  --font-display: 'Philosopher', Georgia, serif;
  --font-body: 'Golos Text', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 700; --display-tracking: -0.005em;
  --ground:#E9E6F1; --surface:#F6F4FA; --surface-2:#DDD8EA; --line:#CBC4DD;
  --ink:#2A2340; --ink-soft:#574C75; --ink-mute:#8880A3;
  --accent:#6B57C7; --accent-ink:#F6F4FA; --accent-soft:#DCD4F5;
  --gold:#C98A45; --shadow: 0 1px 2px rgba(42,35,64,.06), 0 10px 26px -14px rgba(42,35,64,.32);
  --radius:16px; --radius-lg:24px; --border-w:1px;
}
[data-skin="charcoal"]{
  color-scheme: dark;
  --font-display: 'Oswald', ui-sans-serif, sans-serif;
  --font-body: 'Manrope', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 600; --display-tracking: 0.005em;
  --ground:#121211; --surface:#1C1C1A; --surface-2:#262624; --line:#35352F;
  --ink:#EDEAE2; --ink-soft:#ADA79A; --ink-mute:#78736A;
  --accent:#D9C7A3; --accent-ink:#121211; --accent-soft:#2E2B24;
  --gold:#C98F5A; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 34px -18px rgba(0,0,0,.9);
  --radius:10px; --radius-lg:16px; --border-w:1px;
}
[data-skin="frost"]{
  color-scheme: light;
  --font-display: 'Manrope', ui-sans-serif, system-ui, sans-serif;
  --font-body: 'Golos Text', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 700; --display-tracking: -0.02em;
  --ground:#E3EEF7; --surface:#F6FBFE; --surface-2:#D2E4F1; --line:#B6CEE0;
  --ink:#0F2437; --ink-soft:#3C5B75; --ink-mute:#456580;
  --accent:#17648F; --accent-ink:#F6FBFE; --accent-soft:#CBE2F2;
  --gold:#8A5614; --ok:#2A724F; --shadow: 0 1px 2px rgba(15,36,55,.06), 0 12px 28px -16px rgba(15,36,55,.34);
  --radius:16px; --radius-lg:26px; --border-w:1px;
}
[data-skin="doodle"]{
  color-scheme: light;
  --font-display: 'Caveat', 'Pangolin', cursive;
  --font-body: 'Pangolin', 'Caveat', cursive;
  --display-weight: 700; --display-tracking: 0;
  --stripe-a:#E9F1D8; --stripe-b:#F4F6E8;
  --ground:#E9F1D8; --surface:#FFFDF5; --surface-2:#F4EBD0; --line:#4A5185;
  --ink:#2B3158; --ink-soft:#363D6B; --ink-mute:#3F4677;
  --accent:#BF2862; --accent-ink:#FFFFFF; --accent-soft:#FCDDE9;
  --gold:#9C4C04; --ok:#296C44; --bad:#AE2A20;
  --shadow: 0 3px 0 rgba(43,49,88,.22);
  --radius:20px; --radius-lg:30px; --border-w:2px;
}
[data-skin="aurora"]{
  color-scheme: dark;
  --font-display: 'Literata', Georgia, serif;
  --font-body: 'Manrope', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 700; --display-tracking: -0.01em;
  --ground:#08131F; --surface:#102236; --surface-2:#17304A; --line:#26435F;
  --ink:#E7F2F9; --ink-soft:#A9C2D3; --ink-mute:#8DAABF;
  --accent:#52D6BA; --accent-ink:#08131F; --accent-soft:#153F40;
  --gold:#A99CFF; --ok:#5FD39A; --bad:#FF8F80; --shadow: 0 1px 2px rgba(0,0,0,.45), 0 14px 34px -16px rgba(0,0,0,.85);
  --radius:16px; --radius-lg:24px; --border-w:1px;
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; background:var(--ground); }
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  min-height:100dvh;
}
button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
.display{ font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking); text-wrap:balance; }
.eyebrow{ font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-mute); }
.num{ font-variant-numeric:tabular-nums; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.app{
  max-width:520px; margin:0 auto;
  min-height:100dvh;
  display:flex; flex-direction:column;
  padding: max(14px, env(safe-area-inset-top)) 16px 0;
}
main{ flex:1; padding-bottom:104px; }
.hidden{ display:none !important; }

/* ============================================================
   HEADER
   ============================================================ */
.top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:8px 0 18px; }
.top h1{ margin:2px 0 0; font-size:26px; line-height:1.1; }
.top .date{ margin-bottom:6px; }
.iconbtn{
  width:42px; height:42px; flex:none; display:grid; place-items:center;
  border-radius:999px; border:var(--border-w) solid var(--line);
  background:var(--surface); color:var(--ink-soft);
  transition:transform .15s ease, color .15s ease;
}
.iconbtn:active{ transform:scale(.93); }
.iconbtn svg{ width:19px; height:19px; }

/* ============================================================
   DAY RING — one segment per habit
   ============================================================ */
.ring-card{
  background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:var(--radius-lg); box-shadow:var(--shadow);
  padding:22px 20px; display:flex; align-items:center; gap:20px; margin-bottom:22px;
}
.ring{ width:124px; height:124px; flex:none; position:relative; }
.ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring .seg{ fill:none; stroke-width:9; stroke-linecap:round; transition:stroke .35s ease, opacity .35s ease; }
.ring .seg.off{ stroke:var(--surface-2); }
.ring .seg.on{ stroke:var(--accent); }
.ring-center{ position:absolute; inset:0; display:grid; place-content:center; text-align:center; }
.ring-center b{ font-family:var(--font-display); font-weight:var(--display-weight); font-size:36px; line-height:1; display:block; letter-spacing:var(--display-tracking); }
.ring-center b small{ font-size:.55em; color:var(--ink-mute); letter-spacing:0; }
.ring-center span{ font-size:11px; color:var(--ink-mute); letter-spacing:.08em; text-transform:uppercase; font-weight:700; }
.ring-side{ min-width:0; }
.ring-side .lead{ font-family:var(--font-display); font-weight:var(--display-weight); font-size:19px; line-height:1.2; letter-spacing:var(--display-tracking); margin:6px 0 4px; }
.ring-side p{ margin:0; font-size:13.5px; color:var(--ink-soft); }
.lvl{ display:flex; align-items:center; gap:8px; margin-top:12px; }
.lvl-bar{ flex:1; height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
.lvl-bar i{ display:block; height:100%; background:var(--gold); border-radius:99px; transition:width .5s cubic-bezier(.2,.8,.2,1); }
.lvl small{ font-size:11px; color:var(--ink-mute); font-weight:700; letter-spacing:.06em; }

/* ============================================================
   HABIT LIST
   ============================================================ */
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:22px 2px 10px; }
.section-head:first-of-type{ margin-top:0; }
.list{ display:flex; flex-direction:column; gap:10px; }
.habit{
  background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow);
  padding:13px 14px; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:13px;
  transition:transform .18s cubic-bezier(.2,.8,.2,1), border-color .2s ease;
}
.habit.done{ border-color:var(--accent); }
.habit.pop{ transform:scale(1.02); }
.habit-emoji{ width:40px; height:40px; flex:none; display:grid; place-items:center; font-size:21px; border-radius:var(--radius); background:var(--surface-2); }
.habit-main{ min-width:0; }
.habit-name{ font-weight:700; font-size:15.5px; line-height:1.25; margin:0 0 5px; overflow-wrap:anywhere; }
.habit-meta{ display:flex; align-items:center; gap:9px; font-size:12px; color:var(--ink-mute); flex-wrap:wrap; }
.streak{ display:inline-flex; align-items:center; gap:3px; color:var(--gold); font-weight:700; }
.chain{ display:flex; gap:4px; }
.chain i{ width:7px; height:7px; border-radius:99px; background:var(--surface-2); display:block; }
.chain i.hit{ background:var(--accent); }
.chain i.today{ box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink-mute); }
.check{
  width:44px; height:44px; flex:none; border-radius:999px;
  border:2px solid var(--line); display:grid; place-items:center;
  color:transparent; transition:background .2s ease, border-color .2s ease, color .2s ease, transform .15s ease;
}
.check svg{ width:22px; height:22px; }
.check:active{ transform:scale(.88); }
.habit.done .check{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.counter{ display:flex; align-items:center; gap:2px; }
.counter .cnt{ font-size:12px; color:var(--ink-mute); font-weight:700; min-width:26px; text-align:right; }

.empty{ text-align:center; padding:44px 18px; color:var(--ink-mute); }
.empty p{ margin:8px 0 18px; font-size:14px; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 18px; border-radius:999px; font-weight:700; font-size:14.5px;
  border:var(--border-w) solid var(--line); background:var(--surface); color:var(--ink);
  text-decoration:none; transition:transform .15s ease, opacity .2s ease;
}
.btn:active{ transform:scale(.96); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn-ghost{ background:transparent; }
.btn-danger{ color:var(--bad); border-color:currentColor; background:transparent; }
.btn-full{ width:100%; }
.btn-sm{ padding:8px 14px; font-size:13px; }

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; justify-content:center;
  padding:0 16px calc(12px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.tabs-inner{
  pointer-events:auto; width:100%; max-width:488px;
  display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
  background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:999px; padding:5px; box-shadow:var(--shadow);
}
.tab{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 1px 7px; border-radius:999px; color:var(--ink-mute);
  font-size:8.8px; font-weight:700; letter-spacing:.03em;
  transition:background .2s ease, color .2s ease;
}
.tab svg{ width:18px; height:18px; }
.tab[aria-selected="true"]{ background:var(--accent-soft); color:var(--accent); }
[data-skin="charcoal"] .tab[aria-selected="true"],
[data-skin="midnight"] .tab[aria-selected="true"]{ color:var(--accent); }

/* ============================================================
   WEEKS / STATS
   ============================================================ */
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:22px; }
.stat{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius);
  padding:14px 12px; box-shadow:var(--shadow);
}
.stat b{ font-family:var(--font-display); font-weight:var(--display-weight); font-size:27px; line-height:1; display:block; letter-spacing:var(--display-tracking); }
.stat span{ display:block; margin-top:6px; font-size:11px; color:var(--ink-mute); font-weight:600; line-height:1.3; }

.grid-card{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:16px 14px; margin-bottom:14px; overflow-x:auto;
}
.grid-head{ display:flex; align-items:center; gap:9px; margin-bottom:12px; }
.grid-head .habit-emoji{ width:30px; height:30px; font-size:16px; border-radius:9px; }
.grid-head b{ font-size:14.5px; overflow-wrap:anywhere; }
.grid-head .pct{ margin-left:auto; font-size:12px; font-weight:700; color:var(--ink-mute); flex:none; }
.weeks{ display:flex; gap:5px; min-width:min-content; }
.wcol{ display:flex; flex-direction:column; gap:5px; }
.cell{ width:16px; height:16px; border-radius:5px; background:var(--surface-2); }
[data-skin="riso"] .cell{ border-radius:2px; }
.cell.l1{ background:var(--accent); opacity:.35; }
.cell.l2{ background:var(--accent); opacity:.65; }
.cell.l3{ background:var(--accent); }
.cell.future{ background:transparent; box-shadow:inset 0 0 0 1px var(--surface-2); }
.cell.today{ box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink-mute); }
.daylabels{ display:flex; flex-direction:column; gap:5px; margin-right:3px; }
.daylabels span{ height:16px; font-size:9.5px; line-height:16px; color:var(--ink-mute); font-weight:700; width:16px; }

/* ============================================================
   REWARDS
   ============================================================ */
.prize{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:14px; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:center;
}
.prize.locked{ opacity:.62; }
.prize.ready{ border-color:var(--gold); }
.prize-badge{
  width:46px; height:46px; flex:none; display:grid; place-items:center; font-size:23px;
  border-radius:999px; background:var(--surface-2);
}
.prize.ready .prize-badge, .prize.claimed .prize-badge{ background:var(--accent-soft); }
.prize b{ display:block; font-size:14.5px; line-height:1.25; overflow-wrap:anywhere; }
.prize p{ margin:4px 0 0; font-size:12.5px; color:var(--ink-mute); }
.pbar{ height:5px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-top:8px; }
.pbar i{ display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .5s ease; }
.claimed-tag{ display:inline-block; margin-top:7px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); }

/* ============================================================
   BOTTOM SHEET
   ============================================================ */
.scrim{
  position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.42);
  opacity:0; pointer-events:none; transition:opacity .25s ease;
  backdrop-filter:blur(2px);
}
.scrim.open{ opacity:1; pointer-events:auto; }
.sheet{
  position:fixed; z-index:41; left:0; right:0; bottom:0;
  max-width:520px; margin:0 auto;
  background:var(--ground); color:var(--ink);
  border-top-left-radius:26px; border-top-right-radius:26px;
  border-top:var(--border-w) solid var(--line);
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));
  max-height:88dvh; overflow-y:auto;
  transform:translateY(102%); transition:transform .32s cubic-bezier(.2,.85,.25,1);
}
.sheet.open{ transform:translateY(0); }
.grabber{ width:38px; height:4px; border-radius:99px; background:var(--line); margin:0 auto 14px; }
.sheet h2{ font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking); font-size:22px; margin:0 0 4px; }
.sheet .sub{ margin:0 0 18px; font-size:13.5px; color:var(--ink-mute); }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-mute); margin-bottom:7px; }
.field input[type=text], .field input[type=number], .field select, .field textarea{
  width:100%; padding:12px 14px; border-radius:var(--radius);
  border:var(--border-w) solid var(--line); background:var(--surface); color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
.emojis{ display:flex; flex-wrap:wrap; gap:7px; }
.emojis button{
  width:42px; height:42px; border-radius:var(--radius); font-size:20px;
  border:var(--border-w) solid var(--line); background:var(--surface); display:grid; place-items:center;
}
.emojis button[aria-pressed="true"]{ background:var(--accent-soft); border-color:var(--accent); }
.chips{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{
  padding:9px 14px; border-radius:999px; font-size:13px; font-weight:600;
  border:var(--border-w) solid var(--line); background:var(--surface); color:var(--ink-soft);
}
.chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.sheet-actions{ display:flex; gap:9px; margin-top:22px; }
.sheet-actions .btn{ flex:1; }
.rowlink{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 2px; border-bottom:var(--border-w) solid var(--line); font-size:14.5px; font-weight:600; text-align:left;
}
.rowlink:last-of-type{ border-bottom:0; }
.rowlink span{ color:var(--ink-mute); font-weight:500; font-size:13px; }

/* ============================================================
   THEME PICKER
   ============================================================ */
.skins{ display:grid; grid-template-columns:1fr 1fr; gap:11px; }
.fontcard{
  width:100%; text-align:left; padding:14px 15px; border-radius:var(--radius);
  border:var(--border-w) solid var(--line); background:var(--surface); margin-bottom:9px;
  transition:transform .16s ease, border-color .2s ease;
}
.fontcard:active{ transform:scale(.985); }
.fontcard[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); }
.fontcard .fp{ display:block; font-size:23px; line-height:1.1; margin-bottom:6px; }
.fontcard .fb{ display:block; font-size:13.5px; line-height:1.35; margin-bottom:7px; }
.fontcard .fn{ font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-mute); }
.fontcard[aria-pressed="true"] .fn{ color:var(--accent); }
.skin{
  border-radius:16px; padding:14px 13px 13px; text-align:left; position:relative;
  border:2px solid transparent; overflow:hidden; transition:transform .18s ease;
}
.skin:active{ transform:scale(.97); }
.skin[aria-pressed="true"]{ border-color:var(--ink); }
.skin .sname{ display:block; font-size:15px; line-height:1.15; margin-bottom:4px; padding-right:22px; }
.skin .sdesc{ display:block; font-size:11px; opacity:.72; line-height:1.3; }
.sprev{ display:flex; align-items:center; gap:7px; margin-top:11px; padding:7px 8px; border-radius:9px; }
.sprev i{ display:block; }
.sprev .d{ width:14px; height:14px; border-radius:4px; flex:none; }
.sprev .l{ flex:1; height:4px; border-radius:99px; }
.sprev .c{ width:15px; height:15px; border-radius:99px; flex:none; }
.swatches{ display:flex; gap:5px; margin-top:9px; }
.swatches i{ width:15px; height:15px; border-radius:99px; display:block; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); }
.skin .tick{ position:absolute; top:10px; right:10px; width:19px; height:19px; border-radius:99px; display:none; place-items:center; }
.skin[aria-pressed="true"] .tick{ display:grid; }
.skin .tick svg{ width:11px; height:11px; }

/* ============================================================
   WELCOME SCREEN
   ============================================================ */
.onboard{ padding:26px 0 40px; }
.onboard .kicker{ margin-bottom:12px; }
.onboard h1{ font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking); font-size:34px; line-height:1.08; margin:0 0 10px; text-wrap:balance; }
.onboard .intro{ margin:0 0 26px; font-size:15px; color:var(--ink-soft); max-width:34ch; }
.onboard .skins{ margin-bottom:6px; }
.onboard .obl{ display:block; margin:26px 0 11px; }
.onboard .obl2{ margin-top:30px; }
.obfoot{
  position:sticky; bottom:0; padding:14px 0 calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--ground) 62%, transparent);
}

/* ---------- Vocabulary games ---------- */
.vc-modes{ display:flex; flex-direction:column; gap:10px; margin:18px 0 4px; }
.vc-mode{
  width:100%; text-align:left; padding:15px 16px; border-radius:var(--radius-lg);
  background:var(--surface); border:var(--border-w) solid var(--line); box-shadow:var(--shadow);
  transition:transform .16s cubic-bezier(.2,.8,.2,1);
}
.vc-mode:active{ transform:scale(.99); }
.vc-mode b{ display:block; font-size:16px; }
.vc-mode span{ display:block; font-size:12.5px; color:var(--ink-mute); margin-top:4px; line-height:1.45; }
.vc-all{ display:flex; flex-direction:column; gap:7px; }
.vc-row{ display:flex; align-items:baseline; gap:9px; font-size:14px; line-height:1.35; }
.vc-row b{ flex:none; max-width:46%; }
.vc-row span{ flex:1; min-width:0; color:var(--ink-mute); font-size:12.5px; }
.vc-row i{ flex:none; font-style:normal; font-size:9px; color:var(--accent); letter-spacing:1px; }
.vc-row.known b{ color:var(--accent); }
.vc-card{
  width:100%; min-height:230px; margin-top:6px; padding:26px 22px; display:flex;
  flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center;
  background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:var(--radius-lg); box-shadow:var(--shadow);
}
.vc-card.open{ border-color:var(--accent); }
.vc-card b{ font-family:var(--font-display); font-weight:var(--display-weight); font-size:27px; line-height:1.2; }
.vc-tap{ font-size:12.5px; color:var(--ink-mute); }
.vc-mean{ font-size:17px; color:var(--accent); font-weight:600; line-height:1.35; }
.vc-ctx{ font-size:14px; color:var(--ink-mute); line-height:1.5; font-style:italic; }
.vc-judge{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
.vc-match{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:8px; }
.vc-col{ display:flex; flex-direction:column; gap:9px; }
.vc-chip{
  padding:12px 11px; border-radius:var(--radius-lg); font-size:13.5px; line-height:1.3;
  background:var(--surface); border:var(--border-w) solid var(--line); color:var(--ink); text-align:left;
}
.vc-chip.on{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:700; }
.vc-chip.done{ opacity:.32; border-style:dashed; }
.vc-chip[disabled]{ pointer-events:none; }
/* ---------- Flight mode ---------- */
.fl-lede{ margin:0 0 6px; font-size:15px; line-height:1.55; color:var(--ink-soft); }
.fl-ready{
  margin:0 0 4px; font-size:12.5px; line-height:1.45; color:var(--ink-mute);
  padding:11px 13px; border-radius:var(--radius-lg); background:var(--accent-soft);
}
.fl-ready.ok{ color:var(--accent); font-weight:600; }
.fl-ready.warn{ color:var(--bad); font-weight:600; background:transparent; box-shadow:inset 0 0 0 1px currentColor; }
.fl-list{ display:flex; flex-direction:column; gap:10px; }
.fl-item{
  display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left;
  background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:14px;
  transition:transform .16s cubic-bezier(.2,.8,.2,1);
}
.fl-item:active{ transform:scale(.99); }
.fl-flag{ font-size:16px; line-height:1.25; flex:none; }
.fl-body{ flex:1; min-width:0; display:block; }
.fl-body b{ display:block; font-size:15px; line-height:1.3; }
.fl-meta{ display:block; font-size:12px; color:var(--ink-mute); margin-top:3px; line-height:1.4; }
.fl-bar{ display:block; height:4px; border-radius:99px; background:var(--line); margin-top:9px; overflow:hidden; }
.fl-bar i{ display:block; height:100%; background:var(--accent); border-radius:99px; }
.fl-pct{ flex:none; font-size:12px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; }
.fl-nav{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:24px; }
.fl-count{ font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-mute); margin:4px 0 12px; }
.fl-prompt{ font-size:19px; line-height:1.45; margin:0 0 18px; color:var(--ink); }
.fl-opts{ display:flex; flex-direction:column; gap:9px; }
.fl-opt{
  width:100%; text-align:left; padding:13px 15px; border-radius:var(--radius-lg);
  border:var(--border-w) solid var(--line); background:var(--surface);
  font-size:15.5px; line-height:1.35; color:var(--ink);
}
.fl-opt:active{ background:var(--accent-soft); }
.fl-opt.right{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:700; }
.fl-opt.wrong{ border-color:var(--bad); color:var(--bad); }
.fl-opt.dim{ opacity:.42; }
.fl-opt[disabled]{ pointer-events:none; }
.fl-why{
  margin:16px 0 0; font-size:14px; line-height:1.5; color:var(--ink);
  padding:13px 15px; border-radius:var(--radius-lg); background:var(--accent-soft);
}
.fl-why::before{ content:'✗  '; font-weight:700; color:var(--bad); }
.fl-why.ok::before{ content:'✓  '; color:var(--accent); }
.fl-score{
  text-align:center; padding:28px 18px; background:var(--surface);
  border:var(--border-w) solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow);
}
.fl-score b{ display:block; font-family:var(--font-display); font-size:38px; line-height:1; color:var(--accent); }
.fl-score p{ margin:10px 0 20px; font-size:14px; line-height:1.5; color:var(--ink-mute); }
.fl-area{
  width:100%; min-height:46vh; margin-top:16px; padding:15px;
  font-family:inherit; font-size:16px; line-height:1.62; color:var(--ink);
  background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:var(--radius-lg); resize:vertical;
}
.fl-area:focus{ outline:none; border-color:var(--accent); }
.rd-hint{ margin:12px 0 0; font-size:12.5px; color:var(--ink-mute); text-align:center; }

/* ---- To-do ---- */
.cal{ background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:8px 4px 8px; margin-bottom:16px; }
.td-day .eyebrow{ scroll-margin-bottom:210px; }
.cal-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; padding:0 6px; }
.cal-mid{ display:flex; flex-direction:column; align-items:center; min-width:0; }
.cal-title{ font-family:var(--font-display); font-weight:var(--display-weight); font-size:22px; line-height:1.2; }
.cal-nav{ width:44px; height:44px; flex:none; border-radius:50%; font-size:26px; line-height:1; color:var(--ink); background:var(--surface-2); display:grid; place-items:center; padding-bottom:3px; }
.cal-head{ display:grid; grid-template-columns:repeat(7, 1fr); text-align:center; font-size:11.5px; font-weight:700; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:2px; }
.cal-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; touch-action:pan-y; }
.cal-day{ min-height:46px; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--ink); position:relative; padding:0; }
.cal-day b{ font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1; }
.cal-day i{ display:flex; gap:3px; height:6px; align-items:center; }
.cal-day u{ width:5px; height:5px; border-radius:50%; background:var(--accent); display:block; }
.cal-day.late u{ background:var(--bad); border-radius:1px; }
.cal-day.out{ color:var(--ink-mute); opacity:.8; }
.cal-day.today{ box-shadow:inset 0 0 0 2px var(--accent); }
.cal-day.sel{ background:var(--accent); color:var(--accent-ink); opacity:1; }
.cal-day.today.sel{ box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.cal-day.sel u{ background:var(--accent-ink); }
.cal-today{ font-size:12.5px; font-weight:700; color:var(--accent); padding:0 8px; line-height:16px; min-height:16px; }
.td-none{ margin:4px 2px 0; font-size:14px; color:var(--ink-soft); }
.td-arch-btn{ display:block; margin:20px auto 0; font-size:13.5px; font-weight:700; color:var(--ink-soft); padding:12px 16px; }
.td-arch-list{ margin-top:6px; opacity:.9; }
.td-add{ display:flex; gap:8px; margin-bottom:18px; }
.td-add input{
  flex:1; padding:13px 15px; border-radius:999px; font-size:15px;
  border:var(--border-w) solid var(--line); background:var(--surface); color:var(--ink);
}
.td-add input:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
.td-add button{
  width:46px; height:46px; flex:none; border-radius:999px; display:grid; place-items:center;
  background:var(--accent); color:var(--accent-ink); font-size:24px; line-height:1;
}
.td-group{ margin-bottom:22px; }
.td-group > .eyebrow{ display:block; margin-bottom:9px; }
.td-group.late > .eyebrow{ color:var(--bad); }
.td-list{ display:flex; flex-direction:column; gap:8px; }
.td{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:12px 13px;
  display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center;
  transition:transform .16s cubic-bezier(.2,.8,.2,1);
}
.td:active{ transform:scale(.99); }
.td .box{
  width:26px; height:26px; flex:none; border-radius:8px; border:2px solid var(--line);
  display:grid; place-items:center; color:transparent;
  transition:background .18s ease, border-color .18s ease, color .18s ease;
}
.td .box svg{ width:15px; height:15px; }
.td.done .box{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.td-main{ min-width:0; text-align:left; }
.td-main b{ display:block; font-size:15px; line-height:1.3; font-weight:600; overflow-wrap:anywhere; }
.td.done .td-main b{ text-decoration:line-through; color:var(--ink-mute); }
.td-main em{ display:block; font-style:normal; font-size:12px; color:var(--ink-mute); margin-top:4px; line-height:1.35; }
.td-time{
  flex:none; font-size:13px; font-weight:700; color:var(--accent);
  font-variant-numeric:tabular-nums; padding:5px 9px; border-radius:8px; background:var(--accent-soft);
}
.td.done .td-time{ background:var(--surface-2); color:var(--ink-mute); }
.td-late .td-time{ background:#C0392B; color:#fff; }
/* ---- Plans: today's and tomorrow's tasks at the top of Today ---- */
.plans{ background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:15px 15px 10px; margin-bottom:18px; }
.plans-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:2px; }
.plans-top .eyebrow{ margin:0; color:var(--accent); }
.plans-all{ font-size:12.5px; font-weight:700; color:var(--accent); padding:6px 2px; }
.plans-day{ display:flex; align-items:baseline; gap:8px; margin:12px 0 2px; }
.plans-day b{ font-family:var(--font-display); font-weight:var(--display-weight); font-size:21px; line-height:1.2; }
.plans-day small{ font-size:13px; color:var(--ink-soft); }
.plans-day.tom b{ font-size:18px; color:var(--ink-soft); }
.plans-none{ margin:6px 0 4px; font-size:14px; color:var(--ink-soft); }
.plans-row{ display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; min-height:48px; padding:5px 0 5px 4px; border-top:1px solid var(--surface-2); }
.plans-day + .plans-row{ border-top:0; }
.plans-row .box{ position:relative; width:28px; height:28px; border-radius:9px; border:2px solid var(--ink-mute); display:grid; place-items:center; color:transparent; }
.plans-row .box::before{ content:''; position:absolute; inset:-10px; }
.plans-row.late .box{ border-color:var(--bad); }
.plans-row .box svg{ width:16px; height:16px; }
.plans-title{ min-width:0; text-align:left; font-size:16px; line-height:1.3; font-weight:600; overflow-wrap:anywhere; color:var(--ink); }
.plans-title em{ display:block; font-style:normal; font-size:12px; font-weight:700; color:var(--ink-soft); margin-top:2px; }
.plans-time{ flex:none; font-size:13px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; padding:5px 9px; border-radius:8px; background:var(--accent-soft); }
.plans-more{ display:block; width:100%; text-align:left; padding:8px 0 4px; font-size:13px; font-weight:700; color:var(--accent); }

/* ---- What's New ---- */
.rd-flag{ font-size:15px; }

.rd-block{ margin-top:28px; }
.rd-block > .eyebrow{ display:block; margin-bottom:12px; }
.qa{
  width:100%; text-align:left; background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:13px 15px; margin-bottom:9px;
}
.qa b{ display:block; font-size:14.5px; line-height:1.4; font-weight:600; }
.qa i{ display:block; font-style:normal; font-size:11px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--accent); margin-top:8px; }
.qa p{ margin:8px 0 0; font-size:14px; line-height:1.5; color:var(--ink-soft); }
.rd-archive{ display:flex; flex-direction:column; gap:1px; }
.rd-row{
  display:grid; grid-template-columns:auto 1fr auto; gap:11px; align-items:center; width:100%; text-align:left;
  padding:12px 2px; border-bottom:var(--border-w) solid var(--line);
}
.rd-row:last-child{ border-bottom:0; }
.rd-row b{ display:block; font-size:14px; line-height:1.3; font-weight:600; overflow-wrap:anywhere; }
.rd-row em{ display:block; font-style:normal; font-size:11.5px; color:var(--ink-mute); margin-top:2px; }
.rd-row .tick{ font-size:13px; color:var(--accent); }

/* ---- Workouts ---- */
.wk-card{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:16px 16px 14px; margin-bottom:20px; width:100%; text-align:left; display:block;
}
.wk-card .top{ display:flex; align-items:center; gap:10px; margin-bottom:2px; }
.wk-card .top .eyebrow{ margin:0; }
.wk-card .go{ margin-left:auto; font-size:12.5px; font-weight:700; color:var(--accent); }
.wk-card h3{
  margin:6px 0 3px; font-family:var(--font-display); font-weight:var(--display-weight);
  letter-spacing:var(--display-tracking); font-size:20px; line-height:1.15;
}
.wk-card p{ margin:0; font-size:13px; color:var(--ink-mute); line-height:1.4; }
.wk-mins{ display:flex; gap:6px; flex-wrap:wrap; margin-top:13px; }
.wk-mins span{
  padding:7px 12px; border-radius:999px; font-size:12.5px; font-weight:700;
  background:var(--surface-2); color:var(--ink-soft); font-variant-numeric:tabular-nums;
}
.wk-card.done{ border-color:var(--accent); }
.wk-done-line{ display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--accent); font-weight:700; }

.wk-list{ display:flex; flex-direction:column; gap:16px; }
.wk{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); overflow:hidden;
}
.wk.picked{ border-color:var(--accent); }
a.wk-thumb{ text-decoration:none; }
.wk-thumb{
  display:block; width:100%; aspect-ratio:16/9; background:var(--surface-2); position:relative;
  border:0; padding:0; overflow:hidden;
}
.wk-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.wk-thumb .fallback{
  position:absolute; inset:0; display:none; place-items:center; font-size:40px;
  background:linear-gradient(140deg, var(--surface-2), var(--accent-soft));
}
.wk-thumb.broken img{ display:none; }
.wk-thumb.broken .fallback{ display:grid; }
.wk-thumb .play{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:52px; height:52px; border-radius:999px; background:rgba(12,10,14,.55);
  display:grid; place-items:center; backdrop-filter:blur(3px);
}
.wk-thumb .play svg{ width:20px; height:20px; color:#fff; margin-left:3px; }
.wk-thumb .len{
  position:absolute; right:9px; bottom:9px; background:rgba(12,10,14,.78); color:#fff;
  font-size:11.5px; font-weight:700; padding:3px 7px; border-radius:6px; font-variant-numeric:tabular-nums;
}
.wk-body{ padding:14px 15px 15px; }
.wk-body b{ display:block; font-size:15.5px; line-height:1.3; overflow-wrap:anywhere; }
.wk-meta{ display:flex; flex-wrap:wrap; gap:7px; margin:10px 0 0; }
.wk-meta span{
  padding:5px 10px; border-radius:999px; font-size:11.5px; font-weight:700;
  background:var(--surface-2); color:var(--ink-soft);
}
.wk-meta span.hard{ background:var(--accent-soft); color:var(--accent); }
.wk-body p{ margin:10px 0 0; font-size:13px; line-height:1.45; color:var(--ink-mute); }
.wk-acts{ display:flex; gap:9px; margin-top:14px; }
.wk-acts .btn{ flex:1; }

.wk-note{
  background:var(--surface); border:var(--border-w) solid var(--line); border-left:3px solid var(--accent);
  border-radius:var(--radius); padding:13px 15px; font-size:13.5px; line-height:1.5;
  color:var(--ink-soft); margin-bottom:18px;
}
.wk-strip i.now{ box-shadow:inset 0 0 0 2px var(--accent); }
.linkbtn{ font:inherit; font-weight:700; color:var(--accent); text-decoration:underline; text-underline-offset:2px; padding:0; }
/* ---------- Practice: driving theory, diction, neck ---------- */
.tab.due{ position:relative; }
.tab.due::after{ content:''; position:absolute; top:7px; right:calc(50% - 15px); width:6px; height:6px; border-radius:50%; background:var(--accent); }
.pd-today{ margin:4px 0 0; padding:16px; border-radius:var(--radius-lg); background:var(--surface); border:var(--border-w) solid var(--line); box-shadow:var(--shadow); }
.pd-today .eyebrow{ margin:0 0 6px; }
.pd-goal{ display:flex; align-items:baseline; gap:8px; margin-bottom:10px; }
.pd-goal b{ font-family:var(--font-display); font-weight:var(--display-weight); font-size:34px; line-height:1; color:var(--accent); }
.pd-goal span{ font-size:13.5px; color:var(--ink-mute); }
.pd-today .pbar{ margin-bottom:14px; }
.pd-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0 0; }

.ln-title{ margin:4px 0 4px; font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking); font-size:27px; line-height:1.14; text-wrap:balance; }

.ln-body{ display:flex; flex-direction:column; gap:16px; }

.ln-p{ margin:0; font-size:16px; line-height:1.62; }

/* ---------- English: speaking roulette and saved words ---------- */
.tk-spin, .tk-card{ margin-top:4px; padding:16px; border-radius:var(--radius-lg); background:var(--surface); border:var(--border-w) solid var(--line); box-shadow:var(--shadow); }

.tk-plan{ margin:0 0 14px; padding-left:20px; display:flex; flex-direction:column; gap:6px; font-size:15px; line-height:1.45; }
.sw-list{ display:flex; flex-direction:column; gap:9px; }
.sw{ padding:13px 14px; border-radius:var(--radius); background:var(--surface); border:var(--border-w) solid var(--line); cursor:pointer; }
.sw-del{ margin-left:auto; flex:none; width:30px; height:30px; border-radius:50%; font-size:19px; line-height:1; color:var(--ink-mute); }
.sw-back{ transition:filter .2s ease, opacity .2s ease; }
.sw-list.hide .sw:not(.open) .sw-back{ filter:blur(6px); opacity:.55; }
/* ---------- Yoga plan, and habits with their own videos ---------- */
.yg-goals{ display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 0; }
.yg-goals span{ padding:5px 10px; border-radius:999px; font-size:12px; font-weight:700; background:var(--surface-2); color:var(--ink-soft); }
.yg-prog{ display:flex; align-items:center; gap:10px; margin:14px 0 0; }
.yg-prog .pbar{ flex:1; margin-top:0; }
.yg-prog small{ font-size:11.5px; font-weight:700; color:var(--ink-mute); }
.yg-no{ margin:0 0 4px; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); }
.yg-note{ margin:8px 0 12px; padding-left:10px; border-left:3px solid var(--accent-soft); font-size:14px; line-height:1.5; color:var(--ink-soft); }
.yg-pool{ margin:18px 0 0; padding:16px; border-radius:var(--radius-lg); background:var(--surface); border:var(--border-w) solid var(--accent); box-shadow:var(--shadow); }
.yg-pool .eyebrow{ margin:0 0 6px; color:var(--accent); }
.yg-pool h3{ margin:0 0 6px; font-family:var(--font-display); font-weight:var(--display-weight); font-size:21px; }
.yg-pool p{ margin:0 0 12px; font-size:14px; line-height:1.5; color:var(--ink-soft); }
.yg-pool .neck-done{ margin:0; }
.yg-next{ display:flex; flex-direction:column; gap:8px; }
.yg-next > div{ display:grid; grid-template-columns:30px 1fr; gap:10px; align-items:center; padding:10px 12px; border-radius:var(--radius); background:var(--surface); border:var(--border-w) solid var(--line); }
.yg-next .n{ width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:12.5px; font-weight:700; background:var(--surface-2); color:var(--ink-soft); }
.yg-next b{ display:block; font-size:14px; line-height:1.3; }
.yg-next small{ display:block; margin-top:2px; font-size:12px; color:var(--ink-mute); }
.habit-main[data-act]{ cursor:pointer; }
.hb-hint{ display:block; margin-top:2px; font-size:12px; font-weight:700; color:var(--accent); }
.hb-vids{ grid-column:1 / -1; padding-top:10px; border-top:var(--border-w) solid var(--line); }
.hb-tip{ margin:0 0 4px; font-size:12.5px; line-height:1.5; color:var(--ink-mute); }
.yg-vid .vid-body .yg-no{ margin:0 0 3px; }
.yg-vid .yg-note{ margin:7px 0 0; }
.yg-vid.done b{ color:var(--ink-mute); }
.yg-acts{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.yg-log{ margin:0 0 14px; padding:12px 14px; border-radius:var(--radius); background:var(--accent-soft); }
.yg-log .yg-no{ margin:0 0 6px; }
.yg-log-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0; padding:3px 0; font-size:14px; line-height:1.4; }
.yg-log-row + .yg-log-row{ border-top:1px solid var(--line); }
.yg-swim .vid-body{ padding:14px 16px; }
.yg-swim{ border-style:dashed; }
.yg-next-line{ margin:6px 0 0; font-size:12px; color:var(--ink-mute); }
/* a quiet caption under a heading (used by the word test and the Winter Arc) */
.fd-sub{ margin:6px 0 12px; font-size:13px; line-height:1.5; color:var(--ink-mute); }
/* ---------- Speaking: words and recordings ---------- */
.tk-take{ grid-template-columns:52px 1fr; }
.tk-take-acts{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 6px; }
.tk-said{ margin-top:10px; }
.tk-said label{ display:block; margin-bottom:6px; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-mute); }
.tk-said textarea{ width:100%; padding:10px 12px; border-radius:var(--radius); border:var(--border-w) solid var(--line); background:var(--ground); color:var(--ink); font:inherit; font-size:14.5px; line-height:1.45; margin-bottom:8px; }
.tk-text .tk-w{ cursor:pointer; border-radius:4px; }
.tk-text .tk-w.on{ background:var(--accent-soft); box-shadow:0 0 0 2px var(--accent-soft); }
.tk-single .tk-ru-big{ font-size:14.5px; color:var(--ink-soft); }
.tk-trbtn{ display:block; margin:0 auto 12px; padding:7px 12px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--ink-mute); border:var(--border-w) dashed var(--line); }
.tk-trbtn[aria-pressed="true"]{ color:var(--accent); border-style:solid; border-color:var(--accent); background:var(--accent-soft); }
.tk-trbtn small{ font-weight:600; opacity:.7; }
.wq-card{ background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:15px 16px 16px; margin-bottom:20px; }
.wq-card > .eyebrow, .wq-row .eyebrow{ margin:0; color:var(--accent); }
.wq-card h3{ margin:6px 0 4px; font-family:var(--font-display); font-weight:var(--display-weight); font-size:19px; line-height:1.25; }
.wq-card.done{ padding:12px 16px; }
.wq-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.wq-score{ margin:2px 0 0; font-size:15px; font-weight:700; }
.wq-word{ margin:6px 2px 4px; font-family:var(--font-display); font-weight:var(--display-weight); font-size:30px; line-height:1.2; }
.wq-fb{ margin-top:14px; }
.wq-ok, .wq-no{ margin:0 0 8px; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
.wq-ok{ color:var(--ok); }
.wq-no{ color:var(--bad); }
.wq-missed{ display:flex; flex-direction:column; gap:8px; }
.arc-card{ display:block; width:100%; text-align:left; margin-bottom:20px; padding:15px 16px 16px; border-radius:var(--radius-lg); color:var(--ink);
  background:linear-gradient(135deg, var(--accent-soft), var(--surface) 70%); border:var(--border-w) solid var(--accent); box-shadow:var(--shadow); }
.arc-top{ display:flex; align-items:baseline; justify-content:space-between; }
.arc-top .eyebrow{ margin:0; color:var(--accent); }
.arc-top .go{ font-size:12.5px; font-weight:700; color:var(--accent); }
.arc-day{ display:block; margin:6px 0 8px; font-family:var(--font-display); font-weight:var(--display-weight); font-size:22px; line-height:1.2; }
.arc-card .pbar{ display:block; margin:0 0 8px; }
.arc-sub{ display:block; font-size:13px; color:var(--ink-soft); }
.arc-goal{ padding:12px 14px; border-radius:var(--radius); background:var(--surface); border:var(--border-w) solid var(--line); }
.arc-goal b{ display:block; font-size:14.5px; }
.arc-goal p{ margin:4px 0 0; font-size:13.5px; line-height:1.5; color:var(--ink-soft); }
.arc-focus{ border-color:var(--accent); background:var(--accent-soft); }
.arc-note{ margin:10px 2px 0; font-size:14px; font-style:italic; color:var(--ink-soft); }
.arc-week{ display:flex; flex-direction:column; padding:14px; border-radius:var(--radius); background:var(--surface); border:var(--border-w) solid var(--line); }
.arc-habit + .arc-habit{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
.arc-wname{ margin:0 0 9px; font-size:14px; font-weight:700; line-height:1.3; }
.arc-wname small{ margin-left:4px; font-size:10px; font-weight:700; color:var(--ink-mute); }
.arc-cells{ display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; }
.arc-cell{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:48px; padding:4px 0; border:0; border-radius:min(12px, calc(var(--radius) - 2px)); background:var(--surface-2); color:var(--ink-soft); cursor:pointer; }
.arc-cell .d{ font-size:10px; font-weight:700; letter-spacing:.06em; opacity:.8; }
.arc-cell .n{ font-size:15px; font-weight:700; line-height:1; }
.arc-cell.on{ background:var(--accent); color:var(--accent-ink); }
.arc-cell.today{ box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.arc-cell.future{ opacity:.4; cursor:default; }
.daybar{ display:flex; align-items:stretch; gap:8px; margin:0 0 14px; }
.daybar-btn{ flex:none; width:44px; border-radius:var(--radius); background:var(--surface); border:var(--border-w) solid var(--line); color:var(--ink); font-size:22px; line-height:1; }
.daybar-btn:disabled{ opacity:.35; }
.daybar-mid{ flex:1; min-width:0; padding:8px 12px; border-radius:var(--radius); background:var(--surface); border:var(--border-w) solid var(--line); color:var(--ink); text-align:center; }
.daybar-mid b{ display:block; font-size:15px; }
.daybar-mid small{ display:block; margin-top:1px; font-size:11.5px; color:var(--ink-mute); }
.daybar-mid:not(:disabled){ border-color:var(--accent); background:var(--accent-soft); }
.arc-heat{ display:grid; grid-template-columns:repeat(auto-fill, minmax(15px, 1fr)); gap:4px; }
.arc-heat i{ display:block; aspect-ratio:1; border-radius:4px; background:var(--surface-2); }
.arc-heat i.lf{ background:transparent; box-shadow:inset 0 0 0 1px var(--line); }
.arc-heat i.l1{ background:var(--accent-soft); }
.arc-heat i.l2{ background:color-mix(in srgb, var(--accent) 45%, var(--surface)); }
.arc-heat i.l3{ background:color-mix(in srgb, var(--accent) 75%, var(--surface)); }
.arc-heat i.l4{ background:var(--accent); }
.arc-heat i.today{ outline:2px solid var(--ink); outline-offset:1px; }
.arc-sec{ margin:0 0 18px; }
.arc-q{ margin:0 0 8px; font-size:14.5px; font-weight:700; line-height:1.4; }
.arc-scale{ display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; }
.arc-scale button{ padding:11px 4px; border-radius:var(--radius); font-size:16px; font-weight:700; background:var(--surface); border:var(--border-w) solid var(--line); color:var(--ink); }
.arc-scale button[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
.arc-text{ width:100%; padding:10px 12px; border-radius:var(--radius); background:var(--surface); border:var(--border-w) solid var(--line); color:var(--ink); font:inherit; }
.wk-strip{ display:flex; gap:6px; margin:14px 0 0; }
.wk-strip div{ flex:1; text-align:center; }
.wk-strip i{
  display:block; height:30px; border-radius:8px; background:var(--surface-2); margin-bottom:5px;
  display:grid; place-items:center; font-size:14px; font-style:normal;
}
.wk-strip i.hit{ background:var(--accent-soft); }
.wk-strip span{ font-size:9.5px; font-weight:700; color:var(--ink-mute); }

/* ---- Why: the point of all this ---- */
.why{ width:100%; text-align:left; display:block; margin:0 0 20px; padding:0; }
.why > span{
  display:block; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  font-weight:700; color:var(--ink-mute); margin-bottom:5px;
}
.why q{
  quotes:none; display:block; color:var(--accent);
  font-family:var(--font-display); font-weight:var(--display-weight);
  letter-spacing:var(--display-tracking); font-size:16.5px; line-height:1.35;
}
.why.blank q{ color:var(--ink-mute); font-family:var(--font-body); font-weight:500; font-size:14px; }
.habit-why{
  margin:6px 0 0; font-size:12.5px; line-height:1.4; color:var(--ink-mute);
  border-left:2px solid var(--accent-soft); padding-left:8px;
}
.recap{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:20px 18px; margin-bottom:18px;
}
.recap .eyebrow{ margin-bottom:12px; }
.recap p{ margin:0 0 11px; font-size:14.5px; line-height:1.5; color:var(--ink-soft); }
.recap p:last-child{ margin-bottom:0; }
.recap b{
  font-family:var(--font-display); font-weight:var(--display-weight);
  letter-spacing:var(--display-tracking); font-size:19px; color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.recap .close{ color:var(--ink); font-size:14px; padding-top:4px; border-top:var(--border-w) solid var(--line); margin-top:14px; }

/* ---- My words ---- */
.seg{
  display:flex; gap:4px; background:var(--surface-2); border-radius:999px;
  padding:4px; margin-bottom:18px;
}
.seg button{
  flex:1; padding:9px 8px; border-radius:999px; font-size:13px; font-weight:700;
  color:var(--ink-mute); transition:background .2s ease, color .2s ease;
}
.seg button[aria-selected="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
.seg small{ font-weight:700; opacity:.6; }

.words{ display:flex; flex-direction:column; gap:10px; }
.word{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:14px 15px; width:100%; text-align:left;
  transition:transform .18s cubic-bezier(.2,.8,.2,1);
}
.word:active{ transform:scale(.99); }
.word-top{ display:flex; align-items:center; gap:10px; }
.word-top b{ font-size:16.5px; line-height:1.25; overflow-wrap:anywhere; }
.boxdots{ display:flex; gap:3px; margin-left:auto; flex:none; }
.boxdots i{ display:block; width:6px; height:6px; border-radius:99px; background:var(--surface-2); }
.boxdots i.on{ background:var(--accent); }
.word .ctx{ margin:8px 0 0; font-size:14px; line-height:1.45; color:var(--ink-soft); }
.word .ctx mark{ background:var(--accent-soft); color:var(--accent); padding:0 3px; border-radius:4px; font-weight:700; }
.word .mean{ margin:7px 0 0; font-size:12.5px; color:var(--ink-mute); line-height:1.4; }

.pwrap{ display:flex; flex-direction:column; gap:14px; }
.pcard{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:26px 20px; text-align:center; min-height:230px;
  display:flex; flex-direction:column; justify-content:center; gap:14px;
}
.pcard .q{ font-size:17.5px; line-height:1.55; color:var(--ink); }
.pcard .q mark{ background:none; color:var(--accent); font-weight:700; }
.blank{ display:inline-block; min-width:76px; border-bottom:2.5px solid var(--accent); vertical-align:baseline; }
.pcard .a{
  font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking);
  font-size:27px; line-height:1.15; color:var(--ink);
}
.pcard .m{ font-size:13.5px; color:var(--ink-mute); line-height:1.45; }
.pbtns{ display:flex; gap:9px; }
.pbtns .btn{ flex:1; }
.pdone{ text-align:center; padding:36px 16px; }
.pdone .big{
  font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking);
  font-size:30px; line-height:1.15; margin:10px 0 6px;
}

/* ============================================================
   DECOR — a drawn motif behind the header, one per theme
   ============================================================ */
.decor{
  position:fixed; top:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:520px; height:240px; z-index:0; pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom, #000 30%, transparent 100%);
          mask-image:linear-gradient(to bottom, #000 30%, transparent 100%);
}
.decor svg{ width:100%; height:100%; display:block; }
.app{ position:relative; z-index:1; }
#confetti{ position:fixed; inset:0; z-index:50; pointer-events:none; }

/* ============================================================
   EMPTY STATES — small drawings instead of a lone emoji
   ============================================================ */
.emptyart{ width:96px; height:96px; margin:0 auto 4px; display:block; }

.librow{
  display:grid; grid-template-columns:auto 1fr auto; gap:11px; align-items:center;
  width:100%; text-align:left; padding:11px 2px; border-bottom:var(--border-w) solid var(--line);
}
.librow:last-child{ border-bottom:0; }
.librow .habit-emoji{ width:34px; height:34px; font-size:17px; border-radius:10px; }
.librow b{ display:block; font-size:14.5px; line-height:1.25; font-weight:600; overflow-wrap:anywhere; }
.librow em{ display:block; font-style:normal; font-size:11.5px; color:var(--ink-mute); margin-top:3px; }
.librow .plus{
  width:32px; height:32px; flex:none; border-radius:999px; display:grid; place-items:center;
  border:var(--border-w) solid var(--line); color:var(--accent); font-size:19px; line-height:1;
  transition:background .18s ease, color .18s ease, border-color .18s ease;
}
.librow.have{ opacity:.55; }
.librow.have .plus{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-size:14px; }
.libcount{ font-size:12.5px; color:var(--ink-mute); margin:0 0 10px; }
/* ============================================================
   RECIPES
   ============================================================ */
.searchbar{ position:relative; margin-bottom:12px; }
.searchbar input{
  width:100%; padding:12px 14px 12px 40px; border-radius:999px;
  border:var(--border-w) solid var(--line); background:var(--surface); color:var(--ink); font-size:15px;
}
.searchbar svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--ink-mute); pointer-events:none; }
.filters{ display:flex; gap:6px; overflow-x:auto; padding:0 0 4px; margin:0 -16px 16px; padding-left:16px; padding-right:16px; scrollbar-width:none; }
.filters::-webkit-scrollbar{ display:none; }
.filters .chip{ flex:none; padding:7px 13px; font-size:12.5px; }

.rec-list{ display:flex; flex-direction:column; gap:10px; }
.rec{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:10px; display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center;
  width:100%; text-align:left; transition:transform .18s cubic-bezier(.2,.8,.2,1);
}
.rec:active{ transform:scale(.985); }
.rec-thumb{
  width:58px; height:58px; flex:none; border-radius:calc(var(--radius) - 3px);
  background:var(--surface-2) center/cover no-repeat; display:grid; place-items:center; font-size:26px;
}
.rec-body{ min-width:0; }
.rec-body b{ display:block; font-size:15px; line-height:1.25; overflow-wrap:anywhere; }
.rec-body p{ margin:5px 0 0; font-size:12px; color:var(--ink-mute); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.rec-cat{ color:var(--accent); font-weight:700; }
.star{ width:34px; height:34px; flex:none; display:grid; place-items:center; color:var(--ink-mute); border-radius:999px; }
.star svg{ width:19px; height:19px; }
.star[aria-pressed="true"]{ color:var(--gold); }
.star[aria-pressed="true"] svg{ fill:currentColor; }

.rec-hero{
  height:190px; border-radius:var(--radius-lg); background:var(--surface-2) center/cover no-repeat;
  display:grid; place-items:center; font-size:56px; margin-bottom:16px; border:var(--border-w) solid var(--line);
}
.backbtn{ display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; color:var(--ink-mute); padding:6px 2px; margin-bottom:10px; }
.backbtn svg{ width:15px; height:15px; }
.rec-title{ font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking); font-size:27px; line-height:1.12; margin:0 0 10px; text-wrap:balance; }
.rec-meta{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:22px; }
.pill{
  padding:6px 12px; border-radius:999px; font-size:12px; font-weight:700;
  background:var(--surface-2); color:var(--ink-soft);
}
.pill.accent{ background:var(--accent-soft); color:var(--accent); }
.rec-block{ margin-bottom:26px; }
.rec-block > .eyebrow{ display:block; margin-bottom:11px; }
.ings{ display:flex; flex-direction:column; gap:1px; }
.ing{
  display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left;
  padding:11px 2px; border-bottom:var(--border-w) solid var(--line); font-size:14.5px; line-height:1.35;
}
.ing:last-child{ border-bottom:0; }
.ing .box{
  width:20px; height:20px; flex:none; margin-top:1px; border-radius:6px;
  border:2px solid var(--line); display:grid; place-items:center; color:transparent;
  transition:background .18s ease, border-color .18s ease, color .18s ease;
}
.ing .box svg{ width:12px; height:12px; }
.ing[aria-pressed="true"] .box{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.ing[aria-pressed="true"] span{ text-decoration:line-through; color:var(--ink-mute); }
.steps{ display:flex; flex-direction:column; gap:16px; counter-reset:step; }
.step{ display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start; }
.step b{
  font-family:var(--font-display); font-weight:var(--display-weight); font-size:17px; line-height:1;
  width:30px; height:30px; flex:none; border-radius:999px; display:grid; place-items:center;
  background:var(--accent-soft); color:var(--accent); letter-spacing:0;
}
.step p{ margin:4px 0 0; font-size:14.5px; line-height:1.5; }
.note{
  background:var(--surface); border:var(--border-w) solid var(--line); border-left:3px solid var(--gold);
  border-radius:var(--radius); padding:13px 15px; font-size:14px; line-height:1.5; color:var(--ink-soft);
}
.photo-row{ display:flex; gap:9px; align-items:center; }
.photo-prev{ width:56px; height:56px; border-radius:var(--radius); background:var(--surface-2) center/cover no-repeat; flex:none; display:grid; place-items:center; font-size:24px; }

/* ============================================================
   TOAST
   ============================================================ */
.toast{
  position:fixed; z-index:60; left:50%; bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translate(-50%, 14px); opacity:0; pointer-events:none;
  background:var(--ink); color:var(--ground);
  padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
  max-width:min(88vw, 420px); text-align:center;
  transition:opacity .25s ease, transform .25s ease;
}
.toast.show{ opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
.toast-undo{ font:inherit; font-weight:800; color:var(--accent-soft); text-decoration:underline; padding:6px 4px 6px 10px; margin:-6px 0; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
/* English trainer */
.en-card{ padding:20px 18px 18px; margin-bottom:14px; }
.en-big{ margin:0 0 8px; font-family:var(--font-display); font-weight:var(--display-weight); font-size:30px; line-height:1.15; overflow-wrap:anywhere; }
.en-ru{ margin:0 0 12px; font-size:17px; line-height:1.4; color:var(--ink-soft); }
.en-ru-big{ margin:4px 0; font-size:23px; line-height:1.3; color:var(--ink); }
.en-ex{ margin:6px 0 2px; font-size:16px; line-height:1.45; color:var(--ink); }
.en-exru{ margin:0 0 14px; font-size:14px; line-height:1.4; color:var(--ink-soft); }
[data-act="lis-next"]{ scroll-margin-bottom:110px; }
.lis-in{ width:100%; padding:13px 14px; font:inherit; font-size:17px; color:var(--ink); background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius); }
.lis-in:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
.lis-mine{ margin:0 0 6px; font-size:16px; color:var(--ink-soft); overflow-wrap:anywhere; }
.lis-said{ margin:4px 0 8px; font-size:19px; line-height:1.5; }
.lis-said .hit{ color:var(--ok); font-weight:700; }
.lis-said .miss{ color:var(--bad); font-weight:700; text-decoration:underline wavy; text-underline-offset:4px; }
.lis-script{ margin:10px 0 0; padding:12px 14px; background:var(--surface-2); border-radius:var(--radius); font-size:15px; line-height:1.5; }
.en-chips{ display:flex; gap:8px; }
.en-chips .chip.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
/* English course */
.crs-prog{ margin:0; }
.crs-parts{ display:flex; gap:8px; margin:8px 0 12px; }
.crs-parts span{ font-size:12.5px; font-weight:700; padding:3px 10px; border-radius:99px; background:var(--surface-2); color:var(--ink-soft); }
.crs-parts span.on{ background:var(--accent); color:var(--accent-ink); }
.crs-parts span.done{ background:var(--accent-soft); color:var(--ink); }
.crs-map{ display:flex; flex-direction:column; gap:8px; }
.crs-row{ width:100%; display:flex; align-items:center; gap:12px; padding:11px 13px; text-align:left; background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
.crs-row.locked{ opacity:.6; box-shadow:none; }
.crs-row.now{ border-color:var(--accent); }
.crs-n{ flex:none; width:30px; height:30px; border-radius:50%; background:var(--surface-2); display:grid; place-items:center; font-weight:700; font-size:14px; }
.crs-row.done .crs-n{ background:var(--accent); color:var(--accent-ink); }
.crs-t{ display:flex; flex-direction:column; min-width:0; flex:1; }
.crs-t b{ font-size:15.5px; line-height:1.25; }
.crs-t small{ font-size:12.5px; color:var(--ink-soft); }
.crs-chip{ flex:none; font-size:12px; font-weight:700; color:var(--ink-soft); }
.crs-dots{ display:flex; gap:5px; margin:0 2px 8px; }
.crs-dots i{ flex:1; height:5px; border-radius:99px; background:var(--surface-2); }
.crs-dots i.done{ background:var(--accent); }
.crs-dots i.on{ background:var(--accent-soft); box-shadow:inset 0 0 0 1.5px var(--accent); }
.crs-step-title{ margin:4px 2px 12px; font-family:var(--font-display); font-weight:var(--display-weight); font-size:26px; line-height:1.15; }
.crs-nav{ display:flex; justify-content:space-between; gap:10px; margin-top:20px; }
.crs-nav .btn{ flex:1; }
.crs-nav .btn[disabled]{ opacity:.45; }
.crs-words{ display:flex; flex-direction:column; gap:10px; }
.crs-w{ background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius); padding:12px 14px; }
.crs-w-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.crs-w-top b{ font-family:var(--font-display); font-weight:var(--display-weight); font-size:21px; line-height:1.2; }
.crs-snd{ flex:none; width:44px; height:44px; font-size:20px; display:grid; place-items:center; border-radius:50%; background:var(--surface-2); }
.crs-ru{ margin:2px 0 6px; font-size:15.5px; color:var(--ink-soft); }
.crs-ex{ margin:0 0 10px; font-size:15.5px; line-height:1.45; }
.crs-ex li{ margin:4px 0; }
ul.crs-ex{ padding-left:20px; margin:10px 0 0; }
.crs-tasks{ display:flex; flex-direction:column; gap:8px; }
.crs-task{ display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; padding:12px 13px; background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius); font-size:15.5px; line-height:1.4; }
.crs-task.on{ background:var(--accent-soft); }
.crs-box{ flex:none; width:24px; height:24px; border-radius:7px; border:2px solid var(--ink-mute); display:grid; place-items:center; font-weight:800; color:var(--accent-ink); }
.crs-task.on .crs-box{ background:var(--accent); border-color:var(--accent); }
.crs-ta, .qz-in{ width:100%; padding:12px 14px; font:inherit; font-size:16.5px; line-height:1.45; color:var(--ink); background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius); }
.crs-ta:focus, .qz-in:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
.qz-in{ display:inline-block; width:9em; max-width:100%; padding:6px 10px; margin:0 4px; }
.qz-ans{ margin:0 4px; text-decoration:underline; }
.qz-ans.ok{ color:var(--ok); }
.qz-ans.no{ color:var(--bad); }
.qz-sum{ display:flex; flex-direction:column; gap:6px; margin:8px 0 4px; }
.qz-row{ display:flex; gap:10px; margin:0; font-size:15px; line-height:1.4; }
.qz-row span{ flex:none; font-weight:800; }
.qz-row.ok span{ color:var(--ok); }
.qz-row.no span{ color:var(--bad); }
.crs-tg{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0; }
.crs-tg span{ font-size:13.5px; font-weight:700; padding:4px 10px; border-radius:99px; background:var(--surface-2); color:var(--ink); }
.crs-tg span.hit{ background:var(--accent-soft); }
.crs-tg span.miss{ background:transparent; box-shadow:inset 0 0 0 1.5px var(--ink-mute); }
.crs-stats{ margin:6px 0 8px; font-size:15.5px; }
.nk-steps{ display:block; }
.nk-steps .vid-body{ width:100%; }
.nk-steps ol{ margin:6px 0 0; padding:0; list-style:none; counter-reset:nk; display:flex; flex-direction:column; gap:10px; }
.nk-steps li{ counter-increment:nk; display:grid; grid-template-columns:26px 1fr; gap:4px 10px; align-items:start; font-size:15px; line-height:1.4; }
.nk-steps li::before{ content:counter(nk); grid-row:1 / span 2; width:24px; height:24px; border-radius:50%; background:var(--accent-soft); color:var(--ink); font-size:13px; font-weight:700; display:grid; place-items:center; }
.nk-steps li b{ font-weight:700; color:var(--ink); }
.nk-steps li span{ color:var(--ink-soft); }
.dlg-chat{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
.dlg-bub{ max-width:86%; padding:10px 14px; border-radius:18px; font-size:16px; line-height:1.4; border:var(--border-w) solid var(--line); overflow-wrap:anywhere; }
.dlg-bub.them{ align-self:flex-start; background:var(--surface); border-bottom-left-radius:6px; }
.dlg-bub.you{ align-self:flex-end; background:var(--accent-soft); border-bottom-right-radius:6px; }
.dlg-bub.now{ font-size:18px; box-shadow:var(--shadow); }
.dlg-keep{ display:flex; flex-direction:column; gap:8px; }
.dlg-why{ margin:8px 0 0; font-size:14px; line-height:1.4; color:var(--ink-soft); }
.dlg-why b{ display:block; font-weight:700; color:var(--ink); }
.dlg-tr{ margin:10px 2px 0; font-size:14px; color:var(--ink-soft); }
.dlg-row{ width:100%; text-align:left; }
.dlg-row .en-set-top{ align-items:center; }
.en-lvl{ margin-left:auto; flex:none; font-size:11px; font-weight:800; letter-spacing:.04em; color:var(--ink-soft); }
.en-next{ display:inline-block; flex:none; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:.04em; background:var(--accent-soft); color:var(--ink); }
.en-voice{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
.en-rate{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
.en-hero h3{ font-size:22px; }
.en-sets{ display:flex; flex-direction:column; gap:10px; }
.en-set{ background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius); padding:12px 14px; box-shadow:var(--shadow); }
.en-set.first{ border-color:var(--accent); }
.en-set-top{ display:flex; gap:12px; align-items:center; }
.en-set-e{ flex:none; font-size:26px; line-height:1; }
.en-set-t{ display:flex; flex-direction:column; min-width:0; }
.en-set-t b{ font-size:16px; }
.en-set-t small{ font-size:13px; color:var(--ink-soft); line-height:1.35; }
.en-set-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; }
.en-set-foot small{ font-size:12.5px; color:var(--ink-soft); }
/* doodle:css */
html[data-skin="doodle"]{ font-synthesis:none; background-color:var(--stripe-b); background-image:repeating-linear-gradient(0deg, var(--stripe-a) 0 36px, var(--stripe-b) 36px 72px); background-attachment:fixed; }
[data-skin="doodle"] body{ background:transparent; font-size-adjust:.54; letter-spacing:.01em; }
[data-skin="doodle"] .top h1{ overflow-wrap:anywhere; font-size:34px; line-height:1; transform:rotate(-1.5deg); transform-origin:left center; }
[data-skin="doodle"] .eyebrow{ text-transform:none; letter-spacing:.02em; font-size:16px; color:var(--ink-soft); }

[data-skin="doodle"] .habit-name{ font-size:18px; }

[data-skin="doodle"] .tabs-inner{ border-color:var(--line); box-shadow:0 4px 0 rgba(43,49,88,.25); }
[data-skin="doodle"] .tab{ font-size:12px; letter-spacing:0; text-transform:none; }
[data-skin="doodle"] .tab[aria-selected="true"]{ background:var(--accent-soft); color:var(--accent); box-shadow:inset 0 0 0 2px var(--line); }
[data-skin="doodle"] .arc-card{ background-color:var(--surface); background-image:repeating-linear-gradient(90deg, rgba(240,140,180,.55) 0 7px, transparent 7px 14px), repeating-linear-gradient(0deg, rgba(240,140,180,.55) 0 7px, transparent 7px 14px); background-size:100% 14px, 100% 14px; background-repeat:no-repeat; background-position:top left; padding-top:30px; border-color:var(--line); }
[data-skin="doodle"] .arc-day{ font-size:32px; }
[data-skin="doodle"] .wq-card{ background-color:var(--surface); background-image:repeating-linear-gradient(90deg, rgba(120,175,230,.55) 0 8px, transparent 8px 16px); background-size:100% 12px; background-repeat:no-repeat; background-position:top left; padding-top:28px; }
[data-skin="doodle"] .plans{ background-color:var(--surface); background-image:repeating-linear-gradient(90deg, rgba(255,205,70,.65) 0 8px, transparent 8px 16px); background-size:100% 12px; background-repeat:no-repeat; background-position:top left; padding-top:28px; }
[data-skin="doodle"] .wq-card h3, [data-skin="doodle"] .arc-card h3{ font-size:22px; }
[data-skin="doodle"] .decor{ opacity:.5; }
[data-skin="doodle"] .plans-day b{ font-size:25px; }
[data-skin="doodle"] .plans-day.tom b{ font-size:21px; }
[data-skin="doodle"] .plans-title{ font-size:18px; }
[data-skin="doodle"] .plans-row .box{ border-radius:50%; }
[data-skin="doodle"] .fd-sub{ font-size:15px; color:var(--ink-soft); }
[data-skin="doodle"] .wq-card.en-card{ background-image:none; padding-top:20px; }
[data-skin="doodle"] .en-big{ font-size:34px; }
[data-skin="doodle"] .en-ru-big{ font-size:26px; }
[data-skin="doodle"] .en-set{ border-radius:var(--radius); }
[data-skin="doodle"] .wq-word{ font-size:34px; overflow-wrap:anywhere; }
[data-skin="doodle"] .pd-opt .k{ background:var(--accent-soft); color:var(--ink); border:2px solid var(--line); }
[data-skin="doodle"] .pd-opt.picked .k, [data-skin="doodle"] .pd-opt.right .k, [data-skin="doodle"] .pd-opt.wrong .k{ color:#fff; }
[data-skin="doodle"] .pd-opt.picked .k{ background:var(--accent); }
[data-skin="doodle"] .pd-opt.right .k{ background:var(--ok); border-color:var(--ok); }

[data-skin="doodle"] .top > div{ min-width:0; }
[data-skin="doodle"] .pbar{ height:12px; border:2px solid var(--line); background:var(--surface); }

[data-skin="doodle"] .daybar-btn, [data-skin="doodle"] .daybar-mid{ box-shadow:0 2px 0 var(--line); }
[data-skin="doodle"] .daybar-btn, [data-skin="doodle"] .daybar-mid:disabled{ border-color:var(--line); }

[data-skin="doodle"] .arc-cell.future{ border-style:dashed; }
[data-skin="doodle"] .arc-week, [data-skin="doodle"] .arc-goal, [data-skin="doodle"] .pd-opt:not(.picked):not(.right):not(.wrong){ border-color:var(--line); }

/* doodle:end */
</style>
</head>
<body>
<div class="decor" id="decor" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="app">

  <!-- SCREEN 0: theme picker on first launch -->
  <section id="onboard" class="onboard hidden">
    <p class="eyebrow kicker">Your own habit tracker</p>
    <h1>Pick how this looks</h1>
    <p class="intro">Tap anything to try it on — the whole screen changes as you go. Nothing here is final; you can change it again any time.</p>
    <p class="eyebrow obl">Theme</p>
    <div class="skins" id="onboardSkins"></div>
    <p class="eyebrow obl obl2">Typeface</p>
    <div id="onboardFonts"></div>
    <div class="obfoot"><button class="btn btn-primary btn-full" id="onboardDone">This is the one</button></div>
  </section>

  <!-- MAIN APP -->
  <div id="main" class="hidden">
    <header class="top">
      <div>
        <p class="eyebrow date" id="dateLine">—</p>
        <h1 class="display" id="greeting">Hello</h1>
      </div>
      <button class="iconbtn" id="openSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <main id="view"></main>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <div class="tabs-inner">
        <button class="tab" role="tab" data-tab="today" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          Today
        </button>
        <button class="tab" role="tab" data-tab="todo" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h10M9 12h10M9 19h10"/><path d="m3 5 1.6 1.6L7.4 3.8"/><path d="m3 12 1.6 1.6L7.4 10.8"/><path d="m3 19 1.6 1.6L7.4 17.8"/></svg>
          To-do
        </button>
        <button class="tab" role="tab" data-tab="english" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.3-.6L3 21l1.8-5.1A8.2 8.2 0 0 1 4 11.5 8.4 8.4 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01"/></svg>
          English
        </button>
        <button class="tab" role="tab" data-tab="practice" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.2"/><path d="M3.3 11h6.5M14.2 11h6.5M12 14.2V21"/></svg>
          Practice
        </button>
      </div>
    </nav>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Panel"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ---------- Themes ---------- */
const SKINS = [
