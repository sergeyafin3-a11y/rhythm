ndignation irraisonnée, contre cette oeuvre brutale, infâme de destruction.','Je la regardais effaré. Puis je lui pris la main; et des larmes me montèrent aux yeux. Je pleurais sa jeunesse, je pleurais sa mort. Car je ne connaissais point cette grosse dame.','Elle, émue aussi, balbutia:--Je suis bien changée, n\'est-ce pas? Que voulez-vous, tout passe. Vous voyez, je suis devenue une mère, rien qu\'une mère, une bonne mère. Adieu le reste, c\'est fini. Oh! je pensais bien que vous ne me reconnaîtriez pas, si nous nous rencontrions jamais. Vous aussi, d\'ailleurs, vous êtes changé; il m\'a fallu quelque temps pour être sûre de ne me point tromper. Vous êtes devenu tout blanc. Songez. Voici douze ans! Douze ans! Ma fille aînée a dix ans déjà.','Je regardai l\'enfant. Et je retrouvai en elle quelque chose du charme ancien de sa mère, mais quelque chose d\'indécis encore, de peu formé, de prochain. Et la vie m\'apparut rapide comme un train qui passe.','Nous arrivions à Maisons-Laffitte. Je baisai la main de ma vieille amie. Je n\'avais rien trouvé à lui dire que d\'affreuses banalités. J\'étais trop bouleversé pour parler.','Le soir, tout seul, chez moi, je me regardai longtemps dans ma glace, très longtemps. Et je finis par me rappeler ce que j\'avais été, par revoir en pensée, ma moustache brune et mes cheveux noirs, et la physionomie jeune de mon visage. Maintenant j\'étais vieux. Adieu.']},
];

 {id:'w9', lang:'fr', title:'Décris quelqu\'un sans le juger', ask:'Choisis une personne que tu connais bien et décris-la en français (200–250 mots) uniquement par ses gestes, sa voix, ses habitudes. Aucun adjectif de caractère : ni gentil, ni difficile, ni généreux. Le lecteur doit deviner.', helpers:['Quand elle entre dans une pièce, elle…','Elle dit toujours…','Ses mains…']},
 {id:'w10', lang:'fr', title:'Le repas dont tu te souviens', ask:'Raconte en français, en 250 mots, un repas précis dont tu te souviens encore. Qui était là, ce qu\'il y avait dans les assiettes, ce qui s\'est dit et ce qui ne s\'est pas dit.', helpers:['C\'était un…','Sur la table, il y avait…','Personne n\'a osé dire que…']},
 {id:'w11', lang:'en', title:'Rewrite an ending', ask:'Take one of the long reads on this screen and rewrite its ending in 200–250 words of English — same characters, same setting, one different decision. Keep the author\'s register.', helpers:['Up to that point everything is the same, except…','This time, when she…','And so the end of it is…']},
 {id:'w12', lang:'en', title:'What you would teach if nobody checked', ask:'If nobody inspected your lessons and no exam existed, what would you actually teach, and how? Write 250–300 words in English. Be specific: one lesson, start to finish.', helpers:['I would start with…','I would throw out…','By the end of the hour they would be able to…']}
];

const FL_PAGE = 22;                       /* paragraphs per screen — keeps it quick on a phone */
let flightView = null;                    /* null | {t:'read'|'drill'|'write', id} */
let tipCtx = null;                        /* overrides the article context for tap-translate */
let flAnswered = -1;                      /* which option was chosen for the current question */
let writeT = null;

function flState(){
  if(!state.flight) state.flight = {reads:{}, drills:{}, writing:{}};
  const f = state.flight;
  if(!f.reads) f.reads = {};
  if(!f.drills) f.drills = {};
  if(!f.writing) f.writing = {};
  return f;
}
function flRead(id){ const f = flState(); return f.reads[id] || (f.reads[id] = {pg:0, done:false}); }
function flDrill(id){ const f = flState(); return f.drills[id] || (f.drills[id] = {i:0, right:0, wrong:0}); }
function longRead(id){ return LONGREADS.find(function(r){ return r.id === id; }); }
function drillSet(id){ return DRILLS.find(function(d){ return d.id === id; }); }
function writeTask(id){ return WRITING.find(function(w){ return w.id === id; }); }
function flPages(r){ return Math.ceil(r.p.length / FL_PAGE); }
function wordCount(s){ const t = String(s || '').trim(); return t ? t.split(/\s+/).length : 0; }
function flFlag(l){ return l === 'fr' ? '🇫🇷' : '🇬🇧'; }

function renderFlight(){
  if(flightView && flightView.t === 'read')  return flRenderRead();
  if(flightView && flightView.t === 'drill') return flRenderDrill();
  if(flightView && flightView.t === 'write') return flRenderWrite();
  tipCtx = null;
  const f = flState();

  let h = '<div class="section-head"><p class="eyebrow">✈️ Flight mode</p></div>' +
    '<h2 class="rec-title">Eight hours, no signal</h2>' +
    '<p class="fl-lede">Everything on this screen is already inside the app. Switch the phone to airplane mode and it all still works — the stories, the drills, the writing desk.</p>' +
    '<p class="fl-ready" id="flReady">Checking whether the app is saved on this phone…</p>';

  h += '<section class="rd-block"><p class="eyebrow">Long reads</p><div class="fl-list">';
  LONGREADS.forEach(function(r){
    const st = flRead(r.id), pages = flPages(r);
    const pct = st.done ? 100 : Math.round(100 * st.pg / pages);
    h += '<button class="fl-item" data-act="fl-read" data-id="' + r.id + '">' +
      '<span class="fl-flag">' + flFlag(r.lang) + '</span>' +
      '<span class="fl-body"><b>' + esc(r.title) + '</b>' +
      '<span class="fl-meta">' + esc(r.by) + ' · ' + r.year + ' · ' + r.words + ' words · ' + r.mins + '</span>' +
      '<span class="fl-bar"><i style="width:' + pct + '%"></i></span></span>' +
      '<span class="fl-pct">' + (st.done ? '✓' : pct + '%') + '</span></button>';
  });
  h += '</div></section>';

  h += '<section class="rd-block"><p class="eyebrow">Drills</p><div class="fl-list">';
  DRILLS.forEach(function(d){
    const st = flDrill(d.id);
    const pct = Math.round(100 * st.i / d.q.length);
    h += '<button class="fl-item" data-act="fl-drill" data-id="' + d.id + '">' +
      '<span class="fl-flag">' + flFlag(d.lang) + '</span>' +
      '<span class="fl-body"><b>' + esc(d.title) + '</b>' +
      '<span class="fl-meta">' + esc(d.sub) + ' · ' + d.q.length + ' questions</span>' +
      '<span class="fl-bar"><i style="width:' + pct + '%"></i></span></span>' +
      '<span class="fl-pct">' + st.i + '/' + d.q.length + '</span></button>';
  });
  h += '</div></section>';

  h += '<section class="rd-block"><p class="eyebrow">Writing desk</p><div class="fl-list">';
  WRITING.forEach(function(w){
    const n = wordCount(f.writing[w.id]);
    h += '<button class="fl-item" data-act="fl-write" data-id="' + w.id + '">' +
      '<span class="fl-flag">' + flFlag(w.lang) + '</span>' +
      '<span class="fl-body"><b>' + esc(w.title) + '</b>' +
      '<span class="fl-meta">' + (n ? n + ' words written' : 'Nothing yet') + '</span></span>' +
      '<span class="fl-pct">' + (n ? '✎' : '') + '</span></button>';
  });
  h += '</div></section>';

  h += '<p class="rd-hint" style="margin-top:22px">The stories are out of copyright — Conan Doyle, O. Henry and Maupassant — and they are carried in full inside this file. Tap any word for the Russian.</p>';
  view.innerHTML = h;
  flCheckOffline();
}

/* Tells her, before she boards, whether the app is really saved on the phone. */
function flCheckOffline(){
  const el = document.getElementById('flReady');
  if(!el) return;
  if(!('caches' in window) || location.protocol !== 'https:'){
    el.textContent = 'Open this from the home-screen icon and it saves itself for offline use.';
    return;
  }
  caches.has('ritm-v5').then(function(ok){
    const live = navigator.serviceWorker && navigator.serviceWorker.controller;
    if(ok && live){
      el.className = 'fl-ready ok';
      el.textContent = '✓ Saved on this phone. Turn the wifi off and open it again — it will look exactly like this.';
    } else {
      el.className = 'fl-ready warn';
      el.textContent = 'Not saved yet. Stay online, close the app and open it once more, then come back to this screen.';
    }
  }).catch(function(){});
}

function flRenderRead(){
  const r = longRead(flightView.id);
  if(!r){ flightView = null; return renderFlight(); }
  const st = flRead(r.id), pages = flPages(r);
  if(st.pg >= pages) st.pg = pages - 1;
  if(st.pg < 0) st.pg = 0;
  tipCtx = {lang:r.lang, w:[]};

  const from = st.pg * FL_PAGE;
  const slice = r.p.slice(from, from + FL_PAGE);

  let h = '<button class="backbtn" data-act="fl-back">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Flight</button>' +
    '<div class="rd-head"><span class="pill accent">' + flFlag(r.lang) + ' ' + (r.lang === 'fr' ? 'Français' : 'English') + '</span>' +
    '<span class="pill">' + r.year + '</span>' +
    '<span class="pill num">Page ' + (st.pg + 1) + ' / ' + pages + '</span></div>' +
    '<h2 class="rec-title">' + esc(r.title) + '</h2>' +
    '<p class="rd-by">' + esc(r.by) + ' · public domain</p>' +
    '<div class="rd-body">';
  slice.forEach(function(p){ h += '<p>' + wordify(p, r.lang) + '</p>'; });
  h += '</div>';

  h += '<div class="fl-nav">' +
    (st.pg > 0 ? '<button class="btn btn-ghost" data-act="fl-pg" data-d="-1">← Back</button>' : '<span></span>') +
    (st.pg + 1 < pages
      ? '<button class="btn btn-primary" data-act="fl-pg" data-d="1">Next page →</button>'
      : '<button class="btn btn-primary" data-act="fl-fin" data-id="' + r.id + '">' + (st.done ? 'Read it again' : 'Finished ✓') + '</button>') +
    '</div>' +
    '<p class="rd-hint">Your place is saved. Close the app, come back, carry on.</p>';
  view.innerHTML = h;
}

function flRenderDrill(){
  const d = drillSet(flightView.id);
  if(!d){ flightView = null; return renderFlight(); }
  const st = flDrill(d.id);

  let h = '<button class="backbtn" data-act="fl-back">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Flight</button>' +
    '<div class="rd-head"><span class="pill accent">' + flFlag(d.lang) + ' ' + (d.lang === 'fr' ? 'Français' : 'English') + '</span>' +
    '<span class="pill num">' + st.right + ' right · ' + st.wrong + ' wrong</span></div>' +
    '<h2 class="rec-title">' + esc(d.title) + '</h2>';

  if(st.i >= d.q.length){
    const total = st.right + st.wrong;
    const pct = total ? Math.round(100 * st.right / total) : 0;
    h += '<div class="fl-score"><b>' + st.right + ' / ' + total + '</b><p>' +
      (pct >= 90 ? 'That is a very good score. Take the next set.'
       : pct >= 70 ? 'Solid. The ones you missed are worth a second pass.'
       : 'Worth running again — the explanations are the point of it.') + '</p>' +
      '<button class="btn btn-primary" data-act="fl-reset" data-id="' + d.id + '">Run it again</button></div>';
    view.innerHTML = h;
    return;
  }

  const q = d.q[st.i];
  h += '<p class="fl-count">Question ' + (st.i + 1) + ' of ' + d.q.length + '</p>' +
       '<p class="fl-prompt">' + esc(q[0]) + '</p><div class="fl-opts">';
  q[1].forEach(function(opt, i){
    let cls = 'fl-opt';
    if(flAnswered > -1){
      if(i === q[2]) cls += ' right';
      else if(i === flAnswered) cls += ' wrong';
      else cls += ' dim';
    }
    h += '<button class="' + cls + '" data-act="fl-ans" data-i="' + i + '"' +
         (flAnswered > -1 ? ' disabled' : '') + '>' + esc(opt) + '</button>';
  });
  h += '</div>';
  if(flAnswered > -1){
    h += '<p class="fl-why' + (flAnswered === q[2] ? ' ok' : '') + '">' + esc(q[3]) + '</p>' +
         '<button class="btn btn-primary btn-full" data-act="fl-nextq" style="margin-top:14px">' +
         (st.i + 1 < d.q.length ? 'Next question →' : 'See the score →') + '</button>';
  }
  view.innerHTML = h;
}

function flRenderWrite(){
  const w = writeTask(flightView.id);
  if(!w){ flightView = null; return renderFlight(); }
  const text = flState().writing[w.id] || '';

  view.innerHTML = '<button class="backbtn" data-act="fl-back">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Flight</button>' +
    '<div class="rd-head"><span class="pill accent">' + flFlag(w.lang) + ' ' + (w.lang === 'fr' ? 'Français' : 'English') + '</span></div>' +
    '<h2 class="rec-title">' + esc(w.title) + '</h2>' +
    '<div class="rd-say"><p>' + esc(w.ask) + '</p>' +
    '<ul>' + w.helpers.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' +
    '<textarea id="flWrite" class="fl-area" placeholder="Start anywhere. Nobody is marking this."></textarea>' +
    '<p class="rd-hint"><span id="flCount">' + wordCount(text) + '</span> words · saved on this phone as you type</p>';

  const ta = document.getElementById('flWrite');
  ta.value = text;
  ta.addEventListener('input', function(){
    document.getElementById('flCount').textContent = wordCount(ta.value);
    clearTimeout(writeT);
    writeT = setTimeout(function(){ flState().writing[w.id] = ta.value; save(); }, 500);
  });
}

/* ---------- Navigation and start-up ---------- */
function go(t){
  tab = t;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', x.dataset.tab===t ? 'true':'false'));
  window.scrollTo({top:0, behavior:'instant' in document.documentElement.style ? 'instant' : 'auto'});
  render();
}
function render(){
  if(tab!=='flight') tipCtx = null;
  if(tab==='today') renderToday();
  else if(tab==='stats') renderStats();
  else if(tab==='todo') renderTodos();
  else if(tab==='english') renderEnglish();
  else if(tab==='recipes') renderRecipes();
  else if(tab==='flight') renderFlight();
  else renderPrizes();
}
function paintHeader(){
  const d = new Date();
  $('#dateLine').textContent = WDAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
  const h = d.getHours();
  const part = h<5 ? 'Good night' : h<12 ? 'Good morning' : h<18 ? 'Good afternoon' : 'Good evening';
  $('#greeting').textContent = state.name ? part + ', ' + state.name : part;
}

function start(){
  applySkin(state.skin);
  applyFont(state.font || 'auto');
  $('#onboard').classList.add('hidden');
  $('#main').classList.remove('hidden');
  paintHeader(); checkBadges(true); save(); render();
}

if(state.skin){ start(); }
else {
  state.skin = 'peach';
  applySkin(state.skin); applyFont(state.font || 'auto');
  $('#onboard').classList.remove('hidden');
  renderSkinGrid($('#onboardSkins'));
  $('#onboardFonts').innerHTML = fontCards();
  $('#onboardDone').addEventListener('click', function(){
    save(); start(); toast('Theme and typeface live in Settings');
  });
}

/* New day — repaint */
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && state.skin) { paintHeader(); render(); } });

if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
})();
</script>
