<!doctype html>
<html lang="ru" data-skin="peach">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhythm</title>
<meta name="description" content="Daily habits, English and recipes">
<meta name="theme-color" content="#FBE9DE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rhythm">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600;7..72,700&family=Manrope:wght@400;500;700&family=Nunito:wght@400;600;700;800&family=Oswald:wght@500;600&family=Philosopher:wght@700&family=Prata&family=Unbounded:wght@700;800&display=swap">
<style>
/* ============================================================
   THEMES — each with its own palette and typeface
   ============================================================ */
:root,
[data-skin="orangery"]{
  color-scheme: light;
  --font-display: 'Literata', Georgia, serif;
  --font-body: 'Golos Text', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 700;
  --display-tracking: -0.015em;
  --ground:#E7EDE4; --surface:#F6F9F3; --surface-2:#DEE7D9; --line:#C9D6C2;
  --ink:#1F2C24; --ink-soft:#46584C; --ink-mute:#7A8C7F;
  --accent:#2F6B4F; --accent-ink:#F6F9F3; --accent-soft:#CFE0D2;
  --gold:#B0862F; --shadow: 0 1px 2px rgba(31,44,36,.06), 0 8px 24px -12px rgba(31,44,36,.18);
  --radius:14px; --radius-lg:22px; --border-w:1px;
}
[data-skin="midnight"]{
  color-scheme: dark;
  --font-display: 'Prata', Georgia, serif;
  --font-body: 'Manrope', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 400; --display-tracking: 0em;
  --ground:#0D1220; --surface:#161E30; --surface-2:#1F2940; --line:#2B3752;
  --ink:#E6EBF5; --ink-soft:#A9B4CC; --ink-mute:#6C7893;
  --accent:#8FA7FF; --accent-ink:#0D1220; --accent-soft:#26304C;
  --gold:#F0B45E; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.8);
  --radius:14px; --radius-lg:22px; --border-w:1px;
}
[data-skin="peach"]{
  color-scheme: light;
  --font-display: 'Comfortaa', ui-rounded, sans-serif;
  --font-body: 'Nunito', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 700; --display-tracking: -0.01em;
  --ground:#FBE9DE; --surface:#FFF7F2; --surface-2:#F6DACB; --line:#EBC5B2;
  --ink:#40272A; --ink-soft:#7A5157; --ink-mute:#A9807F;
  --accent:#C4566B; --accent-ink:#FFF7F2; --accent-soft:#F7D3D6;
  --gold:#D98E3C; --shadow: 0 1px 2px rgba(64,39,42,.06), 0 10px 26px -14px rgba(64,39,42,.3);
  --radius:18px; --radius-lg:28px; --border-w:1px;
}
[data-skin="riso"]{
  color-scheme: light;
  --font-display: 'Unbounded', 'Golos Text', sans-serif;
  --font-body: 'Golos Text', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 800; --display-tracking: -0.03em;
  --ground:#F7F3EA; --surface:#FFFFFF; --surface-2:#EDE7DA; --line:#141414;
  --ink:#141414; --ink-soft:#4A4A4A; --ink-mute:#8A8A8A;
  --accent:#2B44FF; --accent-ink:#FFFFFF; --accent-soft:#D9DEFF;
  --gold:#FF4D8D; --shadow: 3px 3px 0 #141414;
  --radius:4px; --radius-lg:6px; --border-w:2px;
}
[data-skin="dusk"]{
  color-scheme: light;
  --font-display: 'Philosopher', Georgia, serif;
  --font-body: 'Golos Text', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 700; --display-tracking: -0.005em;
  --ground:#E9E6F1; --surface:#F6F4FA; --surface-2:#DDD8EA; --line:#CBC4DD;
  --ink:#2A2340; --ink-soft:#574C75; --ink-mute:#8880A3;
  --accent:#6B57C7; --accent-ink:#F6F4FA; --accent-soft:#DCD4F5;
  --gold:#C98A45; --shadow: 0 1px 2px rgba(42,35,64,.06), 0 10px 26px -14px rgba(42,35,64,.32);
  --radius:16px; --radius-lg:24px; --border-w:1px;
}
[data-skin="charcoal"]{
  color-scheme: dark;
  --font-display: 'Oswald', ui-sans-serif, sans-serif;
  --font-body: 'Manrope', ui-sans-serif, system-ui, sans-serif;
  --display-weight: 600; --display-tracking: 0.005em;
  --ground:#121211; --surface:#1C1C1A; --surface-2:#262624; --line:#35352F;
  --ink:#EDEAE2; --ink-soft:#ADA79A; --ink-mute:#78736A;
  --accent:#D9C7A3; --accent-ink:#121211; --accent-soft:#2E2B24;
  --gold:#C98F5A; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 34px -18px rgba(0,0,0,.9);
  --radius:10px; --radius-lg:16px; --border-w:1px;
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; background:var(--ground); }
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  min-height:100dvh;
}
button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
.display{ font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking); text-wrap:balance; }
.eyebrow{ font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-mute); }
.num{ font-variant-numeric:tabular-nums; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.app{
  max-width:520px; margin:0 auto;
  min-height:100dvh;
  display:flex; flex-direction:column;
  padding: max(14px, env(safe-area-inset-top)) 16px 0;
}
main{ flex:1; padding-bottom:104px; }
.hidden{ display:none !important; }

/* ============================================================
   HEADER
   ============================================================ */
.top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:8px 0 18px; }
.top h1{ margin:2px 0 0; font-size:26px; line-height:1.1; }
.top .date{ margin-bottom:6px; }
.iconbtn{
  width:42px; height:42px; flex:none; display:grid; place-items:center;
  border-radius:999px; border:var(--border-w) solid var(--line);
  background:var(--surface); color:var(--ink-soft);
  transition:transform .15s ease, color .15s ease;
}
.iconbtn:active{ transform:scale(.93); }
.iconbtn svg{ width:19px; height:19px; }

/* ============================================================
   DAY RING — one segment per habit
   ============================================================ */
.ring-card{
  background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:var(--radius-lg); box-shadow:var(--shadow);
  padding:22px 20px; display:flex; align-items:center; gap:20px; margin-bottom:22px;
}
.ring{ width:124px; height:124px; flex:none; position:relative; }
.ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring .seg{ fill:none; stroke-width:9; stroke-linecap:round; transition:stroke .35s ease, opacity .35s ease; }
.ring .seg.off{ stroke:var(--surface-2); }
.ring .seg.on{ stroke:var(--accent); }
.ring-center{ position:absolute; inset:0; display:grid; place-content:center; text-align:center; }
.ring-center b{ font-family:var(--font-display); font-weight:var(--display-weight); font-size:36px; line-height:1; display:block; letter-spacing:var(--display-tracking); }
.ring-center b small{ font-size:.55em; color:var(--ink-mute); letter-spacing:0; }
.ring-center span{ font-size:11px; color:var(--ink-mute); letter-spacing:.08em; text-transform:uppercase; font-weight:700; }
.ring-side{ min-width:0; }
.ring-side .lead{ font-family:var(--font-display); font-weight:var(--display-weight); font-size:19px; line-height:1.2; letter-spacing:var(--display-tracking); margin:6px 0 4px; }
.ring-side p{ margin:0; font-size:13.5px; color:var(--ink-soft); }
.lvl{ display:flex; align-items:center; gap:8px; margin-top:12px; }
.lvl-bar{ flex:1; height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
.lvl-bar i{ display:block; height:100%; background:var(--gold); border-radius:99px; transition:width .5s cubic-bezier(.2,.8,.2,1); }
.lvl small{ font-size:11px; color:var(--ink-mute); font-weight:700; letter-spacing:.06em; }

/* ============================================================
   HABIT LIST
   ============================================================ */
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:22px 2px 10px; }
.section-head:first-of-type{ margin-top:0; }
.list{ display:flex; flex-direction:column; gap:10px; }
.habit{
  background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow);
  padding:13px 14px; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:13px;
  transition:transform .18s cubic-bezier(.2,.8,.2,1), border-color .2s ease;
}
.habit.done{ border-color:var(--accent); }
.habit.pop{ transform:scale(1.02); }
.habit-emoji{ width:40px; height:40px; flex:none; display:grid; place-items:center; font-size:21px; border-radius:var(--radius); background:var(--surface-2); }
.habit-main{ min-width:0; }
.habit-name{ font-weight:700; font-size:15.5px; line-height:1.25; margin:0 0 5px; overflow-wrap:anywhere; }
.habit-meta{ display:flex; align-items:center; gap:9px; font-size:12px; color:var(--ink-mute); flex-wrap:wrap; }
.streak{ display:inline-flex; align-items:center; gap:3px; color:var(--gold); font-weight:700; }
.chain{ display:flex; gap:4px; }
.chain i{ width:7px; height:7px; border-radius:99px; background:var(--surface-2); display:block; }
.chain i.hit{ background:var(--accent); }
.chain i.today{ box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink-mute); }
.check{
  width:44px; height:44px; flex:none; border-radius:999px;
  border:2px solid var(--line); display:grid; place-items:center;
  color:transparent; transition:background .2s ease, border-color .2s ease, color .2s ease, transform .15s ease;
}
.check svg{ width:22px; height:22px; }
.check:active{ transform:scale(.88); }
.habit.done .check{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.counter{ display:flex; align-items:center; gap:2px; }
.counter .cnt{ font-size:12px; color:var(--ink-mute); font-weight:700; min-width:26px; text-align:right; }

.empty{ text-align:center; padding:44px 18px; color:var(--ink-mute); }
.empty p{ margin:8px 0 18px; font-size:14px; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 18px; border-radius:999px; font-weight:700; font-size:14.5px;
  border:var(--border-w) solid var(--line); background:var(--surface); color:var(--ink);
  text-decoration:none; transition:transform .15s ease, opacity .2s ease;
}
.btn:active{ transform:scale(.96); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn-ghost{ background:transparent; }
.btn-danger{ color:#C0392B; border-color:currentColor; background:transparent; }
.btn-full{ width:100%; }
.btn-sm{ padding:8px 14px; font-size:13px; }

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; justify-content:center;
  padding:0 16px calc(12px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.tabs-inner{
  pointer-events:auto; width:100%; max-width:488px;
  display:grid; grid-template-columns:repeat(7,1fr); gap:1px;
  background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:999px; padding:5px; box-shadow:var(--shadow);
}
.tab{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 1px 7px; border-radius:999px; color:var(--ink-mute);
  font-size:8.8px; font-weight:700; letter-spacing:.03em;
  transition:background .2s ease, color .2s ease;
}
.tab svg{ width:18px; height:18px; }
.tab[aria-selected="true"]{ background:var(--accent-soft); color:var(--accent); }
[data-skin="charcoal"] .tab[aria-selected="true"],
[data-skin="midnight"] .tab[aria-selected="true"]{ color:var(--accent); }

/* ============================================================
   WEEKS / STATS
   ============================================================ */
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:22px; }
.stat{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius);
  padding:14px 12px; box-shadow:var(--shadow);
}
.stat b{ font-family:var(--font-display); font-weight:var(--display-weight); font-size:27px; line-height:1; display:block; letter-spacing:var(--display-tracking); }
.stat span{ display:block; margin-top:6px; font-size:11px; color:var(--ink-mute); font-weight:600; line-height:1.3; }

.grid-card{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:16px 14px; margin-bottom:14px; overflow-x:auto;
}
.grid-head{ display:flex; align-items:center; gap:9px; margin-bottom:12px; }
.grid-head .habit-emoji{ width:30px; height:30px; font-size:16px; border-radius:9px; }
.grid-head b{ font-size:14.5px; overflow-wrap:anywhere; }
.grid-head .pct{ margin-left:auto; font-size:12px; font-weight:700; color:var(--ink-mute); flex:none; }
.weeks{ display:flex; gap:5px; min-width:min-content; }
.wcol{ display:flex; flex-direction:column; gap:5px; }
.cell{ width:16px; height:16px; border-radius:5px; background:var(--surface-2); }
[data-skin="riso"] .cell{ border-radius:2px; }
.cell.l1{ background:var(--accent); opacity:.35; }
.cell.l2{ background:var(--accent); opacity:.65; }
.cell.l3{ background:var(--accent); }
.cell.future{ background:transparent; box-shadow:inset 0 0 0 1px var(--surface-2); }
.cell.today{ box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink-mute); }
.daylabels{ display:flex; flex-direction:column; gap:5px; margin-right:3px; }
.daylabels span{ height:16px; font-size:9.5px; line-height:16px; color:var(--ink-mute); font-weight:700; width:16px; }

/* ============================================================
   REWARDS
   ============================================================ */
.prize{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:14px; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:center;
}
.prize.locked{ opacity:.62; }
.prize.ready{ border-color:var(--gold); }
.prize-badge{
  width:46px; height:46px; flex:none; display:grid; place-items:center; font-size:23px;
  border-radius:999px; background:var(--surface-2);
}
.prize.ready .prize-badge, .prize.claimed .prize-badge{ background:var(--accent-soft); }
.prize b{ display:block; font-size:14.5px; line-height:1.25; overflow-wrap:anywhere; }
.prize p{ margin:4px 0 0; font-size:12.5px; color:var(--ink-mute); }
.pbar{ height:5px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-top:8px; }
.pbar i{ display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .5s ease; }
.claimed-tag{ display:inline-block; margin-top:7px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); }

/* ============================================================
   BOTTOM SHEET
   ============================================================ */
.scrim{
  position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.42);
  opacity:0; pointer-events:none; transition:opacity .25s ease;
  backdrop-filter:blur(2px);
}
.scrim.open{ opacity:1; pointer-events:auto; }
.sheet{
  position:fixed; z-index:41; left:0; right:0; bottom:0;
  max-width:520px; margin:0 auto;
  background:var(--ground); color:var(--ink);
  border-top-left-radius:26px; border-top-right-radius:26px;
  border-top:var(--border-w) solid var(--line);
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));
  max-height:88dvh; overflow-y:auto;
  transform:translateY(102%); transition:transform .32s cubic-bezier(.2,.85,.25,1);
}
.sheet.open{ transform:translateY(0); }
.grabber{ width:38px; height:4px; border-radius:99px; background:var(--line); margin:0 auto 14px; }
.sheet h2{ font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking); font-size:22px; margin:0 0 4px; }
.sheet .sub{ margin:0 0 18px; font-size:13.5px; color:var(--ink-mute); }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-mute); margin-bottom:7px; }
.field input[type=text], .field input[type=number], .field select, .field textarea{
  width:100%; padding:12px 14px; border-radius:var(--radius);
  border:var(--border-w) solid var(--line); background:var(--surface); color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
.emojis{ display:flex; flex-wrap:wrap; gap:7px; }
.emojis button{
  width:42px; height:42px; border-radius:var(--radius); font-size:20px;
  border:var(--border-w) solid var(--line); background:var(--surface); display:grid; place-items:center;
}
.emojis button[aria-pressed="true"]{ background:var(--accent-soft); border-color:var(--accent); }
.chips{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{
  padding:9px 14px; border-radius:999px; font-size:13px; font-weight:600;
  border:var(--border-w) solid var(--line); background:var(--surface); color:var(--ink-soft);
}
.chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.sheet-actions{ display:flex; gap:9px; margin-top:22px; }
.sheet-actions .btn{ flex:1; }
.rowlink{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 2px; border-bottom:var(--border-w) solid var(--line); font-size:14.5px; font-weight:600; text-align:left;
}
.rowlink:last-of-type{ border-bottom:0; }
.rowlink span{ color:var(--ink-mute); font-weight:500; font-size:13px; }

/* ============================================================
   THEME PICKER
   ============================================================ */
.skins{ display:grid; grid-template-columns:1fr 1fr; gap:11px; }
.fontcard{
  width:100%; text-align:left; padding:14px 15px; border-radius:var(--radius);
  border:var(--border-w) solid var(--line); background:var(--surface); margin-bottom:9px;
  transition:transform .16s ease, border-color .2s ease;
}
.fontcard:active{ transform:scale(.985); }
.fontcard[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); }
.fontcard .fp{ display:block; font-size:23px; line-height:1.1; margin-bottom:6px; }
.fontcard .fb{ display:block; font-size:13.5px; line-height:1.35; margin-bottom:7px; }
.fontcard .fn{ font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-mute); }
.fontcard[aria-pressed="true"] .fn{ color:var(--accent); }
.skin{
  border-radius:16px; padding:14px 13px 13px; text-align:left; position:relative;
  border:2px solid transparent; overflow:hidden; transition:transform .18s ease;
}
.skin:active{ transform:scale(.97); }
.skin[aria-pressed="true"]{ border-color:var(--ink); }
.skin .sname{ display:block; font-size:15px; line-height:1.15; margin-bottom:4px; padding-right:22px; }
.skin .sdesc{ display:block; font-size:11px; opacity:.72; line-height:1.3; }
.sprev{ display:flex; align-items:center; gap:7px; margin-top:11px; padding:7px 8px; border-radius:9px; }
.sprev i{ display:block; }
.sprev .d{ width:14px; height:14px; border-radius:4px; flex:none; }
.sprev .l{ flex:1; height:4px; border-radius:99px; }
.sprev .c{ width:15px; height:15px; border-radius:99px; flex:none; }
.swatches{ display:flex; gap:5px; margin-top:9px; }
.swatches i{ width:15px; height:15px; border-radius:99px; display:block; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); }
.skin .tick{ position:absolute; top:10px; right:10px; width:19px; height:19px; border-radius:99px; display:none; place-items:center; }
.skin[aria-pressed="true"] .tick{ display:grid; }
.skin .tick svg{ width:11px; height:11px; }

/* ============================================================
   WELCOME SCREEN
   ============================================================ */
.onboard{ padding:26px 0 40px; }
.onboard .kicker{ margin-bottom:12px; }
.onboard h1{ font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking); font-size:34px; line-height:1.08; margin:0 0 10px; text-wrap:balance; }
.onboard .intro{ margin:0 0 26px; font-size:15px; color:var(--ink-soft); max-width:34ch; }
.onboard .skins{ margin-bottom:6px; }
.onboard .obl{ display:block; margin:26px 0 11px; }
.onboard .obl2{ margin-top:30px; }
.obfoot{
  position:sticky; bottom:0; padding:14px 0 calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--ground) 62%, transparent);
}

/* ---------- Flight mode ---------- */
.fl-lede{ margin:0 0 6px; font-size:15px; line-height:1.55; color:var(--ink-soft); }
.fl-ready{
  margin:0 0 4px; font-size:12.5px; line-height:1.45; color:var(--ink-mute);
  padding:11px 13px; border-radius:var(--radius-lg); background:var(--accent-soft);
}
.fl-ready.ok{ color:var(--accent); font-weight:600; }
.fl-ready.warn{ color:#C0392B; font-weight:600; background:transparent; box-shadow:inset 0 0 0 1px currentColor; }
.fl-list{ display:flex; flex-direction:column; gap:10px; }
.fl-item{
  display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left;
  background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:14px;
  transition:transform .16s cubic-bezier(.2,.8,.2,1);
}
.fl-item:active{ transform:scale(.99); }
.fl-flag{ font-size:16px; line-height:1.25; flex:none; }
.fl-body{ flex:1; min-width:0; display:block; }
.fl-body b{ display:block; font-size:15px; line-height:1.3; }
.fl-meta{ display:block; font-size:12px; color:var(--ink-mute); margin-top:3px; line-height:1.4; }
.fl-bar{ display:block; height:4px; border-radius:99px; background:var(--line); margin-top:9px; overflow:hidden; }
.fl-bar i{ display:block; height:100%; background:var(--accent); border-radius:99px; }
.fl-pct{ flex:none; font-size:12px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; }
.fl-nav{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:24px; }
.fl-count{ font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-mute); margin:4px 0 12px; }
.fl-prompt{ font-size:19px; line-height:1.45; margin:0 0 18px; color:var(--ink); }
.fl-opts{ display:flex; flex-direction:column; gap:9px; }
.fl-opt{
  width:100%; text-align:left; padding:13px 15px; border-radius:var(--radius-lg);
  border:var(--border-w) solid var(--line); background:var(--surface);
  font-size:15.5px; line-height:1.35; color:var(--ink);
}
.fl-opt:active{ background:var(--accent-soft); }
.fl-opt.right{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:700; }
.fl-opt.wrong{ border-color:#C0392B; color:#C0392B; }
.fl-opt.dim{ opacity:.42; }
.fl-opt[disabled]{ pointer-events:none; }
.fl-why{
  margin:16px 0 0; font-size:14px; line-height:1.5; color:var(--ink);
  padding:13px 15px; border-radius:var(--radius-lg); background:var(--accent-soft);
}
.fl-why::before{ content:'✗  '; font-weight:700; color:#C0392B; }
.fl-why.ok::before{ content:'✓  '; color:var(--accent); }
.fl-score{
  text-align:center; padding:28px 18px; background:var(--surface);
  border:var(--border-w) solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow);
}
.fl-score b{ display:block; font-family:var(--font-display); font-size:38px; line-height:1; color:var(--accent); }
.fl-score p{ margin:10px 0 20px; font-size:14px; line-height:1.5; color:var(--ink-mute); }
.fl-area{
  width:100%; min-height:46vh; margin-top:16px; padding:15px;
  font-family:inherit; font-size:16px; line-height:1.62; color:var(--ink);
  background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:var(--radius-lg); resize:vertical;
}
.fl-area:focus{ outline:none; border-color:var(--accent); }
.tw{ cursor:pointer; border-radius:3px; transition:background .15s ease; }
.tw.on{ background:var(--accent-soft); }
.tw:active{ background:var(--accent-soft); }
.tip{
  position:fixed; z-index:70; max-width:min(82vw, 320px);
  background:var(--ink); color:var(--ground);
  padding:11px 14px; border-radius:13px; font-size:14.5px; line-height:1.4;
  box-shadow:0 12px 34px rgba(0,0,0,.34);
  opacity:0; pointer-events:none; transform:translate(-50%, 0) scale(.96);
  transition:opacity .16s ease, transform .16s ease;
}
.tip.show{ opacity:1; transform:translate(-50%, -8px) scale(1); }
.tip b{ display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.65; margin-bottom:3px; font-weight:700; }
.tip i{ font-style:normal; opacity:.65; }
.rd-by{ margin:-6px 0 16px; font-size:12.5px; color:var(--ink-mute); line-height:1.4; }
.rd-hint{ margin:12px 0 0; font-size:12.5px; color:var(--ink-mute); text-align:center; }

/* ---- To-do ---- */
.td-add{ display:flex; gap:8px; margin-bottom:18px; }
.td-add input{
  flex:1; padding:13px 15px; border-radius:999px; font-size:15px;
  border:var(--border-w) solid var(--line); background:var(--surface); color:var(--ink);
}
.td-add input:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
.td-add button{
  width:46px; height:46px; flex:none; border-radius:999px; display:grid; place-items:center;
  background:var(--accent); color:var(--accent-ink); font-size:24px; line-height:1;
}
.td-group{ margin-bottom:22px; }
.td-group > .eyebrow{ display:block; margin-bottom:9px; }
.td-group.late > .eyebrow{ color:#C0392B; }
.td-list{ display:flex; flex-direction:column; gap:8px; }
.td{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:12px 13px;
  display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center;
  transition:transform .16s cubic-bezier(.2,.8,.2,1);
}
.td:active{ transform:scale(.99); }
.td .box{
  width:26px; height:26px; flex:none; border-radius:8px; border:2px solid var(--line);
  display:grid; place-items:center; color:transparent;
  transition:background .18s ease, border-color .18s ease, color .18s ease;
}
.td .box svg{ width:15px; height:15px; }
.td.done .box{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.td-main{ min-width:0; text-align:left; }
.td-main b{ display:block; font-size:15px; line-height:1.3; font-weight:600; overflow-wrap:anywhere; }
.td.done .td-main b{ text-decoration:line-through; color:var(--ink-mute); }
.td-main em{ display:block; font-style:normal; font-size:12px; color:var(--ink-mute); margin-top:4px; line-height:1.35; }
.td-time{
  flex:none; font-size:13px; font-weight:700; color:var(--accent);
  font-variant-numeric:tabular-nums; padding:5px 9px; border-radius:8px; background:var(--accent-soft);
}
.td.done .td-time{ background:var(--surface-2); color:var(--ink-mute); }
.td-late .td-time{ background:#C0392B; color:#fff; }
.td-card{
  background:var(--accent-soft);
  border:var(--border-w) solid var(--accent); border-left-width:5px;
  border-radius:var(--radius-lg); box-shadow:var(--shadow);
  padding:17px; margin-bottom:20px; width:100%; text-align:left; display:block;
  transition:transform .18s cubic-bezier(.2,.8,.2,1);
}
.td-card:active{ transform:scale(.985); }
.td-card .top{ display:flex; align-items:center; gap:9px; }
.td-card .top .eyebrow{ margin:0; color:var(--accent); }
.td-card .count{
  font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  background:var(--accent); color:var(--accent-ink); padding:3px 9px; border-radius:999px; flex:none;
}
.td-card .go{ margin-left:auto; font-size:12.5px; font-weight:700; color:var(--accent); }
.td-card ul{ margin:14px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px; }
.td-card li{ font-size:15px; line-height:1.3; display:flex; gap:10px; align-items:baseline; color:var(--ink); font-weight:600; }
.td-card li span{
  font-size:12px; font-weight:700; color:var(--accent-ink); background:var(--accent); flex:none;
  font-variant-numeric:tabular-nums; padding:3px 7px; border-radius:7px; min-width:48px; text-align:center;
}
.td-card li span.none{ background:transparent; color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
.td-card p{ margin:12px 0 0; font-size:12.5px; color:var(--accent); font-weight:600; }

/* ---- What's New ---- */
.rd-card{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:16px 16px 15px; margin-bottom:20px; width:100%; text-align:left; display:block;
}
.rd-card .top{ display:flex; align-items:center; gap:10px; }
.rd-card .top .eyebrow{ margin:0; }
.rd-card .go{ margin-left:auto; font-size:12.5px; font-weight:700; color:var(--accent); }
.rd-card h3{
  margin:8px 0 5px; font-family:var(--font-display); font-weight:var(--display-weight);
  letter-spacing:var(--display-tracking); font-size:19px; line-height:1.2;
}
.rd-card p{ margin:0; font-size:13px; color:var(--ink-mute); }
.rd-card.done{ border-color:var(--accent); }
.rd-flag{ font-size:15px; }

.rd-head{ display:flex; flex-wrap:wrap; gap:7px; margin:0 0 14px; }
.rd-body p{ font-size:16px; line-height:1.62; margin:0 0 14px; color:var(--ink); }
.rd-body p:last-child{ margin-bottom:0; }
.rd-block{ margin-top:28px; }
.rd-block > .eyebrow{ display:block; margin-bottom:12px; }
.qa{
  width:100%; text-align:left; background:var(--surface); border:var(--border-w) solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:13px 15px; margin-bottom:9px;
}
.qa b{ display:block; font-size:14.5px; line-height:1.4; font-weight:600; }
.qa i{ display:block; font-style:normal; font-size:11px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--accent); margin-top:8px; }
.qa p{ margin:8px 0 0; font-size:14px; line-height:1.5; color:var(--ink-soft); }
.rd-word{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:13px 15px; margin-bottom:9px;
  display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center;
}
.rd-word b{ display:block; font-size:15px; line-height:1.3; }
.rd-word span{ display:block; font-size:12.5px; color:var(--ink-mute); margin-top:3px; line-height:1.4; }
.rd-word .add{
  width:38px; height:38px; flex:none; border-radius:999px; display:grid; place-items:center;
  border:var(--border-w) solid var(--line); color:var(--accent); font-size:20px; line-height:1;
}
.rd-word.have .add{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-size:15px; }
.rd-say{
  background:var(--accent-soft); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  padding:18px 17px;
}
.rd-say p{ margin:0 0 12px; font-size:15px; line-height:1.5; color:var(--ink); }
.rd-say ul{ margin:0; padding-left:18px; }
.rd-say li{ font-size:14px; line-height:1.6; color:var(--ink-soft); }
.rd-archive{ display:flex; flex-direction:column; gap:1px; }
.rd-row{
  display:grid; grid-template-columns:auto 1fr auto; gap:11px; align-items:center; width:100%; text-align:left;
  padding:12px 2px; border-bottom:var(--border-w) solid var(--line);
}
.rd-row:last-child{ border-bottom:0; }
.rd-row b{ display:block; font-size:14px; line-height:1.3; font-weight:600; overflow-wrap:anywhere; }
.rd-row em{ display:block; font-style:normal; font-size:11.5px; color:var(--ink-mute); margin-top:2px; }
.rd-row .tick{ font-size:13px; color:var(--accent); }

/* ---- Workouts ---- */
.wk-card{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:16px 16px 14px; margin-bottom:20px; width:100%; text-align:left; display:block;
}
.wk-card .top{ display:flex; align-items:center; gap:10px; margin-bottom:2px; }
.wk-card .top .eyebrow{ margin:0; }
.wk-card .go{ margin-left:auto; font-size:12.5px; font-weight:700; color:var(--accent); }
.wk-card h3{
  margin:6px 0 3px; font-family:var(--font-display); font-weight:var(--display-weight);
  letter-spacing:var(--display-tracking); font-size:20px; line-height:1.15;
}
.wk-card p{ margin:0; font-size:13px; color:var(--ink-mute); line-height:1.4; }
.wk-mins{ display:flex; gap:6px; flex-wrap:wrap; margin-top:13px; }
.wk-mins span{
  padding:7px 12px; border-radius:999px; font-size:12.5px; font-weight:700;
  background:var(--surface-2); color:var(--ink-soft); font-variant-numeric:tabular-nums;
}
.wk-card.done{ border-color:var(--accent); }
.wk-done-line{ display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--accent); font-weight:700; }

.wk-list{ display:flex; flex-direction:column; gap:16px; }
.wk{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); overflow:hidden;
}
.wk.picked{ border-color:var(--accent); }
a.wk-thumb{ text-decoration:none; }
.wk-thumb{
  display:block; width:100%; aspect-ratio:16/9; background:var(--surface-2); position:relative;
  border:0; padding:0; overflow:hidden;
}
.wk-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.wk-thumb .fallback{
  position:absolute; inset:0; display:none; place-items:center; font-size:40px;
  background:linear-gradient(140deg, var(--surface-2), var(--accent-soft));
}
.wk-thumb.broken img{ display:none; }
.wk-thumb.broken .fallback{ display:grid; }
.wk-thumb .play{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:52px; height:52px; border-radius:999px; background:rgba(12,10,14,.55);
  display:grid; place-items:center; backdrop-filter:blur(3px);
}
.wk-thumb .play svg{ width:20px; height:20px; color:#fff; margin-left:3px; }
.wk-thumb .len{
  position:absolute; right:9px; bottom:9px; background:rgba(12,10,14,.78); color:#fff;
  font-size:11.5px; font-weight:700; padding:3px 7px; border-radius:6px; font-variant-numeric:tabular-nums;
}
.wk-body{ padding:14px 15px 15px; }
.wk-body b{ display:block; font-size:15.5px; line-height:1.3; overflow-wrap:anywhere; }
.wk-meta{ display:flex; flex-wrap:wrap; gap:7px; margin:10px 0 0; }
.wk-meta span{
  padding:5px 10px; border-radius:999px; font-size:11.5px; font-weight:700;
  background:var(--surface-2); color:var(--ink-soft);
}
.wk-meta span.hard{ background:var(--accent-soft); color:var(--accent); }
.wk-body p{ margin:10px 0 0; font-size:13px; line-height:1.45; color:var(--ink-mute); }
.wk-acts{ display:flex; gap:9px; margin-top:14px; }
.wk-acts .btn{ flex:1; }

.wk-note{
  background:var(--surface); border:var(--border-w) solid var(--line); border-left:3px solid var(--accent);
  border-radius:var(--radius); padding:13px 15px; font-size:13.5px; line-height:1.5;
  color:var(--ink-soft); margin-bottom:18px;
}
.wk-strip{ display:flex; gap:6px; margin:14px 0 0; }
.wk-strip div{ flex:1; text-align:center; }
.wk-strip i{
  display:block; height:30px; border-radius:8px; background:var(--surface-2); margin-bottom:5px;
  display:grid; place-items:center; font-size:14px; font-style:normal;
}
.wk-strip i.hit{ background:var(--accent-soft); }
.wk-strip span{ font-size:9.5px; font-weight:700; color:var(--ink-mute); }

/* ---- Why: the point of all this ---- */
.why{ width:100%; text-align:left; display:block; margin:0 0 20px; padding:0; }
.why > span{
  display:block; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  font-weight:700; color:var(--ink-mute); margin-bottom:5px;
}
.why q{
  quotes:none; display:block; color:var(--accent);
  font-family:var(--font-display); font-weight:var(--display-weight);
  letter-spacing:var(--display-tracking); font-size:16.5px; line-height:1.35;
}
.why.blank q{ color:var(--ink-mute); font-family:var(--font-body); font-weight:500; font-size:14px; }
.habit-why{
  margin:6px 0 0; font-size:12.5px; line-height:1.4; color:var(--ink-mute);
  border-left:2px solid var(--accent-soft); padding-left:8px;
}
.recap{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:20px 18px; margin-bottom:18px;
}
.recap .eyebrow{ margin-bottom:12px; }
.recap p{ margin:0 0 11px; font-size:14.5px; line-height:1.5; color:var(--ink-soft); }
.recap p:last-child{ margin-bottom:0; }
.recap b{
  font-family:var(--font-display); font-weight:var(--display-weight);
  letter-spacing:var(--display-tracking); font-size:19px; color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.recap .close{ color:var(--ink); font-size:14px; padding-top:4px; border-top:var(--border-w) solid var(--line); margin-top:14px; }

/* ---- My words ---- */
.seg{
  display:flex; gap:4px; background:var(--surface-2); border-radius:999px;
  padding:4px; margin-bottom:18px;
}
.seg button{
  flex:1; padding:9px 8px; border-radius:999px; font-size:13px; font-weight:700;
  color:var(--ink-mute); transition:background .2s ease, color .2s ease;
}
.seg button[aria-selected="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
.seg small{ font-weight:700; opacity:.6; }

.words{ display:flex; flex-direction:column; gap:10px; }
.word{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:14px 15px; width:100%; text-align:left;
  transition:transform .18s cubic-bezier(.2,.8,.2,1);
}
.word:active{ transform:scale(.99); }
.word-top{ display:flex; align-items:center; gap:10px; }
.word-top b{ font-size:16.5px; line-height:1.25; overflow-wrap:anywhere; }
.boxdots{ display:flex; gap:3px; margin-left:auto; flex:none; }
.boxdots i{ display:block; width:6px; height:6px; border-radius:99px; background:var(--surface-2); }
.boxdots i.on{ background:var(--accent); }
.word .ctx{ margin:8px 0 0; font-size:14px; line-height:1.45; color:var(--ink-soft); }
.word .ctx mark{ background:var(--accent-soft); color:var(--accent); padding:0 3px; border-radius:4px; font-weight:700; }
.word .mean{ margin:7px 0 0; font-size:12.5px; color:var(--ink-mute); line-height:1.4; }

.pwrap{ display:flex; flex-direction:column; gap:14px; }
.pcard{
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:26px 20px; text-align:center; min-height:230px;
  display:flex; flex-direction:column; justify-content:center; gap:14px;
}
.pcard .q{ font-size:17.5px; line-height:1.55; color:var(--ink); }
.pcard .q mark{ background:none; color:var(--accent); font-weight:700; }
.blank{ display:inline-block; min-width:76px; border-bottom:2.5px solid var(--accent); vertical-align:baseline; }
.pcard .a{
  font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking);
  font-size:27px; line-height:1.15; color:var(--ink);
}
.pcard .m{ font-size:13.5px; color:var(--ink-mute); line-height:1.45; }
.pbtns{ display:flex; gap:9px; }
.pbtns .btn{ flex:1; }
.pdone{ text-align:center; padding:36px 16px; }
.pdone .big{
  font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-tracking);
  font-size:30px; line-height:1.15; margin:10px 0 6px;
}

/* ============================================================
   DECOR — a drawn motif behind the header, one per theme
   ============================================================ */
.decor{
  position:fixed; top:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:520px; height:240px; z-index:0; pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom, #000 30%, transparent 100%);
          mask-image:linear-gradient(to bottom, #000 30%, transparent 100%);
}
.decor svg{ width:100%; height:100%; display:block; }
.app{ position:relative; z-index:1; }
#confetti{ position:fixed; inset:0; z-index:50; pointer-events:none; }

/* ============================================================
   EMPTY STATES — small drawings instead of a lone emoji
   ============================================================ */
.emptyart{ width:96px; height:96px; margin:0 auto 4px; display:block; }

/* ============================================================
   ENGLISH — affirmation and ten phrases a day
   ============================================================ */
.affirm{

}

}

.packlist{ display:flex; flex-direction:column; gap:1px; }
.packrow{

/* ---------- Sound: a fanfare built from oscillators, no files needed ---------- */
let AC = null;
function audio(){
  if(state.sound === false) return null;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function note(ac, at, freq, dur, gain, type){
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(gain, at + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(at); o.stop(at + dur + 0.05);
}
function boom(ac, at, gain){
  const len = Math.floor(ac.sampleRate * 0.6);
  const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 2.6);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(2200, at);
  f.frequency.exponentialRampToValueAtTime(110, at + 0.45);
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.6);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(at);
}
function whoosh(ac, at){
  const len = Math.floor(ac.sampleRate * 0.5);
  const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * 0.5;
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 6;
  f.frequency.setValueAtTime(400, at);
  f.frequency.exponentialRampToValueAtTime(2600, at + 0.42);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(0.12, at + 0.1);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.46);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(at);
}
function fanfare(){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + 0.06;
  const C5 = 523.25, E5 = 659.25, G5 = 783.99, C6 = 1046.5, C4 = 261.63, G3 = 196.0;
  [[C5, 0], [E5, 0.11], [G5, 0.22], [C6, 0.33]].forEach(function(n){
    note(ac, t + n[1], n[0], 0.42, 0.16);
    note(ac, t + n[1], n[0] / 2, 0.42, 0.07, 'sine');
  });
  [C5, E5, G5, C6].forEach(function(f){ note(ac, t + 0.58, f, 1.5, 0.12); });
  note(ac, t + 0.58, C4, 1.7, 0.11, 'sine');
  note(ac, t + 0.58, G3, 1.7, 0.08, 'sine');
  [0.02, 0.55, 1.05, 1.55, 2.1, 2.6].forEach(function(d, i){ boom(ac, t + d, 0.5 - i*0.03); });
  [0.5, 1.0, 1.5, 2.05, 2.55].forEach(function(d){ whoosh(ac, t + d - 0.42); });
}

/* ---------- Fireworks ---------- */
let fxRunning = false;
function fireworks(opt){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  opt = opt || {};
  const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cs = getComputedStyle(document.documentElement);
  const COLS = [cs.getPropertyValue('--accent').trim(), cs.getPropertyValue('--gold').trim(),
                '#FF5C8A', '#4FE3C1', '#FFD84D', '#7AA5FF', '#FF9F45', '#FFFFFF'];

  const veilMax = opt.veil == null ? 0.34 : opt.veil;
  const total = opt.duration || 130;
  const parts = [];
  const queue = (opt.bursts || []).slice().sort(function(a, b){ return (a.at||0) - (b.at||0); });

  function spawn(b){
    const n = b.count || 150, power = b.power || 1.6;
    const hue = b.mono ? COLS[(Math.random()*COLS.length)|0] : null;
    for(let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2;
      const v = (1.5 + Math.pow(Math.random(), 0.6) * 9) * power;
      parts.push({
        x: b.x, y: b.y, px: b.x, py: b.y,
        vx: Math.cos(a)*v, vy: Math.sin(a)*v - 1.2*power,
        c: hue || COLS[(Math.random()*COLS.length)|0],
        w: 1.4 + Math.random()*2.8,
        life: 0, max: 55 + Math.random()*55
      });
    }
  }

  let t = 0;
  if(fxRunning) fxRunning = false;
  fxRunning = true;
  (function frame(){
    t++;
    const fade = t < 8 ? t/8 : (t > total - 34 ? Math.max(0, (total - t)/34) : 1);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H);
    if(veilMax > 0){
      ctx.fillStyle = 'rgba(9,7,16,' + (veilMax * fade).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    while(queue.length && (queue[0].at || 0) <= t) spawn(queue.shift());

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for(const p of parts){
      p.life++;
      if(p.life > p.max) continue;
      p.px = p.x; p.py = p.y;
      p.vy += 0.15;
      p.vx *= 0.982; p.vy *= 0.982;
      p.x += p.vx; p.y += p.vy;
      const a = Math.max(0, 1 - p.life / p.max) * fade;
      ctx.strokeStyle = p.c;
      ctx.globalAlpha = a * 0.28;                       // glow
      ctx.lineWidth = p.w * 3.4;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.globalAlpha = a;                              // core
      ctx.lineWidth = p.w;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
    }

    if(t < total && fxRunning) requestAnimationFrame(frame);
    else {
      fxRunning = false;
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.clearRect(0, 0, W, H);
    }
  })();
}

function lookUp(raw, lang){
  const dict = GLOSS[lang]; if(!dict) return null;
  const w = String(raw).toLowerCase().replace(/[\u2019]/g, "'").replace(/^[^a-z\u00e0-\u00ff']+|[^a-z\u00e0-\u00ff']+$/g, '');
  if(!w) return null;
  const d2 = (GLOSS2 && GLOSS2[lang]) || {};
  if(dict[w]) return dict[w];
  if(d2[w]) return d2[w];
  const tries = [w.replace(/e?s$/, ''), w.replace(/e?d$/, ''), w.replace(/ing$/, ''),
                 w.replace(/ing$/, 'e'), w.split("'").pop(), w.split("'")[0]];
  for(const t of tries){ if(t && dict[t]) return dict[t]; if(t && d2[t]) return d2[t]; }
  return null;
}
function wordify(text, lang){
  if(lang === 'ru') return esc(text);
  return String(text).split(/([A-Za-z\u00c0-\u00ff][A-Za-z\u00c0-\u00ff'\u2019-]*)/).map(function(part, i){
    if(i % 2 === 0) return esc(part);
    return '<b class="tw" data-w="' + esc(part) + '">' + esc(part) + '</b>';
  }).join('');
}

function wkPicks(type, key){
  const pool = wkPool(type).slice().sort(function(a, b){ return a.min - b.min || a.diff.localeCompare(b.diff); });
  if(pool.length <= 5) return pool;
  const seed = Math.floor(Date.parse(key + 'T00:00:00Z') / 86400000);
  const out = [], size = pool.length / 5;
  for(let i = 0; i < 5; i++){
    const from = Math.floor(i * size), to = Math.max(from + 1, Math.floor((i + 1) * size));
    const group = pool.slice(from, to);
    out.push(group[(seed + i) % group.length]);
  }
  return out;
}

    if(wkEnergy === 'low')  return a.min - b.min || rank[a.diff] - rank[b.diff];
    if(wkEnergy === 'high') return b.min - a.min || rank[b.diff] - rank[a.diff];
    return Math.abs(a.min - 25) - Math.abs(b.min - 25) || rank[a.diff] - rank[b.diff];
  });
}
function wkVisible(key){
  const type = wkTypeFor(key);
  const band = WK_BANDS.find(function(b){ return b[0] === wkBand; });
  const base = wkBand === 'all' ? wkPicks(type, key) : wkPool(type).filter(band[2]).slice(0, 6);
  return wkSort(base);
}
function wkById(id){ return WORKOUTS.find(function(w){ return w.id === id; }); }
function wkHabit(){ return state.habits.find(function(h){ return h.id === 'hw'; }); }
function wkWeek(){
  const ws = weekStart(today());
  let n = 0, mins = 0, strength = 0, cardio = 0;
  for(let i = 0; i < 7; i++){
    const rec = state.workouts[shift(ws, i)];
    if(!rec || !rec.doneId) continue;
    const w = wkById(rec.doneId);
    n++; mins += (rec.min || (w ? w.min : 0));
    const kind = w ? WK_TYPES[w.type].kind : 'strength';
    if(kind === 'cardio') cardio++; else if(kind === 'strength') strength++;
  }
  return {n:n, mins:mins, strength:strength, cardio:cardio};
}

function dk(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ return dk(new Date()); }
function shift(key, n){ const p=key.split('-').map(Number); return dk(new Date(p[0], p[1]-1, p[2]+n)); }
function toDate(key){ const p=key.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }

const WSHORT=['M','T','W','T','F','S','S'];

/* ---------- Habit helpers ---------- */
function count(h, key){ const l=state.log[h.id]; return (l && l[key]) || 0; }
function isDone(h, key){ return count(h, key) >= (h.perDay||1); }
function setCount(h, key, n){
  if(!state.log[h.id]) state.log[h.id]={};
  if(n<=0) delete state.log[h.id][key]; else state.log[h.id][key]=n;
}
function streakOf(h){
  let k = today(), n = 0;
  if(!isDone(h,k)) k = shift(k,-1);
  while(isDone(h,k)){ n++; k = shift(k,-1); }
  return n;
}
function weekStart(key){ const d=toDate(key); const w=(d.getDay()+6)%7; return shift(key, -w); }
function weekDone(h){
  const ws = weekStart(today()); let n=0;
  for(let i=0;i<7;i++) if(isDone(h, shift(ws,i))) n++;
  return n;
}
function activeHabits(){ return state.habits.filter(h=>!h.archived); }
function doneToday(){ return activeHabits().filter(h=>isDone(h, today())).length; }

function stats(){
  const hs = activeHabits();
  let total=0;
  for(const id in state.log) for(const k in state.log[id]) total += state.log[id][k];
  let best=0;
  for(const h of state.habits){
    const keys = Object.keys(state.log[h.id]||{}).sort();
    let run=0, prev=null, mx=0;
    for(const k of keys){
      if(!isDone(h,k)) continue;
      run = (prev && shift(prev,1)===k) ? run+1 : 1;
      prev = k; if(run>mx) mx=run;
    }
    if(mx>best) best=mx;
  }
  let perfect=0;
  if(hs.length){
    const seen={};
    for(const h of hs) for(const k in (state.log[h.id]||{})) seen[k]=1;
    for(const k in seen) if(hs.every(h=>isDone(h,k))) perfect++;
  }
  return {total, best, perfect, words: (state.words||[]).length};
}
function levelInfo(){
  let i=0; while(i+1<LEVELS.length && state.xp>=LEVELS[i+1].xp) i++;
  const cur=LEVELS[i], next=LEVELS[i+1];
  const pct = next ? Math.round((state.xp-cur.xp)/(next.xp-cur.xp)*100) : 100;
  return {index:i+1, name:cur.name, pct, next:next?next.xp-state.xp:0};
}

/* ---------- Day ring ---------- */
function ring(){
  const hs = activeHabits(), n = hs.length;
  const R = 54, C = 2*Math.PI*R;
  let segs = '';
  if(n === 0){
    segs = '<circle class="seg off" cx="62" cy="62" r="'+R+'"/>';
  } else {
    const gap = n>1 ? Math.min(14, Math.max(5, C/n*0.26)) : 0;
    const seg = C/n, drawn = Math.max(2, seg-gap);
    hs.forEach((h,i)=>{
      const on = isDone(h, today());
      segs += '<circle class="seg '+(on?'on':'off')+'" cx="62" cy="62" r="'+R+'" '+
              'stroke-dasharray="'+drawn.toFixed(2)+' '+(C-drawn).toFixed(2)+'" '+
              'stroke-dashoffset="'+(-i*seg).toFixed(2)+'"><title>'+esc(h.title)+'</title></circle>';
    });
  }
  return '<div class="ring"><svg viewBox="0 0 124 124" aria-hidden="true">'+segs+'</svg>'+
    '<span class="ring-center"><b class="num">'+doneToday()+'<small>/'+n+'</small></b><span>today</span></span></div>';
}

let todoDraft = '';
function todos(){ return state.todos || (state.todos = []); }
function tdSort(list){
  return list.slice().sort(function(a, b){
    if(!!a.done !== !!b.done) return a.done ? 1 : -1;
    const at = a.time || '99:99', bt = b.time || '99:99';
    if(at !== bt) return at < bt ? -1 : 1;
    return (a.made || 0) - (b.made || 0);
  });
}
function tdGroups(){
  const key = today(), tom = shift(key, 1);
  const g = {late:[], today:[], tomorrow:[], later:[], someday:[]};
  todos().forEach(function(t){
    if(!t.date) { g.someday.push(t); return; }
    if(t.date < key) { (t.done ? g.today : g.late).push(t); return; }
    if(t.date === key) { g.today.push(t); return; }
    if(t.date === tom) { g.tomorrow.push(t); return; }
    g.later.push(t);
  });
  Object.keys(g).forEach(function(k){ g[k] = tdSort(g[k]); });
  return g;
}
function tdOpenToday(){
  return todos().filter(function(t){ return !t.done && t.date && t.date <= today(); });

function tdWhen(t){
  if(!t.date) return 'no date';
  if(t.date === today()) return 'today';
  if(t.date === shift(today(), 1)) return 'tomorrow';
  const d = toDate(t.date);
  return WDAYS[d.getDay()].slice(0,3) + ', ' + MONTHS[d.getMonth()].slice(0,3) + ' ' + d.getDate();
}

function seedWords(){
  return [
    {id:'w1', term:'to keep someone posted',
     ctx:'I will keep you posted as soon as the results come in.',
     mean:'to keep someone updated about something',
     box:0, seen:0, right:0, last:''}
  ];
}
function escRx(t){ return String(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// "to keep someone posted" has to find "keep you posted" in a real sentence
const PLACEHOLDER = /^(someone|somebody|something|sb|sth|one's|oneself|your|yours|his|her|hers|their|theirs|my|mine|its)$/i;
function termRx(words){
  const parts = words.map(function(w){
    return PLACEHOLDER.test(w)
      ? '(?:(?:the|a|an|my|your|his|her|their|our|its)\\s+)?[\\w\\u2019\\u0027-]+'
      : escRx(w).replace(/\\?['’]/g, '[\\u0027\\u2019]');
  });
  try{ return new RegExp(parts.join('[\\s,]+'), 'i'); }catch(e){ return null; }
}
function findTerm(ctx, term){
  let words = String(term || '').trim().split(/\s+/).filter(Boolean);
  if(!words.length) return null;
  if(words.length > 1 && /^to$/i.test(words[0])) words = words.slice(1);
  for(let drop = 0; drop < words.length; drop++){
    const sub = words.slice(drop).filter(function(w){ return drop === 0 || !PLACEHOLDER.test(w); });
    if(!sub.length) continue;
    const rx = termRx(sub);
    if(!rx) continue;
    const m = rx.exec(ctx);
    if(m && m[0]) return [m.index, m.index + m[0].length];
  }
  return null;
}
function markTerm(ctx, term, mode){
  if(!ctx) return '';
  const r = term ? findTerm(ctx, term) : null;
  if(!r) return esc(ctx);
  const before = esc(ctx.slice(0, r[0])), hit = esc(ctx.slice(r[0], r[1])), after = esc(ctx.slice(r[1]));
  return before + (mode === 'blank' ? '<span class="blank"></span>' : '<mark>' + hit + '</mark>') + after;
}
function wordsDue(){
  return state.words.slice().sort(function(a, b){
    if(a.box !== b.box) return a.box - b.box;
    return (a.last || '').localeCompare(b.last || '');
  });
}

      '<div class="pdone"><div style="font-size:44px">'+(got === total ? '🎉' : '👏')+'</div>'+
      '<p class="big">'+got+' of '+total+'</p>'+
      '<p style="color:var(--ink-mute);font-size:14px;margin:0 0 22px">'+
      (got === total ? 'Every one of them. Beautifully done.' : 'The ones you missed come back sooner.')+'</p>'+
      '<div class="sheet-actions" style="justify-content:center"><button class="btn btn-primary" data-act="practice-start">Again</button>'+
      '<button class="btn" data-act="eng-view" data-v="words">Back to my words</button></div></div>';
    practice = null;
    return;
  }
  const w = p.items[p.i];
  const q = w.ctx ? markTerm(w.ctx, w.term, 'blank')
                  : '<span class="m">No context saved for this one — do you remember what it means?</span>';
  view.innerHTML = segBar() +
    '<p class="eyebrow" style="margin-bottom:12px">Practice · '+(p.i + 1)+' of '+p.items.length+'</p>'+
    '<div class="pwrap"><div class="pcard">'+
      (p.shown
        ? '<p class="a">'+esc(w.term)+'</p>'+
          (w.mean ? '<p class="m">'+esc(w.mean)+'</p>' : '')+
          (w.ctx ? '<p class="q">'+markTerm(w.ctx, w.term)+'</p>' : '')
        : '<p class="q">'+q+'</p>')+
    '</div>'+
    (p.shown
      ? '<div class="pbtns"><button class="btn" data-act="practice-mark" data-ok="0">Not yet</button>'+
        '<button class="btn btn-primary" data-act="practice-mark" data-ok="1">I knew it</button></div>'
      : '<button class="btn btn-primary btn-full" data-act="practice-show">Show the word</button>')+
    '</div>';
}

function downscale(file, max, cb){
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = function(){
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    try{ cb(c.toDataURL('image/jpeg', 0.7)); }catch(e){ cb(null); }
  };
  img.onerror = function(){ URL.revokeObjectURL(url); cb(null); };
  img.src = url;
}

function toggleHabit(id, el){
  const h = state.habits.find(x=>x.id===id); if(!h) return;
  const k = today(), per = h.perDay||1, c = count(h,k);
  if(c >= per){
    setCount(h,k,0); state.xp = Math.max(0, state.xp - 10*per); toast('Check-in removed');
  } else {
    setCount(h,k,c+1); state.xp += 10; celebrate(el);
    if(c+1 >= per){
      const box = el && el.querySelector('.check');
      const r = box ? box.getBoundingClientRect() : null;
      const fx = r ? r.left + r.width/2 : innerWidth/2;
      const fy = r ? r.top + r.height/2 : innerHeight/2;
      const st = streakOf(h);
      if(doneToday() === activeHabits().length){
        const W = innerWidth, H = innerHeight;
        fanfare();
        fireworks({
          veil: 0.72, duration: 330,
          bursts: [
            {x: fx,     y: fy,     count: 200, power: 1.9, at: 1},
            {x: W*0.22, y: H*0.26, count: 200, power: 2.1, at: 34},
            {x: W*0.78, y: H*0.20, count: 200, power: 2.1, at: 64},
            {x: W*0.50, y: H*0.42, count: 240, power: 2.4, at: 96},
            {x: W*0.16, y: H*0.50, count: 180, power: 2.0, at: 128},
            {x: W*0.84, y: H*0.46, count: 180, power: 2.0, at: 158},
            {x: W*0.50, y: H*0.24, count: 280, power: 2.7, at: 192}
          ]
        });
        toast('✨ Every habit is closed for today');
      } else {
        fireworks({
          veil: 0.3, duration: 125,
          bursts: [
            {x: fx, y: fy, count: 190, power: 1.7, at: 1},
            {x: innerWidth*(0.18 + Math.random()*0.64), y: innerHeight*(0.14 + Math.random()*0.24),
             count: 150, power: 1.95, at: 18}
          ]
        });
        if(st > 1 && st % 7 === 0) toast('🔥 '+st+' '+plural(st,'day','days')+' in a row — '+h.title);
      }
    }
  }
  checkBadges(false); save(); renderToday();
}

    if(pv){ pv.style.backgroundImage = ''; pv.textContent = '🍲'; }
  }
  else if(act==='save-recipe'){
    const title = ($('#rTitle').value || '').trim();
    if(!title){ toast('Give it a name'); $('#rTitle').focus(); return; }
    const emoji = (sheet.querySelector('#recEmoji [aria-pressed="true"]') || {dataset:{emoji:'🍲'}}).dataset.emoji;
    const cat   = (sheet.querySelector('#recCat [aria-pressed="true"]') || {dataset:{cat:''}}).dataset.cat;
    const lines = function(v){ return v.split('\n').map(function(x){ return x.trim(); }).filter(Boolean); };
    const patch = {
      title: title, emoji: emoji, cat: cat,

      serv: Math.max(0, +$('#rServ').value || 0),

    };
    let rec;
    if(id){ rec = state.recipes.find(function(x){ return x.id === id; }); Object.assign(rec, patch); }
    else { rec = Object.assign({id:'r'+Date.now().toString(36), fav:false}, patch); state.recipes.push(rec); }
    save();
    let photoFailed = false;
    if(pendingPhoto !== undefined){
      const backup = photos[rec.id];
      if(pendingPhoto === null) delete photos[rec.id]; else photos[rec.id] = pendingPhoto;
      if(!savePhotos()){
        if(backup === undefined) delete photos[rec.id]; else photos[rec.id] = backup;
        savePhotos(); photoFailed = true;
      }
    }
    pendingPhoto = undefined;
    closeSheet(); openRecipe = rec.id; go('recipes');
    toast(photoFailed ? 'Saved, but the photo would not fit — storage is full' : (id ? 'Updated' : 'Recipe added'));
  }
  else if(act==='del-recipe'){
    if(!confirm('Delete this recipe?')) return;
    state.recipes = state.recipes.filter(function(x){ return x.id !== id; });
    delete photos[id]; savePhotos(); save();
    closeSheet(); openRecipe = null; go('recipes'); toast('Deleted');
  }
  else if(act==='copy-data'){
    const t = $('#dataBox'); t.select(); t.setSelectionRange(0, 99999);
    let ok=false; try{ ok = document.execCommand('copy'); }catch(e){}
    if(navigator.clipboard) navigator.clipboard.writeText(t.value).then(()=>toast('Copied')).catch(()=>{ if(!ok) toast('Select the text and copy it by hand'); });
    else toast(ok ? 'Copied' : 'Select the text and copy it by hand');
  }
  else if(act==='import-data'){
    try{
      const obj = JSON.parse($('#dataBox').value);
      if(!obj || !Array.isArray(obj.habits)) throw new Error('bad');
      state = obj; if(!state.prizes) state.prizes=[]; if(!state.claimed) state.claimed={};
      applySkin(state.skin||'peach'); applyFont(state.font||'auto'); save(); closeSheet(); paintHeader(); render(); toast('Data restored');
    }catch(err){ toast('Could not read that — check the text'); }
  }
  else if(act==='reset'){
    if(!confirm('Delete every habit, check-in, reward and recipe? This cannot be undone.')) return;
    const skin = state.skin; state = seed(); state.skin = skin; state.habits = []; state.recipes = [];
    photos = {}; savePhotos();
    save(); closeSheet(); render(); toast('Starting over');
  }
});

/* ---------- The word bubble ---------- */
let tipT = null;
function hideTip(){
  const t = document.getElementById('tip');
  if(t) t.classList.remove('show');
  document.querySelectorAll('.tw.on').forEach(function(e){ e.classList.remove('on'); });
}
function showTip(el){
  const a = tipCtx || currentRead();
  const raw = el.getAttribute('data-w');
  const tip = document.getElementById('tip');
  if(!tip) return;

  // a word from this article's own list wins — it carries the fuller meaning
  const STOP = ['un','une','le','la','les','des','du','de','au','aux','a','an','the','to','of','in','on','at','for','it','its','and','or','se','que','qui'];
  let hit = null;
  const low = raw.toLowerCase();
  if(STOP.indexOf(low) === -1 && low.length > 2){
    for(const x of (a.w || [])){
      const term = x[0].toLowerCase();
      if(term === low || term.split(/[\s'\u2019]+/).indexOf(low) !== -1){ hit = x[1]; break; }
    }
  }
  const meaning = hit || lookUp(raw, a.lang);

  tip.innerHTML = '<b>' + esc(raw) + '</b>' +
    (meaning ? esc(meaning) : '<i>Нет в словаре — но по контексту обычно понятно.</i>');

  hideTip();
  el.classList.add('on');
  const r = el.getBoundingClientRect();
  tip.style.left = Math.min(Math.max(r.left + r.width/2, 90), innerWidth - 90) + 'px';
  tip.style.top = 'auto';
  tip.style.bottom = (innerHeight - r.top + 6) + 'px';
  tip.classList.add('show');
  clearTimeout(tipT);
  tipT = setTimeout(hideTip, 4200);
}
document.addEventListener('click', function(e){
  const w = e.target.closest && e.target.closest('.tw');
  if(w){ showTip(w); return; }
  hideTip();
}, true);
document.addEventListener('scroll', hideTip, true);

const LONGREADS = [
  {id:'speckled', lang:'en', title:'The Adventure of the Speckled Band', by:'Arthur Conan Doyle', year:'1892', mins:'45 min', words:9805,
   p:['On glancing over my notes of the seventy odd cases in which I have during the last eight years studied the methods of my friend Sherlock Holmes, I find many tragic, some comic, a large number merely strange, but none commonplace; for, working as he did rather for the love of his art than for the acquirement of wealth, he refused to associate himself with any investigation which did not tend towards the unusual, and even the fantastic. Of all these varied cases, however, I cannot recall any which presented more singular features than that which was associated with the well-known Surrey family of the Roylotts of Stoke Moran. The events in question occurred in the early days of my association with Holmes, when we were sharing rooms as bachelors in Baker Street. It is possible that I might have placed them upon record before, but a promise of secrecy was made at the time, from which I have only been freed during the last month by the untimely death of the lady to whom the pledge was given. It is perhaps as well that the facts should now come to light, for I have reasons to know that there are widespread rumours as to the death of Dr. Grimesby Roylott which tend to make the matter even more terrible than the truth.','It was early in April in the year ’83 that I woke one morning to find Sherlock Holmes standing, fully dressed, by the side of my bed. He was a late riser, as a rule, and as the clock on the mantelpiece showed me that it was only a quarter-past seven, I blinked up at him in some surprise, and perhaps just a little resentment, for I was myself regular in my habits.','“Very sorry to knock you up, Watson,” said he, “but it’s the common lot this morning. Mrs. Hudson has been knocked up, she retorted upon me, and I on you.”','“What is it, then—a fire?”','“No; a client. It seems that a young lady has arrived in a considerable state of excitement, who insists upon seeing me. She is waiting now in the sitting-room. Now, when young ladies wander about the metropolis at this hour of the morning, and knock sleepy people up out of their beds, I presume that it is something very pressing which they have to communicate. Should it prove to be an interesting case, you would, I am sure, wish to follow it from the outset. I thought, at any rate, that I should call you and give you the chance.”','“My dear fellow, I would not miss it for anything.”','I had no keener pleasure than in following Holmes in his professional investigations, and in admiring the rapid deductions, as swift as intuitions, and yet always founded on a logical basis with which he unravelled the problems which were submitted to him. I rapidly threw on my clothes and was ready in a few minutes to accompany my friend down to the sitting-room. A lady dressed in black and heavily veiled, who had been sitting in the window, rose as we entered.','“Good-morning, madam,” said Holmes cheerily. “My name is Sherlock Holmes. This is my intimate friend and associate, Dr. Watson, before whom you can speak as freely as before myself. Ha! I am glad to see that Mrs. Hudson has had the good sense to light the fire. Pray draw up to it, and I shall order you a cup of hot coffee, for I observe that you are shivering.”','“It is not cold which makes me shiver,” said the woman in a low voice, changing her seat as requested.','“What, then?”','“It is fear, Mr. Holmes. It is terror.” She raised her veil as she spoke, and we could see that she was indeed in a pitiable state of agitation, her face all drawn and grey, with restless frightened eyes, like those of some hunted animal. Her features and figure were those of a woman of thirty, but her hair was shot with premature grey, and her expression was weary and haggard. Sherlock Holmes ran her over with one of his quick, all-comprehensive glances.','“You must not fear,” said he soothingly, bending forward and patting her forearm. “We shall soon set matters right, I have no doubt. You have come in by train this morning, I see.”','“You know me, then?”','“No, but I observe the second half of a return ticket in the palm of your left glove. You must have started early, and yet you had a good drive in a dog-cart, along heavy roads, before you reached the station.”','The lady gave a violent start and stared in bewilderment at my companion.','“There is no mystery, my dear madam,” said he, smiling. “The left arm of your jacket is spattered with mud in no less than seven places. The marks are perfectly fresh. There is no vehicle save a dog-cart which throws up mud in that way, and then only when you sit on the left-hand side of the driver.”','“Whatever your reasons may be, you are perfectly correct,” said she. “I started from home before six, reached Leatherhead at twenty past, and came in by the first train to Waterloo. Sir, I can stand this strain no longer; I shall go mad if it continues. I have no one to turn to—none, save only one, who cares for me, and he, poor fellow, can be of little aid. I have heard of you, Mr. Holmes; I have heard of you from Mrs. Farintosh, whom you helped in the hour of her sore need. It was from her that I had your address. Oh, sir, do you not think that you could help me, too, and at least throw a little light through the dense darkness which surrounds me? At present it is out of my power to reward you for your services, but in a month or six weeks I shall be married, with the control of my own income, and then at least you shall not find me ungrateful.”','Holmes turned to his desk and, unlocking it, drew out a small case-book, which he consulted.','“Farintosh,” said he. “Ah yes, I recall the case; it was concerned with an opal tiara. I think it was before your time, Watson. I can only say, madam, that I shall be happy to devote the same care to your case as I did to that of your friend. As to reward, my profession is its own reward; but you are at liberty to defray whatever expenses I may be put to, at the time which suits you best. And now I beg that you will lay before us everything that may help us in forming an opinion upon the matter.”','“Alas!” replied our visitor, “the very horror of my situation lies in the fact that my fears are so vague, and my suspicions depend so entirely upon small points, which might seem trivial to another, that even he to whom of all others I have a right to look for help and advice looks upon all that I tell him about it as the fancies of a nervous woman. He does not say so, but I can read it from his soothing answers and averted eyes. But I have heard, Mr. Holmes, that you can see deeply into the manifold wickedness of the human heart. You may advise me how to walk amid the dangers which encompass me.”','“I am all attention, madam.”','“My name is Helen Stoner, and I am living with my stepfather, who is the last survivor of one of the oldest Saxon families in England, the Roylotts of Stoke Moran, on the western border of Surrey.”','Holmes nodded his head. “The name is familiar to me,” said he.','“The family was at one time among the richest in England, and the estates extended over the borders into Berkshire in the north, and Hampshire in the west. In the last century, however, four successive heirs were of a dissolute and wasteful disposition, and the family ruin was eventually completed by a gambler in the days of the Regency. Nothing was left save a few acres of ground, and the two-hundred-year-old house, which is itself crushed under a heavy mortgage. The last squire dragged out his existence there, living the horrible life of an aristocratic pauper; but his only son, my stepfather, seeing that he must adapt himself to the new conditions, obtained an advance from a relative, which enabled him to take a medical degree and went out to Calcutta, where, by his professional skill and his force of character, he established a large practice. In a fit of anger, however, caused by some robberies which had been perpetrated in the house, he beat his native butler to death and narrowly escaped a capital sentence. As it was, he suffered a long term of imprisonment and afterwards returned to England a morose and disappointed man.','“When Dr. Roylott was in India he married my mother, Mrs. Stoner, the young widow of Major-General Stoner, of the Bengal Artillery. My sister Julia and I were twins, and we were only two years old at the time of my mother’s re-marriage. She had a considerable sum of money—not less than £ 1000 a year—and this she bequeathed to Dr. Roylott entirely while we resided with him, with a provision that a certain annual sum should be allowed to each of us in the event of our marriage. Shortly after our return to England my mother died—she was killed eight years ago in a railway accident near Crewe. Dr. Roylott then abandoned his attempts to establish himself in practice in London and took us to live with him in the old ancestral house at Stoke Moran. The money which my mother had left was enough for all our wants, and there seemed to be no obstacle to our happiness.','“But a terrible change came over our stepfather about this time. Instead of making friends and exchanging visits with our neighbours, who had at first been overjoyed to see a Roylott of Stoke Moran back in the old family seat, he shut himself up in his house and seldom came out save to indulge in ferocious quarrels with whoever might cross his path. Violence of temper approaching to mania has been hereditary in the men of the family, and in my stepfather’s case it had, I believe, been intensified by his long residence in the tropics. A series of disgraceful brawls took place, two of which ended in the police-court, until at last he became the terror of the village, and the folks would fly at his approach, for he is a man of immense strength, and absolutely uncontrollable in his anger.','“Last week he hurled the local blacksmith over a parapet into a stream, and it was only by paying over all the money which I could gather together that I was able to avert another public exposure. He had no friends at all save the wandering gipsies, and he would give these vagabonds leave to encamp upon the few acres of bramble-covered land which represent the family estate, and would accept in return the hospitality of their tents, wandering away with them sometimes for weeks on end. He has a passion also for Indian animals, which are sent over to him by a correspondent, and he has at this moment a cheetah and a baboon, which wander freely over his grounds and are feared by the villagers almost as much as their master.','“You can imagine from what I say that my poor sister Julia and I had no great pleasure in our lives. No servant would stay with us, and for a long time we did all the work of the house. She was but thirty at the time of her death, and yet her hair had already begun to whiten, even as mine has.”','“Your sister is dead, then?”','“She died just two years ago, and it is of her death that I wish to speak to you. You can understand that, living the life which I have described, we were little likely to see anyone of our own age and position. We had, however, an aunt, my mother’s maiden sister, Miss Honoria Westphail, who lives near Harrow, and we were occasionally allowed to pay short visits at this lady’s house. Julia went there at Christmas two years ago, and met there a half-pay major of marines, to whom she became engaged. My stepfather learned of the engagement when my sister returned and offered no objection to the marriage; but within a fortnight of the day which had been fixed for the wedding, the terrible event occurred which has deprived me of my only companion.”','Sherlock Holmes had been leaning back in his chair with his eyes closed and his head sunk in a cushion, but he half opened his lids now and glanced across at his visitor.','“Pray be precise as to details,” said he.','“It is easy for me to be so, for every event of that dreadful time is seared into my memory. The manor-house is, as I have already said, very old, and only one wing is now inhabited. The bedrooms in this wing are on the ground floor, the sitting-rooms being in the central block of the buildings. Of these bedrooms the first is Dr. Roylott’s, the second my sister’s, and the third my own. There is no communication between them, but they all open out into the same corridor. Do I make myself plain?”','“Perfectly so.”','“The windows of the three rooms open out upon the lawn. That fatal night Dr. Roylott had gone to his room early, though we knew that he had not retired to rest, for my sister was troubled by the smell of the strong Indian cigars which it was his custom to smoke. She left her room, therefore, and came into mine, where she sat for some time, chatting about her approaching wedding. At eleven o’clock she rose to leave me, but she paused at the door and looked back.','“‘Tell me, Helen,’ said she, ‘have you ever heard anyone whistle in the dead of the night?’','“‘Never,’ said I.','“‘I suppose that you could not possibly whistle, yourself, in your sleep?’','“‘Certainly not. But why?’','“‘Because during the last few nights I have always, about three in the morning, heard a low, clear whistle. I am a light sleeper, and it has awakened me. I cannot tell where it came from—perhaps from the next room, perhaps from the lawn. I thought that I would just ask you whether you had heard it.’','“‘No, I have not. It must be those wretched gipsies in the plantation.’','“‘Very likely. And yet if it were on the lawn, I wonder that you did not hear it also.’','“‘Ah, but I sleep more heavily than you.’','“‘Well, it is of no great consequence, at any rate.’ She smiled back at me, closed my door, and a few moments later I heard her key turn in the lock.”','“Indeed,” said Holmes. “Was it your custom always to lock yourselves in at night?”','“Always.”','“And why?”','“I think that I mentioned to you that the Doctor kept a cheetah and a baboon. We had no feeling of security unless our doors were locked.”','“Quite so. Pray proceed with your statement.”','“I coul
